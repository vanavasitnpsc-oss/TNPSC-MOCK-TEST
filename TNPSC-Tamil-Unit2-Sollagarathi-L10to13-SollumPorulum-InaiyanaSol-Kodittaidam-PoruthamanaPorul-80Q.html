@page{size:A4;margin:11mm 9mm 15mm;
 @bottom-center{content:"ஒளிரும் வனவாசி அகாடமி, சேலம் (செல்:9789521578)";font-family:'NST',sans-serif;font-size:8.5pt;color:#222;border-top:1px solid #888;width:150mm}
 @bottom-right{content:counter(page);font-family:'NST',sans-serif;font-size:8.5pt}}

.stem{font-weight:700}
ol.st{margin:4px 0;padding-left:20px}
.ar p{margin:3px 0}
table.mt{width:100%;border-collapse:collapse;margin:4px 0}
table.mt th,table.mt td{border:1px solid #9aa5b1;padding:2px 5px;text-align:left;vertical-align:top;overflow-wrap:break-word}
table.long td:first-child{width:68%}
table.pr td:first-child{width:40%}

*{box-sizing:border-box}
body{margin:0;font-family:'NST',sans-serif;background:#eef2f7;color:#17202a;line-height:1.55;font-size:16px;padding-bottom:46px}
main{max-width:760px;margin:0 auto;padding:10px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px #0002}
h1{font-size:20px;margin:0 0 4px;color:#123c69;text-align:center}
h2{font-size:17px;margin:0 0 8px;color:#123c69}
.sub{font-size:13px;text-align:center;color:#455}
input{width:100%;padding:12px;font:inherit;border:1px solid #aab;border-radius:8px;margin:4px 0 10px}
button{font:inherit;font-size:15px;border:0;border-radius:8px;padding:10px 14px;background:#123c69;color:#fff;cursor:pointer;touch-action:manipulation}
button.alt{background:#e1e8f0;color:#123c69}
button.go{background:#157347}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1 1 130px}
.err{color:#b02a37;min-height:1.4em;font-size:14px}
footer{position:fixed;left:0;right:0;bottom:0;background:#123c69;color:#fff;text-align:center;font-size:12px;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.bar{position:sticky;top:0;z-index:4;background:#123c69;color:#fff;border-radius:0 0 12px 12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;margin:-10px 0 10px}
.bar b{font-size:20px;font-variant-numeric:tabular-nums}.bar.low{background:#b02a37}
.qt{font-size:13px;color:#566;display:flex;justify-content:space-between;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;background:#fff;color:#17202a;border:1.5px solid #c5cfdb;margin-top:8px}
.opt.sel{background:#dcebff;border-color:#1f6feb;font-weight:700}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.pal button{padding:7px 0;background:#e1e8f0;color:#123c69;min-width:0}
.pal button.done{background:#157347;color:#fff}.pal button.skip{background:#e9c46a;color:#222}
.pal button.mark{background:#6f42c1;color:#fff}.pal button.cur{outline:3px solid #fd7e14}
.legend{font-size:12px;color:#566;margin-top:8px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:400px;width:100%}
.score{font-size:34px;font-weight:700;text-align:center;color:#157347}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:12px;margin:8px 0}
.stats div{background:#f1f5f9;border-radius:8px;padding:6px 2px;min-width:0}.stats b{display:block;font-size:18px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
.tabs button{padding:8px 2px;font-size:13px;background:#e1e8f0;color:#123c69;min-width:0}.tabs button.on{background:#123c69;color:#fff}
.rv{border-left:6px solid #adb5bd}.rv.ok{border-color:#157347}.rv.no{border-color:#b02a37}
.ro{border:1px solid #d5dce5;border-radius:7px;padding:5px 9px;margin-top:5px}
.ro.c{background:#d1e7dd;border-color:#157347}.ro.w{background:#f8d7da;border-color:#b02a37}
.ex{background:#fff8e1;border-radius:7px;padding:7px 9px;margin-top:8px;font-size:14px}
.hist{border-top:1px solid #dde;padding:8px 0;font-size:14px}
#print{display:none}
@media print{
 body{background:#fff;padding:0;font-size:9pt;line-height:1.38}
 #app,footer,.modal{display:none!important}
 #print{display:block}
 #print .head{border:1.5px solid #123c69;border-radius:6px;padding:6px 10px;text-align:center;margin-bottom:7px}
 #print .cols{column-count:2;column-gap:7mm;column-rule:1px solid #bbb}
 #print .q{break-inside:avoid;margin-bottom:8px;border-bottom:1px dotted #999;padding-bottom:5px}
 #print .ro{padding:0 4px;margin-top:1px;border-color:transparent}
 #print .ro.c{border-color:#157347}#print .ro.w{border-color:#b02a37}
 #print .ex{font-size:8.5pt;padding:3px 5px;margin-top:3px}
 #print table.wrap{width:100%;border-collapse:collapse}
 #print tfoot td{text-align:center;font-size:8.5pt;padding-top:6px}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

"<div class=\"stem\">தமிழ் எண் – மதிப்பு இணைகளில் தவறானது எது/எவை?<\/div><ol class=\"st\"><li>க – 1<\/li><li>உ – 2<\/li><li>ரு – 5<\/li><li>எ – 7<\/li><li>கூ – 6<\/li><\/ol>", "o": ["3, 5 மட்டும்", "4 மட்டும்", "3 மட்டும்", "5 மட்டும்"], "a": 3, "ex": "கூ – 9; சா – 6."}, {"n": 13, "h": "<div class=\"stem\">கோணக்காத்துப் பாட்டில் இடம்பெறும் ‘வின்னம்’ என்னும் சொல்லின் பொருள்<\/div>", "o": ["சரியாக", "கூட்டம்", "சேதம்", "மிகுந்த வருத்தம்"], "a": 2, "ex": "வின்னம் – சேதம்; சேகரம் – கூட்டம்; கெடிகலங்கி – மிக வருந்தி; வாகு – சரியாக."}, {"n": 14, "h": "<div class=\"stem\">‘யானை’ என்னும் பொருள்தரும் சொற்கள் எவை?<\/div><ol class=\"st\"><li>கைம்மா<\/li><li>இவுளி<\/li><li>வேழம்<\/li><li>இபம்<\/li><\/ol>", "o": ["1, 3, 4 மட்டும்", "2, 3, 4 மட்டும்", "3, 4 மட்டும்", "1, 2, 3 மட்டும்"], "a": 0, "ex": "கைம்மா, வேழம், இபம் – யானை; இவுளி – குதிரை."}, {"n": 15, "h": "<div class=\"stem\">“சாலைகள் தோன்றிய பிறகே சாலை விதிகள் தோன்றியிருக்கும். _____ இலக்கியம் தோன்றிய பிறகே இலக்கண விதிகள் தோன்றியிருக்க வேண்டும்.”<\/div>", "o": ["அதுபோல", "இல்லையென்றால்", "ஏனெனில்", "ஆயினும்"], "a": 0, "ex": "ஒப்புமை காட்டும் இடத்தில் ‘அதுபோல’ வரும்."}, {"n": 16, "h": "<div class=\"stem\">ஒலி வேறுபாடு அறிந்து பொருளுடன் பொருத்துக.<\/div><table class=\"mt\"><tr><th>சொல்<\/th><th>பொருள்<\/th><\/tr><tr><td>(a) குளவி<\/td><td>1. குழந்தை<\/td><\/tr><tr><td>(b) குழவி<\/td><td>2. புற்று / குகை<\/td><\/tr><tr><td>(c) அளை<\/td><td>3. ஒருவகைப் பூச்சி<\/td><\/tr><tr><td>(d) அழை<\/td><td>4. கூப்பிடு<\/td><\/tr><\/table>", "o": ["a-4, b-1, c-2, d-3", "a-3, b-2, c-1, d-4", "a-4, b-2, c-1, d-3", "a-3, b-1, c-2, d-4"], "a": 3, "ex": "குளவி – பூச்சி; குழவி – குழந்தை; அளை – புற்று, குகை; அழை – கூப்பிடு."}, {"n": 17, "h": "<div class=\"stem\">கோடிட்ட இடம் <u>சரியாக<\/u> நிரப்பப்பட்டுள்ள தொடர்கள் எவை?<\/div><ol class=\"st\"><li>மணிமேகலை செல்வ வாழ்வை விரும்பியவள் <u>அல்லள்<\/u>.<\/li><li>இவை என் நூல்கள் <u>அல்ல<\/u>.<\/li><li>அது குதிரை <u>அல்ல<\/u>.<\/li><li>அவர் ஆசிரியர் <u>அல்லர்<\/u>.<\/li><\/ol>", "o": ["2, 3, 4 மட்டும்", "1, 3, 4 மட்டும்", "1, 2, 4 மட்டும்", "1, 4 மட்டும்"], "a": 2, "ex": "அஃறிணை ஒருமைக்கு ‘அன்று’: அது குதிரை அன்று."}, {"n": 18, "h": "<div class=\"stem\">விதைவகைச் சொற்களை உரியவற்றுடன் பொருத்துக.<\/div><table class=\"mt\"><tr><th>விதைவகை<\/th><th>உரியது<\/th><\/tr><tr><td>(a) காழ்<\/td><td>1. வேம்பு<\/td><\/tr><tr><td>(b) முத்து<\/td><td>2. மா<\/td><\/tr><tr><td>(c) கொட்டை<\/td><td>3. புளி<\/td><\/tr><tr><td>(d) கூலம்<\/td><td>4. நெல், புல்<\/td><\/tr><\/table>", "o": ["a-3, b-1, c-2, d-4", "a-2, b-1, c-3, d-4", "a-3, b-4, c-2, d-1", "a-2, b-4, c-3, d-1"], "a": 0, "ex": "காழ் – புளி, காஞ்சிரை; முத்து – வேம்பு, ஆமணக்கு; கொட்டை – மா, பனை; கூலம் – நெல், புல் முதலிய தானியங்கள்."}, {"n": 19, "h": "<div class=\"stem\">நீலகேசிப் பாடல் சொற்களைப் பொருளுடன் பொருத்துக.<\/div><table class=\"mt\"><tr><th>சொல்<\/th><th>பொருள்<\/th><\/tr><tr><td>(a) உவசமம்<\/td><td>1. அடங்கி இருத்தல்<\/td><\/tr><tr><td>(b) பேர்தற்கு<\/td><td>2. நல்லறிவு<\/td><\/tr><tr><td>(c) ஓர்தல்<\/td><td>3. நற்காட்சி<\/td><\/tr><tr><td>(d) தெளிவு<\/td><td>4. அகற்றுவதற்கு<\/td><\/tr><\/table>", "o": ["a-4, b-1, c-2, d-3", "a-1, b-4, c-2, d-3", "a-1, b-4, c-3, d-2", "a-4, b-1, c-3, d-2"], "a": 1, "ex": "உவசமம் – அடங்கி இருத்தல்; பேர்தற்கு – அகற்றுவதற்கு; ஓர்தல் – நல்லறிவு; தெளிவு – நற்காட்சி."}, {"n": 20, "h": "<div class=\"stem\">“நான் மட்டுமே தண்டனை ஏற்று நரகத்தைச் சேர்வேன்; _____ என் மக்கள் அனைவர்க்கும் நலம் கிட்டும்” – இராமானுசர் கூற்றை நிரப்புக.<\/div>", "o": ["அதுபோல", "ஏனெனில்", "ஆனால்", "இல்லையென்றால்"], "a": 2, "ex": "தனக்குத் துன்பம், பிறர்க்கு நலம் என்னும் முரண் – ஆனால்."}, {"n": 21, "h": "<div class=\"stem\">திருவிளையாடற் புராணத்தில் ‘நீபவனம்’ என்பது எதைக் குறிக்கிறது?<\/div>", "o": ["செண்பகவனம்", "வேணுவனம்", "தில்லைவனம்", "கடம்பவனம்"], "a": 3, "ex": "நீபம் – கடம்பமரம்; நீபவனம் – கடம்பவனம்."}, {"n": 22, "h": "<div class=\"stem\">கீழ்க்காணும் சொற்களுள் ‘கடல்’ என்னும் பொருளைத் தராதது எது/எவை?<\/div><ol class=\"st\"><li>பரவை<\/li><li>புணரி<\/li><li>அடவி<\/li><li>ஆர்கலி<\/li><li>முந்நீர்<\/li><\/ol>", "o": ["3 மட்டும்", "2, 3 மட்டும்", "3, 4 மட்டும்", "4 மட்டும்"], "a": 0, "ex": "அடவி – காடு. பரவை, புணரி, ஆர்கலி, முந்நீர் – கடல்."}, {"n": 23, "h": "<div class=\"stem\">கூற்றையும் காரணத்தையும் ஆராய்ந்து சரியான விடையைத் தேர்க.<\/div><div class=\"ar\"><p><b>கூற்று (A):<\/b> நெல், தினை முதலியவற்றின் கதிர் ‘குரல்’ எனப்படும்.<\/p><p><b>காரணம் (R):<\/b> வாழையின் குலை ‘தாறு’ எனப்படும்.<\/p><\/div>", "o": ["கூற்று, காரணம் இரண்டும் சரி; காரணம் கூற்றுக்குச் சரியான விளக்கம்", "கூற்று, காரணம் இரண்டும் சரி; ஆனால் காரணம் கூற்றுக்குச் சரியான விளக்கம் அன்று", "கூற்று சரி; காரணம் தவறு", "கூற்று தவறு; காரணம் சரி"], "a": 1, "ex": "இரண்டும் சரி; ஆனால் வாழைக்குலையின் பெயர், நெற்கதிரின் பெயருக்கு விளக்கம் ஆகாது."}, {"n": 24, "h": "<div class=\"stem\">‘சரணாலயம்’ என்பதற்கு இணையான வேறு சொல் எது?<\/div>", "o": ["புகலிடம்", "வலசை", "வாழிடம்", "காப்பகம்"], "a": 0, "ex": "சரண் – புகல்; ஆலயம் – இடம். சரணாலயம் – புகலிடம்."}, {"n": 25, "h": "<div class=\"stem\">மரக்கிளைப் பிரிவுகள் பற்றிய கீழ்க்காணும் கூற்றுகளில் சரியானவை எவை?<\/div><ol class=\"st\"><li>கவை – அடிமரத்திலிருந்து பிரியும் மாபெருங்கிளை<\/li><li>கொம்பு – கவையிலிருந்து பிரிவது<\/li><li>சினை – கிளையிலிருந்து பிரிவது<\/li><li>போத்து – சினையிலிருந்து பிரிவது<\/li><li>இணுக்கு – போத்திலிருந்து பிரிவது<\/li><\/ol>", "o": ["1, 2, 3, 4 மட்டும்", "1, 2, 3, 5 மட்டும்", "1, 3, 4, 5 மட்டும்", "1, 2, 4, 5 மட்டும்"], "a": 0, "ex": "போத்திலிருந்து பிரிவது குச்சு; குச்சிலிருந்து பிரிவது இணுக்கு."}, {"n": 26, "h": "<div class=\"stem\">கீழ்க்காணும் இணைச்சொல் இணைகளில் சரியானவை எவை?<\/div><ol class=\"st\"><li>விசும்பு – வானம்<\/li><li>மேதினி – உலகம்<\/li><li>மேதி – மயில்<\/li><\/ol>", "o": ["1, 2, 3 அனைத்தும்", "1, 2 மட்டும்", "2, 3 மட்டும்", "1, 3 மட்டும்"], "a": 1, "ex": "மேதி – எருமை."}, {"n": 27, "h": "<div class=\"stem\">“கபிலர் திறமையானவர் என்று _____ (குமரன்) தெரியும்.” – தகுந்த வடிவம் எது?<\/div>", "o": ["குமரனால்", "குமரனுக்கு", "குமரனோடு", "குமரனை"], "a": 1, "ex": "‘தெரியும்’ என்னும் வினை நான்காம் வேற்றுமை (கு) ஏற்கும்."}, {"n": 28, "h": "<div class=\"stem\">மரக்கலத்திற்குத் தமிழில் வழங்கும் பெயர்களுள் ஒன்று<\/div>", "o": ["துடி", "தூறு", "திமில்", "ஞிமிறு"], "a": 2, "ex": "திமில் – படகு / மரக்கலம்; துடி – ஒருவகைப் பறை; ஞிமிறு – வண்டு."}, {"n": 29, "h": "<div class=\"stem\">“நரகத்தில் இடர்ப்படோம் நடலை இல்லோம்” – ‘நடலை’ என்பதன் பொருள்<\/div>", "o": ["நோய்", "அடிமைத்தனம்", "துன்பம்", "எமன்"], "a": 2, "ex": "நடலை – துன்பம்."}, {"n": 30, "h": "<div class=\"stem\">ஆழ்வார் பாசுரங்களின் சொற்பொருள் இணைகளில் தவறானது எது/எவை?<\/div><ol class=\"st\"><li>தகளி – அகல்விளக்கு<\/li><li>சொல் மாலை – பாமாலை<\/li><li>இடர் ஆழி – துன்பக்கடல்<\/li><li>ஞானம் – அறிவு<\/li><li>சுடர் ஆழியான் – கதிரவன்<\/li><\/ol>", "o": ["5 மட்டும்", "3 மட்டும்", "3, 5 மட்டும்", "2 மட்டும்"], "a": 0, "ex": "சுடர் ஆழியான் – ஒளிவிடும் சக்கரப்படையை ஏந்திய திருமால்."}, {"n": 31, "h": "<div class=\"stem\">சரியான விடையைத் தேர்க.<\/div><ol class=\"st\"><li>‘சேக்கை’ என்னும் சொல் படுக்கையைக் குறிக்கும்.<\/li><li>‘அசும்பு’ என்னும் சொல் நிலத்தைக் குறிக்கும்.<\/li><\/ol>", "o": ["1 மட்டும் சரி", "2 மட்டும் சரி", "1, 2 ஆகிய இரண்டும் சரி", "1, 2 ஆகிய இரண்டும் தவறு"], "a": 2, "ex": "சேக்கை – படுக்கை; அசும்பு – நிலம். இரண்டும் சரி."}, {"n": 32, "h": "<div class=\"stem\">சரியான விடையைத் தேர்க.<\/div><ol class=\"st\"><li>‘பிசி’ என்னும் சொல் பழமொழியைக் குறிக்கும்.<\/li><li>‘ஆமா’ என்னும் சொல் ஆமையின் ஒரு வகையைக் குறிக்கும்.<\/li><\/ol>", "o": ["1 மட்டும் சரி", "2 மட்டும் சரி", "1, 2 ஆகிய இரண்டும் சரி", "1, 2 ஆகிய இரண்டும் தவறு"], "a": 3, "ex": "பிசி – விடுகதை; ஆமா – காட்டுப்பசு. இரண்டும் தவறு."}, {"n": 33, "h": "<div class=\"stem\">‘கோறல்’, ‘கொல்லுதல்’ ஆகிய பொருள்களைத் தரும் சொல் எது?<\/div>", "o": ["ஆர்தல்", "ஓர்தல்", "அலர்தல்", "அடுதல்"], "a": 3, "ex": "அடுதல் – கொல்லுதல்; ஆர்தல் – உண்ணுதல்; அலர்தல் – மலர்தல்."}, {"n": 34, "h": "<div class=\"stem\">‘வருக்கை’ என்னும் சொல் எதனைக் குறிக்கும்?<\/div>", "o": ["வாழைப்பழம்", "விளாம்பழம்", "பலாப்பழம்", "மாம்பழம்"], "a": 2, "ex": "வருக்கை – பலா."}, {"n": 35, "h": "<div class=\"stem\">கூற்றையும் காரணத்தையும் ஆராய்ந்து சரியான விடையைத் தேர்க.<\/div><div class=\"ar\"><p><b>கூற்று (A):<\/b> “_____ வந்தன” என்னும் தொடரில் ‘அவைகள்’ என நிரப்புவதைவிட ‘அவை’ என நிரப்புவதே சரி.<\/p><p><b>காரணம் (R):<\/b> ‘அவை’ என்பதே பன்மைச் சொல் ஆதலால் அதனுடன் ‘கள்’ விகுதி சேர்க்க வேண்டியதில்லை.<\/p><\/div>", "o": ["கூற்று, காரணம் இரண்டும் சரி; காரணம் கூற்றுக்குச் சரியான விளக்கம்", "கூற்று, காரணம் இரண்டும் சரி; ஆனால் காரணம் கூற்றுக்குச் சரியான விளக்கம் அன்று", "கூற்று சரி; காரணம் தவறு", "கூற்று தவறு; காரணம் சரி"], "a": 0, "ex": "அது (ஒருமை) – அவை (பன்மை); அவைகள் என்பது பிழை."}, {"n": 36, "h": "<div class=\"stem\">கோடிட்ட இடத்திற்குரிய இணைப்புச் சொல்லைப் பொருத்துக.<\/div><table class=\"mt long\"><tr><th>தொடர்<\/th><th>இணைப்புச் சொல்<\/th><\/tr><tr><td>(a) குயிலுக்குக் கூடு கட்டத் தெரியாது; _____ காக்கையின் கூட்டில் முட்டையிடும்.<\/td><td>1. இல்லையென்றால்<\/td><\/tr><tr><td>(b) அதிக மரங்களை வளர்ப்போம்; _____ மரங்களே மழைக்கு அடிப்படை.<\/td><td>2. அதனால்<\/td><\/tr><tr><td>(c) இனிய சொற்களைப் பேச வேண்டும்; _____ துன்பப்பட நேரிடும்.<\/td><td>3. ஆயினும்<\/td><\/tr><tr><td>(d) கருமேகங்கள் வானில் திரண்டன; _____ மழை பெய்யவில்லை.<\/td><td>4. ஏனெனில்<\/td><\/tr><\/table>", "o": ["a-4, b-2, c-1, d-3", "a-4, b-2, c-3, d-1", "a-2, b-4, c-1, d-3", "a-2, b-4, c-3, d-1"], "a": 2, "ex": "விளைவு – அதனால்; காரணம் – ஏனெனில்; மாற்று நிலை – இல்லையென்றால்; முரண் – ஆயினும்."}, {"n": 37, "h": "<div class=\"stem\">பூவின் நிலைகள் குறித்த கீழ்க்காணும் இணைகளில் சரியானவை எவை?<\/div><ol class=\"st\"><li>அரும்பு – பூவின் தோற்ற நிலை<\/li><li>போது – பூ விரியத் தொடங்கும் நிலை<\/li><li>செம்மல் – பூ கீழே விழுந்த நிலை<\/li><\/ol>", "o": ["1, 2 மட்டும்", "2, 3 மட்டும்", "1, 2, 3 அனைத்தும்", "1, 3 மட்டும்"], "a": 0, "ex": "வீ – பூ கீழே விழுந்த நிலை; செம்மல் – பூ வாடின நிலை."}, {"n": 38, "h": "<div class=\"stem\">கூற்றையும் காரணத்தையும் ஆராய்ந்து சரியான விடையைத் தேர்க.<\/div><div class=\"ar\"><p><b>கூற்று (A):<\/b> ‘மதுரைக்காஞ்சி’ என்பதில் ‘காஞ்சி’ என்னும் சொல் நிலையாமையைக் குறிக்கிறது.<\/p><p><b>காரணம் (R):<\/b> அந்நூல் பாண்டிய மன்னனுக்கு நிலையாமையை உணர்த்தும் பொருட்டுப் பாடப்பட்டது.<\/p><\/div>", "o": ["கூற்று, காரணம் இரண்டும் சரி; காரணம் கூற்றுக்குச் சரியான விளக்கம்", "கூற்று, காரணம் இரண்டும் சரி; ஆனால் காரணம் கூற்றுக்குச் சரியான விளக்கம் அன்று", "கூற்று சரி; காரணம் தவறு", "கூற்று தவறு; காரணம் சரி"], "a": 0, "ex": "மாங்குடி மருதனார் தலையாலங்கானத்துச் செருவென்ற பாண்டியன் நெடுஞ்செழியனுக்கு நிலையாமையை உணர்த்தப் பாடினார்."}, {"n": 39, "h": "<div class=\"stem\">‘அனிலம்’ என்னும் சொல்லுக்கு இணையான சொல்<\/div>", "o": ["நிலம்", "வானம்", "நெருப்பு", "காற்று"], "a": 3, "ex": "அனிலம் – காற்று (அனல் – நெருப்பு)."}, {"n": 40, "h": "<div class=\"stem\">‘வெறுக்கை’ என்னும் சொல்லின் சரியான பொருள் யாது?<\/div>", "o": ["பட்டாடை", "வெறுப்புணர்வு", "நறுமணப்பொடி", "செல்வம்"], "a": 3, "ex": "வெறுக்கை – செல்வம்; தூசு – பட்டு; சுண்ணம் – நறுமணப்பொடி."}, {"n": 41, "h": "<div class=\"stem\">“வாழ்க்கையில் _____ மீண்டும் வெல்லும்; இதைத் தத்துவமாய்த் _____ கூத்து சொல்லும்.”<\/div>", "o": ["தோல்பவை – தோல்பாவை", "தோற்றவை – தோற்றப்பாவை", "தோற்பவை – தோற்பாவை", "தோற்பாவை – தோற்பவை"], "a": 2, "ex": "தோற்பவை (தோல்வி அடைபவை) மீண்டும் வெல்லும்; அதைக் கூறுவது தோற்பாவைக் கூத்து."}, {"n": 42, "h": "<div class=\"stem\">கலிங்கத்துப்பரணிச் சொற்பொருள் இணைகளில் சரியானவை எவை?<\/div><ol class=\"st\"><li>மறலி – காலன்<\/li><li>தூறு – புதர்<\/li><li>அருவர் – பகைவர்<\/li><li>பிலம் – மலைக்குகை<\/li><\/ol>", "o": ["1, 2, 4 மட்டும்", "1, 2, 3 மட்டும்", "2, 3, 4 மட்டும்", "1, 3, 4 மட்டும்"], "a": 0, "ex": "அருவர் – தமிழர். மற்ற மூன்றும் சரி."}, {"n": 43, "h": "<div class=\"stem\">சரியான விடையைத் தேர்க.<\/div><ol class=\"st\"><li>‘பவித்திரம்’ என்பதற்கு இணையான சொல் ‘கடல்’.<\/li><li>‘சரதம்’ என்பதற்கு இணையான சொல் ‘வாய்மை’.<\/li><\/ol>", "o": ["1 மட்டும் சரி", "2 மட்டும் சரி", "1, 2 ஆகிய இரண்டும் சரி", "1, 2 ஆகிய இரண்டும் தவறு"], "a": 1, "ex": "பவித்திரம் – தூய்மை; சரதம் – வாய்மை. எனவே 2 மட்டும் சரி."}, {"n": 44, "h": "<div class=\"stem\">சிலப்பதிகாரம் குறிப்பிடும் வணிகர், வினைஞர் பற்றிய இணைகளில் சரியானவை எவை?<\/div><ol class=\"st\"><li>பாசவர் – வெற்றிலை விற்போர்<\/li><li>ஓசுநர் – எண்ணெய் விற்போர்<\/li><li>மண்ணுள் வினைஞர் – சிற்பி<\/li><li>காருகர் – நெய்பவர்<\/li><li>வாசவர் – நறுமணப் பொருள் விற்போர்<\/li><\/ol>", "o": ["1, 2, 4, 5 மட்டும்", "1, 3, 4, 5 மட்டும்", "2, 4, 5 மட்டும்", "1, 2, 3, 4 மட்டும்"], "a": 0, "ex": "மண்ணுள் வினைஞர் – ஓவியர்; மண்ணீட்டாளர் – சிற்பி. மற்ற நான்கும் சரி."}, {"n": 45, "h": "<div class=\"stem\">இணையான சொற்களைப் பொருத்துக.<\/div><table class=\"mt\"><tr><th>சொல்<\/th><th>இணைச்சொல்<\/th><\/tr><tr><td>(a) அழல்<\/td><td>1. வானம்<\/td><\/tr><tr><td>(b) ககனம்<\/td><td>2. நெருப்பு<\/td><\/tr><tr><td>(c) தரணி<\/td><td>3. பாம்பு<\/td><\/tr><tr><td>(d) அரவு<\/td><td>4. உலகம்<\/td><\/tr><\/table>", "o": ["a-1, b-2, c-4, d-3", "a-2, b-1, c-3, d-4", "a-1, b-2, c-3, d-4", "a-2, b-1, c-4, d-3"], "a": 3, "ex": "அழல் – நெருப்பு; ககனம் – வானம்; தரணி – உலகம்; அரவு – பாம்பு."}, {"n": 46, "h": "<div class=\"stem\">பெரியபுராணத்தில் வரும் ‘சூடு’ என்னும் சொல்லின் பொருள் யாது?<\/div>", "o": ["குளக்கரை", "வெப்பம் மிகுந்த வயல்", "நெல் அரிக்கட்டு", "வயல் வரப்பு"], "a": 2, "ex": "சூடு – நெல் அரிக்கட்டு; கோடு – குளக்கரை; வரம்பு – வரப்பு."}, {"n": 47, "h": "<div class=\"stem\">கூற்றையும் காரணத்தையும் ஆராய்ந்து சரியான விடையைத் தேர்க.<\/div><div class=\"ar\"><p><b>கூற்று (A):<\/b> ‘குளித்தல்’ என்னும் சொல்லுக்கு உடலைக் குளிர வைத்தல் என்பது பொருள்.<\/p><p><b>காரணம் (R):<\/b> ‘குளித்தல்’ என்னும் சொல் ‘அழுக்கைத் தேய்த்தல்’ என்னும் வேரிலிருந்து பிறந்தது.<\/p><\/div>", "o": ["கூற்று, காரணம் இரண்டும் சரி; காரணம் கூற்றுக்குச் சரியான விளக்கம்", "கூற்று, காரணம் இரண்டும் சரி; ஆனால் காரணம் கூற்றுக்குச் சரியான விளக்கம் அன்று", "கூற்று சரி; காரணம் தவறு", "கூற்று தவறு; காரணம் சரி"], "a": 2, "ex": "‘குளிர்’ என்னும் அடியோடு தொடர்புடையது குளித்தல்; காரணம் தவறு."}, {"n": 48, "h": "<div class=\"stem\">மதுரைக்காஞ்சியில் வரும் ‘நியமம்’ என்னும் சொல்லின் பொருள்<\/div>", "o": ["அங்காடி", "திருவிழா", "கோயில்", "ஓவியம்"], "a": 0, "ex": "நியமம் – அங்காடி; ஓவு – ஓவியம்."}, {"n": 49, "h": "<div class=\"stem\">“_____ ஊரில் _____ பெரிய ஆலமரம் இருந்தது; அதன் அருகே _____ அழகிய குளமும் இருந்தது.” – வரிசைப்படி நிரப்புக.<\/div>", "o": ["ஒரு, ஓர், ஒரு", "ஓர், ஒரு, ஓர்", "ஓர், ஓர், ஒரு", "ஓர், ஒரு, ஒரு"], "a": 1, "ex": "உயிரெழுத்தில் தொடங்கும் ஊர், அழகிய முன் ஓர்; உயிர்மெய்யில் தொடங்கும் பெரிய முன் ஒரு."}, {"n": 50, "h": "<div class=\"stem\">முல்லைப்பாட்டுச் சொற்களைப் பொருளுடன் பொருத்துக.<\/div><table class=\"mt\"><tr><th>சொல்<\/th><th>பொருள்<\/th><\/tr><tr><td>(a) நனந்தலை<\/td><td>1. மலை<\/td><\/tr><tr><td>(b) சுவல்<\/td><td>2. தோள்<\/td><\/tr><tr><td>(c) கோடு<\/td><td>3. சக்கரம்<\/td><\/tr><tr><td>(d) நேமி<\/td><td>4. அகன்ற<\/td><\/tr><\/table>", "o": ["a-1, b-2, c-4, d-3", "a-4, b-2, c-1, d-3", "a-4, b-3, c-1, d-2", "a-1, b-3, c-4, d-2"], "a": 1, "ex": "நனந்தலை – அகன்ற; சுவல் – தோள்; கோடு – மலை; நேமி – சக்கரம்."}, {"n": 51, "h": "<div class=\"stem\">கோடிட்ட இடத்திற்குரிய சொல்லைப் பொருத்துக.<\/div><table class=\"mt long\"><tr><th>தொடர்<\/th><th>சொல்<\/th><\/tr><tr><td>(a) உடல் உறுதிக்கு வாதம், பித்தம், சீதம் ஆகியவற்றின் _____ காரணம்.<\/td><td>1. கம்மியர்<\/td><\/tr><tr><td>(b) பிறர் செய்யும் தீங்கைப் பொறுத்துக் கொள்வது _____.<\/td><td>2. சமநிலை<\/td><\/tr><tr><td>(c) கப்பல் கட்டும் கலைஞர்கள் _____ எனப்பட்டனர்.<\/td><td>3. பொறை<\/td><\/tr><tr><td>(d) நிலத்திற்கு அடியில் கிடைக்கும் _____ அரசுக்கே சொந்தம்.<\/td><td>4. புதையல்<\/td><\/tr><\/table>", "o": ["a-1, b-3, c-2, d-4", "a-2, b-4, c-1, d-3", "a-2, b-3, c-1, d-4", "a-1, b-4, c-2, d-3"], "a": 2, "ex": "சமநிலை, பொறை, கம்மியர், புதையல் என்பன முறையே பொருந்தும்."}, {"n": 52, "h": "<div class=\"stem\">இளம்பயிர் வகை குறித்த இணைகளில் பொருந்தாத இணை எது?<\/div><table class=\"mt pr\"><tr><td>1. நாற்று<\/td><td>நெல்<\/td><\/tr><tr><td>2. குட்டி<\/td><td>வாழை<\/td><\/tr><tr><td>3. பிள்ளை<\/td><td>தென்னை<\/td><\/tr><tr><td>4. மடலி<\/td><td>பனை<\/td><\/tr><\/table>", "o": ["இணை 1", "இணை 2", "இணை 3", "இணை 4"], "a": 1, "ex": "குட்டி என்பது விளாவின் இளநிலை; வாழையின் இளநிலை கன்று / குருத்து."}, {"n": 53, "h": "<div class=\"stem\">“அன்புக்குரியவரின் துன்பம் கண்டு பெருகும் கண்ணீர் _____ எனப்படும்.”<\/div>", "o": ["புங்கணீர்", "புயங்கணீர்", "புண்கணீர்", "புன்கணீர்"], "a": 3, "ex": "புன்கண் – துன்பம்; அன்புடையார் துன்பத்தால் வருவது புன்கணீர்."}, {"n": 54, "h": "<div class=\"stem\">‘கொழுந்தாடை’ என்னும் சொல் குறிப்பது எது?<\/div>", "o": ["புளியின் கொழுந்து", "பனையின் குருத்து", "நெல்லின் தளிர்", "கரும்பின் நுனிப்பகுதி"], "a": 3, "ex": "கொழுந்தாடை – கரும்பின் நுனிப்பகுதி; புளி, வேம்பு – முறி அல்லது கொழுந்து."}, {"n": 55, "h": "<div class=\"stem\">பொருத்தமான பொருள் தரப்பட்டுள்ள இணைகள் எவை?<\/div><ol class=\"st\"><li>அழுக்காறு – பொறாமை<\/li><li>பொச்சாப்பு – பொறாமை<\/li><li>வெஃகாமை – பிறர் பொருளை விரும்பாமை<\/li><\/ol>", "o": ["2, 3 மட்டும்", "1, 3 மட்டும்", "1, 2 மட்டும்", "1, 2, 3 அனைத்தும்"], "a": 1, "ex": "பொச்சாப்பு – மறதியால் வரும் சோர்வு."}, {"n": 56, "h": "<div class=\"stem\">உயிரினங்களைக் குறிக்கும் சொற்களைப் பொருத்துக.<\/div><table class=\"mt\"><tr><th>சொல்<\/th><th>பொருள்<\/th><\/tr><tr><td>(a) பிடி<\/td><td>1. விலங்கின் குட்டி<\/td><\/tr><tr><td>(b) குருளை<\/td><td>2. பெண் யானை<\/td><\/tr><tr><td>(c) அலவன்<\/td><td>3. நாகணவாய்ப் பறவை<\/td><\/tr><tr><td>(d) பூவை<\/td><td>4. நண்டு<\/td><\/tr><\/table>", "o": ["a-3, b-1, c-4, d-2", "a-2, b-1, c-4, d-3", "a-2, b-4, c-1, d-3", "a-3, b-4, c-1, d-2"], "a": 1, "ex": "பிடி – பெண் யானை; குருளை – குட்டி; அலவன் – நண்டு; பூவை – நாகணவாய்ப் பறவை."}, {"n": 57, "h": "<div class=\"stem\">வீரர்கள் ‘கரந்தை’ப் பூவைச் சூடிச் செல்வதன் பொருள் யாது?<\/div>", "o": ["கவரப்பட்ட ஆநிரைகளை மீட்டல்", "பகைவர் நாட்டைக் கைப்பற்றச் செல்லுதல்", "பகைவரின் ஆநிரைகளைக் கவர்தல்", "பகைவரின் மதிலை வளைத்தல்"], "a": 0, "ex": "வெட்சி – ஆநிரை கவர்தல்; கரந்தை – ஆநிரை மீட்டல்."}, {"n": 58, "h": "<div class=\"stem\">பெரியபுராணம் குறிப்பிடும் மரங்கள் பற்றிய இணைகளில் தவறானவை எவை?<\/div><ol class=\"st\"><li>நரந்தம் – நாரத்தை<\/li><li>சாலம் – பச்சிலை மரம்<\/li><li>தமாலம் – ஆச்சா மரம்<\/li><\/ol>", "o": ["1, 2 மட்டும்", "2, 3 மட்டும்", "3 மட்டும்", "1, 2, 3 அனைத்தும்"], "a": 1, "ex": "சாலம் – ஆச்சா மரம்; தமாலம் – பச்சிலை மரம்."}, {"n": 59, "h": "<div class=\"stem\">சரியான விடையைத் தேர்க.<\/div><ol class=\"st\"><li>‘கேண்மையினான்’ என்பது நட்புடையவனைக் குறிக்கும்.<\/li><li>‘தமர்’ என்பது பகைவரைக் குறிக்கும்.<\/li><\/ol>", "o": ["1 மட்டும் சரி", "2 மட்டும் சரி", "1, 2 ஆகிய இரண்டும் சரி", "1, 2 ஆகிய இரண்டும் தவறு"], "a": 0, "ex": "தமர் – உறவினர். எனவே 1 மட்டும் சரி."}, {"n": 60, "h": "<div class=\"stem\">மரபுச் சொல் <u>தவறாக<\/u> அமைந்துள்ள தொடர் எது/எவை?<\/div><ol class=\"st\"><li>குயவர் பானை <u>வனைந்தார்<\/u>.<\/li><li>கொத்தனார் சுவர் <u>எழுப்பினார்<\/u>.<\/li><li>கோதை பூக் <u>கொய்தாள்<\/u>.<\/li><li>பாட்டி கூடை <u>முடைந்தார்<\/u>.<\/li><li>புலவர் செய்யுள் <u>வனைந்தார்<\/u>.<\/li><\/ol>", "o": ["1, 5 மட்டும்", "4 மட்டும்", "3, 5 மட்டும்", "5 மட்டும்"], "a": 3, "ex": "செய்யுள் இயற்றினார் / யாத்தார் என்பதே மரபு."}, {"n": 61, "h": "<div class=\"stem\">இணைப்புச் சொல்லும் அது பயன்படும் இடமும் – எத்தனை இணைகள் சரியானவை?<\/div><table class=\"mt pr\"><tr><td>1. மேலும்<\/td><td>கூடுதல் செய்தி<\/td><\/tr><tr><td>2. ஆனால்<\/td><td>காரணம்<\/td><\/tr><tr><td>3. ஏனெனில்<\/td><td>முரண்<\/td><\/tr><tr><td>4. அதுபோல<\/td><td>ஒப்புமை<\/td><\/tr><\/table>", "o": ["ஒரே ஒரு இணை மட்டும் சரி", "இரண்டு இணைகள் மட்டும் சரி", "மூன்று இணைகள் மட்டும் சரி", "நான்கு இணைகளும் சரி"], "a": 1, "ex": "ஆனால் – முரண்; ஏனெனில் – காரணம். 1, 4 ஆகிய இரண்டு மட்டும் சரி."}, {"n": 62, "h": "<div class=\"stem\">கெட்டுப்போன காய்கனிகளைக் குறிக்கும் சொற்களில் தவறான இணை எது/எவை?<\/div><ol class=\"st\"><li>சூம்பல் – நுனியில் சுருங்கிய காய்<\/li><li>வெம்பல் – சூட்டினால் பழுத்த பிஞ்சு<\/li><li>அளியல் – புழு பூச்சி அரித்த காய்<\/li><li>சிவியல் – சுருங்கிய பழம்<\/li><\/ol>", "o": ["4 மட்டும்", "2, 3 மட்டும்", "1, 3 மட்டும்", "3 மட்டும்"], "a": 3, "ex": "அளியல் – குளுகுளுத்த பழம்; புழு பூச்சி அரித்த காய் அல்லது கனி – சொத்தை."}, {"n": 63, "h": "<div class=\"stem\">‘செவிச்செல்வம்’ என்பதன் பொருத்தமான பொருள் எது?<\/div>", "o": ["இசையைச் சுவைக்கும் ஆற்றல்", "செவியில் அணியும் அணிகலன்", "நுட்பமாகக் கேட்கும் உடல் திறன்", "கேட்பதால் பெறும் அறிவு"], "a": 3, "ex": "செவிச்செல்வம் – கேள்விச் செல்வம்."}, {"n": 64, "h": "<div class=\"stem\">பெரியபுராணப் பாடல்களில் இடம்பெறும் சொற்களைப் பொருளுடன் பொருத்துக.<\/div><table class=\"mt\"><tr><th>சொல்<\/th><th>பொருள்<\/th><\/tr><tr><td>(a) தரளம்<\/td><td>1. வலம்புரிச்சங்கு<\/td><\/tr><tr><td>(b) பணிலம்<\/td><td>2. எருமைக்கடா<\/td><\/tr><tr><td>(c) வேரி<\/td><td>3. முத்து<\/td><\/tr><tr><td>(d) பகடு<\/td><td>4. தேன்<\/td><\/tr><\/table>", "o": ["a-3, b-2, c-4, d-1", "a-3, b-1, c-4, d-2", "a-4, b-2, c-3, d-1", "a-4, b-1, c-3, d-2"], "a": 1, "ex": "தரளம் – முத்து; பணிலம் – வலம்புரிச்சங்கு; வேரி – தேன்; பகடு – எருமைக்கடா."}, {"n": 65, "h": "<div class=\"stem\">மதுரைக்காஞ்சிச் சொற்பொருள் இணைகளில் எத்தனை இணைகள் சரியானவை?<\/div><table class=\"mt pr\"><tr><td>1. புரிசை<\/td><td>மதில்<\/td><\/tr><tr><td>2. புழை<\/td><td>சாளரம்<\/td><\/tr><tr><td>3. பணை<\/td><td>முரசு<\/td><\/tr><tr><td>4. கயம்<\/td><td>நீர்நிலை<\/td><\/tr><\/table>", "o": ["ஒரே ஒரு இணை மட்டும் சரி", "இரண்டு இணைகள் மட்டும் சரி", "மூன்று இணைகள் மட்டும் சரி", "நான்கு இணைகளும் சரி"], "a": 3, "ex": "நான்கு இணைகளும் சரியானவை."}, {"n": 66, "h": "<div class=\"stem\">கோடிட்ட இடம் சரியாக நிரப்பப்பட்டுள்ளதா எனத் தேர்க.<\/div><ol class=\"st\"><li>மாணவர்கள் <u>தனது<\/u> கடமையைச் செய்தனர்.<\/li><li>சிறுமி <u>தனது<\/u> கையில் மலர்களை வைத்திருந்தாள்.<\/li><\/ol>", "o": ["1 மட்டும் சரி", "2 மட்டும் சரி", "1, 2 ஆகிய இரண்டும் சரி", "1, 2 ஆகிய இரண்டும் தவறு"], "a": 1, "ex": "பன்மைக்கு ‘தமது’; ஒருமைக்கு ‘தனது’. எனவே 2 மட்டும் சரி."}, {"n": 67, "h": "<div class=\"stem\">“ஆராயும் அறிவு உடையவர்கள் _____ சொற்களைப் பேசமாட்டார்கள்.” – குறள் கருத்துப்படி பொருத்தமானது எது?<\/div>", "o": ["விலைமதிப்பற்ற", "பெரும்பொருள் உடைய", "அரும்பயன் உடைய", "பெரும்பயன் இல்லாத"], "a": 3, "ex": "“அரும்பயன் ஆயும் அறிவினார் சொல்லார் பெரும்பயன் இல்லாத சொல்.”"}, {"n": 68, "h": "<div class=\"stem\">“பதிதொறு புயல்பொழி தருமணி பணைதரு” – இவ்வடியில் ‘பணை’ என்பதன் பொருள்<\/div>", "o": ["பனைமரம்", "மூங்கில்", "முத்து", "வயல்"], "a": 1, "ex": "இங்குப் பணை – மூங்கில் (‘முரசு’, ‘பருமை’ என்னும் பொருள்களும் உண்டு)."}, {"n": 69, "h": "<div class=\"stem\">பிஞ்சுவகைச் சொற்களை உரிய தாவரத்துடன் பொருத்துக.<\/div><table class=\"mt\"><tr><th>பிஞ்சுவகை<\/th><th>தாவரம்<\/th><\/tr><tr><td>(a) வடு<\/td><td>1. பாக்கு<\/td><\/tr><tr><td>(b) மூசு<\/td><td>2. மா<\/td><\/tr><tr><td>(c) கவ்வை<\/td><td>3. பலா<\/td><\/tr><tr><td>(d) நுழாய்<\/td><td>4. எள்<\/td><\/tr><\/table>", "o": ["a-4, b-1, c-2, d-3", "a-2, b-1, c-4, d-3", "a-4, b-3, c-2, d-1", "a-2, b-3, c-4, d-1"], "a": 3, "ex": "வடு – மாம்பிஞ்சு; மூசு – பலாப்பிஞ்சு; கவ்வை – எள்பிஞ்சு; நுழாய் – இளம்பாக்கு."}, {"n": 70, "h": "<div class=\"stem\">இராவண காவிய விலங்குப் பெயர்ப் பொருள் இணைகளில் சரியானவை எவை?<\/div><ol class=\"st\"><li>எண்கு – கரடி<\/li><li>உழுவை – சிங்கம்<\/li><li>மடங்கல் – புலி<\/li><li>கேழல் – பன்றி<\/li><\/ol>", "o": ["1, 2, 4 மட்டும்", "1, 4 மட்டும்", "1, 3, 4 மட்டும்", "2, 3 மட்டும்"], "a": 1, "ex": "உழுவை – புலி; மடங்கல் – சிங்கம்."}, {"n": 71, "h": "<div class=\"stem\">பொருத்தமான பொருள் தரப்படாத இணை எது?<\/div><table class=\"mt pr\"><tr><td>1. வளி<\/td><td>காற்று<\/td><\/tr><tr><td>2. தால்<\/td><td>நாக்கு<\/td><\/tr><tr><td>3. பணி<\/td><td>குளிர்ச்சி<\/td><\/tr><tr><td>4. அரம்<\/td><td>ஒரு கருவி<\/td><\/tr><\/table>", "o": ["இணை 1", "இணை 2", "இணை 3", "இணை 4"], "a": 2, "ex": "பனி – குளிர்ச்சி; பணி – தொண்டு / வேலை."}, {"n": 72, "h": "<div class=\"stem\">“…மேலலார் செல்வமே போல் தலைநிறுவித் தேர்ந்த நூல் கல்விசேர் மாந்தரின் இறைஞ்சிக் காய்த்தவே” – நெற்பயிர் வருணனை பற்றிய சரியான கூற்றுகள் எவை?<\/div><ol class=\"st\"><li>கருக்கொண்ட நெற்பயிர் பச்சைப்பாம்பின் தோற்றம் போன்றது.<\/li><li>‘மேலலார்’ என்பது மேன்மையில்லாத கீழ்மக்களைக் குறிக்கும்.<\/li><li>கீழ்மக்கள் பெற்ற செல்வம் போல் கதிர்கள் தலைநிமிர்ந்து நின்றன.<\/li><li>கற்றறிந்தோர் போல் கதிர்கள் தலைநிமிர்ந்து நின்றன.<\/li><\/ol>", "o": ["2, 3, 4 மட்டும்", "1, 3 மட்டும்", "1, 2, 3 மட்டும்", "1, 2, 4 மட்டும்"], "a": 2, "ex": "முற்றிய கதிர்கள் கற்றறிந்தோர் போல் தலைவணங்கின."}, {"n": 73, "h": "<div class=\"stem\">இணைப்புச் சொல் <u>சரியாக<\/u> அமைந்துள்ள தொடர்கள் எவை?<\/div><ol class=\"st\"><li>நேற்றிரவு ந டும் சரி", "மூன்று இணைகள் மட்டும் சரி", "நான்கு இணைகளும் சரி"], "a": 2, "ex": "பழனம் – வயல். மற்ற மூன்று இணைகளும் சரி."}, {"n": 78, "h": "<div class=\"stem\">மலைபடுகடாம் சொற்களைப் பொருளுடன் பொருத்துக.<\/div><table class=\"mt\"><tr><th>சொல்<\/th><th>பொருள்<\/th><\/tr><tr><td>(a) அசைஇ<\/td><td>1. தங்கி<\/td><\/tr><tr><td>(b) அல்கி<\/td><td>2. அருமை<\/td><\/tr><tr><td>(c) கடும்பு<\/td><td>3. இளைப்பாறி<\/td><\/tr><tr><td>(d) ஆரி<\/td><td>4. சுற்றம்<\/td><\/tr><\/table>", "o": ["a-3, b-1, c-4, d-2", "a-2, b-4, c-1, d-3", "a-3, b-4, c-1, d-2", "a-2, b-1, c-4, d-3"], "a": 0, "ex": "அசைஇ – இளைப்பாறி; அல்கி – தங்கி; கடும்பு – சுற்றம்; ஆரி – அருமை."}, {"n": 79, "h": "<div class=\"stem\">அடிப்பகுதியைக் குறிக்கும் சொற்களை உரிய தாவரத்துடன் பொருத்துக.<\/div><table class=\"mt\"><tr><th>அடிவகை<\/th><th>தாவரம்<\/th><\/tr><tr><td>(a) தாள்<\/td><td>1. மூங்கில்<\/td><\/tr><tr><td>(b) தண்டு<\/td><td>2. சோளம்<\/td><\/tr><tr><td>(c) தட்டை<\/td><td>3. கீரை<\/td><\/tr><tr><td>(d) கழை<\/td><td>4. நெல்<\/td><\/tr><\/table>", "o": ["a-3, b-4, c-2, d-1", "a-4, b-3, c-2, d-1", "a-4, b-3, c-1, d-2", "a-3, b-4, c-1, d-2"], "a": 1, "ex": "தாள் – நெல், கேழ்வரகு; தண்டு – கீரை, வாழை; தட்டை – கம்பு, சோளம்; கழை – மூங்கில்."}, {"n": 80, "h": "<div class=\"stem\">‘நனி’ என்னும் சொல்லுக்கு இணையான பொருள்தரும் சொல் எது?<\/div>", "o": ["தவ", "பைய", "ஒல்லை", "மழ"], "a": 0, "ex": "உறு, தவ, நனி – மிகுதி; ஒல்லை – விரைவு; பைய – மெல்ல; மழ – இளமை."}], KEY='TNPSC-Tamil-Unit2-Sollagarathi-L10to13-SollumPorulum-InaiyanaSol-Kodittaidam-PoruthamanaPorul-80Q', SEC=36, L='ABCDE';

  clearInterval(tick);S=null;
  let h='<div class="card"><h1>பொதுத்தமிழ் – அலகு II : சொல்லகராதி</h1><div class="sub">10. சொல்லும் பொருளும் அறிதல் • 11. இணையான வேறு சொல் அறிதல் • 12. கோடிட்ட இடத்தில் சரியான சொல் • 13. பொருத்தமான பொருளைத் தெரிவு செய்தல்</div></div>';
  h+='<div class="card"><h2>தேர்வு விவரம்</h2><div>வினாக்கள்: <b>80</b> • நேரம்: <b>48 நிமிடங்கள்</b> • மதிப்பெண்: <b>80</b><br>நேரம் முடிந்ததும் விடைத்தாள் தானாகச் சமர்ப்பிக்கப்படும். தவறான விடைக்கு மதிப்பெண் குறைப்பு இல்லை. (E) தேர்வு விடையளிக்காததாகக் கணக்கிடப்படும். பக்கத்தை மூடினாலும் விடைகள் சேமிக்கப்படும்; நேரக் கணக்கு தொடர்ந்து ஓடும்.</div></div>';
  h+='<div class="card"><label>பெயர்<input id="nm" autocomplete="name" maxlength="60" placeholder="உங்கள் பெயர்"></label><label>கைபேசி எண்<input id="mb" type="tel" inputmode="numeric" maxlength="10" placeholder="10 இலக்க எண்"></label><div class="err" id="er"></div><button class="go" id="st" style="width:100%">தேர்வைத் தொடங்கு</button></div>';
  if(mem.hist.length){h+='<div class="card"><h2>சேமிக்கப்பட்ட தேர்வுகள்</h2>'+mem.hist.map((a,i)=>'<div class="hist">'+esc(a.name)+' • '+new Date(a.start).toLocaleString('en-IN')+' • <b>'+pick(a,'right').length+'/'+a.ids.length+'</b><div class="row"><button class="alt" data-v="'+i+'">முடிவைப் பார்</button><button class="alt" data-r="'+i+'">மீண்டும் எழுது</button></div></div>').join('')+'</div>'}
  app.innerHTML=h;
  const prev=mem.hist[0];if(prev){nm.value=prev.name;mb.value=prev.mobile}
  st.onclick=()=>{const n=nm.value.trim(),m=mb.value.trim();
    if(n.length<2){er.textContent='பெயரை உள்ளிடவும்.';return}
    if(!/^[6-9]\d{9}$/.test(m)){er.textContent='சரியான 10 இலக்கக் கைபேசி எண்ணை உள்ளிடவும்.';return}
    start(n,m,DATA.map(q=>q.n),'முழுத் தேர்வு')};
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>result(mem.hist[+b.dataset.v]));
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const a=mem.hist[+b.dataset.r];start(a.name,a.mobile,DATA.map(q=>q.n),'முழுத் தேர்வு')});
  scrollTo(0,0)}

function start(name,mobile,ids,mode){
  const now=Date.now();
  mem.cur={name,mobile,ids,mode,ans:{},time:{},mark:{},seen:{},i:0,start:now,end:now+ids.length*SEC*1000};
  save();run()}
function run(){S=mem.cur;last=Date.now();if(last>=S.end){submit(true);return}
  draw();clearInterval(tick);tick=setInterval(step,500)}
function account(){if(!S)return;const now=Math.min(Date.now(),S.end),n=S.ids[S.i];
  if(now>last)S.time[n]=(S.time[n]||0)+(now-last)/1000;last=now}
function step(){if(!S)return;if(!document.hidden)account();
  if(Date.now()>=S.end){submit(true);return}save();clock()}
function clock(){const left=(S.end-Date.now())/1000,c=document.getElementById('clk');if(!c)return;
  c.textContent=fmt(Math.ceil(left));c.closest('.bar').classList.toggle('low',left<=120);
  document.getElementById('qtm').textContent=fmt(Math.floor(S.time[S.ids[S.i]]||0))}
document.addEventListener('visibilitychange',()=>{if(!S)return;if(document.hidden){account();save()}else{last=Date.now();step()}});
addEventListener('pagehide',()=>{if(S){if(!document.hidden)account();save()}});

function draw(){
  const n=S.ids[S.i],q=Q(n),N=S.ids.length;S.seen[n]=1;
  const done=S.ids.filter(x=>S.ans[x]!==undefined).length;
  let h='<div class="bar"><span>வினா '+(S.i+1)+' / '+N+'<br>விடையளித்தவை: '+done+'</span><span>மீதி நேரம் <b id="clk"></b></span></div>';
  h+='<div class="card"><div class="qt"><span>'+esc(S.mode)+'</span><span>இவ்வினாவிற்கான நேரம்: <b id="qtm"></b></span></div>'+q.h;
  q.o.concat('விடை தெரியவில்லை').forEach((o,k)=>h+='<button class="opt'+(S.ans[n]===k?' sel':'')+'" data-k="'+k+'" aria-pressed="'+(S.ans[n]===k)+'">('+L[k]+') '+o+'</button>');
  h+='</div><div class="card"><div class="row"><button class="alt" id="pv"'+(S.i?'':' disabled')+'>◀ முந்தையது</button><button class="alt" id="nx"'+(S.i<N-1?'':' disabled')+'>அடுத்தது ▶</button></div><div class="row" style="margin-top:8px"><button class="alt" id="mk">'+(S.mark[n]?'குறியை நீக்கு':'மறுபார்வைக்குக் குறி')+'</button><button class="alt" id="cl">விடையை அழி</button><button class="go" id="sb">சமர்ப்பி</button></div></div>';
  h+='<div class="card"><div class="pal">'+S.ids.map((x,i)=>{let c=S.mark[x]?'mark':S.ans[x]!==undefined?'done':S.seen[x]?'skip':'';return '<button class="'+c+(i===S.i?' cur':'')+'" data-i="'+i+'">'+(i+1)+'</button>'}).join('')+'</div><div class="legend">பச்சை: விடையளித்தவை • மஞ்சள்: பார்த்தும் விடையளிக்காதவை • ஊதா: மறுபார்வை</div></div>';
  app.innerHTML=h;clock();
  const go=i=>{account();S.i=i;draw();save();scrollTo(0,0)};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(Date.now()>=S.end){submit(true);return}account();S.ans[n]=+b.dataset.k;save();const y=scrollY;draw();scrollTo(0,y)});
  pv.onclick=()=>go(S.i-1);nx.onclick=()=>go(S.i+1);
  mk.onclick=()=>{S.mark[n]=!S.mark[n];const y=scrollY;draw();save();scrollTo(0,y)};
  cl.onclick=()=>{delete S.ans[n];const y=scrollY;draw();save();scrollTo(0,y)};
  sb.onclick=()=>{const un=S.ids.length-S.ids.filter(x=>S.ans[x]!==undefined).length;
    modal('<h2>சமர்ப்பிக்கலாமா?</h2>விடையளிக்காத வினாக்கள்: <b>'+un+'</b>',[['தொடர்ந்து எழுது',null,'alt'],['சமர்ப்பி',()=>submit(false),'go']])};
  app.querySelectorAll('.pal button').forEach(b=>b.onclick=()=>go(+b.dataset.i))}

function submit(auto){
  if(!S)return;if(auto||!document.hidden)account();clearInterval(tick);closeModal();
  const a=S;a.done=Math.min(Date.now(),a.end);a.auto=auto;delete a.seen;delete a.mark;
  S=null;mem.cur=null;mem.hist.unshift(a);if(mem.hist.length>20)mem.hist.length=20;save();result(a);
  if(auto)modal('<h2>நேரம் முடிந்தது</h2>உங்கள் விடைகள் தானாகச் சமர்ப்பிக்கப்பட்டன.',[['முடிவைப் பார்']])}

function review(a,n){const q=Q(n),st=status(a,n),v=a.ans[n];
  let h='<div class="qt"><span><b>வினா '+(a.ids.indexOf(n)+1)+'</b> • '+(st==='right'?'✔ சரி':st==='wrong'?'✘ தவறு':'– விடையளிக்கவில்லை')+'</span><span>நேரம்: '+fmt(a.time[n]||0)+'</span></div>'+q.h;
  q.o.concat('விடை தெரியவில்லை').forEach((o,k)=>{h+='<div class="ro'+(k===q.a?' c':k===v&&st==='wrong'?' w':'')+'">('+L[k]+') '+o+(k===q.a?' ✔':'')+(k===v?' <b>[உங்கள் தேர்வு]</b>':'')+'</div>'});
  return h+'<div class="ex"><b>விளக்கம்:</b> '+q.ex+'</div>'}
function summary(a){const r=pick(a,'right').length,w=pick(a,'wrong').length,N=a.ids.length;
  return {r,w,u:N-r-w,N,used:(a.done-a.start)/1000,pc:(r*100/N).toFixed(1)}}
function result(a){
  clearInterval(tick);view='all';const m=summary(a);
  let h='<div class="card"><h1>தேர்வு முடிவு</h1><div class="sub">'+esc(a.name)+' • '+esc(a.mobile)+'<br>'+esc(a.mode)+' • '+new Date(a.start).toLocaleString('en-IN')+(a.auto?' • தானியங்கிச் சமர்ப்பிப்பு':'')+'</div><div class="score">'+m.r+' / '+m.N+'</div><div class="stats"><div><b>'+m.pc+'%</b>விழுக்காடு</div><div><b>'+m.w+'</b>தவறு</div><div><b>'+m.u+'</b>விடாதவை</div><div><b>'+fmt(m.used)+'</b>நேரம்</div></div></div>';
  h+='<div class="card"><h2>மீண்டும் எழுத</h2><div class="row">';
  [['all','முழுத் தேர்வு'],['answered','விடையளித்தவை'],['wrong','தவறானவை'],['skip','விடையளிக்காதவை']].forEach(([k,t])=>{const c=k==='all'?DATA.length:pick(a,k).length;h+='<button class="alt" data-re="'+k+'" data-t="'+t+'"'+(c?'':' disabled')+'>'+t+' ('+c+')</button>'});
  h+='</div><div class="row" style="margin-top:8px"><button class="go" id="pdf">தேர்வை PDF ஆகப் பதிவிறக்கு</button><button id="hm">முகப்பு</button></div><div class="legend">அச்சுத் திரையில் “Save as PDF” என்பதைத் தேர்ந்தெடுக்கவும். WhatsApp-க்குள் திறந்திருந்தால் Chrome உலாவியில் திறக்கவும்.</div></div>';
  h+='<div class="tabs" id="tb"></div><div id="list"></div>';
  app.innerHTML=h;
  const list=()=>{tb.innerHTML=[['all','அனைத்தும்'],['right','சரி'],['wrong','தவறு'],['skip','விடாதவை']].map(([k,t])=>'<button data-tab="'+k+'" class="'+(view===k?'on':'')+'">'+t+' ('+pick(a,k).length+')</button>').join('');
    const ids=pick(a,view);document.getElementById('list').innerHTML=ids.length?ids.map(n=>'<div class="card rv '+({right:'ok',wrong:'no'}[status(a,n)]||'')+'">'+review(a,n)+'</div>').join(''):'<div class="card">இப்பிரிவில் வினாக்கள் இல்லை.</div>';
    tb.querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.tab;list()})};
  list();
  app.querySelectorAll('[data-re]').forEach(b=>b.onclick=()=>{const k=b.dataset.re;start(a.name,a.mobile,k==='all'?DATA.map(q=>q.n):pick(a,k),k==='all'?'முழுத் தேர்வு':'மறுதேர்வு: '+b.dataset.t)});
  pdf.onclick=()=>printAttempt(a);hm.onclick=home;scrollTo(0,0)}
function printAttempt(a){
  const m=summary(a);
  let body='<div class="head"><b style="font-size:13pt">பொதுத்தமிழ் – அலகு II : சொல்லகராதி</b><br>10. சொல்லும் பொருளும் அறிதல் • 11. இணையான வேறு சொல் அறிதல் • 12. கோடிட்ட இடத்தில் சரியான சொல் • 13. பொருத்தமான பொருளைத் தெரிவு செய்தல்<br>பெயர்: <b>'+esc(a.name)+'</b> • கைபேசி: '+esc(a.mobile)+' • '+new Date(a.start).toLocaleString('en-IN')+'<br>'+esc(a.mode)+' • மதிப்பெண்: <b>'+m.r+' / '+m.N+'</b> ('+m.pc+'%) • தவறு: '+m.w+' • விடாதவை: '+m.u+' • நேரம்: '+fmt(m.used)+'</div><div class="cols">'+a.ids.map(n=>'<div class="q">'+review(a,n)+'</div>').join('')+'</div>';
  /* browsers without @page footer support get a repeating table footer */
  if(!('CSSMarginRule' in window))body='<table class="wrap"><tbody><tr><td>'+body+'</td></tr></tbody><tfoot><tr><td>ஒளிரும் வனவாசி அகாடமி, சேலம் (செல்:9789521578)</td></tr></tfoot></table>';
  document.getElementById('print').innerHTML=body;
  const t=document.title;document.title='TNPSC-Tamil-Unit2-Sollagarathi-L10to13-SollumPorulum-InaiyanaSol-Kodittaidam-PoruthamanaPorul-80Q-'+a.name.replace(/\s+/g,'-');
  addEventListener('afterprint',()=>{document.title=t},{once:true});
  setTimeout(()=>window.print(),150)}

if(mem.cur){const expired=Date.now()>=mem.cur.end;S=mem.cur;
  if(expired){last=S.end;submit(true)}else{run();modal('<h2>தேர்வு தொடர்கிறது</h2>சேமிக்கப்பட்ட உங்கள் தேர்வு மீட்கப்பட்டது.',[['தொடர்',null,'go']])}}
else home();
</script>
</body>
</html>
