      if(sel===i&&i!==q.ans){cls=' bad';tag='<span class="tag" style="color:#b3261e">✘ உங்கள் விடை / Your answer</span>'}
      else if(sel===i&&i===q.ans){tag='<span class="tag" style="color:#1b7a3d">✔ உங்கள் விடை / Your answer</span>'}
      h+='<div class="opt'+cls+'"><span class="ol">'+L+'</span><div>'+bi(o)+'</div>'+tag+'</div>';
    }
  });
  return h+'</div>';
}

/* ---------- state ---------- */
let S=null, tickH=null, cur=0, qEnter=0;
function save(){ if(S&&!S.submitted) lsSet(K_ACT,S) }
function newAttempt(user,qids,kind,parent){
  const now=Date.now();
  return {id:'A'+now,user:user,kind:kind,parent:parent||null,qids:qids,answers:{},times:{},marked:{},
    startAt:now,endAt:now+qids.length*SEC_PER_Q*1000,submitted:false,cur:0};
}

/* ---------- registration ---------- */
function showReg(){
  hideAll(); $('vReg').classList.remove('hide'); $('whoChip').style.display='none';
  const u=lsGet(K_USER,{name:'',mobile:''});
  const act=lsGet(K_ACT,null);
  const his=lsGet(K_HIS,[]);
  let h='';
  if(act&&!act.submitted){
    const left=Math.max(0,Math.round((act.endAt-Date.now())/1000));
    h+='<div class="card" style="border-color:#d6a100;background:var(--warnbg)"><h2 class="ta">பாதியில் நிற்கும் தேர்வு / Unfinished test</h2><div>'+esc(act.user.name)+' · '+act.qids.length+' Q · '+(left>0?'மீதி நேரம் / time left: <b>'+fmt(left)+'</b>':'நேரம் முடிந்தது / time is over')+'</div><div class="row" style="margin-top:8px"><button id="bResume">தொடர்க / Resume</button><button class="gray" id="bDrop">நீக்கு / Discard</button></div></div>';
  }
  h+='<div class="card"><h2 class="ta">தேர்வு விவரங்கள் / Test details</h2>'
   +'<ul class="info"><li class="ta">மொத்த வினாக்கள்: <b>'+Q.length+'</b> · நேரம்: <b>'+durTa(Q.length)+'</b></li>'
   +'<li class="en">'+Q.length+' questions · time allowed: '+durEn(Q.length)+' · auto-submits at time-up · no negative marking, 1 mark each</li>'
   +'<li class="ta">தேர்வுக்குப் பின் சரி / தவறு / விடையளிக்காதவை தனித்தனியாகப் பார்க்கலாம்; தவறியவற்றை மட்டும் மீண்டும் எழுதலாம்.</li>'
   +'<li class="ta">உங்கள் விடைகள் இந்தச் சாதனத்தில் தானாகச் சேமிக்கப்படும்; பக்கத்தை மூடினாலும் தேர்வைத் தொடரலாம்.</li></ul>'
   +'<label class="f ta" for="iName">பெயர் / Name</label><input type="text" id="iName" autocomplete="name" value="'+esc(u.name)+'">'
   +'<label class="f ta" for="iMob">கைப்பேசி எண் / Mobile</label><input type="tel" id="iMob" inputmode="numeric" maxlength="10" autocomplete="tel" value="'+esc(u.mobile)+'">'
   +'<div class="err" id="regErr"></div><div class="row"><button id="bStart">தேர்வைத் தொடங்கு / Start Test</button></div></div>';
  if(his.length){
    h+='<div class="card"><h2 class="ta">சேமித்த தேர்வுகள் / Saved attempts</h2><div style="overflow-x:auto"><table class="hist"><tr><th>#</th><th>Date</th><th>Type</th><th>Score</th><th>Time</th><th></th></tr>';
    his.slice().reverse().forEach((a,i)=>{
      h+='<tr><td>'+(his.length-i)+'</td><td>'+new Date(a.submittedAt).toLocaleString()+'</td><td>'+(a.kind==='full'?'Full / முழு':'Retake / மறு')+' ('+a.qids.length+')</td><td><b>'+a.score+'/'+a.qids.length+'</b></td><td>'+fmt(a.usedSec)+'</td><td><button class="sec" data-view="'+a.id+'" style="padding:4px 10px">View</button></td></tr>';
    });
    h+='</table></div></div>';
  }
  $('vReg').innerHTML=h;
  $('bStart').onclick=()=>{
    const name=$('iName').value.trim(), mob=$('iMob').value.trim();
    if(name.length<2){$('regErr').textContent='பெயரை உள்ளிடவும் / Enter your name';return}
    if(!/^[6-9]\d{9}$/.test(mob)){$('regErr').textContent='சரியான 10 இலக்க கைப்பேசி எண்ணை உள்ளிடவும் / Enter a valid 10-digit mobile number';return}
    const user={name:name,mobile:mob}; lsSet(K_USER,user);
    S=newAttempt(user,Q.map(q=>q.id),'full'); save(); startTest();
  };
  if($('bResume'))$('bResume').onclick=()=>{S=act;startTest()};
  if($('bDrop'))$('bDrop').onclick=()=>{lsDel(K_ACT);showReg()};
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const a=his.find(x=>x.id===b.dataset.view);showResult(a)});
}
function hideAll(){['vReg','vTest','vRes'].forEach(i=>$(i).classList.add('hide'));if(tickH){clearInterval(tickH);tickH=null}}

/* ---------- test ---------- */
function startTest(){
  hideAll(); $('vTest').classList.remove('hide');
  $('whoChip').style.display='';$('whoChip').textContent=S.user.name+' · '+S.user.mobile;
  cur=Math.min(S.cur||0,S.qids.length-1); qEnter=Date.now();
  $('vTest').innerHTML=
   '<div class="bar"><div class="in"><div>⏱ <span class="timer ta" id="tLeft"></span></div>'
   +'<span class="chip ta" id="tQ">இந்த வினா / This Q: 0:00</span><span class="chip" id="tTot">Elapsed 0:00</span>'
   +'<span class="chip" id="tAns"></span><div class="sp"></div><button class="red" id="bSubmit">சமர்ப்பி / Submit</button></div></div>'
   +'<div class="wrap"><div class="layout"><div class="card" id="qCard"></div><div><div class="card"><b class="ta">வினா பட்டியல் / Question palette</b><div class="pal" id="pal" style="margin-top:8px"></div><div class="legend ta">🟩 விடையளித்தது · 🟨 குறியிட்டது · எண்ணின் கீழ் = செலவிட்ட நேரம்<br>Green=answered · Yellow=marked · small text = time spent</div></div></div></div></div>';
  $('bSubmit').onclick=confirmSubmit;
  render(); tick(); tickH=setInterval(tick,1000);
  window.onbeforeunload=()=>{commit();save()};
  document.onvisibilitychange=()=>{if(document.hidden){commit();save()}};
}
function commit(){
  if(!S||S.submitted)return;
  const now=Date.now(), id=S.qids[cur];
  const lim=Math.min(now,S.endAt);
  const dt=Math.max(0,(lim-qEnter)/1000);
  S.times[id]=(S.times[id]||0)+dt; qEnter=now;
}
function tick(){
  if(!S||S.submitted)return;
  const now=Date.now(); const left=(S.endAt-now)/1000;
  if(left<=0){commit();doSubmit(true);return}
  commit();
  const t=$('tLeft'); if(t){t.textContent=fmt(left);t.classList.toggle('low',left<300)}
  const id=S.qids[cur];
  $('tQ').textContent='இந்த வினா / This Q: '+fmt(S.times[id]||0);
  $('tTot').textContent='Elapsed '+fmt((now-S.startAt)/1000);
  const n=Object.keys(S.answers).length;
  $('tAns').textContent='Answered '+n+'/'+S.qids.length;
  updPal();
  if(Math.round(now/1000)%5===0)save();
}
function updPal(){
  const p=$('pal'); if(!p)return;
  p.querySelectorAll('button').forEach((b,i)=>{
    const id=S.qids[i];
    b.className=(S.answers[id]!==undefined?'ans ':'')+(S.marked[id]?'mk ':'')+(i===cur?'cur':'');
    b.querySelector('small').textContent=fmt(S.times[id]||0);
  });
}
function render(){
  const id=S.qids[cur], q=QBY[id];
  const sel=S.answers[id];
  $('qCard').innerHTML='<div class="qno">வினா / Question '+(cur+1)+' of '+S.qids.length+'</div>'+body(q)+optsHTML(q,'test',sel,'o'+id)
   +'<div class="row" style="margin-top:10px"><button class="sec" id="bPrev"'+(cur===0?' disabled':'')+'>◀ முந்தைய / Prev</button><button class="sec" id="bNext"'+(cur===S.qids.length-1?' disabled':'')+'>அடுத்த / Next ▶</button><button class="gray" id="bClear">அழி / Clear</button><button class="gray" id="bMark">'+(S.marked[id]?'குறியை நீக்கு / Unmark':'குறியிடு / Mark')+'</button></div>';
  document.querySelectorAll('#qCard input[type=radio]').forEach(r=>r.onchange=()=>{S.answers[id]=+r.value;commit();save();render();updPal()});
  $('bPrev').onclick=()=>go(cur-1);$('bNext').onclick=()=>go(cur+1);
  $('bClear').onclick=()=>{delete S.answers[id];save();render();updPal()};
  $('bMark').onclick=()=>{if(S.marked[id])delete S.marked[id];else S.marked[id]=1;save();render();updPal()};
  if(!$('pal').children.length){
    S.qids.forEach((qid,i)=>{const b=document.createElement('button');b.innerHTML=(i+1)+'<small>0:00</small>';b.onclick=()=>go(i);$('pal').appendChild(b)});
  }
  updPal();
}
function go(i){ if(i<0||i>=S.qids.length)return; commit(); cur=i; S.cur=i; qEnter=Date.now(); save(); render(); window.scrollTo({top:0}); tick() }

function modal(html){ const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="box">'+html+'</div>';$('modalHost').appendChild(m);return m}
function confirmSubmit(){
  commit();
  const n=Object.keys(S.answers).length, t=S.qids.length;
  const m=modal('<h2 class="ta">தேர்வை சமர்ப்பிக்கவா? / Submit test?</h2><p>விடையளித்தவை / Answered: <b>'+n+'</b> · விடையளிக்காதவை / Unanswered: <b>'+(t-n)+'</b></p><div class="row"><button id="mY">சமர்ப்பி / Submit</button><button class="gray" id="mN">திரும்பு / Back</button></div>');
  m.querySelector('#mN').onclick=()=>m.remove();
  m.querySelector('#mY').onclick=()=>{m.remove();doSubmit(false)};
}
function doSubmit(auto){
  if(!S||S.submitted)return;
  if(tickH){clearInterval(tickH);tickH=null}
  commit();
  S.submitted=true; S.auto=!!auto;
  S.submittedAt=Date.now();
  S.usedSec=Math.min(S.submittedAt,S.endAt)-S.startAt; S.usedSec=Math.round(S.usedSec/1000);
  let r=0,w=0,u=0;
  S.qids.forEach(id=>{const a=S.answers[id];if(a===undefined)u++;else if(a===QBY[id].ans)r++;else w++});
  S.right=r;S.wrong=w;S.un=u;S.score=r;
  const his=lsGet(K_HIS,[]); his.push(S); lsSet(K_HIS,his); lsDel(K_ACT);
  window.onbeforeunload=null; document.onvisibilitychange=null;
  document.querySelectorAll('.modal').forEach(m=>m.remove());
  showResult(S,auto);
}

/* ---------- result ---------- */
function status(a,id){const x=a.answers[id];return x===undefined?'un':(x===QBY[id].ans?'ok':'bad')}
function reviewCard(a,id,num){
  const q=QBY[id], st=status(a,id), sel=a.answers[id];
  const lab={ok:['ok','✔ சரி / Right'],bad:['bad','✘ தவறு / Wrong'],un:['un','— விடையில்லை / Unanswered']}[st];
  return '<div class="rq"><div class="meta"><b style="color:var(--brand)">Q'+num+'</b><span class="badge '+lab[0]+'">'+lab[1]+'</span><span class="badge t">⏱ '+fmt(a.times[id]||0)+'</span><span class="chip">'+CHN[q.ch].split(' – ')[0]+'</span></div>'
   +body(q)+optsHTML(q,'review',sel)+'<div class="exp"><b>விளக்கம் / Explanation:</b><div class="ta">'+esc(q.exp.ta)+'</div><div class="en">'+esc(q.exp.en)+'</div></div></div>';
}
function showResult(a,auto){
  hideAll(); $('vRes').classList.remove('hide'); window.scrollTo({top:0});
  $('whoChip').style.display='';$('whoChip').textContent=a.user.name+' · '+a.user.mobile;
  const t=a.qids.length, pct=Math.round(a.right*1000/t)/10;
  const timeSum=a.qids.reduce((s,id)=>s+(a.times[id]||0),0);
  const chs={}; a.qids.forEach(id=>{const c=QBY[id].ch;chs[c]=chs[c]||{r:0,t:0};chs[c].t++;if(status(a,id)==='ok')chs[c].r++});
  let h='<div class="card"><h2 class="ta">தேர்வு முடிவு / Result'+(auto?' <span class="badge bad">நேரம் முடிந்ததால் தானாகச் சமர்ப்பிக்கப்பட்டது / auto-submitted</span>':'')+'</h2>'
   +'<div class="ta">'+esc(a.user.name)+' · '+esc(a.user.mobile)+' · '+new Date(a.submittedAt).toLocaleString()+'</div>'
   +'<div class="stats" style="margin-top:10px"><div class="stat"><b>'+a.right+' / '+t+'</b>மதிப்பெண் / Score ('+pct+'%)</div>'
   +'<div class="stat ok"><b>'+a.right+'</b>சரி / Right</div><div class="stat bad"><b>'+a.wrong+'</b>தவறு / Wrong</div><div class="stat un"><b>'+a.un+'</b>விடையில்லை / Unanswered</div>'
   +'<div class="stat"><b>'+fmt(a.usedSec)+'</b>மொத்த நேரம் / Total time</div><div class="stat"><b>'+fmt(timeSum/t)+'</b>சராசரி / Avg per Q</div></div>'
   +'<div style="margin-top:10px" class="en">'+Object.keys(chs).sort().map(c=>CHN[c]+': <b>'+chs[c].r+'/'+chs[c].t+'</b>').join(' · ')+'</div>'
   +'<div class="row" style="margin-top:12px"><button id="rFull">முழுத் தேர்வை மீண்டும் / Retake full test</button>'
   +'<button class="sec" id="rWU"'+((a.wrong+a.un)?'':' disabled')+'>தவறு + விடையில்லாதவை மட்டும் / Retake wrong &amp; unanswered ('+(a.wrong+a.un)+')</button>'
   +'<button class="sec" id="rPdf">PDF பதிவிறக்கம் / Download PDF</button><button class="gray" id="rHome">முகப்பு / Home</button></div>'
   +'<div class="en" style="font-size:.8rem;color:var(--mute);margin-top:6px">PDF: in the print dialog choose “Save as PDF”.</div></div>';
  h+='<div class="tabs" id="tabs"></div><div id="list"></div>';
  $('vRes').innerHTML=h;
  const tabs=[['all','அனைத்தும் / All',t],['ok','சரி / Right',a.right],['bad','தவறு / Wrong',a.wrong],['un','விடையில்லை / Unanswered',a.un]];
  let tab='all';
  function draw(){
    $('tabs').innerHTML=tabs.map(x=>'<button class="'+(tab===x[0]?'on':'')+'" data-t="'+x[0]+'">'+x[1]+' ('+x[2]+')</button>').join('');
    $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
    let out='';
    a.qids.forEach((id,i)=>{ if(tab==='all'||status(a,id)===tab) out+=reviewCard(a,id,i+1) });
    $('list').innerHTML=out||'<div class="card ta">இந்தப் பிரிவில் வினாக்கள் இல்லை / No questions here</div>';
  }
  draw();
  $('rFull').onclick=()=>{S=newAttempt(a.user,Q.map(q=>q.id),'full');save();startTest()};
  $('rWU').onclick=()=>{
    const ids=a.qids.filter(id=>status(a,id)!=='ok'); if(!ids.length)return;
    S=newAttempt(a.user,ids,'retake',a.id);save();startTest();
  };
  $('rPdf').onclick=()=>printAttempt(a);
  $('rHome').onclick=()=>showReg();
}
function printAttempt(a){
  const t=a.qids.length;
  let h='<h2>'+esc(document.title)+'</h2><div>'+esc(a.user.name)+' · '+esc(a.user.mobile)+' · '+new Date(a.submittedAt).toLocaleString()+'</div>'
   +'<div><b>Score '+a.right+'/'+t+'</b> · Right '+a.right+' · Wrong '+a.wrong+' · Unanswered '+a.un+' · Total time '+fmt(a.usedSec)+'</div><div class="cols">';
  a.qids.forEach((id,i)=>{h+=reviewCard(a,id,i+1)});
  h+='</div>';
  $('printArea').innerHTML=h;
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),100);
}

/* ---------- boot ---------- */
window.__app={Q:Q,state:()=>S,showReg:showReg};
showReg();
})();
</script>
</body>
