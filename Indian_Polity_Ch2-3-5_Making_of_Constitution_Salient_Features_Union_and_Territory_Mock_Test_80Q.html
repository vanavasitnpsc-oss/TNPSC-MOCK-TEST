:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2433;--mute:#5d6676;--line:#dcd8cb;--brand:#7a3b12;--brand2:#b4531a;--ok:#1b7a3d;--okbg:#e5f4ea;--bad:#b3261e;--badbg:#fbe9e7;--warn:#8a6100;--warnbg:#fff4d6;--sel:#e8f0fe}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'NotoSans','NotoTamil',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:64px;font-size:16px}
.ta{font-family:'NotoTamil','NotoSans',sans-serif}
.en{font-family:'NotoSans','NotoTamil',sans-serif;color:#2b3550;font-size:.95em}
.wrap{max-width:1000px;margin:0 auto;padding:12px 14px}
header.top{background:var(--brand);color:#fff;padding:10px 14px}
header.top .in{max-width:1000px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header.top h1{font-size:1.05rem;margin:0;font-weight:700}
header.top .sub{font-size:.8rem;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
h2{font-size:1.15rem;margin:.2em 0 .6em}
label.f{display:block;font-weight:700;margin:10px 0 4px}
input[type=text],input[type=tel]{width:100%;padding:11px;border:1px solid #b9b4a3;border-radius:8px;font-size:1rem;font-family:inherit}
button{font-family:inherit;font-size:.95rem;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--brand);color:#fff;font-weight:700}
button.sec{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
button.gray{background:#e9e6da;color:#333}
button.red{background:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}

 "ta": "இது 1947 ஆகஸ்ட் 29 அன்று அமைக்கப்பட்டது; இதில் ஏழு உறுப்பினர்கள் இருந்தனர்."}, {"en": "N. Madhava Rau replaced B.L. Mitter, and T.T. Krishnamachari replaced D.P. Khaitan after his death in 1948.", "ta": "பி.எல். மித்தருக்குப் பதிலாக என். மாதவ ராவும், 1948-ல் டி.பி. கைதான் மறைவுக்குப் பின் டி.டி. கிருஷ்ணமாச்சாரியும் நியமிக்கப்பட்டனர்."}, {"en": "The first draft was published in February 1948, and the public was given six months for comments.", "ta": "முதல் வரைவு 1948 பிப்ரவரியில் வெளியிடப்பட்டது; கருத்துத் தெரிவிக்கப் பொதுமக்களுக்கு ஆறு மாதங்கள் வழங்கப்பட்டன."}, {"en": "The second draft was published in October 1948.", "ta": "இரண்டாவது வரைவு 1948 அக்டோபரில் வெளியிடப்பட்டது."}], "ask": {"en": "Which of the statements given above is/are NOT correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை தவறானது/தவறானவை?"}, "opts": [{"en": "III and IV only", "ta": "III மற்றும் IV மட்டும்"}, {"en": "III only", "ta": "III மட்டும்"}, {"en": "II and III only", "ta": "II மற்றும் III மட்டும்"}, {"en": "I and III only", "ta": "I மற்றும் III மட்டும்"}], "ans": 1, "exp": {"en": "III is wrong: the public was given eight months to comment on the first draft.", "ta": "III தவறு: முதல் வரைவு குறித்துக் கருத்துத் தெரிவிக்கப் பொதுமக்களுக்கு எட்டு மாதங்கள் வழங்கப்பட்டன."}, "n": 4, "id": 4}, {"type": "stmt", "ch": "2", "d": "D", "src": "pyq", "stem": {"en": "Consider the following statements about the changes made by the Indian Independence Act, 1947:", "ta": "1947-ன் இந்திய சுதந்திரச் சட்டம் ஏற்படுத்திய மாற்றங்கள் குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "The Assembly became a fully sovereign body.", "ta": "சபை முழுமையான இறையாண்மை அமைப்பாக மாறியது."}, {"en": "The Assembly also became the Dominion Legislature, chaired by G.V. Mavalankar when it made ordinary laws.", "ta": "சபை டொமினியன் சட்டமன்றமாகவும் மாறியது; சாதாரணச் சட்டங்களை இயற்றும்போது ஜி.வி. மாவலங்கர் தலைமை தாங்கினார்."}, {"en": "After the Muslim League members from Pakistan areas withdrew, the strength fell from 389 to 229.", "ta": "பாகிஸ்தான் பகுதி முஸ்லிம் லீக் உறுப்பினர்கள் விலகிய பின் பலம் 389-லிருந்து 229 ஆகக் குறைந்தது."}], "ask": {"en": "Which of the statements given above is/are NOT correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை தவறானது/தவறானவை?"}, "opts": [{"en": "II only", "ta": "II மட்டும்"}, {"en": "I and III only", "ta": "I மற்றும் III மட்டும்"}, {"en": "II and III only", "ta": "II மற்றும் III மட்டும்"}, {"en": "III only", "ta": "III மட்டும்"}], "ans": 3, "exp": {"en": "III is wrong: strength fell from 389 to 299 (provinces 296→229; princely states 93→70).", "ta": "III தவறு: பலம் 389-லிருந்து 299 ஆகக் குறைந்தது (மாகாணங்கள் 296→229; சமஸ்தானங்கள் 93→70)."}, "n": 3, "id": 5}, {"type": "stmt", "ch": "2", "d": "D", "src": "new", "stem": {"en": "Consider the following statements regarding the enactment of the Constitution:", "ta": "அரசியலமைப்பு இயற்றப்பட்டது குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "Dr. Ambedkar introduced the final draft (first reading) on 4 November 1948.", "ta": "டாக்டர் அம்பேத்கர் இறுதி வரைவை (முதல் வாசிப்பு) 1948 நவம்பர் 4 அன்று அறிமுகப்படுத்தினார்."}, {"en": "The second reading ran from 15 November 1948 to 17 October 1949.", "ta": "இரண்டாம் வாசிப்பு 1948 நவம்பர் 15 முதல் 1949 அக்டோபர் 17 வரை நடந்தது."}, {"en": "The third reading began on 14 November 1949.", "ta": "மூன்றாம் வாசிப்பு 1949 நவம்பர் 14 அன்று தொடங்கியது."}, {"en": "Of the 299 members, 284 were present and signed on 26 November 1949.", "ta": "299 உறுப்பினர்களில் 284 பேர் 1949 நவம்பர் 26 அன்று கலந்துகொண்டு கையெழுத்திட்டனர்."}, {"en": "The total expenditure on framing the Constitution was ₹46 lakh.", "ta": "அரசியலமைப்பை உருவாக்கச் செலவான மொத்தத் தொகை ₹46 இலட்சம்."}], "ask": {"en": "Which of the statements given above is/are correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை சரியானது/சரியானவை?"}, "opts": [{"en": "II, III and IV only", "ta": "II, III மற்றும் IV மட்டும்"}, {"en": "I, II, III and IV only", "ta": "I, II, III மற்றும் IV மட்டும்"}, {"en": "I, II and III only", "ta": "I, II மற்றும் III மட்டும்"}, {"en": "I, II, III, IV and V only", "ta": "I, II, III, IV மற்றும் V மட்டும்"}], "ans": 1, "exp": {"en": "V is wrong: the total expenditure was ₹64 lakh.", "ta": "V தவறு: மொத்தச் செலவு ₹64 இலட்சம்."}, "n": 5, "id": 6}, {"type": "stmt", "ch": "5", "d": "M", "src": "new", "stem": {"en": "Consider the following statements about Union Territories:", "ta": "ஒன்றியப் பகுதிகள் குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "Delhi was given the special status of National Capital Territory by the 42nd Amendment Act.", "ta": "42-வது திருத்தச் சட்டத்தால் டெல்லிக்கு தேசியத் தலைநகர்ப் பகுதி என்ற சிறப்பு அந்தஸ்து வழங்கப்பட்டது."}, {"en": "Puducherry has a Legislative Assembly under Article 239A.", "ta": "உறுப்புரை 239A-ன் கீழ் புதுச்சேரிக்குச் சட்டமன்றம் உண்டு."}, {"en": "Delhi has its own High Court.", "ta": "டெல்லிக்குத் தனி உயர்நீதிமன்றம் உண்டு."}], "ask": {"en": "Which of the statements given above is/are correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை சரியானது/சரியானவை?"}, "opts": [{"en": "I, II and III only", "ta": "I, II மற்றும் III மட்டும்"}, {"en": "II and III only", "ta": "II மற்றும் III மட்டும்"}, {"en": "III only", "ta": "III மட்டும்"}, {"en": "II only", "ta": "II மட்டும்"}], "ans": 1, "exp": {"en": "I is wrong: the 69th Amendment (1991) inserted Art 239AA and made Delhi the NCT.", "ta": "I தவறு: 69-வது திருத்தம் (1991) உறுப்புரை 239AA-ஐச் சேர்த்து டெல்லியை தேசியத் தலைநகர்ப் பகுதியாக்கியது."}, "n": 3, "id": 7}, {"type": "ar", "ch": "5", "d": "M", "src": "pyq", "stem": {"en": "Read the following and choose the correct option.", "ta": "பின்வருவனவற்றைப் படித்துச் சரியான விடையைத் தேர்ந்தெடுக்கவும்."}, "A": {"en": "Parliament can form new States or alter the boundaries of existing States by an ordinary law, without a constitutional amendment.", "ta": "அரசியலமைப்புத் திருத்தம் இன்றி, சாதாரணச் சட்டத்தின் மூலம் புதிய மாநிலங்களை உருவாக்க அல்லது ஏற்கெனவே உள்ள மாநில எல்லைகளை மாற்ற நாடாளுமன்றத்தால் இயலும்."}, "R": {"en": "Article 4 provides that laws made under Articles 2 and 3 are not amendments of the Constitution under Article 368.", "ta": "உறுப்புரைகள் 2, 3-ன் கீழ் இயற்றும் சட்டங்கள் உறுப்புரை 368-ன் கீழான திருத்தங்களாகக் கருதப்படா என உறுப்புரை 4 கூறுகிறது."}, "opts": [{"en": "Both A and R are true, and R is the correct explanation of A", "ta": "A மற்றும் R இரண்டும் சரி; R என்பது A-க்கான சரியான விளக்கம்"}, {"en": "A is true, but R is false", "ta": "A சரி, ஆனால் R தவறு"}, {"en": "A is false, but R is true", "ta": "A தவறு, ஆனால் R சரி"}, {"en": "Both A and R are true, but R is not the correct explanation of A", "ta": "A மற்றும் R இரண்டும் சரி; ஆனால் R என்பது A-க்கான சரியான விளக்கமல்ல"}], "ans": 0, "exp": {"en": "Because of Art 4, such laws pass by a simple majority and need no special majority or State ratification.", "ta": "உறுப்புரை 4 காரணமாக, இத்தகைய சட்டங்கள் எளிய பெரும்பான்மையிலேயே நிறைவேறும்; சிறப்புப் பெரும்பான்மையோ மாநில ஒப்புதலோ தேவையில்லை."}, "id": 8}, {"type": "one", "ch": "3", "d": "M", "src": "new", "stem": {"en": "Consider the following statement:", "ta": "பின்வரும் கூற்றைக் கருதுக:"}, "item": {"en": "Part IX-A of the Constitution, relating to Municipalities, was added by the 73rd Amendment Act, 1992.", "ta": "நகராட்சிகள் தொடர்பான அரசியலமைப்பின் பகுதி IX-A, 1992-ன் 73-வது திருத்தச் சட்டத்தால் சேர்க்கப்பட்டது."}, "ask": {"en": "Which one of the following is correct about the statement given above?", "ta": "மேற்கண்ட கூற்று குறித்துச் சரியான விடையைத் தேர்ந்தெடுக்கவும்."}, "opts": [{"en": "The statement is correct", "ta": "கூற்று சரியானது"}, {"en": "Incorrect – it was added by the 74th Amendment Act, 1992", "ta": "தவறு – இது 1992-ன் 74-வது திருத்தச் சட்டத்தால் சேர்க்கப்பட்டது"}, {"en": "Incorrect – it was added by the 97th Amendment Act, 2011", "ta": "தவறு – இது 2011-ன் 97-வது திருத்தச் சட்டத்தால் சேர்க்கப்பட்டது"}, {"en": "Incorrect – it was added by the 42nd Amendment Act, 1976", "ta": "தவறு – இது 1976-ன் 42-வது திருத்தச் சட்டத்தால் சேர்க்கப்பட்டது"}], "ans": 1, "exp": {"en": "Part IX (Panchayats) – 73rd Amendment; Part IX-A (Municipalities, Arts 243-P to 243-ZG) – 74th Amendment (both 1992).", "ta": "பகுதி IX (பஞ்சாயத்துகள்) – 73-வது திருத்தம்; பகுதி IX-A (நகராட்சிகள், 243-P முதல் 243-ZG) – 74-வது திருத்தம் (இரண்டும் 1992)."}, "id": 9}, {"type": "match", "ch": "3", "d": "D", "src": "pyq", "stem": {"en": "Match the following:", "ta": "பின்வருவனவற்றைப் பொருத்துக:"}, "heads": [{"en": "Feature", "ta": "அம்சம்"}, {"en": "Source", "ta": "மூலம்"}], "left": [{"en": "Concurrent List", "ta": "பொதுப் பட்டியல்"}, {"en": "Procedure established by law", "ta": "சட்டத்தால் நிறுவப்பட்ட நடைமுறை"}, {"en": "Fundamental Duties", "ta": "அடிப்படைக் கடமைகள்"}, {"en": "Residuary powers with the Centre", "ta": "எஞ்சிய அதிகாரங்கள் மையத்திடம்"}], "right": [{"en": "Japan", "ta": "ஜப்பான்"}, {"en": "Canada", "ta": "கனடா"}, {"en": "Australia", "ta": "ஆஸ்திரேலியா"}, {"en": "USSR", "ta": "சோவியத் ஒன்றியம்"}], "opts": [{"en": "a-3  b-4  c-1  d-2", "ta": "a-3  b-4  c-1  d-2"}, {"en": "a-4  b-1  c-3  d-2", "ta": "a-4  b-1  c-3  d-2"}, {"en": "a-3  b-1  c-2  d-4", "ta": "a-3  b-1  c-2  d-4"}, {"en": "a-3  b-1  c-4  d-2", "ta": "a-3  b-1  c-4  d-2"}], "ans": 3, "exp": {"en": "Concurrent List – Australia; Procedure established by law – Japan; Fundamental Duties – USSR; Residuary powers with Centre – Canada.", "ta": "பொதுப் பட்டியல் – ஆஸ்திரேலியா; சட்டத்தால் நிறுவப்பட்ட நடைமுறை – ஜப்பான்; அடிப்படைக் கடமைகள் – சோவியத் ஒன்றியம்; எஞ்சிய அதிகாரம் – கனடா."}, "id": 10}, {"type": "stmt", "ch": "5", "d": "D", "src": "pyq", "stem": {"en": "Consider the following statements about the reorganisation of States on a linguistic basis:", "ta": "மொழிவாரி மாநில மறுசீரமைப்பு குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "The Dar Commission (1948) recommended reorganisation on the basis of administrative convenience rather than language.", "ta": "தார் ஆணையம் (1948) மொழியை அல்லாமல் நிர்வாக வசதியை அடிப்படையாகக் கொண்ட மறுசீரமைப்பைப் பரிந்துரைத்தது."}, {"en": "The JVP Committee (1948) rejected language as the basis of reorganisation at that time.", "ta": "JVP குழு (1948) அப்போதைக்கு மொழியை மறுசீரமைப்பின் அடிப்படையாக ஏற்க மறுத்தது."}, {"en": "The States Reorganisation Commission was appointed in 1953 and submitted its report in 1953 itself.", "ta": "மாநில மறுசீரமைப்பு ஆணையம் 1953-ல் அமைக்கப்பட்டு, அதே 1953-லேயே அறிக்கை சமர்ப்பித்தது."}], "ask": {"en": "Which of the statements given above is/are correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை சரியானது/சரியானவை?"}, "opts": [{"en": "I and II only", "ta": "I மற்றும் II மட்டும்"}, {"en": "I, II and III only", "ta": "I, II மற்றும் III மட்டும்"}, {"en": "I only", "ta": "I மட்டும்"}, {"en": "II only", "ta": "II மட்டும்"}], "ans": 0, "exp": {"en": "III is wrong: the SRC (Fazl Ali, K.M. Panikkar, H.N. Kunzru) was appointed in December 1953 and reported in September 1955.", "ta": "III தவறு: ஆணையம் (ஃபசல் அலி, கே.எம். பணிக்கர், ஹெச்.என். குன்ஸ்ரு) 1953 டிசம்பரில் அமைக்கப்பட்டு 1955 செப்டம்பரில் அறிக்கை அளித்தது."}, "n": 3, "id": 11}, {"type": "stmt", "ch": "5", "d": "D", "src": "pyq", "stem": {"en": "Consider the following statements about the classification of States in the Constitution as it stood in 1950:", "ta": "1950-ல் இருந்தவாறு அரசியலமைப்பிலுள்ள மாநிலப் பிரிவுகள் குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "Part A comprised 9 States, headed by Governors.", "ta": "பகுதி A-ல் 9 மாநிலங்கள் இருந்தன; அவற்றின் தலைவர் ஆளுநர்."}, {"en": "Part B comprised 8 States, headed by Rajpramukhs.", "ta": "பகுதி B-ல் 8 மாநிலங்கள் இருந்தன; அவற்றின் தலைவர் இராஜபிரமுகர்."}, {"en": "Part C comprised 10 States, administered by Rajpramukhs.", "ta": "பகுதி C-ல் 10 மாநிலங்கள் இருந்தன; இராஜபிரமுகர்கள் நிர்வகித்தனர்."}, {"en": "Part D comprised the Andaman and Nicobar Islands and Lakshadweep.", "ta": "பகுதி D-ல் அந்தமான் நிக்கோபார் தீவுகளும் இலட்சத்தீவுகளும் இருந்தன."}], "ask": {"en": "Which of the statements given above is/are NOT correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை தவறானது/தவறானவை?"}, "opts": [{"en": "IV only", "ta": "IV மட்டும்"}, {"en": "I, III and IV only", "ta": "I, III மற்றும் IV மட்டும்"}, {"en": "III and IV only", "ta": "III மற்றும் IV மட்டும்"}, {"en": "II, III and IV only", "ta": "II, III மற்றும் IV மட்டும்"}], "ans": 2, "exp": {"en": "III wrong: Part C States were administered by Chief Commissioners (Rajpramukhs headed Part B). IV wrong: Part D consisted of the Andaman and Nicobar Islands alone.", "ta": "III தவறு: பகுதி C மாநிலங்களைத் தலைமை ஆணையர்கள் நிர்வகித்தனர் (பகுதி B-க்குத் தலைவர் இராஜபிரமுகர்). IV தவறு: பகுதி D-ல் அந்தமான் நிக்கோபார் தீவுகள் மட்டுமே இருந்தன."}, "n": 4, "id": 12}, {"type": "stmt", "ch": "3", "d": "D", "src": "pyq", "stem": {"en": "Consider the following statements about the sources of the Indian Constitution:", "ta": "இந்திய அரசியலமைப்பின் மூலங்கள் குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "The Concurrent List is borrowed from the Constitution of Australia.", "ta": "பொதுப் பட்டியல் ஆஸ்திரேலிய அரசியலமைப்பிலிருந்து பெறப்பட்டது."}, {"en": "The Emergency provisions are borrowed from the Weimar Constitution of Germany.", "ta": "நெருக்கடிநிலை ஏற்பாடுகள் ஜெர்மனியின் வெய்மார் அரசியலமைப்பிலிருந்து பெறப்பட்டன."}, {"en": "The procedure for amendment of the Constitution and the election of members of the Rajya Sabha are borrowed from the Constitution of Ireland.", "ta": "அரசியலமைப்புத் திருத்த நடைமுறையும் மாநிலங்களவை உறுப்பினர் தேர்தல் முறையும் அயர்லாந்து அரசியலமைப்பிலிருந்து பெறப்பட்டவை."}, {"en": "The language of the Preamble, freedom of trade, commerce and intercourse, and the Joint Sitting of Parliament are borrowed from the Constitution of Australia.", "ta": "முகவுரையின் மொழிநடை, வணிகம்-வர்த்தகம்-தொடர்பு சுதந்திரம், நாடாளுமன்றக் கூட்டுக் கூட்டம் ஆகியவை ஆஸ்திரேலிய அரசியலமைப்பிலிருந்து பெறப்பட்டவை."}], "ask": {"en": "Which of the statements given above is/are correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை சரியானது/சரியானவை?"}, "opts": [{"en": "II and IV only", "ta": "II மற்றும் IV மட்டும்"}, {"en": "I, II and IV only", "ta": "I, II மற்றும் IV மட்டும்"}, {"en": "I and IV only", "ta": "I மற்றும் IV மட்டும்"}, {"en": "I and II only", "ta": "I மற்றும் II மட்டும்"}], "ans": 1, "exp": {"en": "III is wrong: both are borrowed from South Africa (Ireland gave DPSP, nomination of RS members and the Presidential election method). IV is correct: Australia gave the Concurrent List, freedom of trade, Joint Sitting and the Preamble’s language.", "ta": "III தவறு: இவ்விரண்டும் தென்னாப்பிரிக்காவிலிருந்து பெறப்பட்டவை (அயர்லாந்து அளித்தது: வழிகாட்டு நெறிமுறைகள், மாநிலங்களவை நியமனம், குடியரசுத் தலைவர் தேர்தல் முறை). IV சரி: ஆஸ்திரேலியாவிடமிருந்து பொதுப் பட்டியல், வணிக சுதந்திரம், கூட்டுக் கூட்டம், முகவுரை மொழிநடை."}, "n": 4, "id": 13}, {"type": "single", "ch": "2", "d": "D", "src": "pyq", "stem": {"en": "Which one of the following was NOT a member of the Drafting Committee of the Constituent Assembly?", "ta": "அரசியலமைப்பு நிர்ணய சபையின் வரைவுக் குழுவில் உறுப்பினராக இல்லாதவர் கீழ்க்கண்டவர்களில் யார்?"}, "opts": [{"en": "T.T. Krishnamachari", "ta": "டி.டி. கிருஷ்ணமாச்சாரி"}, {"en": "Syed Mohammad Saadullah", "ta": "சையது முகமது சாதுல்லா"}, {"en": "N. Madhava Rau", "ta": "என். மாதவ ராவ்"}, {"en": "V.T. Krishnamachari", "ta": "வி.டி. கிருஷ்ணமாச்சாரி"}], "ans": 3, "exp": {"en": "V.T. Krishnamachari was a Vice-President of the Assembly; T.T. Krishnamachari (not V.T.) joined the Drafting Committee.", "ta": "வி.டி. கிருஷ்ணமாச்சாரி சபையின் துணைத் தலைவர்; வரைவுக் குழுவில் இருந்தவர் டி.டி. கிருஷ்ணமாச்சாரி."}, "id": 14}, {"type": "match", "ch": "3", "d": "D", "src": "pyq", "stem": {"en": "Match the following:", "ta": "பின்வருவனவற்றைப் பொருத்துக:"}, "heads": [{"en": "Language(s) added to Eighth Schedule", "ta": "எட்டாவது அட்டவணையில் சேர்க்கப்பட்ட மொழி(கள்)"}, {"en": "Amendment", "ta": "திருத்தம்"}], "left": [{"en": "Sindhi", "ta": "சிந்தி"}, {"en": "Konkani, Manipuri, Nepali", "ta": "கொங்கணி, மணிப்புரி, நேபாளி"}, {"en": "Bodo, Dogri, Maithili, Santhali", "ta": "போடோ, டோக்ரி, மைதிலி, சந்தாலி"}, {"en": "Odia (renamed from Oriya)", "ta": "ஒடியா (ஒரியாவிலிருந்து பெயர் மாற்றம்)"}], "right": [{"en": "96th Amendment, 2011", "ta": "96-வது திருத்தம், 2011"}, {"en": "21st Amendment, 1967", "ta": "21-வது திருத்தம், 1967"}, {"en": "92nd Amendment, 2003", "ta": "92-வது திருத்தம், 2003"}, {"en": "71st Amendment, 1992", "ta": "71-வது திருத்தம், 1992"}], "opts": [{"en": "a-3  b-4  c-2  d-1", "ta": "a-3  b-4  c-2  d-1"}, {"en": "a-4  b-2  c-3  d-1", "ta": "a-4  b-2  c-3  d-1"}, {"en": "a-1  b-4  c-3  d-2", "ta": "a-1  b-4  c-3  d-2"}, {"en": "a-2  b-4  c-3  d-1", "ta": "a-2  b-4  c-3  d-1"}], "ans": 3, "exp": {"en": "14 original languages + Sindhi (21st) + 3 (71st) + 4 (92nd) = 22; the 96th Amendment only renamed Oriya as Odia.", "ta": "14 மூல மொழிகள் + சிந்தி (21) + 3 (71) + 4 (92) = 22; 96-வது திருத்தம் ஒரியாவை ஒடியா எனப் பெயர்மாற்றம் மட்டுமே செய்தது."}, "id": 15}, {"type": "match", "ch": "2", "d": "D", "src": "pyq", "stem": {"en": "Match the following:", "ta": "பின்வருவனவற்றைப் பொருத்துக:"}, "heads": [{"en": "Committee", "ta": "குழு"}, {"en": "Chairman", "ta": "தலைவர்"}], "left": [{"en": "Union Powers Committee", "ta": "ஒன்றிய அதிகாரக் குழு"}, {"en": "Provincial Constitution Committee", "ta": "மாகாண அரசியலமைப்புக் குழு"}, {"en": "Rules of Procedure Committee", "ta": "நடைமுறை விதிகள் குழு"}, {"en": "Fundamental Rights Sub-Committee", "ta": "அடிப்படை உரிமைகள் துணைக்குழு"}], "right": [{"en": "J.B. Kripalani", "ta": "ஜே.பி. கிருபளானி"}, {"en": "Jawaharlal Nehru", "ta": "ஜவஹர்லால் நேரு"}, {"en": "Sardar Vallabhbhai Patel", "ta": "சர்தார் வல்லபாய் படேல்"}, {"en": "Dr. Rajendra Prasad", "ta": "டாக்டர் இராஜேந்திர பிரசாத்"}], "opts": [{"en": "a-2  b-3  c-4  d-1", "ta": "a-2  b-3  c-4  d-1"}, {"en": "a-2  b-3  c-1  d-4", "ta": "a-2  b-3  c-1  d-4"}, {"en": "a-2  b-4  c-3  d-1", "ta": "a-2  b-4  c-3  d-1"}, {"en": "a-4  b-3  c-2  d-1", "ta": "a-4  b-3  c-2  d-1"}], "ans": 0, "exp": {"en": "Nehru – Union Powers, Union Constitution, States; Patel – Provincial Constitution & Rights advisory; Prasad – Rules of Procedure, Steering; Kripalani – FR sub-committee.", "ta": "நேரு – ஒன்றிய அதிகாரம், ஒன்றிய அரசியலமைப்பு, மாநிலங்கள் குழுக்கள்; படேல் – மாகாண அரசியலமைப்பு, உரிமைகள் ஆலோசனைக் குழு; பிரசாத் – நடைமுறை விதிகள், வழிநடத்தல் குழு; கிருபளானி – அடிப்படை உரிமைகள் துணைக்குழு."}, "id": 16}, {"type": "stmt", "ch": "5", "d": "D", "src": "new", "stem": {"en": "Consider the following statements:", "ta": "பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "Article 4 declares that laws made under Articles 2 and 3 are not to be deemed amendments of the Constitution under Article 368.", "ta": "உறுப்புரைகள் 2, 3-ன் கீழ் இயற்றப்படும் சட்டங்கள் உறுப்புரை 368-ன் கீழான அரசியலமைப்புத் திருத்தங்களாகக் கருதப்படாது என உறுப்புரை 4 கூறுகிறது."}, {"en": "Parliament can cede a part of Indian territory to a foreign country by an ordinary law under Article 3.", "ta": "உறுப்புரை 3-ன் கீழ் சாதாரணச் சட்டத்தின் மூலம் இந்தியப் பகுதியின் ஒரு பகுதியை வெளிநாட்டுக்கு நாடாளுமன்றம் வழங்கலாம்."}], "ask": {"en": "Which of the statements given above is/are NOT correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை தவறானது/தவறானவை?"}, "opts": [{"en": "Both I and II", "ta": "I மற்றும் II இரண்டும்"}, {"en": "I only", "ta": "I மட்டும்"}, {"en": "II only", "ta": "II மட்டும்"}, {"en": "Neither I nor II", "ta": "இரண்டும் அல்ல"}], "ans": 2, "exp": {"en": "II is wrong: ceding territory requires a constitutional amendment under Article 368 (Berubari case, 1960).", "ta": "II தவறு: ஆட்சிப்பரப்பை வழங்க உறுப்புரை 368-ன் கீழ் அரசியலமைப்புத் திருத்தம் தேவை (பெருபாரி வழக்கு, 1960)."}, "n": 2, "id": 17}, {"type": "stmt", "ch": "3", "d": "D", "src": "new", "stem": {"en": "Consider the following statements about the 97th Constitutional Amendment Act, 2011:", "ta": "2011-ன் 97-வது அரசியலமைப்புத் திருத்தச் சட்டம் குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "It added Part IX-B to the Constitution relating to co-operative societies.", "ta": "இது கூட்டுறவுச் சங்கங்கள் தொடர்பான பகுதி IX-B-ஐ அரசியலமைப்பில் சேர்த்தது."}, {"en": "Part IX-B contains Articles 243-P to 243-ZG.", "ta": "பகுதி IX-B-ல் உறுப்புரைகள் 243-P முதல் 243-ZG வரை உள்ளன."}], "ask": {"en": "Which of the statements given above is/are NOT correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை தவறானது/தவறானவை?"}, "opts": [{"en": "Neither I nor II", "ta": "இரண்டும் அல்ல"}, {"en": "Both I and II", "ta": "I மற்றும் II இரண்டும்"}, {"en": "II only", "ta": "II மட்டும்"}, {"en": "I only", "ta": "I மட்டும்"}], "ans": 2, "exp": {"en": "II is wrong: Articles 243-P to 243-ZG are in Part IX-A (Municipalities); Part IX-B has Articles 243-ZH to 243-ZT.", "ta": "II தவறு: 243-P முதல் 243-ZG வரை பகுதி IX-A (நகராட்சிகள்); பகுதி IX-B-ல் 243-ZH முதல் 243-ZT வரை உள்ளன."}, "n": 2, "id": 18}, {"type": "ar", "ch": "3", "d": "D", "src": "new", "stem": {"en": "Read the following and choose the correct option.", "ta": "பின்வருவனவற்றைப் படித்துச் சரியான விடையைத் தேர்ந்தெடுக்கவும்."}, "A": {"en": "The Indian Constitution is a blend of rigidity and flexibility.", "ta": "இந்திய அரசியலமைப்பு இறுக்கமும் நெகிழ்வும் கலந்த ஒன்றாகும்."}, "R": {"en": "All provisions of the Constitution can be amended by a simple majority of Parliament.", "ta": "அரசியலமைப்பின் அனைத்து ஏற்பாடுகளையும் நாடாளுமன்றம் எளிய பெரும்பான்மையால் திருத்தலாம்."}, "opts": [{"en": "A is false, but R is true", "ta": "A தவறு, ஆனால் R சரி"}, {"en": "Both A and R are true, and R is the correct explanation of A", "ta": "A மற்றும் R இரண்டும் சரி; R என்பது A-க்கான சரியான விளக்கம்"}, {"en": "Both A and R are true, but R is not the correct explanation of A", "ta": "A மற்றும் R இரண்டும் சரி; ஆனால் R என்பது A-க்கான சரியான விளக்கமல்ல"}, {"en": "A is true, but R is false", "ta": "A சரி, ஆனால் R தவறு"}], "ans": 3, "exp": {"en": "A is true (some provisions by simple majority, others by special majority, others also need State ratification). R is false.", "ta": "A சரி (சில ஏற்பாடுகள் எளிய பெரும்பான்மை, சில சிறப்புப் பெரும்பான்மை, சில மாநில ஒப்புதலுடன்). R தவறு."}, "id": 19}, {"type": "single", "ch": "3", "d": "M", "src": "new", "stem": {"en": "The idea of the Directive Principles of State Policy in the Indian Constitution is borrowed from the Constitution of ______.", "ta": "இந்திய அரசியலமைப்பிலுள்ள அரசு நெறிப்படுத்தும் கோட்பாடுகள் என்ற கருத்து ______ அரசியலமைப்பிலிருந்து பெறப்பட்டது."}, "opts": [{"en": "Canada", "ta": "கனடா"}, {"en": "Australia", "ta": "ஆஸ்திரேலியா"}, {"en": "Ireland", "ta": "அயர்லாந்து"}, {"en": "Germany", "ta": "ஜெர்மனி"}], "ans": 2, "exp": {"en": "DPSP – Ireland (also nomination of Rajya Sabha members and the method of electing the President).", "ta": "வழிகாட்டு நெறிமுறைகள் – அயர்லாந்து (மேலும் மாநிலங்களவை உறுப்பினர் நியமனம், குடியரசுத் தலைவர் தேர்தல் முறை)."}, "id": 20}, {"type": "stmt", "ch": "2", "d": "D", "src": "new", "stem": {"en": "Consider the following statements about the Hindi text of the Constitution:", "ta": "அரசியலமைப்பின் இந்தி மொழிப் பதிப்பு குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "The Constitution (Fifty-eighth Amendment) Act, 1987 authorised the President to publish an authoritative Hindi text of the Constitution.", "ta": "1987-ன் அரசியலமைப்பு (ஐம்பத்தெட்டாவது திருத்தம்) சட்டம், அரசியலமைப்பின் அதிகாரபூர்வ இந்தி உரையை வெளியிட குடியரசுத் தலைவருக்கு அதிகாரம் அளித்தது."}, {"en": "The 58th Amendment Act inserted Article 394-A in Part XXI of the Constitution.", "ta": "58-வது திருத்தச் சட்டம் அரசியலமைப்பின் பகுதி XXI-ல் உறுப்புரை 394-A-ஐச் சேர்த்தது."}], "ask": {"en": "Which of the statements given above is/are correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை சரியானது/சரியானவை?"}, "opts": [{"en": "I only", "ta": "I மட்டும்"}, {"en": "Both I and II", "ta": "I மற்றும் II இரண்டும்"}, {"en": "Neither I nor II", "ta": "இரண்டும் அல்ல"}, {"en": "II only", "ta": "II மட்டும்"}], "ans": 0, "exp": {"en": "Article 394-A (authoritative Hindi text) was inserted in Part XXII, not Part XXI.", "ta": "உறுப்புரை 394-A (இந்தி அதிகாரபூர்வ உரை) சேர்க்கப்பட்டது பகுதி XXII-ல்; பகுதி XXI-ல் அல்ல."}, "n": 2, "id": 21}, {"type": "pair", "ch": "5", "d": "D", "src": "pyq", "stem": {"en": "Consider the following pairs of States and their year of formation:", "ta": "மாநிலங்களும் அவை உருவான ஆண்டும் அடங்கிய பின்வரும் இணைகளைக் கருதுக:"}, "heads": [{"en": "State", "ta": "மாநிலம்"}, {"en": "Year", "ta": "ஆண்டு"}], "rows": [{"l": {"en": "Sikkim", "ta": "சிக்கிம்"}, "r": {"en": "1975", "ta": "1975"}}, {"l": {"en": "Goa", "ta": "கோவா"}, "r": {"en": "1987", "ta": "1987"}}, {"l": {"en": "Mizoram", "ta": "மிசோரம்"}, "r": {"en": "1986", "ta": "1986"}}, {"l": {"en": "Telangana", "ta": "தெலங்கானா"}, "r": {"en": "2014", "ta": "2014"}}], "ask": {"en": "Which of the above pairs is/are NOT correctly matched?", "ta": "மேற்கண்ட இணைகளில் எது/எவை சரியாகப் பொருந்தவில்லை?"}, "opts": [{"en": "3 only", "ta": "3 மட்டும்"}, {"en": "3 and 4 only", "ta": "3 மற்றும் 4 மட்டும்"}, {"en": "1 and 3 only", "ta": "1 மற்றும் 3 மட்டும்"}, {"en": "2 and 3 only", "ta": "2 மற்றும் 3 மட்டும்"}], "ans": 0, "exp": {"en": "Mizoram attained statehood in 1987 (the 53rd Amendment Act was of 1986, effective 1987).", "ta": "மிசோரம் 1987-ல் மாநில அந்தஸ்து பெற்றது (53-வது திருத்தச் சட்டம் 1986-ல்; அமலுக்கு வந்தது 1987)."}, "id": 22}, {"type": "match", "ch": "3", "d": "M", "src": "new", "stem": {"en": "Match the following:", "ta": "பின்வருவனவற்றைப் பொருத்துக:"}, "heads": [{"en": "Amendment", "ta": "திருத்தம்"}, {"en": "Provision", "ta": "ஏற்பாடு"}], "left": [{"en": "7th Amendment, 1956", "ta": "7-வது திருத்தம், 1956"}, {"en": "24th Amendment, 1971", "ta": "24-வது திருத்தம், 1971"}, {"en": "44th Amendment, 1978", "ta": "44-வது திருத்தம், 1978"}, {"en": "101st Amendment, 2016", "ta": "101-வது திருத்தம், 2016"}], "right": [{"en": "Goods and Services Tax", "ta": "சரக்கு மற்றும் சேவை வரி"}, {"en": "Reorganisation of States; abolished Part A/B/C/D classification", "ta": "மாநில மறுசீரமைப்பு; A/B/C/D பிரிவு ஒழிப்பு"}, {"en": "Right to property removed from Fundamental Rights", "ta": "சொத்துரிமை அடிப்படை உரிமையிலிருந்து நீக்கம்"}, {"en": "Parliament’s power to amend Fundamental Rights affirmed", "ta": "அடிப்படை உரிமைகளைத் திருத்தும் நாடாளுமன்ற அதிகாரம் உறுதி"}], "opts": [{"en": "a-4  b-2  c-3  d-1", "ta": "a-4  b-2  c-3  d-1"}, {"en": "a-1  b-4  c-3  d-2", "ta": "a-1  b-4  c-3  d-2"}, {"en": "a-2  b-1  c-3  d-4", "ta": "a-2  b-1  c-3  d-4"}, {"en": "a-2  b-4  c-3  d-1", "ta": "a-2  b-4  c-3  d-1"}], "ans": 3, "exp": {"en": "7th – States reorganisation; 24th – Art 13 & 368 amended; 44th – Art 300-A; 101st – GST (Art 246A, 279A).", "ta": "7-வது – மாநில மறுசீரமைப்பு; 24-வது – உறுப்புரை 13, 368 திருத்தம்; 44-வது – உறுப்புரை 300-A; 101-வது – GST (246A, 279A)."}, "id": 23}, {"type": "stmt", "ch": "2", "d": "D", "src": "new", "stem": {"en": "Consider the following statements about the criticism of the Constituent Assembly:", "ta": "அரசியலமைப்பு நிர்ணய சபை மீதான விமர்சனங்கள் குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "Naziruddin Ahmed called the Drafting Committee a ‘Drifting Committee’.", "ta": "நசீருதீன் அகமது வரைவுக் குழுவை ‘Drifting Committee’ (அலைபாயும் குழு) என்றார்."}, {"en": "Granville Austin described the Assembly as ‘a body of Hindus’.", "ta": "கிரன்வில் ஆஸ்டின் சபையை ‘இந்துக்களின் அமைப்பு’ என்று வர்ணித்தார்."}, {"en": "Winston Churchill remarked that it represented only one major community of India.", "ta": "இந்தியாவின் ஒரே ஒரு பெரிய சமூகத்தையே அது பிரதிநிதித்துவப்படுத்துகிறது என வின்ஸ்டன் சர்ச்சில் குறிப்பிட்டார்."}], "ask": {"en": "Which of the statements given above is/are correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை சரியானது/சரியானவை?"}, "opts": [{"en": "I only", "ta": "I மட்டும்"}, {"en": "III only", "ta": "III மட்டும்"}, {"en": "I and III only", "ta": "I மற்றும் III மட்டும்"}, {"en": "I, II and III only", "ta": "I, II மற்றும் III மட்டும்"}], "ans": 2, "exp": {"en": "‘A body of Hindus’ was Viscount Simon’s remark; Austin said ‘The Assembly was the Congress and the Congress was India’.", "ta": "‘இந்துக்களின் அமைப்பு’ என்றவர் விஸ்கவுண்ட் சைமன்; ஆஸ்டின் கூறியது ‘சபையே காங்கிரஸ், காங்கிரஸே இந்தியா’."}, "n": 3, "id": 24}, {"type": "stmt", "ch": "2", "d": "M", "src": "new", "stem": {"en": "Consider the following statements about the composition of the Constituent Assembly under the Cabinet Mission Plan:", "ta": "அமைச்சரவைத் தூதுக்குழுத் திட்டத்தின் கீழ் அமைந்த அரசியலமைப்பு நிர்ணய சபையின் அமைப்பு குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "Its total strength was 389, of which 296 seats were for British India and 93 for the Princely States.", "ta": "மொத்த பலம் 389; அதில் பிரிட்டிஷ் இந்தியாவுக்கு 296, சமஸ்தானங்களுக்கு 93 இடங்கள்."}, {"en": "In the July–August 1946 elections, the Congress won 208 and the Muslim League 73 of the 296 seats.", "ta": "1946 ஜூலை–ஆகஸ்ட் தேர்தலில் 296 இடங்களில் காங்கிரஸ் 208, முஸ்லிம் லீக் 73 இடங்களைப் பெற்றன."}, {"en": "Its members were directly elected by the people on the basis of adult franchise.", "ta": "உறுப்பினர்கள் வயது வந்தோர் வாக்குரிமை அடிப்படையில் மக்களால் நேரடியாகத் தேர்ந்தெடுக்கப்பட்டனர்."}], "ask": {"en": "Which of the statements given above is/are correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை சரியானது/சரியானவை?"}, "opts": [{"en": "I, II and III only", "ta": "I, II மற்றும் III மட்டும்"}, {"en": "II only", "ta": "II மட்டும்"}, {"en": "I and II only", "ta": "I மற்றும் II மட்டும்"}, {"en": "I only", "ta": "I மட்டும்"}], "ans": 2, "exp": {"en": "III is wrong: members were indirectly elected by the provincial assemblies (limited franchise); princely-state members were nominated.", "ta": "III தவறு: உறுப்பினர்கள் மாகாணச் சட்டமன்றங்களால் (வரையறுக்கப்பட்ட வாக்குரிமை) மறைமுகமாகத் தேர்ந்தெடுக்கப்பட்டனர்; சமஸ்தானப் பிரதிநிதிகள் நியமிக்கப்பட்டனர்."}, "n": 3, "id": 25}, {"type": "stmt", "ch": "2", "d": "D", "src": "pyq", "stem": {"en": "Consider the following statements about the work of the Constituent Assembly:", "ta": "அரசியலமைப்பு நிர்ணய சபையின் பணிகள் குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "It held 11 sessions in all.", "ta": "மொத்தம் 11 அமர்வுகள் நடைபெற்றன."}, {"en": "It took 2 years, 11 months and 18 days to frame the Constitution.", "ta": "அரசியலமைப்பை உருவாக்க 2 ஆண்டுகள், 11 மாதங்கள், 18 நாட்கள் ஆயின."}, {"en": "The draft Constitution was considered for 114 days.", "ta": "வரைவு அரசியலமைப்பு 114 நாட்கள் பரிசீலிக்கப்பட்டது."}, {"en": "The Drafting Committee sat for 114 days.", "ta": "வரைவுக் குழு 114 நாட்கள் கூடியது."}], "ask": {"en": "Which of the statements given above is/are NOT correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை தவறானது/தவறானவை?"}, "opts": [{"en": "I and IV only", "ta": "I மற்றும் IV மட்டும்"}, {"en": "IV only", "ta": "IV மட்டும்"}, {"en": "III and IV only", "ta": "III மற்றும் IV மட்டும்"}, {"en": "II and IV only", "ta": "II மற்றும் IV மட்டும்"}], "ans": 1, "exp": {"en": "IV is wrong: the Drafting Committee sat for 141 days (the draft Constitution was considered for 114 days).", "ta": "IV தவறு: வரைவுக் குழு 141 நாட்கள் கூடியது (வரைவு அரசியலமைப்பு 114 நாட்கள் பரிசீலிக்கப்பட்டது)."}, "n": 4, "id": 26}, {"type": "pair", "ch": "3", "d": "D", "src": "new", "stem": {"en": "Consider the following pairs of Schedules and their content:", "ta": "அட்டவணைகளும் அவற்றின் உள்ளடக்கமும் அடங்கிய பின்வரும் இணைகளைக் கருதுக:"}, "heads": [{"en": "Schedule", "ta": "அட்டவணை"}, {"en": "Content", "ta": "உள்ளடக்கம்"}], "rows": [{"l": {"en": "First Schedule", "ta": "முதல் அட்டவணை"}, "r": {"en": "Names of States and Union Territories and their territorial jurisdiction", "ta": "மாநிலங்கள், ஒன்றியப் பகுதிகளின் பெயர்களும் ஆட்சி எல்லையும்"}}, {"l": {"en": "Third Schedule", "ta": "மூன்றாம் அட்டவணை"}, "r": {"en": "Forms of Oaths and Affirmations", "ta": "பதவிப் பிரமாணம் மற்றும் உறுதிமொழி படிவங்கள்"}}, {"l": {"en": "Fourth Schedule", "ta": "நான்காம் அட்டவணை"}, "r": {"en": "Allocation of seats in the Lok Sabha", "ta": "மக்களவை இடங்களின் ஒதுக்கீடு"}}, {"l": {"en": "Seventh Schedule", "ta": "ஏழாம் அட்டவணை"}, "r": {"en": "Union, State and Concurrent Lists", "ta": "ஒன்றியம், மாநிலம், பொதுப் பட்டியல்கள்"}}], "ask": {"en": "Which of the above pairs is/are correctly matched?", "ta": "மேற்கண்ட இணைகளில் எது/எவை சரியாகப் பொருந்தியுள்ளது/பொருந்தியுள்ளன?"}, "opts": [{"en": "1, 2 and 4 only", "ta": "1, 2 மற்றும் 4 மட்டும்"}, {"en": "2 and 4 only", "ta": "2 மற்றும் 4 மட்டும்"}, {"en": "1 and 2 only", "ta": "1 மற்றும் 2 மட்டும்"}, {"en": "1, 2, 3 and 4 only", "ta": "1, 2, 3 மற்றும் 4 மட்டும்"}], "ans": 0, "exp": {"en": "The Fourth Schedule allocates seats in the Rajya Sabha (not the Lok Sabha).", "ta": "நான்காம் அட்டவணை மாநிலங்களவை இடங்களை ஒதுக்குகிறது (மக்களவை அல்ல)."}, "id": 27}, {"type": "single", "ch": "2", "d": "M", "src": "new", "stem": {"en": "Who was the first to put forward, in 1934, the idea of a Constituent Assembly for India?", "ta": "இந்தியாவுக்கு அரசியலமைப்பு நிர்ணய சபை என்ற கருத்தை 1934-ல் முதன்முதலில் முன்வைத்தவர் யார்?"}, "opts": [{"en": "Motilal Nehru", "ta": "மோதிலால் நேரு"}, {"en": "Jawaharlal Nehru", "ta": "ஜவஹர்லால் நேரு"}, {"en": "Sir Stafford Cripps", "ta": "சர் ஸ்டாஃபோர்டு கிரிப்ஸ்"}, {"en": "M.N. Roy", "ta": "எம்.என். ராய்"}], "ans": 3, "exp": {"en": "M.N. Roy proposed it in 1934; the INC officially demanded it in 1935; the British accepted it in principle in the August Offer (1940).", "ta": "1934-ல் எம்.என். ராய் இக்கருத்தை முன்வைத்தார்; 1935-ல் காங்கிரஸ் அதிகாரபூர்வமாகக் கோரியது; 1940 ஆகஸ்ட் கொடையில் பிரிட்டிஷ் அரசு கொள்கையளவில் ஏற்றது."}, "id": 28}, {"type": "single", "ch": "2", "d": "D", "src": "new", "stem": {"en": "Which one of the following sets of Articles came into force on 26 November 1949 itself?", "ta": "பின்வரும் உறுப்புரைத் தொகுப்புகளில் எது 1949 நவம்பர் 26 அன்றே நடைமுறைக்கு வந்தது?"}, "opts": [{"en": "5, 6, 7, 8, 9, 60, 324, 366, 367, 379, 380, 388, 391, 392, 394", "ta": "5, 6, 7, 8, 9, 60, 324, 366, 367, 379, 380, 388, 391, 392, 394"}, {"en": "5, 6, 7, 8, 9, 61, 324, 366, 367, 379, 380, 388, 391, 392, 393", "ta": "5, 6, 7, 8, 9, 61, 324, 366, 367, 379, 380, 388, 391, 392, 393"}, {"en": "5, 6, 7, 8, 9, 60, 326, 366, 367, 379, 380, 388, 391, 392, 393", "ta": "5, 6, 7, 8, 9, 60, 326, 366, 367, 379, 380, 388, 391, 392, 393"}, {"en": "5, 6, 7, 8, 9, 60, 324, 366, 367, 379, 380, 388, 391, 392, 393", "ta": "5, 6, 7, 8, 9, 60, 324, 366, 367, 379, 380, 388, 391, 392, 393"}], "ans": 3, "exp": {"en": "These cover citizenship, elections, provisional Parliament, and temporary/transitional provisions & short title; the rest (incl. Art 394 – commencement) began on 26 Jan 1950.", "ta": "குடியுரிமை, தேர்தல், இடைக்கால நாடாளுமன்றம், தற்காலிக/மாறுகால ஏற்பாடுகள், சுருக்கத் தலைப்பு தொடர்பான இவை 1949 நவ. 26 அன்று அமலுக்கு வந்தன; மற்றவை (உறுப்புரை 394 உட்பட) 1950 ஜன. 26 முதல்."}, "id": 29}, {"type": "match", "ch": "5", "d": "D", "src": "new", "stem": {"en": "Match the following:", "ta": "பின்வருவனவற்றைப் பொருத்துக:"}, "heads": [{"en": "Article", "ta": "உறுப்புரை"}, {"en": "Provision", "ta": "ஏற்பாடு"}], "left": [{"en": "Article 2A", "ta": "உறுப்புரை 2A"}, {"en": "Article 239AA", "ta": "உறுப்புரை 239AA"}, {"en": "Article 240", "ta": "உறுப்புரை 240"}, {"en": "Article 241", "ta": "உறுப்புரை 241"}], "right": [{"en": "High Courts for Union Territories", "ta": "ஒன்றியப் பகுதிகளுக்கான உயர்நீதிமன்றங்கள்"}, {"en": "Sikkim as Associate State (since repealed)", "ta": "சிக்கிம் இணைப்பு மாநிலம் (பின்னர் நீக்கம்)"}, {"en": "President’s power to make regulations for certain Union Territories", "ta": "சில ஒன்றியப் பகுதிகளுக்கு விதிகள் இயற்றும் குடியரசுத் தலைவரின் அதிகாரம்"}, {"en": "Special provisions for Delhi", "ta": "டெல்லிக்கான சிறப்பு ஏற்பாடுகள்"}], "opts": [{"en": "a-2  b-4  c-3  d-1", "ta": "a-2  b-4  c-3  d-1"}, {"en": "a-2  b-3  c-4  d-1", "ta": "a-2  b-3  c-4  d-1"}, {"en": "a-2  b-1  c-3  d-4", "ta": "a-2  b-1  c-3  d-4"}, {"en": "a-1  b-4  c-3  d-2", "ta": "a-1  b-4  c-3  d-2"}], "ans": 0, "exp": {"en": "2A – Sikkim; 239AA – Delhi NCT (69th Am.); 240 – regulations (A&N, Lakshadweep, DNH&DD, Puducherry); 241 – High Courts for UTs.", "ta": "2A – சிக்கிம்; 239AA – டெல்லி (69-வது); 240 – விதிகள் (அந்தமான், இலட்சத்தீவு, DNH&DD, புதுச்சேரி); 241 – ஒ.பகுதிகளின் உயர்நீதிமன்றங்கள்."}, "id": 30}, {"type": "stmt", "ch": "5", "d": "M", "src": "new", "stem": {"en": "Consider the following statements about Article 3:", "ta": "உறுப்புரை 3 குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "A Bill under Article 3 can be introduced in Parliament only on the recommendation of the President.", "ta": "உறுப்புரை 3-ன் கீழான மசோதாவை குடியரசுத் தலைவரின் பரிந்துரையுடன் மட்டுமே நாடாளுமன்றத்தில் அறிமுகப்படுத்த முடியும்."}, {"en": "The President is bound to accept the views expressed by the concerned State Legislature on the Bill.", "ta": "சம்பந்தப்பட்ட மாநிலச் சட்டமன்றம் தெரிவிக்கும் கருத்துகளை குடியரசுத் தலைவர் ஏற்கக் கடமைப்பட்டவர்."}], "ask": {"en": "Which of the statements given above is/are correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை சரியானது/சரியானவை?"}, "opts": [{"en": "I only", "ta": "I மட்டும்"}, {"en": "Both I and II", "ta": "I மற்றும் II இரண்டும்"}, {"en": "Neither I nor II", "ta": "இரண்டும் அல்ல"}, {"en": "II only", "ta": "II மட்டும்"}], "ans": 0, "exp": {"en": "II is wrong: the President (and Parliament) is not bound by the State Legislature’s views, which are only advisory.", "ta": "II தவறு: மாநிலச் சட்டமன்றத்தின் கருத்து ஆலோசனை மட்டுமே; குடியரசுத் தலைவரோ நாடாளுமன்றமோ அதை ஏற்கக் கடமைப்பட்டவர் அல்லர்."}, "n": 2, "id": 31}, {"type": "single", "ch": "5", "d": "M", "src": "pyq", "stem": {"en": "Which of the following became the 16th State of the Indian Union in 1963?", "ta": "1963-ல் இந்திய ஒன்றியத்தின் 16-வது மாநிலமாக உருவானது பின்வருவனவற்றுள் எது?"}, "opts": [{"en": "Himachal Pradesh", "ta": "இமாச்சலப் பிரதேசம்"}, {"en": "Haryana", "ta": "ஹரியானா"}, {"en": "Nagaland", "ta": "நாகாலாந்து"}, {"en": "Gujarat", "ta": "குஜராத்"}], "ans": 2, "exp": {"en": "Gujarat (15th, 1960), Nagaland (16th, 1963 – 13th Amendment, Art 371A), Haryana (17th, 1966), Himachal Pradesh (18th, 1971).", "ta": "குஜராத் (15, 1960), நாகாலாந்து (16, 1963 – 13-வது திருத்தம், உறுப்புரை 371A), ஹரியானா (17, 1966), இமாச்சலப் பிரதேசம் (18, 1971)."}, "id": 32}, {"type": "stmt", "ch": "5", "d": "D", "src": "pyq", "stem": {"en": "Consider the following statements about Sikkim:", "ta": "சிக்கிம் குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "The 35th Amendment Act, 1974 made Sikkim an Associate State of the Indian Union.", "ta": "1974-ன் 35-வது திருத்தச் சட்டம் சிக்கிமை இந்திய ஒன்றியத்தின் இணைப்பு மாநிலமாக்கியது."}, {"en": "The 35th Amendment added Article 2A and the Tenth Schedule.", "ta": "35-வது திருத்தம் உறுப்புரை 2A-வையும் பத்தாவது அட்டவணையையும் சேர்த்தது."}, {"en": "The 36th Amendment Act, 1975 made Sikkim a full-fledged State and inserted Article 371F.", "ta": "1975-ன் 36-வது திருத்தச் சட்டம் சிக்கிமை முழு மாநிலமாக்கி உறுப்புரை 371F-ஐச் சேர்த்தது."}, {"en": "Sikkim became the 21st State of the Union.", "ta": "சிக்கிம் ஒன்றியத்தின் 21-வது மாநிலமாக ஆனது."}], "ask": {"en": "Which of the statements given above is/are correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை சரியானது/சரியானவை?"}, "opts": [{"en": "I and III only", "ta": "I மற்றும் III மட்டும்"}, {"en": "I, II and III only", "ta": "I, II மற்றும் III மட்டும்"}, {"en": "II and III only", "ta": "II மற்றும் III மட்டும்"}, {"en": "I, II, III and IV only", "ta": "I, II, III மற்றும் IV மட்டும்"}], "ans": 1, "exp": {"en": "IV is wrong: Sikkim became the 22nd State.", "ta": "IV தவறு: சிக்கிம் 22-வது மாநிலமாக ஆனது."}, "n": 4, "id": 33}, {"type": "stmt", "ch": "2", "d": "D", "src": "new", "stem": {"en": "Consider the following statements about the Objectives Resolution:", "ta": "நோக்கத் தீர்மானம் (Objectives Resolution) குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "It was moved by Jawaharlal Nehru on 13 December 1946.", "ta": "இது 1946 டிசம்பர் 13 அன்று ஜவஹர்லால் நேருவால் முன்மொழியப்பட்டது."}, {"en": "It was unanimously adopted by the Assembly on 22 January 1947.", "ta": "இது 1947 ஜனவரி 22 அன்று சபையால் ஒருமனதாக ஏற்கப்பட்டது."}, {"en": "It described India as an ‘Independent Sovereign Socialist Republic’.", "ta": "இது இந்தியாவை ‘சுதந்திர இறையாண்மை சமதர்மக் குடியரசு’ எனக் குறிப்பிட்டது."}, {"en": "Its modified version forms the Preamble of the present Constitution.", "ta": "இதன் மாற்றியமைக்கப்பட்ட வடிவமே தற்போதைய அரசியலமைப்பின் முகவுரை ஆகும்."}], "ask": {"en": "Which of the statements given above is/are NOT correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை தவறானது/தவறானவை?"}, "opts": [{"en": "III and IV only", "ta": "III மற்றும் IV மட்டும்"}, {"en": "I and III only", "ta": "I மற்றும் III மட்டும்"}, {"en": "II and III only", "ta": "II மற்றும் III மட்டும்"}, {"en": "III only", "ta": "III மட்டும்"}], "ans": 3, "exp": {"en": "III is wrong: the Resolution said ‘Independent Sovereign Republic’; ‘Socialist’ was added to the Preamble only by the 42nd Amendment (1976).", "ta": "III தவறு: தீர்மானம் ‘சுதந்திர இறையாண்மைக் குடியரசு’ என்றே கூறியது; ‘சமதர்மம்’ 1976-ன் 42-வது திருத்தத்தால்தான் முகவுரையில் சேர்ந்தது."}, "n": 4, "id": 34}, {"type": "match", "ch": "5", "d": "D", "src": "new", "stem": {"en": "Match the following:", "ta": "பின்வருவனவற்றைப் பொருத்துக:"}, "heads": [{"en": "Territory", "ta": "பகுதி"}, {"en": "Mode of integration with India", "ta": "இந்தியாவுடன் இணைந்த முறை"}], "left": [{"en": "Junagarh", "ta": "ஜுனாகத்"}, {"en": "Hyderabad", "ta": "ஹைதராபாத்"}, {"en": "Goa", "ta": "கோவா"}, {"en": "Puducherry", "ta": "புதுச்சேரி"}], "right": [{"en": "Treaty of Cession (1956, ratified 1962)", "ta": "ஒப்படைப்பு ஒப்பந்தம் (1956; 1962-ல் உறுதி)"}, {"en": "Plebiscite (1948)", "ta": "பொது வாக்கெடுப்பு (1948)"}, {"en": "Military operation (1961)", "ta": "இராணுவ நடவடிக்கை (1961)"}, {"en": "Police Action (1948)", "ta": "காவல்துறை நடவடிக்கை (1948)"}], "opts": [{"en": "a-3  b-4  c-2  d-1", "ta": "a-3  b-4  c-2  d-1"}, {"en": "a-4  b-2  c-3  d-1", "ta": "a-4  b-2  c-3  d-1"}, {"en": "a-2  b-4  c-3  d-1", "ta": "a-2  b-4  c-3  d-1"}, {"en": "a-2  b-3  c-4  d-1", "ta": "a-2  b-3  c-4  d-1"}], "ans": 2, "exp": {"en": "Junagarh – plebiscite; Hyderabad – Operation Polo (police action); Goa – Operation Vijay; Puducherry – de facto 1954, treaty 1956, de jure 1962.", "ta": "ஜுனாகத் – வாக்கெடுப்பு; ஹைதராபாத் – ஆபரேஷன் போலோ; கோவா – ஆபரேஷன் விஜய்; புத  [{"en": "The statement is correct", "ta": "கூற்று சரியானது"}, {"en": "Incorrect – the Mission had four members, including Lord Wavell", "ta": "தவறு – தூதுக்குழுவில் லார்டு வேவல் உட்பட நான்கு உறுப்பினர்கள் இருந்தனர்"}, {"en": "Incorrect – the plan was published on 3 June 1946", "ta": "தவறு – திட்டம் 1946 ஜூன் 3 அன்று வெளியிடப்பட்டது"}, {"en": "Incorrect – Lord Mountbatten was a member in place of A.V. Alexander", "ta": "தவறு – ஏ.வி. அலெக்ஸாண்டருக்குப் பதிலாக லார்டு மவுண்ட்பேட்டன் உறுப்பினராக இருந்தார்"}], "ans": 0, "exp": {"en": "Correct: the Mission reached India on 24 March 1946 and published its plan on 16 May 1946. (The Mountbatten Plan is of 3 June 1947.)", "ta": "சரி: தூதுக்குழு 1946 மார்ச் 24 அன்று இந்தியா வந்து, 1946 மே 16 அன்று திட்டத்தை வெளியிட்டது. (மவுண்ட்பேட்டன் திட்டம் 1947 ஜூன் 3.)"}, "id": 37}, {"type": "single", "ch": "3", "d": "M", "src": "new", "stem": {"en": "The Fundamental Duties were incorporated in the Constitution on the recommendation of which Committee?", "ta": "அடிப்படைக் கடமைகள் எந்தக் குழுவின் பரிந்துரையின் பேரில் அரசியலமைப்பில் சேர்க்கப்பட்டன?"}, "opts": [{"en": "Swaran Singh Committee", "ta": "சர்தார் ஸ்வரண் சிங் குழு"}, {"en": "Sarkaria Commission", "ta": "சர்க்காரியா ஆணையம்"}, {"en": "Ashok Mehta Committee", "ta": "அசோக் மேத்தா குழு"}, {"en": "Balwant Rai Mehta Committee", "ta": "பல்வந்த்ராய் மேத்தா குழு"}], "ans": 0, "exp": {"en": "Swaran Singh Committee (1976) → Part IV-A, Article 51A by the 42nd Amendment; the 11th duty was added by the 86th Amendment (2002).", "ta": "ஸ்வரண் சிங் குழு (1976) → 42-வது திருத்தத்தால் பகுதி IV-A, உறுப்புரை 51A; 11-வது கடமை 86-வது திருத்தத்தால் (2002) சேர்க்கப்பட்டது."}, "id": 38}, {"type": "pair", "ch": "5", "d": "D", "src": "new", "stem": {"en": "Consider the following pairs of Commissions/Committees/Cases and their associations:", "ta": "ஆணையங்கள்/குழுக்கள்/வழக்குகளும் அவற்றின் தொடர்புகளும் அடங்கிய பின்வரும் இணைகளைக் கருதுக:"}, "heads": [{"en": "Commission / Committee / Case", "ta": "ஆணையம் / குழு or Delhi.", "ta": "10 – தாத்ரா நாகர் ஹவேலி (போர்ச்சுகீசியர்); 12 – கோவா, டாமன் டையு; 14 – புதுச்சேரி (பிரெஞ்சு) + உறுப்புரை 239A; 69 – டெல்லிக்கு 239AA."}, "id": 41}, {"type": "single", "ch": "2", "d": "M", "src": "new", "stem": {"en": "Which one of the following Acts was NOT repealed when the Constitution commenced on 26 January 1950?", "ta": "1950 ஜனவரி 26-ல் அரசியலமைப்பு நடைமுறைக்கு வந்தபோது ரத்து செய்யப்படாத சட்டம் பின்வருவனவற்றில் எது?"}, "opts": [{"en": "Enactments amending or supplementing the 1935 Act", "ta": "1935 சட்டத்தைத் திருத்திய/துணைசெய்த சட்டங்கள்"}, {"en": "Indian Independence Act, 1947", "ta": "1947-ன் இந்திய சுதந்திரச் சட்டம்"}, {"en": "Abolition of Privy Council Jurisdiction Act, 1949", "ta": "1949-ன் பிரிவி கவுன்சில் அதிகாரவரம்பு ஒழிப்புச் சட்டம்"}, {"en": "Government of India Act, 1935", "ta": "1935-ன் இந்திய அரசுச் சட்டம்"}], "ans": 2, "exp": {"en": "The Independence Act 1947, the GoI Act 1935 and its amending enactments were repealed; the Privy Council Jurisdiction Abolition Act 1949 was continued.", "ta": "1947 சுதந்திரச் சட்டம், 1935 அரசுச் சட்டம் மற்றும் அதனைத் திருத்திய சட்டங்கள் ரத்தாயின; 1949-ன் பிரிவி கவுன்சில் ஒழிப்புச் சட்டம் தொடர்ந்தது."}, "id": 42}, {"type": "ar", "ch": "3", "d": "M", "src": "pyq", "stem": {"en": "Read the following and choose the correct option.", "ta": "பின்வருவனவற்றைப் படித்துச் சரியான விடையைத் தேர்ந்தெடுக்கவும்."}, "A": {"en": "The Indian Constitution describes India as a ‘Union of States’ and not as a ‘Federation of States’.", "ta": "இந்திய அரசியலமைப்பு இந்தியாவை ‘மாநிலங்களின் கூட்டமைப்பு’ என்று அல்லாமல் ‘மாநிலங்களின் ஒன்றியம்’ என்று குறிப்பிடுகிறது."}, "R": {"en": "The Indian Federation is not the result of an agreement among the States, and the States have no right to secede from it.", "ta": "இந்தியக் கூட்டாட்சி மாநிலங்களுக்கிடையிலான ஒப்பந்தத்தின் விளைவு அல்ல; மேலும் மாநிலங்களுக்கு அதிலிருந்து பிரிந்து செல்லும் உரிமை இல்லை."}, "opts": [{"en": "A is false, but R is true", "ta": "A தவறு, ஆனால் R சரி"}, {"en": "Both A and R are true, but R is not the correct explanation of A", "ta": "A மற்றும் R இரண்டும் சரி; ஆனால் R என்பது A-க்கான சரியான விளக்கமல்ல"}, {"en": "Both A and R are true, and R is the correct explanation of A", "ta": "A மற்றும் R இரண்டும் சரி; R என்பது A-க்கான சரியான விளக்கம்"}, {"en": "A is true, but R is false", "ta": "A சரி, ஆனால் R தவறு"}], "ans": 2, "exp": {"en": "Dr. Ambedkar explained this in the Constituent Assembly: the Federation is indestructible and States cannot secede.", "ta": "டாக்டர் அம்பேத்கர் அரசியலமைப்பு நிர்ணய சபையில் விளக்கியபடி, இந்தியக் கூட்டாட்சி அழிக்க முடியாதது; மாநிலங்கள் பிரிய முடியாது."}, "id": 43}, {"type": "one", "ch": "2", "d": "D", "src": "new", "stem": {"en": "Consider the following statement:", "ta": "பின்வரும் கூற்றைக் கருதுக:"}, "item": {"en": "The original Constitution was handwritten in a flowing italic style by Nandalal Bose.", "ta": "அசல் அரசியலமைப்பு சாய்வு எழுத்து நடையில் நந்தலால் போஸால் கையால் எழுதப்பட்டது."}, "ask": {"en": "Which one of the following is correct about the statement given above?", "ta": "மேற்கண்ட கூற்று குறித்துச் சரியான விடையைத் தேர்ந்தெடுக்கவும்."}, "opts": [{"en": "The statement is correct", "ta": "கூற்று சரியானது"}, {"en": "Incorrect – it was written by Prem Behari Narain Raizada; Nandalal Bose decorated it", "ta": "தவறு – இதை எழுதியவர் பிரேம் பிஹாரி நாராயண் ரைசாடா; நந்தலால் போஸ் அலங்கரித்தார்"}, {"en": "Incorrect – it was written by Vasant Krishan Vaidya", "ta": "தவறு – இதை எழுதியவர் வசந்த் கிருஷ்ண வைத்யா"}, {"en": "Incorrect – it was written by Beohar Rammanohar Sinha", "ta": "தவறு – இதை எழுதியவர் பியோஹர் ராம்மனோகர் சின்ஹா"}], "ans": 1, "exp": {"en": "Raizada wrote the original; Nandalal Bose and Beohar Rammanohar Sinha (Santiniketan artists) decorated it; Vasant Krishan Vaidya wrote the Hindi version.", "ta": "அசல் பிரதியை எழுதியவர் ரைசாடா; சாந்திநிகேதன் கலைஞர்கள் நந்தலால் போஸ், பியோஹர் ராம்மனோகர் சின்ஹா அலங்கரித்தனர்; இந்திப் பதிப்பை எழுதியவர் வசந்த் கிருஷ்ண வைத்யா."}, "id": 44}, {"type": "stmt", "ch": "3", "d": "D", "src": "pyq", "stem": {"en": "Consider the following statements about the Schedules of the Constitution:", "ta": "அரசியலமைப்பின் அட்டவணைகள் குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "The Tenth Schedule (anti-defection) was added by the 52nd Amendment Act, 1985.", "ta": "பத்தாவது அட்டவணை (கட்சித்தாவல் தடை) 1985-ன் 52-வது திருத்தச் சட்டத்தால் சேர்க்கப்பட்டது."}, {"en": "The Ninth Schedule was added by the First Amendment Act, 1951.", "ta": "ஒன்பதாவது அட்டவணை 1951-ன் முதல் திருத்தச் சட்டத்தால் சேர்க்கப்பட்டது."}, {"en": "The Eleventh Schedule contains 29 subjects relating to Panchayats.", "ta": "பதினொன்றாவது அட்டவணை பஞ்சாயத்துகள் தொடர்பான 29 பொருள்களைக் கொண்டுள்ளது."}, {"en": "The Twelfth Schedule contains 12 subjects relating to Municipalities.", "ta": "பன்னிரண்டாவது அட்டவணை நகராட்சிகள் தொடர்பான 12 பொருள்களைக் கொண்டுள்ளது."}], "ask": {"en": "Which of the statements given above is/are correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை சரியானது/சரியானவை?"}, "opts": [{"en": "II and III only", "ta": "II மற்றும் III மட்டும்"}, {"en": "I and II only", "ta": "I மற்றும் II மட்டும்"}, {"en": "I and III only", "ta": "I மற்றும் III மட்டும்"}, {"en": "I, II and III only", "ta": "I, II மற்றும் III மட்டும்"}], "ans": 3, "exp": {"en": "IV is wrong: the Twelfth Schedule has 18 subjects (Art 243-W).", "ta": "IV தவறு: பன்னிரண்டாவது அட்டவணையில் 18 பொருள்கள் உள்ளன (உறுப்புரை 243-W)."}, "n": 4, "id": 45}, {"type": "stmt", "ch": "5", "d": "D", "src": "pyq", "stem": {"en": "Consider the following statements about the attainment of statehood:", "ta": "மாநில அந்தஸ்து பெற்றது குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "Himachal Pradesh attained statehood in 1971.", "ta": "இமாச்சலப் பிரதேசம் 1971-ல் மாநில அந்தஸ்து பெற்றது."}, {"en": "Manipur, Tripura and Meghalaya became States in 1972.", "ta": "மணிப்பூர், திரிபுரா, மேகாலயா 1972-ல் மாநிலங்களாயின."}, {"en": "Mizoram, Arunachal Pradesh and Goa became States in 1987.", "ta": "மிசோரம், அருணாசலப் பி them are non-federal (unitary) features?", "ta": "இந்திய அரசியலமைப்பின் அம்சங்கள் குறித்த பின்வரும் கூற்றுகளைக் கருதுக. இவற்றுள் கூட்டாட்சிக்கு மாறான (ஒற்றையாட்சி) அம்சங்கள் எவை என்பதைக் குறிக்கும் கூற்று/கூற்றுகள்:"}, "items": [{"en": "Appointment of the Governors of States by the President is a non-federal feature.", "ta": "மாநில ஆளுநர்களைக் குடியரசுத் தலைவர் நியமிப்பது கூட்டாட்சிக்கு மாறான அம்சம்."}, {"en": "Division of powers between the Centre and the States is a non-federal feature.", "ta": "மையத்திற்கும் மாநிலங்களுக்கும் இடையிலான அதிகாரப் பகிர்வு கூட்டாட்சிக்கு மாறான அம்சம்."}, {"en": "An integrated judicial system is a non-federal feature.", "ta": "ஒருங்கிணைந்த நீதித்துறை அமைப்பு கூட்டாட்சிக்கு மாறான அம்சம்."}], "ask": {"en": "Which of the statements given above is/are correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை சரியானது/சரியானவை?"}, "opts": [{"en": "I, II and III only", "ta": "I, II மற்றும் III மட்டும்"}, {"en": "I and III only", "ta": "I மற்றும் III மட்டும்"}, {"en": "I only", "ta": "I மட்டும்"}, {"en": "III only", "ta": "III மட்டும்"}], "ans": 1, "exp": {"en": "II is wrong: division of powers (Seventh Schedule) is a federal feature.", "ta": "II தவறு: அதிகாரப் பகிர்வு (ஏழாவது அட்டவணை) கூட்டாட்சி அம்சம்."}, "n": 3, "id": 48}, {"type": "stmt", "ch": "5", "d": "D", "src": "new", "stem": {"en": "Consider the following statements about recent territorial changes:", "ta": "சமீபத்திய ஆட்சிப்பரப்பு மாற்றங்கள் குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "Telangana was formed on 2 June 2014.", "ta": "தெலங்கானா 2014 ஜூன் 2 அன்று உருவானது."}, {"en": "Telangana was carved out of Andhra Pradesh.", "ta": "தெலங்கானா ஆந்திரப் பிரதேசத்திலிருந்து பிரிக்கப்பட்டது."}, {"en": "The Jammu and Kashmir Reorganisation Act, 2019 created the Union Territories of Jammu & Kashmir and Ladakh.", "ta": "2019-ன் ஜம்மு காஷ்மீர் மறுசீரமைப்புச் சட்டம் ஜம்மு & காஷ்மீர், லடாக் ஆகிய ஒன்றியப் பகுதிகளை உருவாக்கியது."}, {"en": "Dadra and Nagar Haveli and Daman and Diu were merged into a single Union Territory in 2020.", "ta": "தாத்ரா நாகர் ஹவேலியும் டாமன் டையுவும் 2020-ல் ஒரே ஒன்றியப் பகுதியாக இணைக்கப்பட்டன."}, {"en": "Both Jammu & Kashmir and Ladakh Union Territories have Legislative Assemblies.", "ta": "ஜம்மு & காஷ்மீர், லடாக் ஆகிய இரு ஒன்றியப் பகுதிகளுக்கும் சட்டமன்றம் உண்டு."}], "ask": {"en": "Which of the statements given above is/are NOT correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை தவறானது/தவறானவை?"}, "opts": [{"en": "II and V only", "ta": "II மற்றும் V மட்டும்"}, {"en": "III and V only", "ta": "III மற்றும் V மட்டும்"}, {"en": "IV and V only", "ta": "IV மற்றும் V மட்டும்"}, {"en": "V only", "ta": "V மட்டும்"}], "ans": 3, "exp": {"en": "V is wrong: only Jammu & Kashmir has a Legislative Assembly; Ladakh has none.", "ta": "V தவறு: ஜம்மு & காஷ்மீருக்கு மட்டுமே சட்டமன்றம் உண்டு; லடாக்கிற்கு இல்லை."}, "n": 5, "id": 49}, {"type": "single", "ch": "3", "d": "M", "src": "pyq", "stem": {"en": "‘Procedure established by law’ in Article 21 of the Indian Constitution is borrowed from the Constitution of:", "ta": "இந்திய அரசியலமைப்பின் உறுப்புரை 21-ல் உள்ள ‘சட்டத்தால் நிறுவப்பட்ட நடைமுறை’ எந்த நாட்டு அரசியலமைப்பிலிருந்து பெறப்பட்டது?"}, "opts": [{"en": "Britain", "ta": "பிரிட்டன்"}, {"en": "Japan", "ta": "ஜப்பான்"}, {"en": "Canada", "ta": "கனடா"}, {"en": "USA", "ta": "அமெரிக்கா"}], "ans": 1, "exp": {"en": "Procedure established by law – Japan. (The US has ‘due process of law’.)", "ta": "சட்டத்தால் நிறுவப்பட்ட நடைமுறை – ஜப்பான். (அமெரிக்காவில் இருப்பது ‘உரிய சட்ட நடைமுறை’.)"}, "id": 50}, {"type": "single", "ch": "5", "d": "D", "src": "pyq", "stem": {"en": "The JVP Committee (December 1948), which examined the linguistic reorganisation of States, consisted of:", "ta": "மொழிவாரி மாநில மறுசீரமைப்பை ஆராய்ந்த JVP குழு (டிசம்பர் 1948) யாரைக் கொண்டிருந்தது?"}, "opts": [{"en": "Jayaprakash Narayan, Vallabhbhai Patel, K.M. Panikkar", "ta": "ஜெயப்பிரகாஷ் நாராயண், வல்லபாய் படேல், கே.எம். பணிக்கர்"}, {"en": "Jawaharlal Nehru, Vallabhbhai Patel, K.M. Panikkar", "ta": "ஜவஹர்லால் நேரு, வல்லபாய் படேல், கே.எம். பணிக்கர்"}, {"en": "Jawaharlal Nehru, Vallabhbhai Patel, Pattabhi Sitaramayya", "ta": "ஜவஹர்லால் நேரு, வல்லபாய் படேல், பட்டாபி சீதாராமையா"}, {"en": "Jawaharlal Nehru, V.P. Menon, Pattabhi Sitaramayya", "ta": "ஜவஹர்லால் நேரு, வி.பி. மேனன், பட்டாபி சீதாராமையா"}], "ans": 2, "exp": {"en": "J-V-P = Jawaharlal, Vallabhbhai, Pattabhi. (K.M. Panikkar was a member of the later States Reorganisation Commission, 1953.) It rejected language as the basis of reorganisation for the time being.", "ta": "J-V-P = ஜவஹர்லால், வல்லபாய், பட்டாபி. (கே.எம். பணிக்கர் பின்னர் அமைந்த மாநில மறுசீரமைப்பு ஆணையத்தின் (1953) உறுப்பினர்.) அது மொழியை அடிப்படையாகக் கொண்ட மறுசீரமைப்பை தற்போதைக்கு நிராகரித்தது."}, "id": 51}, {"type": "stmt", "ch": "5", "d": "M", "src": "new", "stem": {"en": "Consider the following statements about the creation of Andhra State:", "ta": "ஆந்திர மாநிலம் உருவாக்கப்பட்டது குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "It was the first State created on a linguistic basis after Independence.", "ta": "சுதந்திரத்திற்குப் பின் மொழி அடிப்படையில் உருவாக்கப்பட்ட முதல் மாநிலம் இது."}, {"en": "It was carved out of the Madras State in 1953.", "ta": "இது 1953-ல் சென்னை மாகாணத்திலிருந்து பிரிக்கப்பட்டது."}, {"en": "Its first capital was Hyderabad.", "ta": "இதன் முதல் தலைநகரம் ஹைதராபாத்."}], "ask": {"en": "Which of the statements given above is/are NOT correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை தவறானது/தவறானவை?"}, "opts": [{"en": "II only", "ta": "II மட்டும்"}, {"en": "I and III only", "ta": "I மற்றும் III மட்டும்"}, {"en": "III only", "ta": "III மட்டும்"}, {"en": "II and III only", "ta": "II மற்றும் III மட்டும்"}], "ans": 2, "exp": {"en": "III is wrong: Kurnool was the first capital of Andhra State (Hyderabad was the capital of Hyderabad State); Potti Sriramulu’s death after a fast triggered the creation.", "ta": "III தவறு: ஆந்திர மாநிலத்தின் முதல் தலைநகரம் கர்னூல்; பொட்டி ஸ்ரீராமுலுவின் உண்ணாவிரத மரணமே இதற்குத் தூண்டுதலாக அமைந்தது."}, "n": 3, "id": 52}, {"type": "one", "ch": "2", "d": "M", "src": "new", "stem": {"en": "Consider the following statement:", "ta": "பின்வரும் கூற்றைக் கருதுக:"}, "item": {"en": "26 January was chosen as the date of commencement of the Constitution because Purna Swaraj Day had been celebrated on that date in 1930.", "ta": "1930-ல் ஜனவரி 26 அன்று பூர்ண சுயராஜ்ய நாள் கொண்டாடப்பட்டதால், அந்நாள் அரசியலமைப்பு அமலுக்கு வரும் நாளாகத் தேர்ந்தெடுக்கப்பட்டது."}, "ask": {"en": "Which one of the following is correct about the statement given above?", "ta": "மேற்கண்ட கூற்று குறித்துச் சரியான விடையைத் தேர்ந்தெடுக்கவும்."}, "opts": [{"en": "The statement is correct", "ta": "கூற்று சரியானது"}, {"en": "Incorrect – it was the date on which the Constituent Assembly first met", "ta": "தவறு – அந்நாளில்தான் அரசியலமைப்பு நிர்ணய சபை முதன்முதலாகக் கூடியது"}, {"en": "Incorrect – India became independent on that date in 1947", "ta": "தவறு – 1947-ல் அந்நாளில்தான் இந்தியா சுதந்திரம் பெற்றது"}, {"en": "Incorrect – the Cabinet Mission Plan was published on that date", "ta": "தவறு – அந்நாளில்தான் அமைச்சரவைத் தூதுக்குழுத் திட்டம் வெளியிடப்பட்டது"}], "ans": 0, "exp": {"en": "Correct: it recalls the Purna Swaraj resolution of the Lahore Congress (Dec 1929) and the first Purna Swaraj Day on 26 Jan 1930.", "ta": "சரி: லாகூர் காங்கிரஸ் (டிச. 1929) பூர்ண சுயராஜ்யத் தீர்மானத்தையும் 1930 ஜன. 26 முதல் பூர்ண சுயராஜ்ய நாளையும் நினைவுகூர்கிறது."}, "id": 53}, {"type": "stmt", "ch": "3", "d": "D", "src": "new", "stem": {"en": "Consider the following statements about the amendment procedure:", "ta": "திருத்த நடைமுறை குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "Admission or establishment of new States can be amended by a simple majority of Parliament, outside Article 368.", "ta": "புதிய மாநிலங்களை இணைத்தல்/உருவாக்குதல் தொடர்பான விதிகளை உறுப்புரை 368-க்கு வெளியே நாடாளுமன்றம் எளிய பெரும்பான்மையால் திருத்தலாம்."}, {"en": "An amendment to the Seventh Schedule requires a special majority and ratification by half of the State legislatures.", "ta": "ஏழாவது அட்டவணையைத் திருத்த சிறப்புப் பெரும்பான்மையுடன் பாதி மாநிலச் சட்டமன்றங்களின் ஒப்புதலும் தேவை."}, {"en": "An amendment to the Fundamental Rights requires ratification by half of the State legislatures.", "ta": "அடிப்படை உரிமைகளைத் திருத்த பாதி மாநிலச் சட்டமன்றங்களின் ஒப்புதல் தேவை."}], "ask": {"en": "Which of the statements given above is/are NOT correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை தவறானது/தவறானவை?"}, "opts": [{"en": "I and III only", "ta": "I மற்றும் III மட்டும்"}, {"en": "III only", "ta": "III மட்டும்"}, {"en": "II and III only", "ta": "II மற்றும் III மட்டும்"}, {"en": "II only", "ta": "II மட்டும்"}], "ans": 1, "exp": {"en": "III is wrong: FR amendments need only a special majority of Parliament (Art 368); ratification is for federal matters.", "ta": "III தவறு: அடிப்படை உரிமைத் திருத்தத்திற்கு நாடாளுமன்றத்தின் சிறப்புப் பெரும்பான்மை (உறுப்புரை 368) மட்டுமே போதும்; மாநில ஒப்புதல் கூட்டாட்சி விஷயங்களுக்கு மட்டுமே."}, "n": 3, "id": 54}, {"type": "pair", "ch": "2", "d": "D", "src": "pyq", "stem": {"en": "Consider the following pairs of events and dates:", "ta": "நிகழ்வுகளும் நாட்களும் அடங்கிய பின்வரும் இணைகளைக் கருதுக:"}, "heads": [{"en": "Event", "ta": "நிகழ்வு"}, {"en": "Date", "ta": "நாள்"}], "rows": [{"l": {"en": "First meeting of the Constituent Assembly", "ta": "அரசியலமைப்பு நிர்ணய சபையின் முதல் கூட்டம்"}, "r": {"en": "9 December 1946", "ta": "1946 டிசம்பர் 9"}}, {"l": {"en": "Objectives Resolution moved", "ta": "நோக்கத் தீர்மானம் முன்மொழியப்பட்டது"}, "r": {"en": "11 December 1946", "ta": "1946 டிசம்பர் 11"}}, {"l": {"en": "National Flag adopted", "ta": "தேசியக் கொடி ஏற்கப்பட்டது"}, "r": {"en": "22 July 1947", "ta": "1947 ஜூலை 22"}}, {"l": {"en": "Drafting Committee set up", "ta": "வரைவுக் குழு அமைக்கப்பட்டது"}, "r": {"en": "29 August 1947", "ta": "1947 ஆகஸ்ட் 29"}}], "ask": {"en": "Which of the above pairs is/are NOT correctly matched?", "ta": "மேற்கண்ட இணைகளில் எது/எவை சரியாகப் பொருந்தவில்லை?"}, "opts": [{"en": "2 and 4 only", "ta": "2 மற்றும் 4 மட்டும்"}, {"en": "2 only", "ta": "2 மட்டும்"}, {"en": "2 and 3 only", "ta": "2 மற்றும் 3 மட்டும்"}, {"en": "1 and 2 only", "ta": "1 மற்றும் 2 மட்டும்"}], "ans": 1, "exp": {"en": "The Objectives Resolution was moved on 13 December 1946 (not 11 December – the day Rajendra Prasad was elected President).", "ta": "நோக்கத் தீர்மானம் 1946 டிசம்பர் 13 அன்றே முன்மொழியப்பட்டது (டிசம்பர் 11 அல்ல – அது இராஜேந்திர பிரசாத் தலைவராகத் தேர்ந்தெடுக்கப்பட்ட நாள்)."}, "id": 55}, {"type": "stmt", "ch": "3", "d": "M", "src": "new", "stem": {"en": "Consider the following statements about the parliamentary system in India:", "ta": "இந்தியாவின் நாடாளுமன்ற முறை குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "The President is the nominal executive while the Council of Ministers is the real executive.", "ta": "குடியரசுத் தலைவர் பெயரளவு நிர்வாகி; அமைச்சரவையே உண்மையான நிர்வாகி."}, {"en": "The Council of Ministers is collectively responsible to the Lok Sabha.", "ta": "அமைச்சரவை மக்களவைக்குக் கூட்டுப் பொறுப்புடையது."}, {"en": "Ministers are members of the legislature.", "ta": "அமைச்சர்கள் சட்டமன்ற உறுப்பினர்களாக இருப்பர்."}, {"en": "The Prime Minister enjoys a fixed tenure of five years.", "ta": "பிரதமருக்கு ஐந்தாண்டு நிலையான பதவிக்காலம் உண்டு."}], "ask": {"en": "Which of the statements given above is/are correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை சரியானது/சரியானவை?"}, "opts": [{"en": "I, II, III and IV only", "ta": "I, II, III மற்றும் IV மட்டும்"}, {"en": "I and II only", "ta": "I மற்றும் II மட்டும்"}, {"en": "I and III only", "ta": "I மற்றும் III மட்டும்"}, {"en": "I, II and III only", "ta": "I, II மற்றும் III மட்டும்"}], "ans": 3, "exp": {"en": "IV is wrong: the PM holds office as long as he enjoys the confidence of the Lok Sabha; no fixed tenure.", "ta": "IV தவறு: மக்களவையின் நம்பிக்கை உள்ளவரை பிரதமர் பதவியில் தொடர்வார்; நிலையான பதவிக்காலம் இல்லை."}, "n": 4, "id": 56}, {"type": "match", "ch": "2", "d": "D", "src": "new", "stem": {"en": "Match the following:", "ta": "பின்வருவனவற்றைப் பொருத்துக:"}, "heads": [{"en": "Role", "ta": "பொறுப்பு"}, {"en": "Person", "ta": "நபர்"}], "left": [{"en": "Constitutional (legal) advisor", "ta": "அரசியலமைப்பு சட்ட ஆலோசகர்"}, {"en": "Secretary of the Assembly", "ta": "சபையின் செயலாளர்"}, {"en": "Chief draftsman", "ta": "தலைமை வரைவாளர்"}, {"en": "Calligrapher of the original Constitution", "ta": "மூல அரசியலமைப்பின் கையெழுத்துக் கலைஞர்"}], "right": [{"en": "S.N. Mukerjee", "ta": "எஸ்.என். முகர்ஜி"}, {"en": "Sir B.N. Rau", "ta": "சர் பி.என். ராவ்"}, {"en": "Prem Behari Narain Raizada", "ta": "பிரேம் பிஹாரி நாராயண் ரைஸாதா"}, {"en": "H.V.R. Iyengar", "ta": "எச்.வி.ஆர். ஐயங்கார்"}], "opts": [{"en": "a-2  b-4  c-1  d-3", "ta": "a-2  b-4  c-1  d-3"}, {"en": "a-2  b-3  c-1  d-4", "ta": "a-2  b-3  c-1  d-4"}, {"en": "a-2  b-4  c-3  d-1", "ta": "a-2  b-4  c-3  d-1"}, {"en": "a-2  b-1  c-4  d-3", "ta": "a-2  b-1  c-4  d-3"}], "ans": 0, "exp": {"en": "B.N. Rau – legal advisor; H.V.R. Iyengar – Secretary; S.N. Mukerjee – chief draftsman; Raizada – handwritten in flowing italic style.", "ta": "பி.என். ராவ் – சட்ட ஆலோசகர்; ஐயங்கார் – செயலாளர்; எஸ்.என். முகர்ஜி – தலைமை வரைவாளர்; ரைஸாதா – மூலப் பிரதியைக் கைப்பட எழுதியவர்."}, "id": 57}, {"type": "single", "ch": "3", "d": "D", "src": "new", "stem": {"en": "Which Constitutional Amendment replaced the words ‘internal disturbance’ with ‘armed rebellion’ as a ground for proclaiming a National Emergency?", "ta": "தேசிய நெருக்கடிநிலை அறிவிப்பதற்கான காரணமாக ‘உள்நாட்டுக் குழப்பம்’ என்பதற்குப் பதிலாக ‘ஆயுதமேந்திய கிளர்ச்சி’ என மாற்றிய அரசியலமைப்புத் திருத்தம் எது?"}, "opts": [{"en": "44th Amendment, 1978", "ta": "44-வது திருத்தம், 1978"}, {"en": "52nd Amendment, 1985", "ta": "52-வது திருத்தம், 1985"}, {"en": "38th Amendment, 1975", "ta": "38-வது திருத்தம், 1975"}, {"en": "42nd Amendment, 1976", "ta": "42-வது திருத்தம், 1976"}], "ans": 0, "exp": {"en": "The 44th Amendment (1978) made this change; it also made Articles 20 and 21 non-suspendable during Emergency.", "ta": "44-வது திருத்தம் (1978) இம்மாற்றத்தைச் செய்தது; நெருக்கடிநிலையிலும் உறுப்புரை 20, 21 முடக்கப்படக்கூடாது என்றும் ஆக்கியது."}, "id": 58}, {"type": "ar", "ch": "2", "d": "M", "src": "pyq", "stem": {"en": "Read the following and choose the correct option.", "ta": "பின்வருவனவற்றைப் படித்துச் சரியான விடையைத் தேர்ந்தெடுக்கவும்."}, "A": {"en": "The Constituent Assembly became a fully sovereign body only after the Indian Independence Act, 1947.", "ta": "1947-ன் இந்திய சுதந்திரச் சட்டத்திற்குப் பிறகே அரசியலமைப்பு நிர்ணய சபை முழுமையான இறையாண்மை அமைப்பாக மாறியது."}, "R": {"en": "The Act empowered the Assembly to abrogate or alter any law made by the British Parliament in relation to India.", "ta": "இந்தியா தொடர்பாக பிரிட்டிஷ் நாடாளுமன்றம் இயற்றிய எந்தச் சட்டத்தையும் ரத்து செய்ய அல்லது மாற்ற இச்சட்டம் சபைக்கு அதிகாரம் அளித்தது."}, "opts": [{"en": "A is true, but R is false", "ta": "A சரி, ஆனால் R தவறு"}, {"en": "A is false, but R is true", "ta": "A தவறு, ஆனால் R சரி"}, {"en": "Both A and R are true, but R is not the correct explanation of A", "ta": "A மற்றும் R இரண்டும் சரி; ஆனால் R என்பது A-க்கான சரியான விளக்கமல்ல"}, {"en": "Both A and R are true, and R is the correct explanation of A", "ta": "A மற்றும் R இரண்டும் சரி; R என்பது A-க்கான சரியான விளக்கம்"}], "ans": 3, "exp": {"en": "The Independence Act made the Assembly sovereign and a legislative body (Dominion Legislature); the power to alter British laws is what made it sovereign.", "ta": "சுதந்திரச் சட்டம் சபையை இறையாண்மை அமைப்பாகவும் சட்டமியற்றும் அமைப்பாகவும் (டொமினியன் சட்டமன்றம்) மாற்றியது; பிரிட்டிஷ் சட்டங்களை மாற்றும் அதிகாரமே அதன் இறையாண்மைக்குக் காரணம்."}, "id": 59}, {"type": "pair", "ch": "5", "d": "D", "src": "pyq", "stem": {"en": "Consider the following pairs of Amendments and subjects:", "ta": "திருத்தங்களும் பொருள்களும் அடங்கிய பின்வரும் இணைகளைக் கருதுக:"}, "heads": [{"en": "Amendment", "ta": "திருத்தம்"}, {"en": "Subject", "ta": "பொருள்"}], "rows": [{"l": {"en": "7th Amendment", "ta": "7-வது திருத்தம்"}, "r": {"en": "Implemented the States Reorganisation Act, 1956", "ta": "மாநில மறுசீரமைப்புச் சட்டம் 1956-ஐ நடைமுறைப்படுத்தியது"}}, {"l": {"en": "13th Amendment", "ta": "13-வது திருத்தம்"}, "r": {"en": "Statehood of Nagaland", "ta": "நாகாலாந்து மாநில அந்தஸ்து"}}, {"l": {"en": "12th Amendment", "ta": "12-வது திருத்தம்"}, "r": {"en": "Integration of Dadra and Nagar Haveli", "ta": "தாத்ரா நாகர் ஹவேலி இணைப்பு"}}, {"l": {"en": "14th Amendment", "ta": "14-வது திருத்தம்"}, "r": {"en": "Incorporation of Puducherry", "ta": "புதுச்சேரி இணைப்பு"}}], "ask": {"en": "Which of the above pairs is/are correctly matched?", "ta": "மேற்கண்ட இணைகளில் எது/எவை சரியாகப் பொருந்தியுள்ளது/பொருந்தியுள்ளன?"}, "opts": [{"en": "1 and 2 only", "ta": "1 மற்றும் 2 மட்டும்"}, {"en": "1 and 4 only", "ta": "1 மற்றும் 4 மட்டும்"}, {"en": "1, 2, 3 and 4 only", "ta": "1, 2, 3 மற்றும் 4 மட்டும்"}, {"en": "1, 2 and 4 only", "ta": "1, 2 மற்றும் 4 மட்டும்"}], "ans": 3, "exp": {"en": "Dadra & Nagar Haveli was integrated by the 10th Amendment; the 12th was for Goa, Daman & Diu.", "ta": "தாத்ரா நாகர் ஹவேலி 10-வது திருத்தத்தால் இணைக்கப்பட்டது; 12-வது கோவா, டாமன் & டையுவுக்கானது."}, "id": 60}, {"type": "stmt", "ch": "3", "d": "D", "src": "new", "stem": {"en": "Consider the following statements about the Salient Features of the Constitution:", "ta": "அரசியலமைப்பின் முக்கிய அம்சங்கள் குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "The original Constitution had 395 Articles, 22 Parts and 8 Schedules.", "ta": "மூல அரசியலமைப்பில் 395 உறுப்புரைகள், 22 பகுதிகள், 8 அட்டவணைகள் இருந்தன."}, {"en": "At present the Constitution has 25 Parts and 12 Schedules.", "ta": "தற்போது அரசியலமைப்பில் 25 பகுதிகளும் 12 அட்டவணைகளும் உள்ளன."}, {"en": "The idea of a Joint Sitting of the two Houses of Parliament is borrowed from Canada.", "ta": "நாடாளுமன்ற இரு அவைகளின் கூட்டுக் கூட்டம் என்ற கருத்து கனடாவிலிருந்து பெறப்பட்டது."}, {"en": "Single citizenship is borrowed from the British Constitution.", "ta": "ஒற்றைக் குடியுரிமை பிரிட்டிஷ் அரசியலமைப்பிலிருந்து பெறப்பட்டது."}, {"en": "Residuary powers being vested in the Centre is borrowed from the Constitution of the USA.", "ta": "எஞ்சிய அதிகாரங்கள் மையத்திடம் இருப்பது அமெரிக்க அரசியலமைப்பிலிருந்து பெறப்பட்டது."}], "ask": {"en": "Which of the statements given above is/are NOT correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை தவறானது/தவறானவை?"}, "opts": [{"en": "I, III and V only", "ta": "I, III மற்றும் V மட்டும்"}, {"en": "III and V only", "ta": "III மற்றும் V மட்டும்"}, {"en": "III only", "ta": "III மட்டும்"}, {"en": "II, III and V only", "ta": "II, III மற்றும் V மட்டும்"}], "ans": 1, "exp": {"en": "III wrong: Joint sitting – Australia. V wrong: residuary powers with the Centre – Canada (in the USA they rest with the States).", "ta": "III தவறு: கூட்டுக் கூட்டம் – ஆஸ்திரேலியா. V தவறு: எஞ்சிய அதிகாரங்கள் மையத்திடம் – கனடா (அமெரிக்காவில் மாநிலங்களிடம் உள்ளது)."}, "n": 5, "id": 61}, {"type": "single", "ch": "5", "d": "D", "src": "new", "stem": {"en": "In 1961 India liberated Goa from Portuguese rule through the military operation named ‘Operation ______’.", "ta": "1961-ல் போர்ச்சுகீசிய ஆட்சியிலிருந்து கோவாவை விடுவிக்க இந்தியா மேற்கொண்ட இராணுவ நடவடிக்கையின் பெயர் ‘ஆபரேஷன் ______’."}, "opts": [{"en": "Polo", "ta": "போலோ"}, {"en": "Meghdoot", "ta": "மேகதூத்"}, {"en": "Trident", "ta": "டிரைடென்ட்"}, {"en": "Vijay", "ta": "விஜய்"}], "ans": 3, "exp": {"en": "Operation Vijay (1961) liberated Goa, Daman and Diu (12th Amendment, 1962). Operation Polo (1948) was the police action in Hyderabad.", "ta": "ஆபரேஷன் விஜய் (1961) கோவா, டாமன் & டையுவை விடுவித்தது (12-வது திருத்தம், 1962). ஆபரேஷன் போலோ (1948) ஹைதராபாத் காவல்துறை நடவடிக்கை."}, "id": 62}, {"type": "stmt", "ch": "2", "d": "M", "src": "new", "stem": {"en": "Consider the following statements about the Constituent Assembly:", "ta": "அரசியலமைப்பு நிர்ணய சபை குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "Only 211 members attended its first meeting because the Muslim League b t the statement given above?", "ta": "மேற்கண்ட கூற்று குறித்துச் சரியான விடையைத் தேர்ந்தெடுக்கவும்."}, "opts": [{"en": "The statement is correct", "ta": "கூற்று சரியானது"}, {"en": "Incorrect – he was a member only of the Drafting Committee", "ta": "தவறு – அவர் வரைவுக் குழுவில் மட்டும் உறுப்பினராக இருந்தார்"}, {"en": "Incorrect – he was not a member of the Constituent Assembly", "ta": "தவறு – அவர் அரசியலமைப்பு நிர்ணய சபையின் உறுப்பினர் அல்ல"}, {"en": "Incorrect – he resigned from the Assembly in 1947", "ta": "தவறு – அவர் 1947-ல் சபையிலிருந்து விலகினார்"}], "ans": 2, "exp": {"en": "Gandhi was the only major leader of the time who was not a member of the Assembly.", "ta": "அக்காலத்தின் முக்கியத் தலைவர்களில் காந்தி மட்டுமே சபையில் உறுப்பினராக இல்லை."}, "id": 74}, {"type": "stmt", "ch": "3", "d": "M", "src": "new", "stem": {"en": "Consider the following statements about universal adult franchise:", "ta": "வயது வந்தோர் வாக்குரிமை குறித்த பின்வரும் கூற்றுகளைக் கருதுக:"}, "items": [{"en": "Members of the Rajya Sabha are elected on the basis of adult franchise.", "ta": "மாநிலங்களவை உறுப்பினர்கள் வயது வந்தோர் வாக்குரிமை அடிப்படையில் தேர்ந்தெடுக்கப்படுகின்றனர்."}, {"en": "The 61st Amendment lowered the voting age from 21 years to 18 years.", "ta": "61-வது திருத்தம் வாக்களிக்கும் வயதை 21-லிருந்து 18 ஆகக் குறைத்தது."}, {"en": "Article 326 provides that elections to the Lok Sabha and the State Legislative Assemblies are held on the basis of adult suffrage.", "ta": "மக்களவை, மாநிலச் சட்டமன்றத் தேர்தல்கள் வயது வந்தோர் வாக்குரிமை அடிப்படையில் நடைபெறும் என உறுப்புரை 326 கூறுகிறது."}], "ask": {"en": "Which of the statements given above is/are correct?", "ta": "மேற்கண்ட கூற்றுகளில் எது/எவை சரியானது/சரியானவை?"}, "opts": [{"en": "II only", "ta": "II மட்டும்"}, {"en": "II and III only", "ta": "II மற்றும் III மட்டும்"}, {"en": "III only", "ta": "III மட்டும்"}, {"en": "I, II and III only", "ta": "I, II மற்றும் III மட்டும்"}], "ans": 1, "exp": {"en": "I is wrong: Rajya Sabha members are indirectly elected by elected members of State Assemblies.", "ta": "I தவறு: மாநிலங்களவை உறுப்பினர்கள் மாநிலச் சட்டமன்றத்தின் தேர்ந்தெடுக்கப்பட்ட உறுப்பினர்களால் மறைமுகமாகத் தேர்ந்தெடுக்கப்படுகின்றனர்."}, "n": 3, "id": 75}, {"type": "one", "ch": "5", "d": "D", "src": "new", "stem": {"en": "Consider the following statement:", "ta": "பின்வரும் கூற்றைக் கருதுக:"}, "item": {"en": "The Constitution empowers Parliament to form new States and to alter the areas, boundaries or names of existing States under Article 2.", "ta": "புதிய மாநிலங்களை உருவாக்கவும், ஏற்கெனவே உள்ள மாநிலங்களின் பரப்பு, எல்லை, பெயர்களை மாற்றவும் நாடாளுமன்றத்திற்கு உறுப்புரை 2 அதிகாரம் அளிக்கிறது."}, "ask": {"en": "Which one of the following is correct about the statement given above?", "ta": "மேற்கண்ட கூற்று குறித்துச் சரியான விடையைத் தேர்ந்தெடுக்கவும்."}, "opts": [{"en": "The statement is correct", "ta": "கூற்று சரியானது"}, {"en": "Incorrect – this power is given by Article 4", "ta": "தவறு – இவ்வதிகாரத்தை உறுப்புரை 4 வழங்குகிறது"}, {"en": "Incorrect – this power is given by Article 368", "ta": "தவறு – இவ்வதிகாரத்தை உறுப்புரை 368 வழங்குகிறது"}, {"en": "Incorrect – this power is given by Article 3", "ta": "தவறு – இவ்வதிகாரத்தை உறுப்புரை 3 வழங்குகிறது"}], "ans": 3, "exp": {"en": "Article 2 – admission/establishment of new States not already in the Union; Article 3 – formation of new States and alteration of areas, boundaries or names of existing States; Article 4 – such laws are not Article 368 amendments.", "ta": "உறுப்புரை 2 – ஒன்றியத்தில் இல்லாத புதிய மாநிலங்களை இணைத்தல்/உருவாக்குதல்; உறுப்புரை 3 – புதிய மாநிலங்கள் உருவாக்கம், ஏற்கெனவே உள்ளவற்றின் பரப்பு, எல்லை, பெயர் மாற்றம்; உறுப்புரை 4 – இத்தகைய சட்டங்கள் உறுப்புரை 368 திருத்தங்கள் ஆகா."}, "id": 76}, {"type": "pair", "ch": "3", "d": "D", "src": "new", "stem": {"en": "Consider the following pairs of Articles and their subjects:", "ta": "உறுப்புரைகளும் அவற்றின் பொருள்களும் அடங்கிய பின்வரும் இணைகளைக் கருதுக:"}, "heads": [{"en": "Article", "ta": "உறுப்புரை" <script>

function bi(o){ if(o.en===o.ta) return '<div class="en">'+esc(o.en)+'</div>'; return '<div class="ta">'+esc(o.ta)+'</div><div class="en">'+esc(o.en)+'</div>'}

}
