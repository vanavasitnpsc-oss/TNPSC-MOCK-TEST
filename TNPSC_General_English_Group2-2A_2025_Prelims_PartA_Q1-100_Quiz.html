:root{
  --bg:#f5f3ec; --card:#ffffff; --ink:#1c2430; --muted:#5d6775; --line:#dcd8cc;
  --accent:#0e6b5c; --accent-ink:#ffffff; --accent-soft:#dff0eb;
  --good:#1b7a45; --good-soft:#dcf1e3; --bad:#b3261e; --bad-soft:#fbe3e0;
  --warn:#9a5a00; --warn-soft:#fdf0d5; --mark:#6a4fb3; --mark-soft:#ece6fa;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 16px rgba(20,30,40,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171d; --card:#1a2129; --ink:#e8ecef; --muted:#9aa6b2; --line:#2c3641;
    --accent:#3fb8a0; --accent-ink:#06211c; --accent-soft:#16342f;
    --good:#52c283; --good-soft:#15301f; --bad:#ff7b72; --bad-soft:#3a1a18;
    --warn:#f0b24a; --warn-soft:#37290f; --mark:#b9a6f5; --mark-soft:#2a2347;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#12171d; --card:#1a2129; --ink:#e8ecef; --muted:#9aa6b2; --line:#2c3641;
  --accent:#3fb8a0; --accent-ink:#06211c; --accent-soft:#16342f;
  --good:#52c283; --good-soft:#15301f; --bad:#ff7b72; --bad-soft:#3a1a18;
  --warn:#f0b24a; --warn-soft:#37290f; --mark:#b9a6f5; --mark-soft:#2a2347; --shadow:none;
}

.ta{font-family:"NotoTamil","Latha","Nirmala UI","Noto Sans Tamil",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{line-height:1.25;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:10px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.hidden{display:none!important}
footer.brand{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--accent);color:var(--accent-ink);
  text-align:center;padding:9px 12px;font-size:15px;font-weight:700;letter-spacing:.2px}
header.top{background:var(--card);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;flex-wrap:wrap}
.title{font-size:18px;font-weight:800}
.sub{color:var(--muted);font-size:13px}

/* ---------- home / register ---------- */
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.3px}
.hero p{color:var(--muted);margin:8px 0 0;max-width:62ch}
.grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;margin-top:20px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{padding:20px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-weight:700;font-size:14px;margin-bottom:5px}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;min-height:44px}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0 4px}
.fact{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fact b{display:block;font-size:20px}
.fact small{color:var(--muted)}
table.hist{width:100%;border-collapse:collapse;font-size:14px}
table.hist th,table.hist td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.hist th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.note{background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}

/* ---------- test screen ---------- */
.testbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line)}
.testbar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 16px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;padding:4px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.timer.low{background:var(--bad-soft);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.qtimer{font-variant-numeric:tabular-nums;font-weight:700;padding:4px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:15px}
.layout{display:grid;grid-template-columns:1fr 300px;gap:18px;margin-top:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.qcard{padding:20px}
.qno{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:8px;padding:2px 10px;margin-right:8px}
.passage{background:var(--bg);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;margin:10px 0;font-size:15px}
.stem p{margin:.35em 0}
ul.items{margin:8px 0;padding-left:0;list-style:none}
ul.items li{padding:2px 0 2px 0}
table.match{border-collapse:collapse;margin:10px 0;font-size:15px;width:100%;max-width:640px}
table.match th{text-align:left;border-bottom:2px solid var(--line);padding:4px 8px}
table.match td{padding:4px 8px;vertical-align:top}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-weight:800;font-size:13px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.e{color:var(--muted)}
.qnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.qnav .grow{flex:1}
.pal{padding:14px;position:sticky;top:70px}
.pal h3{font-size:15px;margin-bottom:8px}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:52vh;overflow:auto;padding:2px}
.pb{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 0 2px;text-align:center;line-height:1.1;min-height:44px}
.pb b{display:block;font-size:14px}
.pb small{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.pb.ans{background:var(--good-soft);border-color:var(--good)}
.pb.mk{background:var(--mark-soft);border-color:var(--mark)}
.pb.cur{outline:2.5px solid var(--accent);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;border:1.5px solid var(--line);vertical-align:-1px}

/* ---------- result ---------- */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.sc{border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--card)}
.sc b{display:block;font-size:26px;line-height:1.1}
.sc small{color:var(--muted)}
.sc.good b{color:var(--good)} .sc.bad b{color:var(--bad)} .sc.un b{color:var(--warn)} .sc.big{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .sc.big small{color:inherit;opacity:.85}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.tab{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.tab.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.rq{padding:16px;margin-bottom:12px;border-left:6px solid var(--line)}
.rq.c{border-left-color:var(--good)} .rq.w{border-left-color:var(--bad)} .rq.u{border-left-color:var(--warn)} .rq.d{border-left-color:var(--mark)}
.rq .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.chip{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
.chip.c{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.chip.w{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.chip.u{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.chip.d{background:var(--mark-soft);color:var(--mark);border-color:var(--mark)}
.chip.t{background:var(--bg);color:var(--muted)}
.ro{display:flex;gap:10px;padding:7px 10px;border-radius:8px;border:1.5px solid transparent;margin:4px 0}
.ro .k{flex:0 0 26px;font-weight:800}
.ro.ok{background:var(--good-soft);border-color:var(--good)}
.ro.no{background:var(--bad-soft);border-color:var(--bad)}
.ro .tag{margin-left:auto;font-size:12px;font-weight:800;white-space:nowrap;padding-left:8px}
.expl{margin-top:10px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14.5px;border:1px dashed var(--line)}
.expl .ta{display:block;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,20,.55);z-index:80;display:grid;place-items:center;padding:16px}
.modal .box{max-width:460px;width:100%;padding:22px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

/* ---------- print (download as PDF) ---------- */
.printonly{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm 18mm}
  body{background:#fff;color:#000;padding:0;font-size:11pt}
  :root{--bg:#fff;--card:#fff;--ink:#000;--line:#bbb;--muted:#444}
  .noprint,.testbar,header.top,.tabs,.actions,.pal,.qnav,.btn{display:none!important}
  .printonly{display:block}
  .card{box-shadow:none;border-radius:6px}
  .rq{break-inside:avoid;page-break-inside:avoid;margin-bottom:8px;padding:8px 10px}
  .opt,.ro{break-inside:avoid}
  footer.brand{position:fixed;bottom:0;background:#fff!important;color:#000!important;border-top:1px solid #000;font-size:10pt;padding:4px 0}
  .wrap{max-width:none;padding:0}
  #resultList .rq{display:block!important}
  /* compact two-column layout for the downloaded attempt */
  #resultList{column-count:2;column-gap:8mm}
  body{font-size:9.5pt;line-height:1.35}
  .rq{padding:5px 7px;border-left-width:3px;margin-bottom:6px}
  .rq .meta{margin-bottom:2px;gap:4px}
  .chip{font-size:7.5pt;padding:0 6px}
  .qno{padding:0 7px;margin-right:4px}
  .stem p{margin:2px 0}
  ul.items{margin:3px 0}
  .passage{font-size:8.5pt;padding:4px 8px;margin:4px 0}
  table.match{font-size:8.5pt;margin:4px 0}
  table.match th,table.match td{padding:1px 6px}
  .ro{padding:1px 5px;margin:2px 0;gap:6px;font-size:9pt;flex-wrap:wrap}
  .ro .tag{font-size:7.5pt;margin-left:auto}
  .expl{font-size:8.5pt;padding:4px 6px;margin-top:4px}
  .score{grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0}
  .sc{padding:4px 8px;border-radius:6px}.sc b{font-size:14pt}.sc small{font-size:8pt}
  .sc.big{background:#fff!important;color:#000!important;border:2px solid #000}
  .wrap > div:first-child{padding-top:0!important}
}
</style>

(a)-4  (b)-1  (c)-2  (d)-3"], "a": 0, "e": "Champing = munching/chewing; Perplexing = confusing; Thronging = crowding; Hearkening = listening.", "t": "Champing = மெல்லுதல்; Perplexing = குழப்பும்; Thronging = நெரிசலாகக் கூடுதல்; Hearkening = செவிசாய்த்தல்.", "m": {"h": ["Column - A", "Column - B"], "a": ["(a) Champing", "(b) Perplexing", "(c) Thronging", "(d) Hearkening"], "b": ["1. Confusing", "2. Listening, heading", "3. Munching, chewing", "4. Crowding"]}}, {"n": 6, "s": "Choose the correct ‘synonyms’ by matching column ‘A’ and ‘B’.", "o": ["(a)-1  (b)-2  (c)-3  (d)-4", "(a)-3  (b)-4  (c)-1  (d)-2", "(a)-2  (b)-3  (c)-4  (d)-1", "(a)-4  (b)-1  (c)-2  (d)-3"], "a": 1, "e": "Mourn = anguish; Veil = conceal; Crown = pinnacle; Quest = search.", "t": "Mourn = துயரம்; Veil = மறைத்தல்; Crown = உச்சி; Quest = தேடல்.", "m": {"h": ["Column - A", "Column - B"], "a": ["(a) Mourn", "(b) Veil", "(c) Crown", "(d) Quest"], "b": ["1. Pinnacle", "2. Search", "3. Anguish", "4. Conceal"]}}, {"n": 7, "s": "Choose the right answer among these: Which are the following statements are true according to Nadia Bush?", "o": ["1 only", "2 and 3 only", "3 and 4 only", "1 and 3 only"], "a": 1, "e": "As per the poem’s text, statements 2 and 3 hold (the poet was tempted to enter; besides the house there was a tree).", "t": "கவிதையின்படி கூற்றுகள் 2, 3 சரி – கவிஞர் வீட்டிற்குள் செல்ல ஆசைப்பட்டார்; வீட்டின் அருகில் ஒரு மரம் இருந்தது.", "it": ["1. The house seems to be alive at day.", "2. The poet was often tempted to go inside the house.", "3. Besides the house, there was a tree.", "4. The tree is growing faster."]}, {"n": 8, "s": "Fill in the blanks using the correct words given in the options.\n“Children like to ______ crispy snacks. But the author in seventeen oranges was very fond of ______ oranges. Eventually, he was forced to ______ all the ______ including ______.”", "o": ["2 1 4 5 3", "2 3 1 5 4", "1 3 2 4 5", "3 1 2 5 4"], "a": 3, "e": "munch → eating → swallow → chunks → pips gives the sensible sentence (3 1 2 5 4).", "t": "munch – eating – swallow – chunks – pips என்ற வரிசையே பொருள் பொருந்தும் (3 1 2 5 4).", "it": ["1. eating", "2. swallow", "3. munch", "4. pips", "5. chunks"]}, {"n": 9, "s": "Which of the following statements are true about Jawaharlal Nehru?", "o": ["(i) only", "(ii) and (iii) only", "(i) and (ii) only", "(i) and (iii) only"], "a": 1, "e": "Nehru wrote ‘Glimpses of World History’ (not ‘Indian History’); he was India’s first PM and architect of the modern nation-state.", "t": "நேரு எழுதியது ‘Glimpses of World History’ (Indian History அல்ல). அவர் முதல் பிரதமர்; நவீன இந்தியாவின் சிற்பி – (ii), (iii) சரி.", "it": ["(i) He wrote the book “Glimpses of Indian History”.", "(ii) He was the First Prime Minister of India.", "(iii) He is considered to be the architect of the modern Indian Nation-state."]}, {"n": 10, "s": "Match the words with the suitable pair words.", "o": ["(a)-3 (b)-2 (c)-4 (d)-5 (e)-1", "(a)-4 (b)-2 (c)-5 (d)-1 (e)-3", "(a)-2 (b)-3 (c)-1 (d)-5 (e)-4", "(a)-1 (b)-5 (c)-3 (d)-4 (e)-2"], "a": 1, "e": "Walls crumble; lights flicker; people huddle; a valley path straggles; insects scuttle.", "t": "சுவர்கள் – crumble; விளக்குகள் – flicker; மக்கள் – huddle; பள்ளத்தாக்குப் பாதை – straggle; பூச்சிகள் – scuttle.", "m": {"h": ["Column - A", "Column - B"], "a": ["(a) Walls", "(b) Lights", "(c) People", "(d) Path of a valley", "(e) Insects"], "b": ["1. Straggle", "2. Flicker", "3. Scuttle", "4. Crumble", "5. Huddle"]}}, {"n": 11, "s": "Which of the following statements are true about the play ‘The Tempest’?", "o": ["(ii) only", "(i) and (ii) only", "(ii) and (iii) only", "(i) and (iii) only"], "a": 2, "e": "The Tempest (c.1610–11) is among Shakespeare’s last plays and was inspired by the 1609 Sea Venture shipwreck; it was not written in 1500.", "t": "‘The Tempest’ (சு. 1610–11) ஷேக்ஸ்பியரின் கடைசி நாடகங்களுள் ஒன்று; 1609 கப்பல் விபத்தை அடிப்படையாகக் கொண்டது. 1500 என்பது தவறு.", "it": ["(i) ‘The Tempest’ was written in 1500.", "(ii) It is considered to be one of the last plays of William Shakespeare.", "(iii) It is believed that the play ‘The Tempest’ was based on an actual wreck of a ship."]}, {"n": 12, "s": "Translate the following sentence into English.\nநாளை இந்நேரத்திற்குள் நான் இந்த வேலையை முடித்திருப்பேன்.\nChoose the correct translation from the options given of the sentence given below.", "o": ["I will have completed this work by tomorrow.", "I would have finished this work by tomorrow.", "I have completed this work by this time tomorrow.", "I would have completed this work by this time tomorrow."], "a": 3, "e": "‘By this time tomorrow’ (இந்நேரத்திற்குள்) must appear; per the ticked key the answer is (D).", "t": "‘நாளை இந்நேரத்திற்குள்’ = by this time tomorrow என்ற தொடர் இடம்பெற வேண்டும்; விடைக்குறிப்பின்படி (D)."}, {"n": 13, "s": "Sentence: They were being followed when they left the building.\nQuestion: Which of the following Tamil Sentences best conveys the meaning of the given English Sentence?\n(a) அவர்கள் கட்டிடத்தை விட்டு வெளியேறிய போது அவர்களை பின் தொடர்ந்தார்கள்\n(b) அவர்கள் கட்டிடத்தை விட்டு வெளியேறும் போது அவர்கள் பின் தொடரப்பட்டுக் கொண்டிருந்தார்கள்\n(c) அவர்கள் கட்டிடத்தை விட்டு வெளியேறினார்கள், அவர்களை பின் தொடர்ந்தார்கள்.\n(d) அவர்கள் கட்டிடத்தை விட்டு வெளியேறும் போது அவர்கள் பின் தொடர்ந்தார்கள்.", "o": ["(a) and (b)", "only (b)", "(a) and (d)", "only (c)"], "a": 1, "e": "‘Were being followed’ is past continuous passive → ‘தொடரப்பட்டுக் கொண்டிருந்தார்கள்’, found only in (b).", "t": "‘were being followed’ = இறந்தகால தொடர் செயப்பாட்டுவினை → ‘தொடரப்பட்டுக் கொண்டிருந்தார்கள்’ – (b) மட்டுமே."}, {"n": 14, "s": "Which of the following statements accurately reflect the main ideas presented in the passage about Aadhaar? Select all statements that apply.", "o": ["(b), (c), (d)", "(a), (b), (c), (d)", "(b) and (c)", "only (b)"], "a": 0, "e": "Statement (a) is wrong (Aadhaar expanded beyond welfare); (b), (c), (d) match the passage.", "t": "(a) தவறு – ஆதார் நலத்திட்டங்களைத் தாண்டி விரிவடைந்துள்ளது; (b), (c), (d) பத்தியுடன் ஒத்துப்போகின்றன.", "p": "‘Aadhaar’, India’s unique ID has expanded from welfare to various diverse services. It aimed to reduce fraud and boost financial inclusion. Concerns about privacy and exclusion persist. Court rulings balance security with rights.", "it": ["(a) Aadhaar is only used for welfare distribution.", "(b) Aadhaar’s scope has grown beyond it’s initial purpose", "(c) Aadhaar aimed to reduce fraud and improve financial inclusion", "(d) Privacy and exclusion concerns are associated with Aadhaar"]}, {"n": 15, "s": "What is the biggest challenge for banks in India?", "o": ["To handle corporate borrowers", "To pursue targets of financial inclusion", "Ever increasing level of non performing assets", "Onslaught of foreign banks"], "a": 2, "e": "The passage speaks of RBI measures to improve the profile of non-performing banks – rising NPAs are the main challenge.", "t": "பத்தியில் வாராக்கடன் (NPA) நிலையை மேம்படுத்தும் நடவடிக்கைகள் கூறப்படுவதால், NPA உயர்வே பெரிய சவால்.", "p": "With a sense of optimism slowly creeping in, the banking industry is hopeful that 2025 will bring better growth prospects. This optimism stems from a number of factors. For one, the Government is working hard to revitalise the industrial growth in the country. Secondly, the RBI has initiated a numbers of measures that would go a long way in helping the banks to restructure themselves thereby improving the profile of non-performing banks."}, {"n": 16, "s": "Which question type illustrates a point or focuses attention on an idea or principle? Choose from the options given below.", "o": ["Rhetorical", "Funnel", "Inference", "Divergent"], "a": 0, "e": "A rhetorical question is asked to make a point or draw attention, not to get an answer.", "t": "கருத்தை வலியுறுத்தவோ கவனத்தை ஈர்க்கவோ கேட்கப்படுவது rhetorical question (சொல்லாட்சி வினா)."}, {"n": 17, "s": "Based on the passage, which of the following is most likely to be true?", "o": ["Only (a)", "Both (a) and (b)", "Only (b)", "Both (c) and (d)"], "a": 2, "e": "The CEO rejects price cuts and stresses brand loyalty and differentiated service – so only (b) is supported.", "t": "விலைக்குறைப்பை மறுத்து, பிராண்ட் விசுவாசம் மற்றும் தனித்துவமான சேவையை வலியுறுத்துவதால் (b) மட்டுமே சரி.", "p": "A company facing declining market share considered two options: aggressive price cuts or a niche product line targeting a specific consumer segment. The CEO, known for his long-term vision, argued that the price cuts would only offer temporary relief and erode brand value. He emphasized building a loyal customer base through unique product offerings and differentiated service.", "it": ["(a) The company is primarily focused on short-term financial gains.", "(b) The CEO of the company prioritizes sustainable growth and brand loyalty.", "(c) The company’s main challenge is a lack of production capacity.", "(d) The niche product strategy has proved to be successful for the company."]}, {"n": 18, "s": "Match the initiatives of the Tamil Nadu climate change mission in Column A with their expected outcomes in Column B.", "o": ["(a)-2 (b)-4 (c)-1 (d)-3", "(a)-1 (b)-4 (c)-2 (d)-3", "(a)-3 (b)-4 (c)-1 (d)-2", "(a)-4 (b)-3 (c)-1 (d)-2"], "a": 2, "e": "Reforestation → carbon absorption & biodiversity; Coastal zone plans → protect shorelines; Renewables → less fossil fuel; Community programmes → local resilience.", "t": "மறுவனமாக்கல் → கார்பன் உறிஞ்சல்; கடலோர மேலாண்மை → கரைப் பாதுகாப்பு; புதுப்பிக்கத்தக்க ஆற்றல் → புதைபடிவ எரிபொருள் சார்பு குறைவு; சமூகத் திட்டங்கள் → உள்ளூர் தாங்குதிறன்.", "p": "The Tamil Nadu climate change mission focusses on mitigating the impact of climate change through various initiatives. Reforestation projects aim to increase carbon sinks and restore biodiversity. Coastal zone Management plans protect vulnerable shorelines from rising sea-levels. Promotion of renewable energy sources, like solar and wind power, reduce dependence on fossil fuels. Community-based adaptation programs build resilience in local populations facing climate-related challenges.", "m": {"h": ["Column A", "Column B"], "a": ["(a) Reforestation projects", "(b) Coastal Zone Management plans", "(c) Promotion of renewable energy", "(d) Community-based adaptation programs"], "b": ["1. Reduces reliance on fossil fuels", "2. Enhances local resilience to climate impact", "3. Increases carbon absorption and biodiversity", "4. Protects shorelines from rising sea levels"]}}, {"n": 19, "s": "Which of the following statements accurately compare crypto currencies and stocks as described in the passage?", "o": ["(b) and (d)", "(a) and (c)", "(d) and (a)", "(d) and (c)"], "a": 0, "e": "Both involve investment (b) and both react differently to market fluctuations (d).", "t": "இரண்டும் முதலீடு சார்ந்தவை (b); சந்தை ஏற்ற இறக்கங்களுக்கு வேறுபட்டு எதிர்வினையாற்றும் (d).", "p": "Crypto currencies and traditional stocks both involve investment. Crypto currencies are highly volatile, stocks are relatively stable. Both are susceptible to market fluctuations, albeit differently.", "it": ["(a) Crypto currencies and stocks involve no investment", "(b) Crypto currencies and stocks both involve investment", "(c) Crypto currencies and stocks both immune to market fluctuations", "(d) Crypto currencies and stocks react differently to market fluctuations."]}, {"n": 20, "s": "Which of the following statements accurately describes the sequence of events in the passage?", "o": ["(a) and (d)", "(d) and (b)", "(c) and (a)", "(b) and (c)"], "a": 3, "e": "Sequence: heated → boils → steam → cools/condenses. So (b) and (c) are correct.", "t": "வரிசை: சூடாக்குதல் → கொதித்தல் → நீராவி → குளிர்ந்து திரவமாதல். எனவே (b), (c) சரி.", "p": "First, water is heated. Then, it boils. Next, steam is produced. Finally, the steam cools and condenses.", "it": ["(a) Steam is produced before the water boils.", "(b) Water is heated before it boils.", "(c) Steam cools and condenses after it is produced.", "(d) The process starts with the cooling and condensing of steam."]}, {"n": 21, "s": "Which of the following statements best support the claim that reforestation is beneficial?", "o": ["(b), (a), (c)", "(b), (d), (a)", "(b), (c), (d)", "(a), (b), (c)"], "a": 2, "e": "(a) contradicts the passage; (b), (c), (d) support the claim.", "t": "(a) பத்திக்கு முரணானது; (b), (c), (d) மறுவனமாக்கலின் நன்மைகளை ஆதரிக்கின்றன.", "p": "Reforestation projects restore degraded ecosystems. They increase biodiversity and improve air quality. They also enhance water retention. These efforts support long-term environmental sustainability.", "it": ["(a) Reforestation projects decrease biodiversity.", "(b) Reforestation projects restore degraded ecosystems.", "(c) Reforestation projects improve air quality.", "(d) Reforestation projects enhance water retention."]}, {"n": 22, "s": "Which of the following statements are NOT characteristic of a formal letter?", "o": ["(a)", "(b)", "(c)", "(d)"], "a": 2, "e": "Slang or unprofessional expressions have no place in a formal letter.", "t": "பேச்சுவழக்குச் சொற்கள் / தொழில்முறையற்ற நடை முறைசார் கடிதத்தின் பண்பல்ல.", "it": ["(a) Use of professional language.", "(b) Clear and understandable structure.", "(c) Use of slang or unprofessional expressions.", "(d) Convey official information"]}, {"n": 23, "s": "Arrange the jumbled statements in logical form and choose the correct order.", "o": ["(b), (d), (a), (c)", "(a), (c), (b), (d)", "(d), (b), (c), (a)", "(c), (a), (d), (b)"], "a": 0, "e": "Ticked key: (b) states the main idea, (d) the result, then (a) and (c) follow.", "t": "விடைக்குறிப்பின்படி வரிசை (b), (d), (a), (c).", "it": ["(a) This shift has challenged for the motif of artistic expression.", "(b) Contemporary art is primarily acknowledged by its interdisciplinary nature.", "(c) Apparently, the boundaries between different artistic connections are merged for good.", "(d) As a result, artists are now exploring new forms of creative collaboration."]}, {"n": 24, "s": "In the following sentence ordering, the first (S1) and sixth (S6) sentences of a passage are already provided. The middle four sentences are shuffled up; they are labelled P Q R & S. Rearrange these four sentences and choose the correct order.", "o": ["S1, S, Q, P, R, S6", "S1, Q, S, R, P, S6", "S1, R, P, Q, S, S6", "S1, P, S, Q, R, S6"], "a": 1, "e": "Q introduces intellectual history; S adds (‘Moreover’); R follows (‘Consequently’); P (‘however’) leads to S6.", "t": "Q (அறிமுகம்) → S (Moreover) → R (Consequently) → P (however) → S6 என்ற தொடர்ச்சி பொருந்தும்.", "it": ["S1: The study of intellectual history provides significant insights into the development of human history.", "P: This however, understands the historical context in which these ideas emerged.", "Q: Intellectual history often involves understanding the evolution of main concepts and their impact on the society.", "R: Consequently interpretations of these concepts can widely vary depending on the researchers’ perspective", "S: Moreover, these concepts are frequently revisited and reinterpreted over the period.", "S6: Essentially, it seeks to enhance the complex intersection between ideas and their socio-cultural milieu."]}, {"n": 25, "s": "Find out the best inference based on the passage:\nThere were different streams of freedom movements in colonial India carried out by the moderates, liberals, radicals, socialists and so on.\nWhich of the following is the best inference from the above statement?", "o": ["The emergence of nationalism in colonial India led to our independence", "Nationalism in India emerged in the context of colonialism", "Nationalism in India is homogenous", "Nationalism in India is heterogenous"], "a": 3, "e": "Many different streams → varied (heterogeneous) nationalism, not uniform.", "t": "பல்வேறு போக்குகள் இருந்ததால் இந்திய தேசியம் ஒரேவகையானது அல்ல – பன்முகத்தன்மை (heterogeneous) கொண்டது."}, {"n": 26, "s": "Choose the correct code to fill in the blanks:", "o": ["conclusive, exquisite, excellent, inspiring", "exquisite, excellent, inspiring, conclusive", "excellent, exquisite, inspiring, conclusive", "inspiring, conclusive, excellent, exquisite"], "a": 2, "e": "excellent result; exquisite in taste; inspiring speech; conclusive evidence.", "t": "excellent result; exquisite taste; inspiring speech; conclusive evidence.", "it": ["1. The manager was known for his positive approach to decision-making, which often led to ______ result.", "2. The Chef’s dish were not only ______ in taste but also elaborate in presentation.", "3. The Chief Guest’s speech was so ______ that it left the audience motivated.", "4. The Student’s decision was based on the ______ evidence, which made the outcome of the project predictable."]}, {"n": 27, "s": "In a legal context, which of the following sentences use the word ‘right’ appropriately?", "o": ["(a) and (c)", "only (b)", "only (c)", "(c) and (d)"], "a": 1, "e": "‘Right’ as a legal entitlement appears only in (b) “your right to remain silent”.", "t": "சட்ட உரிமை என்ற பொருளில் ‘right’ (b) இல் மட்டுமே வந்துள்ளது.", "it": ["(a) Turn right at the next intersection", "(b) It is your right to remain silent", "(c) The answer is right in front of you", "(d) He wanted to right the wrong he did to his sister"]}, {"n": 28, "s": "Which pair is an example of homophones?", "o": ["Read and Read", "Light and dark", "Bear and bare", "Pretty and beautiful"], "a": 2, "e": "Homophones sound alike but differ in meaning/spelling: bear – bare.", "t": "ஒலி ஒன்று, பொருள்/எழுத்துக்கூட்டல் வேறு – homophones: bear – bare."}, {"n": 29, "s": "Complete the blanks using the phrasal verbs given in the options:", "o": ["1-(c) 2-(d) 3-(b) 4-(a)", "1-(b) 2-(c) 3-(a) 4-(d)", "1-(a) 2-(c) 3-(d) 4-(b)", "1-(c) 2-(b) 3-(d) 4-(a)"], "a": 3, "e": "ring up; drop in; do without; try out.", "t": "ring up; drop in; do without; try out.", "it": ["1. You’d better ring her ______ and tell her you’ll be late.", "2. I invited her to drop ______ any time she was passing for a cup of tea.", "3. If you can’t afford it, you’ll have to do ______ it.", "4. He won’t buy the car without trying it ______ on the road first.", "(a) out   (b) in   (c) up   (d) without"]}, {"n": 30, "s": "Identify the correct spelling of the word which denotes the following sentence.\nA class of people in society who are interested mainly in having more money and a higher social position.", "o": ["Bourggiese", "Borgieoise", "Bourgeoisie", "Bourgeosie"], "a": 2, "e": "Correct spelling: Bourgeoisie (the middle/capitalist class).", "t": "சரியான எழுத்துக்கூட்டல்: Bourgeoisie (நடுத்தர / முதலாளித்துவ வர்க்கம்)."}, {"n": 31, "s": "Which of the following British English words in column A are incorrectly paired with the American English words in column B?", "o": ["1 and 2", "2 and 4", "3 and 4", "1 and 3"], "a": 3, "e": "Courgette = Zucchini and Aubergine = Eggplant; pairs 1 and 3 are swapped (incorrect).", "t": "Courgette = Zucchini; Aubergine = Eggplant. எனவே 1, 3 தவறான இணைகள்.", "m": {"h": ["Column A (British)", "Column B (American)"], "a": ["1. Courgette", "2. Rocket", "3. Aubergine", "4. Fringe"], "b": ["Egg plant", "Arugala", "Zucchini", "Bangs"]}}, {"n": 32, "s": "In the given pairs, the type of compound word is given in column A and the examples are given in column B. Identify the incorrect pairs of types and their examples.", "o": ["1 and 3", "1 and 2", "2 and 4", "3 and 4"], "a": 1, "e": "‘Snowman’ is a closed compound and ‘ice cream’ is an open compound – so pairs 1 and 2 are incorrect.", "t": "snowman – closed compound; ice cream – open compound. எனவே 1, 2 தவறு.", "m": {"h": ["Column A", "Column B"], "a": ["1. Open compound words", "2. Closed compound words", "3. Co-ordinative compound words", "4. Adjective compound words"], "b": ["snowman", "ice cream", "walkie-talkie", "blue-eyed"]}}, {"n": 33, "s": "What figure of speech is the following?\nLife is compared to pathless wood with the word ‘like’.", "o": ["Metaphor", "Personification", "Simile", "Hyperbole"], "a": 2, "e": "A comparison using ‘like’ or ‘as’ is a simile.", "t": "‘like’, ‘as’ கொண்டு ஒப்பிடுவது simile (உவமை)."}, {"n": 34, "s": "Select the correct Passive forms of the sentence: “The Manager will give you a ticket”.", "o": ["(a) and (b)", "(a) and (c)", "(b) and (d)", "(b) and (c)"], "a": 2, "e": "Two valid passives: ‘A ticket will be given to you by the Manager’ and ‘You will be given a ticket by the Manager’.", "t": "சரியான செயப்பாட்டு வடிவங்கள் (b), (d).", "it": ["(a) A ticket will be given to the Manager by you.", "(b) A ticket will be given to you by the Manager.", "(c) The Manager will be given a ticket by you.", "(d) You will be given a ticket by the Manager."]}, {"n": 35, "s": "Match the following with correct type of sentence:", "o": ["(a)-3 (b)-2 (c)-1 (d)-4", "(a)-4 (b)-3 (c)-1 (d)-2", "(a)-3 (b)-4 (c)-1 (d)-2", "(a)-4 (b)-3 (c)-2 (d)-1"], "a": 2, "e": "This pen is blue – Declarative; Please help me – Imperative; How are you? – Interrogative; How well she dances! – Exclamatory.", "t": "This pen is blue – கூற்று; Please help me – கட்டளை; How are you? – வினா; How well she dances! – வியப்பு.", "m": {"h": ["Column A", "Column B"], "a": ["(a) This pen is blue", "(b) Please help me", "(c) How are you?", "(d) How well she dances!"], "b": ["1. Interrogative", "2. Exclamatory", "3. Declarative", "4. Imperative"]}}, {"n": 36, "s": "‘Is she not changing her dress’. Which of the following is the correct statement of this interrogative?", "o": ["She will not change her dress", "She was not changing her dress", "She will change her dress", "She is not changing her dress"], "a": 3, "e": "Convert the question to a statement keeping tense: ‘She is not changing her dress.’", "t": "காலத்தை மாற்றாமல் கூற்றாக்கினால்: ‘She is not changing her dress.’"}, {"n": 37, "s": "Transform the following sentence into a negative sentence.\n“He is too shrewd to be cheated”", "o": ["(a)", "(b)", "(c)", "(d)"], "a": 1, "e": "‘Too … to’ → ‘so … that … cannot’: He is so shrewd that he cannot be cheated.", "t": "too … to → so … that … cannot: He is so shrewd that he cannot be cheated.", "it": ["(a) He is not shrewd enough to be cheated", "(b) He is so shrewd that he cannot be cheated", "(c) He is not too shrewd to be cheated", "(d) He is shrewd"]}, {"n": 38, "s": "Convert the exclamatory sentence: “Had she known it earlier” into an assertive sentence.", "o": ["(a)", "(b)", "(c)", "(d)"], "a": 1, "e": "A wish expressed in an exclamatory conditional → ‘I wish she had known it earlier’.", "t": "‘Had she known it earlier!’ என்ற ஆதங்கம் → ‘I wish she had known it earlier.’", "it": ["(a) She knew it earlier", "(b) I wish she had known it earlier", "(c) Knowing this earlier is beneficial", "(d) She should have known it earlier"]}, {"n": 39, "s": "Which one of the following has a correct infinitive?", "o": ["(a)", "(b)", "(c)", "(d)"], "a": 0, "e": "‘bold enough to take decisions’ uses the infinitive correctly (to + base verb).", "t": "‘enough to + வினையடி’ – (a) சரி; (d) ‘to taking’ தவறு.", "it": ["(a) She is bold enough to take decisions", "(b) She is bold enough in accepting challenges", "(c) She is bold but afraid of snakes", "(d) She is bold enough to taking decisions"]}, {"n": 40, "s": "Choose the correct answer for the underlined words.\nI heard of his having gained a prize.", "o": ["Gerund", "Compound Gerund", "Infinitive", "Participle"], "a": 1, "e": "‘having + past participle’ is the perfect (compound) gerund form (as per the ticked key).", "t": "‘having gained’ – perfect / compound gerund (விடைக்குறிப்பின்படி)."}, {"n": 41, "s": "Identify the participle in the given sentence: “The barking dog kept the neighbours awake all night”.", "o": ["barking", "the", "kept", "awake"], "a": 0, "e": "‘Barking’ is a present participle used as an adjective for ‘dog’.", "t": "‘barking’ – நிகழ்கால வினையெச்சம்/பெயரடையாக வரும் participle."}, {"n": 42, "s": "Choose the correct question tag for the sentence given below.\nLet’s all go to the beach this evening, ______?", "o": ["do we?", "don’t we?", "shall we?", "aren’t we?"], "a": 2, "e": "Let’s … takes the tag ‘shall we?’.", "t": "‘Let’s …’ என்றால் tag – ‘shall we?’."}, {"n": 43, "s": "Which of the following is the best synthesis of the two sentences using a cause-effect relationship?\nSentence 1 – The company decreased its product prices.\nSentence 2 – Sales increased gradually.", "o": ["(a)", "(b)", "(c)", "(d)"], "a": 1, "e": "Per the ticked key, (b) with ‘so’ shows the cause-effect link.", "t": "விடைக்குறிப்பின்படி (b) – ‘so’ மூலம் காரண–விளைவு உறவு.", "it": ["(a) The company decreased its product prices, which caused sales to increase gradually.", "(b) The company decreased its product prices, so sales increased gradually.", "(c) The company decreased its product prices and sales increased gradually.", "(d) Sales increased gradually as a result of the company decreasing its product prices."]}, {"n": 44, "s": "Which includes an apostrophe indicating the possessive form?", "o": ["(a)", "(b)", "(c)", "(d)"], "a": 1, "e": "‘Mr. X’s new bag’ shows possession; in the others ’s = is/has.", "t": "Mr. X’s new bag – உடைமை; மற்றவற்றில் ’s = is / has.", "it": ["(a) Our child’s busy", "(b) Mr. X’s new bag is ready", "(c) Mrs. X’s got her bag", "(d) The child’s slept"]}, {"n": 45, "s": "Which of the following clearly describes an ‘adhoc’ committee?", "o": ["A committee that meets regularly", "A committee formed for a specific purpose and dissolved after that purpose is achieved", "A committee with a permanent layout", "A committee that oversees all organisational activities"], "a": 1, "e": "Ad hoc = formed for a specific purpose and dissolved afterwards.", "t": "Ad hoc குழு – குறிப்பிட்ட நோக்கத்திற்காக அமைக்கப்பட்டு, நோக்கம் முடிந்ததும் கலைக்கப்படும்."}, {"n": 46, "s": "The word “Agenda” refers to __________", "o": ["A type of clothing", "A form of entertainment", "A list of items to be discussed", "A scientific theory"], "a": 2, "e": "Agenda = list of items to be discussed at a meeting.", "t": "Agenda – கூட்டத்தில் விவாதிக்க வேண்டிய பொருள்களின் பட்டியல்."}, {"n": 47, "s": "The Tamil Nadu Physical Education and Sports University (TNPESU) began to function in ______, to promote sports and culture, harnessing talent at the grass root level.", "o": ["2015", "2007", "2005", "2010"], "a": 2, "e": "As per the ticked key, TNPESU began to function in 2005.", "t": "விடைக்குறிப்பின்படி தமிழ்நாடு உடற்கல்வி மற்றும் விளையாட்டுப் பல்கலைக்கழகம் 2005 இல் செயல்படத் தொடங்கியது."}, {"n": 48, "s": "The meaning of the word ‘Repercussion’ is __________", "o": ["repetitious", "irreplaceable", "an unpleasant effect", "repellent"], "a": 2, "e": "Repercussion = an (often unpleasant) consequence of an action.", "t": "Repercussion – ஒரு செயலின் விளைவு (பெரும்பாலும் விரும்பத்தகாதது)."}, {"n": 49, "s": "Which of the following is not included in a memo?", "o": ["Subject line", "Greeting/Salutation", "To and from sections", "Signature line"], "a": 1, "e": "A memo has no greeting/salutation; it begins with To, From, Date, Subject.", "t": "மெமோவில் வணக்கம்/விளிப்பு (salutation) இடம்பெறாது."}, {"n": 50, "s": "Which of the following is a suitable salutation for a formal letter?", "o": ["Hello", "Dear Sir/Madam", "Cheers", "Best regards"], "a": 1, "e": "‘Dear Sir/Madam’ opens a formal letter; ‘Best regards’ is a closing.", "t": "முறைசார் கடிதத் தொடக்கம் – ‘Dear Sir/Madam’; ‘Best regards’ முடிப்புச் சொல்."}, {"n": 51, "s": "The Acronym of the term ‘DGTD’ is", "o": ["Direct General Telecommunication Department", "District Grant Tax Department", "Digital Government Tele Department", "Directorate General of Technical Development"], "a": 3, "e": "DGTD = Directorate General of Technical Development.", "t": "DGTD – Directorate General of Technical Development."}, {"n": 52, "s": "Identify the poetic works of ‘Robert Frost’.", "o": ["1 only", "1 and 2 only", "1 and 3 only", "2 and 4 only"], "a": 2, "e": "‘The Road Not Taken’ and ‘Mending Wall’ are Frost’s poems; Jungle Book (Kipling) and Treasure Island (Stevenson) are not.", "t": "The Road Not Taken, Mending Wall – ராபர்ட் ஃப்ராஸ்ட் கவிதைகள்; Jungle Book (கிப்ளிங்), Treasure Island (ஸ்டீவன்சன்).", "it": ["1. The Road Not Taken", "2. The Jungle Book", "3. Mending Wall", "4. Treasure Island"]}, {"n": 53, "s": "Which of the following statements do not agree with Gieve Patel’s views in the poem “On killing a tree”?", "o": ["1 and 2", "2 and 4", "3 and 4", "1 and 4"], "a": 1, "e": "Patel says a simple jab will NOT kill a tree, and its strength lies in its roots – so statements 2 and 4 disagree.", "t": "ஒரு சிறு குத்தினால் மரம் வீழாது; மரத்தின் வலிமை வேரில் உள்ளது – எனவே 2, 4 கவிஞர் கருத்துக்கு முரண்.", "it": ["1. Cutting a tree is an act of murder", "2. A simple jab of the knife will cut a tree", "3. Disapproval of mankind is failure to care for the earth", "4. The strength of the tree lies on its big branches"]}, {"n": 54, "s": "Identify the figure of speech in these lines.\nFaster than a cheetah / With a tail that’s miles long / Bigger than a mountain / So powerful and strong.", "o": ["Imagery", "Anaphora", "Consonance", "Simile"], "a": 3, "e": "Direct comparisons (‘faster than’, ‘bigger than’) – simile (as per the ticked key).", "t": "‘faster than’, ‘bigger than’ என நேரடி ஒப்பீடு – simile (விடைக்குறிப்பின்படி)."}, {"n": 55, "s": "Choose the correct choices.\nNavika Sagar Parikrama was a project to", "o": ["1 and 2 are correct", "2 and 4 are correct", "3 and 4 are correct", "2 and 3 are correct"], "a": 1, "e": "The Navika Sagar Parikrama (Indian Navy women officers’ circumnavigation) empowered women and promoted ocean sailing.", "t": "நாவிகா சாகர் பரிக்ரமா – பெண்களை வலுப்படுத்துதல், கடல் பயணச் செயல்பாடுகளை ஊக்குவித்தல் (2, 4).", "it": ["1. Promote Economical status of women.", "2. Empower women to attain their full potential.", "3. Promote reservation of women in the Indian Navy.", "4. Promote ocean sailing activities."]}, {"n": 56, "s": "Who inspired Arthur Conan Doyle to create the character “Sherlock Holmes”?", "o": ["(a) and (c)", "(b) only", "(c) and (d)", "(d) only"], "a": 3, "e": "Doyle modelled Holmes on his Edinburgh teacher Dr Joseph Bell.", "t": "டாக்டர் ஜோசப் பெல் (எடின்பரோ ஆசிரியர்) என்பவரே ஷெர்லாக் ஹோம்ஸ் பாத்திரத்திற்கு உந்துதல்.", "it": ["(a) Dr. Watson", "(b) Dr. Ainstree", "(c) Inspector Smith", "(d) Joseph Bell"]}, {"n": 57, "s": "Identify the incorrect sentence/sentences, according to the given statement.\nAlfred Nobel was considered as –", "o": ["3 and 4", "1 and 3", "4 only", "2 only"], "a": 2, "e": "As per the ticked key, statement 4 is the incorrect one – Nobel’s guilt was over his destructive inventions.", "t": "விடைக்குறிப்பின்படி கூற்று 4 தவறு – நோபலின் குற்றவுணர்வு அழிவுக் கண்டுபிடிப்புகளுக்காக.", "it": ["1. Europe’s richest Vagabond.", "2. A chemist, engineer and an aspiring poet.", "3. A man who felt guilty for having invented highly destructive things.", "4. Felt guilty for having earned so much money."]}, {"n": 58, "s": "Identify the Incorrect Statements.", "o": ["1, 2 and 5 are incorrect", "1, 3 and 5 are incorrect", "2, 4 and 5 are incorrect", "2, 3, 4 are incorrect"], "a": 1, "e": "Mithali Raj scored seven consecutive 50+ scores (not centuries), received the Padma Shri/Khel Ratna (not Padma Bhushan) and was encouraged by her family.", "t": "மிதாலி ராஜ் – தொடர்ந்து 7 அரைசதங்கள் (சதங்கள் அல்ல); பத்மஸ்ரீ (பத்ம பூஷண் அல்ல); குடும்பம் ஊக்குவித்தது. எனவே 1, 3, 5 தவறு.", "it": ["1. Mithali Dorai Raj is the first to score seven consecutive centuries.", "2. The mother tongue of Mithali is Tamil.", "3. Mithali is honoured with Padma Bhushan award.", "4. Mithali is nicknamed as “Tendulkar of Indian Women’s Cricket”.", "5. Mithali is not encouraged to play cricket by her family members."]}, {"n": 59, "s": "Translate:\nபறவைகள் பறக்கின்றன\nChoose the correct English translation from the options which best conveys the meaning of the given sentence.", "o": ["The birds are flying", "Birds fly", "The birds were flying", "The birds will fly"], "a": 0, "e": "‘பறக்கின்றன’ is present continuous → ‘are flying’.", "t": "‘பறக்கின்றன’ – நிகழ்கால வினை → The birds are flying."}, {"n": 60, "s": "What is word for word translation called?", "o": ["Literary translation", "Literal translation", "Administrative translation", "Machine translation"], "a": 1, "e": "Word-for-word translation = literal translation.", "t": "சொல்லுக்குச் சொல் மொழிபெயர்ப்பு – literal translation."}, {"n": 61, "s": "Pick the correct English word for தூண்டிவிடாதே from the options given.", "o": ["Don’t induce me", "Don’t indulge me", "Don’t talk to me", "Don’t make me do what I don’t want to"], "a": 0, "e": "As per the ticked key, ‘தூண்டிவிடாதே’ = ‘Don’t induce me’.", "t": "விடைக்குறிப்பின்படி ‘தூண்டிவிடாதே’ = Don’t induce me."}, {"n": 62, "s": "What is the primary function of e-sevai centers as mentioned in the passage?", "o": ["to provide free internet access to rural population", "to facilitate online delivery of essential government services", "to train government employees in digital literacy", "to manage state-level databases"], "a": 1, "e": "The passage says e-sevai centers facilitate online delivery of essential services and documents.", "t": "இ-சேவை மையங்கள் அத்தியாவசிய அரசுச் சேவைகளை இணையவழி வழங்க உதவுகின்றன.", "p": "‘E-sevai centers’, a cornerstone of Tamil Nadu’s e-governance, streamlines citizen access to essential services. These centers facilitate online delivery of documents like birth certificates and land records, reducing bureaucratic delays. Integrated with state databases, they aim to enhance transparency and minimize corruption. However, challenges persist in ensuring consistent service quality across diverse locations. Digital literacy among rural population remains a crucial factor impacting implementation. Further, system integration and maintenance require continuous investment and skilled personnel. The long-term success of e-sevai depends on bridging the digital divide and maintaining a robust infrastructure."}, {"n": 63, "s": "The passage implies that the long-term sustainability of e-sevai primarily relies on:", "o": ["increasing the number of physical e-sevai centers", "focussing solely on urban areas", "bridging the digital divide and maintaining a robust infrastructure", "reducing the number of available online services"], "a": 2, "e": "The last line: long-term success depends on bridging the digital divide and robust infrastructure.", "t": "பத்தியின் கடைசி வரி: டிஜிட்டல் இடைவெளியைக் குறைத்து வலுவான கட்டமைப்பைப் பராமரிப்பதே நீண்டகால வெற்றி.", "p": "‘E-sevai centers’, a cornerstone of Tamil Nadu’s e-governance, streamlines citizen access to essential services. These centers facilitate online delivery of documents like birth certificates and land records, reducing bureaucratic delays. Integrated with state databases, they aim to enhance transparency and minimize corruption. However, challenges persist in ensuring consistent service quality across diverse locations. Digital literacy among rural population remains a crucial factor impacting implementation. Further, system integration and maintenance require continuous investment and skilled personnel. The long-term success of e-sevai depends on bridging the digital divide and maintaining a robust infrastructure."}, {"n": 64, "s": "In the context of the passage ‘streamline’ means:", "o": ["Complicate", "Simplify", "Delay", "Increase cost"], "a": 1, "e": "Streamline = make simpler and more efficient.", "t": "Streamline – எளிமையாக்கி திறமையாக்குதல்.", "p": "‘E-sevai centers’, a cornerstone of Tamil Nadu’s e-governance, streamlines citizen access to essential services. These centers facilitate online delivery of documents like birth certificates and land records, reducing bureaucratic delays. Integrated with state databases, they aim to enhance transparency and minimize corruption. However, challenges persist in ensuring consistent service quality across diverse locations. Digital literacy among rural population remains a crucial factor impacting implementation. Further, system integration and maintenance require continuous investment and skilled personnel. The long-term success of e-sevai depends on bridging the digital divide and maintaining a robust infrastructure."}, {"n": 65, "s": "Frame a question to get the following answer:\nWhy ______?\nHe has gone to the railway station to see off his cousin.", "o": ["Why has he gone to the railway station?", "Why he went to the railway station?", "Why he go to the railway station?", "Why have he gone to the railway station?"], "a": 0, "e": "Present perfect question: Why + has + subject + past participle.", "t": "Why + has + he + gone – நிகழ்கால நிறைவு வினா அமைப்பு."}, {"n": 66, "s": "Based on the passage, which of the following statements are most likely true?", "o": ["Both (b) and (d)", "Both (a) and (b)", "Both (a) and (d)", "Both (b) and (c)"], "a": 0, "e": "The community faces economic and educational disadvantages (b), and privacy fears hinder the digital centre (d).", "t": "சமூகம் பொருளாதார, கல்வி பின்னடைவுகளைச் சந்திக்கிறது (b); தனியுரிமை அச்சம் தடையாக உள்ளது (d).", "p": "A rural community lacked access to reliable internet and digital devices. Local schools struggled to integrate technology into their curriculum and small businesses found it difficult to compete with online retailers. Community leaders proposed setting up a shared digital center, but residents feared the potential for increased surveillance and data misuse.", "it": ["(a) The digital divide is primarily an urban phenomenon.", "(b) The community is experiencing both economic and educational disadvantages.", "(c) There is complete agreement on the need for a digital center.", "(d) Concerns about privacy are hindering efforts to bridge the digital divide."]}, {"n": 67, "s": "According to Dr. Montague, “Women are not only equal in intelligence to men, they have in reserve the genius of humaneness, the highest form of intelligence. Man proceeds by analysis to study a problem, whereas women can even grasp it intuitively in its entirety”.\nWhat does the above passage imply?", "o": ["Equality in India", "Role of women in India", "Innate Intelligence of women", "About Dr. Montague"], "a": 2, "e": "The passage speaks of women’s intuitive, innate intelligence.", "t": "பெண்களின் இயல்பான, உள்ளுணர்வு சார்ந்த அறிவாற்றலை (innate intelligence) இது உணர்த்துகிறது."}, {"n": 68, "s": "Based on the passage, which of the following are true?", "o": ["Only (a)", "Only (b)", "Only (c)", "Only (d)"], "a": 1, "e": "The fair included environmental experiments – only (b) is stated.", "t": "அறிவியல் கண்காட்சியில் சுற்றுச்சூழல் சார்ந்த சோதனைகள் இடம்பெற்றன – (b) மட்டும்.", "p": "The school’s annual science fair showcased student projects, many experiments focussed on environmental issues. The judges awarded prizes based on creativity and scientific accuracy.", "it": ["(a) The science fair only displayed art projects.", "(b) The science fair included experiments about the environment.", "(c) The judges focused on students’ fashion sense.", "(d) The science fair is held every two years."]}, {"n": 69, "s": "Match the description of the train journey in Column A with their meanings in Column B.", "o": ["(a)-4 (b)-2 (c)-1 (d)-3", "(a)-1 (b)-2 (c)-4 (d)-3", "(a)-2 (b)-1 (c)-4 (d)-3", "(a)-3 (b)-4 (c)-2 (d)-1"], "a": 2, "e": "Clanking – auditory experience; steam – visual effect; passengers gazing – observation and travel; whistle – pace (per key).", "t": "ஒலி – auditory; நீராவி – visual effect; பயணிகள் பார்த்தல் – observation & travel; (விடைக்குறிப்பின்படி) whistle – pace.", "p": "The old train chugged along the tracks, its rhythmic clanking a familiar sound. Steam billowed from its engine, creating a white cloud against the blue sky. Passengers gazed out the windows, watching the landscape roll by. The whistle blew, a long, mournful sound.", "m": {"h": ["Column A", "Column B"], "a": ["(a) Rhythmic clanking", "(b) Steam billows", "(c) Passengers gazing", "(d) Mournful whistle"], "b": ["1. Creates a visual effect", "2. Provides an auditory experience", "3. Highlights the pace of the train", "4. Indicates observation and travel"]}}, {"n": 70, "s": "Complete the sentence below, choosing the suitable words from the options given.\nHe is at the __________ in the organisation.", "o": ["Herculean Task", "High time", "Hitch hike", "Helm of affairs"], "a": 3, "e": "‘At the helm of affairs’ = in charge/in control.", "t": "‘at the helm of affairs’ – நிர்வாகத் தலைமையில்/பொறுப்பில்."}, {"n": 71, "s": "Complete the sentence given below, choosing the most appropriate words from the options given.\n__________, I was born on exactly the same day as my wife.", "o": ["as if", "frighteningly", "my ‘eye!’", "funnily enough"], "a": 3, "e": "‘Funnily enough’ introduces a surprising coincidence.", "t": "‘Funnily enough’ – வியப்பான தற்செயல் நிகழ்வைக் குறிக்கும் தொடர்."}, {"n": 72, "s": "Which of the following can be best inferred from the passage?", "o": ["(a) and (b)", "(b) and (d)", "(b) and (c)", "(a) and (d)"], "a": 2, "e": "Transparency potentially increases (b) and streamlined processes can build trust (c).", "t": "வெளிப்படைத்தன்மை உயரும் (b); எளிய நடைமுறைகள் நம்பிக்கையை வளர்க்கும் (c).", "p": "Digital platforms enhance citizen access to government services. Online portals reduce bureaucratic delays. This implies increased transparency and efficiency. Streamlined processes foster public trust.", "it": ["(a) E-governance increases bureaucratic delays.", "(b) E-governance potentially increases transparency.", "(c) Streamlined processes can build public trust.", "(d) Digital platforms reduce citizen access to services."]}, {"n": 73, "s": "Which of the following statements best summarize the main points of the passage?", "o": ["(b), (a), (c)", "(b), (d), (a)", "(a), (b), (c)", "(b), (c), (d)"], "a": 3, "e": "(b), (c), (d) restate the passage; (a) contradicts it.", "t": "(b), (c), (d) பத்தியின் முக்கியக் கருத்துகள்; (a) முரணானது.", "p": "Renewable energy reduces carbon emissions. Solar and wind power are increasingly viable. This transition combats climate change. Sustainable energy solutions are vital for future generations.", "it": ["(a) Renewable energy has no impact on climate change.", "(b) Renewable energy reduces carbon emissions.", "(c) Solar and wind power are becoming increasingly viable.", "(d) Sustainable energy solutions are crucial for future generations."]}, {"n": 74, "s": "Scenario: You are a volunteer for a local charity and need to know the specific items the charity currently needed for donations. Write an email to the charity’s coordinator asking for an updated donation list.\nType of Query:", "o": ["Only (a)", "Only (c)", "Only (b)", "(a), (b), (c)"], "a": 2, "e": "As per the ticked key the query type is (b) Material Request.", "t": "விடைக்குறிப்பின்படி வினா வகை (b) – Material Request.", "it": ["(a) Charity Support Inquiry", "(b) Material Request", "(c) Donation Item Request", "(d) Volunteer co-ordination"]}, {"n": 75, "s": "Find out the answer and fill up the blank:\nYou want to see him? ______.", "o": ["Beyond all question", "Over head and ears", "Out of the question!", "The ins and outs"], "a": 2, "e": "‘Out of the question’ = impossible / not allowed – a firm refusal.", "t": "‘Out of the question’ – இயலாது / அனுமதிக்க முடியாது."}, {"n": 76, "s": "“Will you tell me who is there?” is an example for __________", "o": ["Direct question", "Indirect question", "Exclamation", "Basic formation"], "a": 1, "e": "The embedded clause ‘who is there’ (statement order) makes it an indirect question.", "t": "உள்ளடங்கிய வினா ‘who is there’ (கூற்று வரிசை) – indirect question."}, {"n": 77, "s": "Fill out the suitable inference:\nShe read the message and sighed, hinting at her __________.", "o": ["achievement", "proud moment", "disappointment", "excitement"], "a": 2, "e": "A sigh hints at disappointment.", "t": "பெருமூச்சு – ஏமாற்றத்தைக் (disappointment) குறிக்கும்."}, {"n": 78, "s": "A famous celebrity wants to experience a normal day without being recognized, visited a local bookstore. Which of the following best describes their state?", "o": ["Ubiquitous", "Ostentatious", "Incognito", "Gregarious"], "a": 2, "e": "Incognito = concealing one’s identity.", "t": "Incognito – அடையாளத்தை மறைத்தபடி."}, {"n": 79, "s": "Choose the correct “Synonym” for the underlined word.\n“Chuck is mendacious about his vegetarianism”.", "o": ["Untruthful", "Proud", "Unhappy", "Clear"], "a": 0, "e": "Mendacious = lying / untruthful.", "t": "Mendacious – பொய்யுரைக்கும் (untruthful)."}, {"n": 80, "s": "Choose the antonyms of the following underlined words.\nThe driver known for his cautiousness was surprised by the road traffic. As his talent was innate, he had to drive slowly.", "o": ["(d)", "(c)", "(a)", "(b)"], "a": 1, "e": "Antonyms: cautiousness → recklessness; innate → acquired.", "t": "cautiousness ↔ recklessness; innate ↔ acquired.", "it": ["(a) Gloomy, active", "(b) Dim, retain", "(c) Recklessness, acquired", "(d) Subtle, intolerant"]}, {"n": 81, "s": "Scenario: You are a newly appointed Civil Servant in the Department of climate change.\nQuestion: You are asked to communicate the department’s initiatives to the public.\nWhich of the following collocations would be most effective in your communication strategy?", "o": ["(a) and (c)", "(b) and (d)", "(b) and (c)", "(c) and (d)"], "a": 1, "e": "Raising public awareness and engaging stakeholders are constructive strategies.", "t": "மக்கள் விழிப்புணர்வு (b), பங்குதாரர் ஆலோசனை (d) – ஆக்கபூர்வமான உத்திகள்.", "it": ["(a) to spread climate misinformation", "(b) to raise public awareness about climate change impacts", "(c) to minimize the urgency of climate action", "(d) to engage in stakeholder consultations"]}, {"n": 82, "s": "Identify the incorrect pairs of Idioms and phrases in the given pairs.", "o": ["1 and 3", "2 and 4", "1 and 2", "3 and 4"], "a": 1, "e": "‘To be at large’ = free/not captured; ‘to pass the buck’ = shift responsibility – pairs 2 and 4 are wrong.", "t": "to be at large = தப்பியோடிய/சுதந்திரமாக; to pass the buck = பொறுப்பைத் தட்டிக்கழித்தல். எனவே 2, 4 தவறு.", "m": {"h": ["Idiom", "Meaning given"], "a": ["1. To brow beat", "2. To be at large", "3. To knit the brow", "4. To pass the buck"], "b": ["bully", "to blame each other", "to frown", "free"]}}, {"n": 83, "s": "Fill in the blank with the suitable word:\n“The pupil was asked to ______ the mistake”.", "o": ["correct", "condone", "clarify", "rectify"], "a": 3, "e": "Per the ticked key, ‘rectify’ (set right) is the answer.", "t": "விடைக்குறிப்பின்படி ‘rectify’ (திருத்துதல்)."}, {"n": 84, "s": "Choose one word to substitute “Creature having both male and female organ”.", "o": ["Omnigenous", "Queer", "Uxorious", "Hermaphrodite"], "a": 3, "e": "Hermaphrodite = having both male and female reproductive organs.", "t": "Hermaphrodite – ஆண், பெண் இனப்பெருக்க உறுப்புகள் இரண்டும் கொண்ட உயிரி."}, {"n": 85, "s": "Choose the correct answer by word creation.\nWhat is the negative case of consistent?\nWhat is the negative case of embark?", "o": ["unconsistent, inembark", "inconsistent, disembark", "inconsistent, unembark", "disconsistent, nonembark"], "a": 1, "e": "consistent → inconsistent; embark → disembark.", "t": "consistent → inconsistent; embark → disembark."}, {"n": 86, "s": "Expand the term IPCC.", "o": ["International Pollution Control Council", "International Panel of Climate Control", "Interim Panel of Climate Change", "Intergovernmental Panel on Climate Change"], "a": 3, "e": "IPCC = Intergovernmental Panel on Climate Change (UN body, 1988).", "t": "IPCC – காலநிலை மாற்றத்திற்கான அரசுகளுக்கிடையேயான குழு (1988)."}, {"n": 87, "s": "Select the correct parts of speech for the underlined word.\nHe makes rather a fuss about ordinary things", "o": ["Adjective", "Adverb", "Noun", "Conjunction"], "a": 1, "e": "‘Rather’ modifies the noun phrase ‘a fuss’ as a degree adverb.", "t": "‘rather’ – அளவைக் குறிக்கும் adverb (வினையடை)."}, {"n": 88, "s": "Select the correct meaningful sentence from the following:", "o": ["The wages of sin are death", "His wages is Rs. 1,000 a day", "Measles are a disease", "Politics has divided the country"], "a": 3, "e": "‘Politics’ is a singular noun taking ‘has’ – (D) is acceptable as per the key.", "t": "‘Politics’ ஒருமைச் சொல் → has; விடைக்குறிப்பின்படி (D)."}, {"n": 89, "s": "Fill in the blanks with the correct form of the verb.\nShe ______ (is) tired because she ______ (clean) the house yesterday.", "o": ["is, had been cleaning", "was, have been cleaning", "was, had been cleaning", "is, has been cleaning"], "a": 2, "e": "Past context (‘yesterday’): was tired because she had been cleaning.", "t": "‘yesterday’ என்பதால் இறந்தகாலம்: was … had been cleaning."}, {"n": 90, "s": "Which of the following is an imperative sentence?", "o": ["(a)", "(b)", "(c)", "(d)"], "a": 2, "e": "‘Clean your room’ is a command.", "t": "‘Clean your room’ – கட்டளை வாக்கியம்.", "it": ["(a) Who are you?", "(b) How did you explain this question?", "(c) Clean your room", "(d) What a great statue!"]}, {"n": 91, "s": "“Let my head be shattered to pieces” is an", "o": ["Interrogative sentence", "Affirmative sentence", "Imperative sentence", "Exclamatory sentence"], "a": 2, "e": "Sentences beginning with ‘Let’ express command/wish – imperative (per the key).", "t": "‘Let …’ எனத் தொடங்கும் வாக்கியம் – imperative (விடைக்குறிப்பின்படி)."}, {"n": 92, "s": "Transform the following assertive sentence into an imperative sentence:\n‘You should answer all the questions’.", "o": ["(a)", "(b)", "(c)", "(d)"], "a": 1, "e": "‘Answer all the questions.’ is the imperative form.", "t": "‘Answer all the questions.’ – கட்டளை வடிவம்.", "it": ["(a) Should you answer all the questions?", "(b) Answer all the questions.", "(c) You answer all the questions.", "(d) All questions should be answered."]}, {"n": 93, "s": "The interrogative form of ‘You have to be there on Monday’ will be", "o": ["Will you be there on Monday?", "Would you be th const $ = (s, r=document) => r.querySelector(s);

const mmss = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s/60), r = s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; };
const shortT = s => { s = Math.round(s); return s < 60 ? s+'s' : Math.floor(s/60)+'m'+(s%60<10?'0':'')+(s%60); };
const fmtDate = ts => new Date(ts).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

function qBody(q){
  let h = '';
  if(q.p) h += `<div class="passage"><b>Passage:</b> ${esc(q.p)}</div>`;
  h += `<div class="stem">` + q.s.split('\n').map(p => `<p class="${/[஀-௿]/.test(p)?'ta':''}">${esc(p)}</p>`).join('') + `</div>`;
  if(q.it) h += `<ul class="items">` + q.it.map(i => `<li class="${/[஀-௿]/.test(i)?'ta':''}">${esc(i)}</li>`).join('') + `</ul>`;
  if(q.m){
    h += `<table class="match"><tr><th>${esc(q.m.h[0])}</th><th>${esc(q.m.h[1])}</th></tr>`;
    for(let i=0;i<q.m.a.length;i++) h += `<tr><td>${esc(q.m.a[i])}</td><td>${esc(q.m.b[i]||'')}</td></tr>`;
    h += `</table>`;
  }
  return h;
}
function grade(attempt){
  let c=0,w=0,u=0,d=0;
  attempt.qids.forEach(n => {
    const q = BYN[n], a = attempt.answers[n];
    if(q.d){ d++; return; }
    if(a === undefined || a === null || a === E_IDX) u++;
    else if(a === q.a) c++; else w++;
  });
  return {c,w,u,d,scored:c+w+u,marks:c*META.marksPerQ};
}
function status(attempt,n){
  const q = BYN[n], a = attempt.answers[n];
  if(q.d) return 'd';
  if(a===undefined||a===null||a===E_IDX) return 'u';
  return a===q.a ? 'c':'w';
}

function toggleTheme(){

/* ---------- RUN TEST ---------- */
function startAttempt(mode, qids){
  const u = user();
  cur = { id:uid(), mode, qids, answers:{}, times:{}, marks:{}, idx:0, mobile:u.mobile, name:u.name,
          startedAt:Date.now(), endAt:Date.now() + qids.length*META.secPerQ*1000 };
  DB.current = cur; save(); beginRun();
}
function beginRun(){
  if(Date.now() >= cur.endAt){ submitAttempt(true); return; }
  view='test'; qStart = Date.now(); renderTest(); startTick();
  window.onbeforeunload = e => { e.preventDefault(); e.returnValue=''; };
}
function startTick(){ stopTick(); tickId = setInterval(tick, 500); }
function stopTick(){ if(tickId){ clearInterval(tickId); tickId=null; } window.onbeforeunload = null; }
let lastSave = 0;
function tick(){
  if(!cur) return;
  const left = (cur.endAt - Date.now())/1000;
  const t = $('#timer'); if(t){ t.textContent = mmss(left); t.classList.toggle('low', left <= 300); }
  const n = cur.qids[cur.idx];
  const spent = (cur.times[n]||0) + (Date.now()-qStart)/1000;
  const qt = $('#qtimer'); if(qt) qt.textContent = mmss(spent);
  const pb = $('#pb'+n+' small'); if(pb) pb.textContent = shortT(spent);
  if(Date.now()-lastSave > 5000){ lastSave = Date.now(); flushTime(true); }
  if(left <= 0) submitAttempt(true);
}
function flushTime(keep){            // add elapsed time on the current question to its total
  if(!cur) return; const n = cur.qids[cur.idx]; const now = Date.now();
  cur.times[n] = (cur.times[n]||0) + (now - qStart)/1000; qStart = now;
  DB.current = cur; save();
}
function goto(i){ flushTime(); cur.idx = Math.max(0, Math.min(cur.qids.length-1, i)); DB.current = cur; save(); renderTest(); window.scrollTo({top:0}); }

      <div class="pgrid">${cur.qids.map((x,i)=>`<button class="pb ${cur.answers[x]!==undefined?'ans':''} ${cur.marks[x]?'mk':''} ${i===cur.idx?'cur':''}" id="pb${x}" data-g="${i}" aria-label="Question ${x}"><b>${x}</b><small>${(cur.times[x]||0)>0?shortT(cur.times[x]):'–'}</small></button>`).join('')}</div>
      <div class="legend"><span><i class="dot" style="background:var(--good-soft);border-color:var(--good)"></i>Answered</span><span><i class="dot" style="background:var(--mark-soft);border-color:var(--mark)"></i>Marked</span><span><i class="dot"></i>Not visited / unanswered</span></div>
      <p class="sub" style="margin:10px 0 0">Small text = time spent on that question.<br><span class="ta">சிறிய எழுத்து = அந்த வினாவிற்குச் செலவிட்ட நேரம்.</span></p>
    </aside>
  </div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => { cur.answers[n] = +b.dataset.i; DB.current = cur; save(); renderTest(); });
  $('#prev').onclick = () => goto(cur.idx-1);
  $('#next').onclick = () => goto(cur.idx+1);
  $('#clear').onclick = () => { delete cur.answers[n]; DB.current=cur; save(); renderTest(); };
  $('#mark').onclick = () => { cur.marks[n] = !cur.marks[n]; DB.current=cur; save(); renderTest(); };
  document.querySelectorAll('.pb').forEach(b => b.onclick = () => goto(+b.dataset.g));
  $('#subBtn').onclick = confirmSubmit;
}
function confirmSubmit(){
  flushTime();
  const un = cur.qids.filter(x => cur.answers[x]===undefined || cur.answers[x]===E_IDX).length;
  const m = document.createElement('div'); m.className='modal';
  m.innerHTML = `<div class="card box"><h2 style="font-size:19px">Submit the test? / சமர்ப்பிக்கவா?</h2>
    <p>You have <b>${un}</b> unanswered question(s) and <b>${mmss((cur.endAt-Date.now())/1000)}</b> left.<br><span class="ta">${un} வினாக்களுக்கு விடையளிக்கவில்லை.</span></p>
    <div class="row"><button class="btn" id="cn">Continue / தொடர்</button><button class="btn primary" id="ok">Submit / சமர்ப்பி</button></div></div>`;
  document.body.appendChild(m);
  $('#cn',m).onclick = () => m.remove();
  $('#ok',m).onclick = () => { m.remove(); submitAttempt(false); };
}
function submitAttempt(auto){
  if(!cur) return; flushTime(); stopTick();
  const a = { id:cur.id, ts:Date.now(), mode:cur.mode, qids:cur.qids, answers:cur.answers, times:cur.times,
              name:cur.name, mobile:cur.mobile, used:Math.min(cur.qids.length*META.secPerQ, Math.round((Date.now()-cur.startedAt)/1000)), auto:!!auto };
  if(!DB.users[a.mobile]) DB.users[a.mobile] = {name:a.name, attempts:[]};
  DB.users[a.mobile].attempts.push(a); DB.current = null; cur = null; save();
  renderResult(a);
  if(auto){ const m = document.createElement('div'); m.className='modal'; m.innerHTML = `<div class="card box"><h2 style="font-size:19px">Time is up – test submitted</h2><p class="ta">நேரம் முடிந்தது – தேர்வு தானாகச் சமர்ப்பிக்கப்பட்டது.</p><div class="row"><button class="btn primary" id="ok">View result</button></div></div>`; document.body.appendChild(m); $('#ok',m).onclick = () => m.remove(); }
}

/* ---------- RESULT ---------- */
function renderResult(a, tab){
  stopTick(); view='result'; resultAttempt = a; resultTab = tab || 'all';
  const g = grade(a);
  const list = a.qids.filter(n => resultTab==='all' || (resultTab==='c'&&status(a,n)==='c') || (resultTab==='w'&&status(a,n)==='w') || (resultTab==='u'&&status(a,n)==='u'));
  const retryIds = a.qids.filter(n => ['w','u'].includes(status(a,n)));
  const totalSpent = a.qids.reduce((s,n)=>s+(a.times[n]||0),0);
  document.title = META.fileTitle + '_' + (a.name||'').replace(/\s+/g,'_') + '_Result';
  $('#app').innerHTML = `
  <header class="top"><div class="wrap"><div><div class="title">${esc(META.title)}</div><div class="sub">Result · ${fmtDate(a.ts)} · ${a.mode==='full'?'Full test':'Retry test ('+a.qids.length+' Qs)'}</div></div>
    <div class="actions noprint" style="margin:0"><button class="btn sm" id="home">⌂ Home</button><button class="btn sm" id="themeBtn">◐ Theme</button></div></div></header>
  <div class="wrap">
    <div class="printonly" style="text-align:center;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:6px"><b style="font-size:13pt">${esc(META.title)}</b><br><span class="ta">${esc(META.titleTa)}</span><br><span style="font-size:9pt">Attempt: ${fmtDate(a.ts)} · ${a.mode==='full'?'Full test':'Retry test'}</span></div>
    <div style="padding:16px 0 0"><b style="font-size:18px">${esc(a.name)}</b> <span class="sub">· Mobile ${esc(a.mobile)}</span>${a.auto?' <span class="chip u">Auto-submitted at time-up</span>':''}</div>
    <div class="score">
      <div class="sc big"><b>${g.c} / ${g.scored}</b><small>Score · Marks ${g.marks.toFixed(1)} of ${(g.scored*META.marksPerQ).toFixed(1)}</small></div>
      <div class="sc good"><b>${g.c}</b><small>Right / சரி</small></div>
      <div class="sc bad"><b>${g.w}</b><small>Wrong / தவறு</small></div>
      <div class="sc un"><b>${g.u}</b><small>Unanswered / விடையிலா</small></div>
      <div class="sc"><b>${mmss(totalSpent)}</b><small>Time taken · of ${mmss(a.qids.length*META.secPerQ)}</small></div>
    </div>
    ${g.d ? `<p class="sub">Q93 (under Expert Committee review) is not counted in the score.</p>`:''}
    <div class="actions noprint">
      <button class="btn primary" id="retakeFull">↻ Retake full test</button>
      <button class="btn" id="retakeWU" ${retryIds.length?'':'disabled'}>↻ Retake wrong &amp; unanswered only (${retryIds.length})</button>
      <button class="btn" id="dl">⬇ Download attempted test (PDF)</button>
    </div>
    <div class="tabs noprint" role="tablist">
      ${[['all','All / எல்லாம்',a.qids.length],['c','Right / சரி',g.c],['w','Wrong / தவறு',g.w],['u','Unanswered / விடையிலா',g.u]].map(t=>`<button class="tab ${resultTab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]} (${t[2]})</button>`).join('')}
    </div>
    <div id="resultList">${list.length ? list.map(n => resultCard(a,n)).join('') : '<p class="sub">Nothing in this list. / பட்டியலில் எதுவுமில்லை.</p>'}</div>
  </div>`;
  $('#home').onclick = renderHome; $('#themeBtn').onclick = toggleTheme;
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => renderResult(a, b.dataset.tab));
  $('#retakeFull').onclick = () => { DB.last = {name:a.name, mobile:a.mobile}; startAttempt('full', Q.map(q=>q.n)); };
  $('#retakeWU').onclick = () => { DB.last = {name:a.name, mobile:a.mobile}; startAttempt('retry', retryIds); };
  $('#dl').onclick = () => downloadPdf(a);
}
function resultCard(a,n){
  const q = BYN[n], s = status(a,n), ans = a.answers[n];
  const lab = {c:'Right / சரி', w:'Wrong / தவறு', u:'Unanswered / விடையிலா', d:'Under review – not scored'}[s];
  const opts = q.o.map((t,i)=>{
    let cls='', tag='';
    if(!q.d && i===q.a){ cls='ok'; tag='✔ Correct answer'; }
    if(ans===i && (q.d || i!==q.a)){ cls = q.d ? '' : 'no'; tag = '✘ Your answer'; }
    else if(ans===i && i===q.a){ tag = '✔ Your answer (correct)'; }
    else if(q.d && ans===i){ tag='Your answer'; }
    return `<div class="ro ${cls} ${/[஀-௿]/.test(t)?'ta':''}"><span class="k">${LET[i]}</span><span>${esc(t)}</span><span class="tag">${tag}</span></div>`;
  }).join('');
  const eLine = ans===E_IDX ? `<div class="sub">You chose (E) Answer not known.</div>` : '';
  return `<article class="card rq ${s}"><div class="meta"><span class="qno">Q${n}</span><span class="chip ${s}">${lab}</span>
    <span class="chip t">⏱ ${mmss(a.times[n]||0)} (${Math.round(a.times[n]||0)} s)</span></div>
    ${qBody(q)}${opts}${eLine}
    <div class="expl"><b>Explanation:</b> ${esc(q.e)}<span class="ta">${esc(q.t)}</span></div></article>`;
}
function downloadPdf(a){
  // Opens the browser's print dialog – choose “Save as PDF”. The print stylesheet shows the full attempted test.
  const prev = document.title; renderResult(a, 'all');
  document.title = META.fileTitle + '_' + (a.name||'student').replace(/\s+/g,'_') + '_Attempt';
  setTimeout(() => { window.print(); setTimeout(()=>{document.title = prev;}, 500); }, 150);
}

/* ---------- boot ---------- */
(function boot(){
  // Resume an unfinished test after refresh / accidental close / session loss – timer keeps running on the clock.
  if(DB.current){
    const c = DB.current; DB.last = {name:c.name, mobile:c.mobile};
    if(Date.now() >= c.endAt){ cur = c; submitAttempt(true); return; }
    cur = c; renderHome(); return;
  }
  renderHome();
})();
</script>
</body>
</html>
