:root{
  --pri:#1b5e3b; --pri-d:#134629; --pri-s:#e6f2ea; --amber:#b7791f; --amber-s:#fdf3dc;
  --red:#b42318; --red-s:#fdecea; --grn:#157347; --grn-s:#e3f4ea;
  --bg:#f3f6f2; --card:#fff; --tx:#1d2a24; --mut:#5b6b63; --bd:#d6dfd8;
  --r:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:"OVA Sans","Noto Sans","Noto Sans Tamil","Nirmala UI","Latha","Tamil Sangam MN",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
#app{flex:1}
#print-root{flex:0}
button{font:inherit;color:inherit;cursor:pointer}
sup{font-size:.7em;line-height:0}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.site-footer{text-align:center;color:var(--mut);font-size:13px;padding:18px 12px 26px;border-top:1px solid var(--bd);margin-top:28px;background:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px}
.btn{border:1px solid var(--pri);background:#fff;color:var(--pri);border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px}
.btn:hover{background:var(--pri-s)}
.btn.primary{background:var(--pri);color:#fff}
.btn.primary:hover{background:var(--pri-d)}
.btn.warn{border-color:var(--amber);color:var(--amber)}
.btn.warn:hover{background:var(--amber-s)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red-s)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;min-height:34px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mut)}
.ta{color:#26503a}
h1{font-size:26px;line-height:1.25;margin:0 0 4px}
h2{font-size:20px;margin:0 0 10px}
/* home */
.hero{background:linear-gradient(135deg,var(--pri),#2c7a50);color:#fff;border-radius:var(--r);padding:22px 20px;margin-bottom:16px}
.hero h1{color:#fff}.hero p{margin:4px 0 0;opacity:.92}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 0}
.fact{background:rgba(255,255,255,.14);border-radius:10px;padding:10px 12px}
.fact b{display:block;font-size:20px}
.fact span{font-size:13px;opacity:.9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=tel]{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff}
input:focus{outline:2px solid var(--pri);border-color:var(--pri)}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:6px}
.notice{background:var(--amber-s);border:1px solid #ecd49a;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.rules{margin:10px 0 0;padding-left:20px;font-size:14px;color:var(--mut)}
table.saved{width:100%;border-collapse:collapse;font-size:14px}
table.saved th,table.saved td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
table.saved th{color:var(--mut);font-weight:600;font-size:13px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700}
.pill.g{background:var(--grn-s);color:var(--grn)}.pill.r{background:var(--red-s);color:var(--red)}.pill.a{background:var(--amber-s);color:var(--amber)}.pill.n{background:#eceff0;color:#4a5560}
/* test */
.topbar{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.topbar .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .tt{font-weight:700;font-size:15px;line-height:1.3}
.topbar .who{font-size:12px;opacity:.85;font-weight:400}
.timer{background:rgba(255,255,255,.16);border-radius:10px;padding:6px 12px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.warn{background:var(--amber);color:#fff}
.timer.danger{background:var(--red);animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.55}}
.testwrap{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
@media(max-width:860px){.testwrap{grid-template-columns:1fr}}
.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--mut)}
.qhead b{color:var(--tx)}
.qtime{background:var(--pri-s);color:var(--pri-d);border-radius:99px;padding:2px 12px;font-weight:600}
.qen{font-size:18px;font-weight:600}
.qta{font-size:17px;margin-top:6px;color:#26503a}
.opts{display:grid;gap:9px;margin:16px 0}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;min-height:48px}
.opt:hover{border-color:var(--pri)}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;background:#eef2ef;display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--pri);background:var(--pri-s)}
.opt.sel .L{background:var(--pri);color:#fff}
.otxt small{display:block;color:#26503a;font-size:14px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav .sp{flex:1}
.palette h3{margin:0 0 8px;font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pi{border:1.5px solid var(--bd);background:#f1f3f2;border-radius:8px;padding:5px 2px;text-align:center;line-height:1.15;min-height:48px}
.pi b{display:block;font-size:15px}.pi small{display:block;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.pi.ans{background:var(--grn-s);border-color:#8fcfa8}
.pi.mk{background:var(--amber-s);border-color:#e3b95c}
.pi.cur{outline:3px solid var(--pri);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;color:var(--mut);margin:10px 0 12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--bd)}
/* result */
.score{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
@media(max-width:640px){.score{grid-template-columns:1fr;text-align:center}}
.big{background:var(--pri);color:#fff;border-radius:var(--r);padding:18px;text-align:center}
.big b{font-size:48px;line-height:1}.big span{font-size:20px}.big div{opacity:.9;font-size:14px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:#fff}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mut)}
.stat.g b{color:var(--grn)}.stat.r b{color:var(--red)}.stat.a b{color:var(--amber)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 10px}
.tab{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px}
.tc{border-radius:8px;padding:4px 2px;text-align:center;font-size:12px;line-height:1.2;border:1px solid var(--bd)}
.tc b{display:block;font-size:14px}
.tc.g{background:var(--grn-s);border-color:#8fcfa8}.tc.r{background:var(--red-s);border-color:#f0b4ad}.tc.n{background:#eceff0}
.rq{margin-bottom:12px;break-inside:avoid;page-break-inside:avoid}
.rq .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:13px}
.ro{display:flex;gap:8px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;margin:5px 0;font-size:15px}
.ro .L{flex:0 0 22px;font-weight:700}
.ro small{display:block;color:#26503a}
.ro.ok{background:var(--grn-s);border-color:#8fcfa8}
.ro.bad{background:var(--red-s);border-color:#f0b4ad}
.ro .tag{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.key{margin-top:8px;padding:8px 10px;border-left:4px solid var(--pri);background:#f4f9f6;border-radius:6px;font-size:14px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,25,18,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:440px;width:100%;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px}
.modal .row{justify-content:flex-end;margin-top:16px}
/* print */
#print-root{display:none}
@page{size:A4;margin:14mm 12mm 22mm 12mm}
@media print{
  body{background:#fff;font-size:12.5px}
  #app,.ov{display:none!important}
  #print-root{display:block}
  .site-footer{position:fixed;left:0;right:0;bottom:0;border-top:1px solid #999;padding:6px 0 0;margin:0;background:#fff;font-size:11px;color:#222}
  .rq{border:1px solid #bbb;border-radius:6px;padding:8px 10px;margin:0 0 8px}
  .ro{padding:3px 8px;margin:3px 0;font-size:12px}
  .qen{font-size:13.5px}.qta{font-size:13px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

const QUESTIONS = [{"id": 1, "level": "Easy", "en": "If the LCM of 3 and 9 is 9, then their H.C.F. is ______.", "ta": "3 மற்றும் 9 ஆகிய எண்களின் மீ.சி.ம. 9 எனில், அவற்றின் மீ.பொ.வ. ______ ஆகும்.", "o": [{"en": "1", "ta": "1"}, {"en": "3", "ta": "3"}, {"en": "9", "ta": "9"}, {"en": "27", "ta": "27"}], "a": 1, "xen": "HCF × LCM = product of the numbers. 3 × 9 = 27 = HCF × 9, so HCF = 3 (3 is a factor of 9).", "xta": "மீ.பொ.வ. × மீ.சி.ம. = எண்களின் பெருக்கற்பலன். 3 × 9 = 27 = மீ.பொ.வ. × 9 ⇒ மீ.பொ.வ. = 3."}, {"id": 2, "level": "Easy", "en": "Find the ratio of the H.C.F. and L.C.M. of the numbers 7 and 13.", "ta": "7 மற்றும் 13 ஆகிய எண்களின் மீ.பொ.வ. மற்றும் மீ.சி.ம. ஆகியவற்றின் விகிதத்தைக் காண்க.", "o": [{"en": "1 : 91", "ta": "1 : 91"}, {"en": "7 : 13", "ta": "7 : 13"}, {"en": "13 : 7", "ta": "13 : 7"}, {"en": "91 : 10", "ta": "91 : 10"}], "a": 0, "xen": "7 and 13 are co-prime: HCF = 1, LCM = 7 × 13 = 91. Ratio = 1 : 91.", "xta": "7, 13 ஒன்றுக்கொன்று பகா எண்கள்: மீ.பொ.வ. = 1; மீ.சி.ம. = 7 × 13 = 91; விகிதம் = 1 : 91."}, {"id": 3, "level": "Easy", "en": "Find the ratio of the HCF and LCM of the numbers 18 and 30.", "ta": "18 மற்றும் 30 ஆகிய எண்களின் மீ.பொ.வ. மற்றும் மீ.சி.ம. ஆகியவற்றின் விகிதத்தைக் காண்க.", "o": [{"en": "1 : 5", "ta": "1 : 5"}, {"en": "1 : 15", "ta": "1 : 15"}, {"en": "3 : 5", "ta": "3 : 5"}, {"en": "5 : 3", "ta": "5 : 3"}], "a": 1, "xen": "18 = 2 × 3², 30 = 2 × 3 × 5. HCF = 6, LCM = 90. Ratio = 6 : 90 = 1 : 15.", "xta": "18 = 2 × 3², 30 = 2 × 3 × 5. மீ.பொ.வ. = 6; மீ.சி.ம. = 90; விகிதம் = 6 : 90 = 1 : 15."}, {"id": 4, "level": "Easy", "en": "The product of two numbers is 2160 and their HCF is 12. Find their LCM.", "ta": "இரு எண்களின் பெருக்கற்பலன் 2160 மற்றும் அவற்றின் மீ.பொ.வ. 12 எனில், அவற்றின் மீ.சி.ம. காண்க.", "o": [{"en": "120", "ta": "120"}, {"en": "150", "ta": "150"}, {"en": "180", "ta": "180"}, {"en": "210", "ta": "210"}], "a": 2, "xen": "LCM = product ÷ HCF = 2160 ÷ 12 = 180.", "xta": "மீ.சி.ம. = பெருக்கற்பலன் ÷ மீ.பொ.வ. = 2160 ÷ 12 = 180."}, {"id": 5, "level": "Easy", "en": "If the HCF of two numbers 36 and 156 is 12, then their LCM is ______.", "ta": "36 மற்றும் 156 ஆகிய இரு எண்களின் மீ.பொ.வ. 12 எனில், அவற்றின் மீ.சி.ம. ______ ஆகும்.", "o": [{"en": "468", "ta": "468"}, {"en": "432", "ta": "432"}, {"en": "312", "ta": "312"}, {"en": "936", "ta": "936"}], "a": 0, "xen": "LCM = (36 × 156) ÷ 12 = 5616 ÷ 12 = 468.", "xta": "மீ.சி.ம. = (36 × 156) ÷ 12 = 5616 ÷ 12 = 468."}, {"id": 6, "level": "Easy", "en": "The H.C.F. of two numbers is 8. Which one of the following can never be their LCM?", "ta": "இரு எண்களின் மீ.பொ.வ. 8 எனில், பின்வருவனவற்றுள் எது அவ்விரு எண்களின் மீ.சி.ம. ஆக இருக்க முடியாது?", "o": [{"en": "24", "ta": "24"}, {"en": "48", "ta": "48"}, {"en": "56", "ta": "56"}, {"en": "60", "ta": "60"}], "a": 3, "xen": "The LCM is always a multiple of the HCF. 24, 48 and 56 are multiples of 8; 60 is not (60 ÷ 8 = 7.5).", "xta": "மீ.சி.ம. எப்போதும் மீ.பொ.வ.-வின் மடங்காக இருக்கும். 24, 48, 56 ஆகியவை 8-ன் மடங்குகள்; 60 அல்ல (60 ÷ 8 = 7.5)."}, {"id": 7, "level": "Easy", "en": "The ratio of two numbers is 3 : 4 and their H.C.F. is 4. Their L.C.M. is ______.", "ta": "இரு எண்களின் விகிதம் 3 : 4 மற்றும் அவற்றின் மீ.பொ.வ. 4 எனில், அவற்றின் மீ.சி.ம. ______ ஆகும்.", "o": [{"en": "24", "ta": "24"}, {"en": "48", "ta": "48"}, {"en": "96", "ta": "96"}, {"en": "192", "ta": "192"}], "a": 1, "xen": "Numbers are 3k and 4k with HCF k = 4, so the numbers are 12 and 16. LCM = 12k = 48.", "xta": "எண்கள் 3k, 4k; மீ.பொ.வ. k = 4 ⇒ எண்கள் 12, 16; மீ.சி.ம. = 12k = 48."}, {"id": 8, "level": "Medium", "en": "The product of two numbers is 3672 and their LCM and HCF are 612 and 6 respectively. If one of the numbers is 36, then find the other number.", "ta": "இரு எண்களின் பெருக்கற்பலன் 3672 மற்றும் அவற்றின் மீ.சி.ம. மற்றும் மீ.பொ.வ. முறையே 612 மற்றும் 6. அவ்வெண்களில் ஒரு எண் 36 எனில், மற்றொரு எண்ணைக் காண்க.", "o": [{"en": "96", "ta": "96"}, {"en": "112", "ta": "112"}, {"en": "124", "ta": "124"}, {"en": "102", "ta": "102"}], "a": 3, "xen": "Other number = 3672 ÷ 36 = 102. (Check: HCF × LCM = 6 × 612 = 3672.)", "xta": "மற்றொரு எண் = 3672 ÷ 36 = 102. (சரிபார்ப்பு: 6 × 612 = 3672)"}, {"id": 9, "level": "Medium", "en": "The LCM of two numbers is 432 and their HCF is 36. If one of the numbers is 108, then the other number is ______.", "ta": "இரு எண்களின் மீ.சி.ம. 432 மற்றும் மீ.பொ.வ. 36. அவற்றில் ஒரு எண் 108 எனில், மற்றொரு எண் ______ ஆகும்.", "o": [{"en": "72", "ta": "72"}, {"en": "126", "ta": "126"}, {"en": "144", "ta": "144"}, {"en": "162", "ta": "162"}], "a": 2, "xen": "Other number = (LCM × HCF) ÷ 108 = (432 × 36) ÷ 108 = 15552 ÷ 108 = 144.", "xta": "மற்றொரு எண் = (432 × 36) ÷ 108 = 15552 ÷ 108 = 144."}, {"id": 10, "level": "Medium", "en": "The LCM of two numbers is 6 times their HCF. If the HCF is 12 and one of the numbers is 36, then find the other number.", "ta": "இரு எண்களின் மீ.சி.ம. ஆனது அவற்றின் மீ.பொ.வ.-ன் 6 மடங்காகும். மீ.பொ.வ. 12 மற்றும் ஒரு எண் 36 எனில், மற்றொரு எண்ணைக் காண்க.", "o": [{"en": "24", "ta": "24"}, {"en": "18", "ta": "18"}, {"en": "48", "ta": "48"}, {"en": "72", "ta": "72"}], "a": 0, "xen": "LCM = 6 × 12 = 72. Other number = (12 × 72) ÷ 36 = 24.", "xta": "மீ.சி.ம. = 6 × 12 = 72; மற்றொரு எண் = (12 × 72) ÷ 36 = 24."}, {"id": 11, "level": "Medium", "en": "The LCM of two numbers is 2002 and their HCF is 22. If one of the numbers is 154, then find the other number.", "ta": "இரு எண்களின் மீ.சி.ம. 2002 மற்றும் அவற்றின் மீ.பொ.வ. 22. ஒரு எண் 154 எனில், மற்றொரு எண் என்ன?", "o": [{"en": "268", "ta": "268"}, {"en": "286", "ta": "286"}, {"en": "278", "ta": "278"}, {"en": "276", "ta": "276"}], "a": 1, "xen": "Other number = (22 × 2002) ÷ 154 = 44044 ÷ 154 = 286.", "xta": "மற்றொரு எண் = (22 × 2002) ÷ 154 = 44044 ÷ 154 = 286."}, {"id": 12, "level": "Medium", "en": "If the HCF of the two given numbers 96 and 404 is 4, then the LCM of the two numbers is ______.", "ta": "கொடுக்கப்பட்ட இரு எண்களான 96 மற்றும் 404-ன் மீ.பொ.வ. 4 எனில், இவ்விரு எண்களின் மீ.சி.ம.-ன் மதிப்பு ______.", "o": [{"en": "384", "ta": "384"}, {"en": "1616", "ta": "1616"}, {"en": "38784", "ta": "38784"}, {"en": "9696", "ta": "9696"}], "a": 3, "xen": "LCM = (96 × 404) ÷ 4 = 38784 ÷ 4 = 9696. (38784 is only the product, not the LCM.)", "xta": "மீ.சி.ம. = (96 × 404) ÷ 4 = 38784 ÷ 4 = 9696. (38784 என்பது பெருக்கற்பலன் மட்டுமே.)"}, {"id": 13, "level": "Medium", "en": "Three numbers are in the ratio 2 : 3 : 5 and their L.C.M. is 900. Then their HCF is equal to ______.", "ta": "மூன்று எண்கள் 2 : 3 : 5 என்ற விகிதத்தில் உள்ளன. அவற்றின் மீ.சி.ம. 900 எனில், அவற்றின் மீ.பொ.வ. யாது?", "o": [{"en": "30", "ta": "30"}, {"en": "60", "ta": "60"}, {"en": "90", "ta": "90"}, {"en": "150", "ta": "150"}], "a": 0, "xen": "Numbers are 2k, 3k, 5k. LCM = 30k = 900 ⇒ k = 30, and HCF = k = 30.", "xta": "எண்கள் 2k, 3k, 5k; மீ.சி.ம. = 30k = 900 ⇒ k = 30; மீ.பொ.வ. = k = 30."}, {"id": 14, "level": "Medium", "en": "The LCM of three different numbers is 120. Which of the following cannot be their HCF?", "ta": "மூன்று வெவ்வேறு எண்களின் மீ.சி.ம. 120 எனில், பின்வருவனவற்றுள் எது அவற்றின் மீ.பொ.வ. ஆக இருக்க இயலாது?", "o": [{"en": "8", "ta": "8"}, {"en": "12", "ta": "12"}, {"en": "35", "ta": "35"}, {"en": "24", "ta": "24"}], "a": 2, "xen": "The HCF must divide the LCM. 8, 12 and 24 divide 120; 35 does not.", "xta": "மீ.பொ.வ. ஆனது மீ.சி.ம.-வை மீதமின்றி வகுக்க வேண்டும். 8, 12, 24 ஆகியவை 120-ஐ வகுக்கும்; 35 வகுக்காது."}, {"id": 15, "level": "Medium", "en": "What is the difference between the L.C.M. and H.C.F. of the three numbers 60, 75 and 90?", "ta": "60, 75 மற்றும் 90 ஆகிய மூன்று எண்களின் மீ.சி.ம. மற்றும் மீ.பொ.வ.-க்கு இடையேயான வித்தியாசம் என்ன?", "o": [{"en": "895", "ta": "895"}, {"en": "899", "ta": "899"}, {"en": "845", "ta": "845"}, {"en": "885", "ta": "885"}], "a": 3, "xen": "60 = 2²·3·5, 75 = 3·5², 90 = 2·3²·5. HCF = 3·5 = 15; LCM = 2²·3²·5² = 900. Difference = 900 − 15 = 885.", "xta": "60 = 2²·3·5, 75 = 3·5², 90 = 2·3²·5; மீ.பொ.வ. = 15; மீ.சி.ம. = 900; வித்தியாசம் = 900 − 15 = 885."}, {"id": 16, "level": "Medium", "en": "The HCF of two numbers is 2 and their LCM is 154. If the difference between the numbers is 8, then the sum is ______.", "ta": "இரு எண்களின் மீ.பொ.வ. 2 மற்றும் மீ.சி.ம. 154. அவ்விரு எண்களுக்கு இடையேயுள்ள வித்தியாசம் 8 எனில், அவற்றின் கூடுதல் ______.", "o": [{"en": "26", "ta": "26"}, {"en": "46", "ta": "46"}, {"en": "36", "ta": "36"}, {"en": "56", "ta": "56"}], "a": 2, "xen": "Let the numbers be 2a and 2b (a, b co-prime). LCM = 2ab = 154 ⇒ ab = 77 ⇒ (7, 11) gives difference 8. Numbers 14 and 22; sum = 36.", "xta": "எண்கள் 2a, 2b (a, b ஒன்றுக்கொன்று பகா); மீ.சி.ம. = 2ab = 154 ⇒ ab = 77; (7, 11) ⇒ எண்கள் 14, 22 (வித்தியாசம் 8); கூடுதல் = 36."}, {"id": 17, "level": "Medium", "en": "Find the HCF and LCM of the numbers 154, 198 and 286.", "ta": "154, 198 மற்றும் 286 ஆகிய எண்களின் மீ.பொ.வ. மற்றும் மீ.சி.ம. காண்க.", "o": [{"en": "22, 18018", "ta": "22, 18018"}, {"en": "22, 9009", "ta": "22, 9009"}, {"en": "11, 18018", "ta": "11, 18018"}, {"en": "2, 18018", "ta": "2, 18018"}], "a": 0, "xen": "154 = 2·7·11; 198 = 2·3²·11; 286 = 2·11·13. HCF = 2·11 = 22; LCM = 2·3²·7·11·13 = 18018.", "xta": "154 = 2·7·11; 198 = 2·3²·11; 286 = 2·11·13; மீ.பொ.வ. = 2 × 11 = 22; மீ.சி.ம. = 2·3²·7·11·13 = 18018."}, {"id": 18, "level": "Medium", "en": "If A → 1, B → 2, C → 3 … Z → 26, then H.C.F. of (I, X) : L.C.M. of (C, P) = ?", "ta": "A → 1, B → 2, C → 3 … Z → 26 என மதிப்புக் கொண்டால், மீ.பொ.வ. (I, X) : மீ.சி.ம. (C, P) = ?", "o": [{"en": "1 : 8", "ta": "1 : 8"}, {"en": "1 : 16", "ta": "1 : 16"}, {"en": "3 : 16", "ta": "3 : 16"}, {"en": "16 : 1", "ta": "16 : 1"}], "a": 1, "xen": "I = 9, X = 24 ⇒ HCF = 3. C = 3, P = 16 ⇒ LCM = 48. Ratio = 3 : 48 = 1 : 16.", "xta": "I = 9, X = 24 ⇒ மீ.பொ.வ. = 3; C = 3, P = 16 ⇒ மீ.சி.ம. = 48; விகிதம் = 3 : 48 = 1 : 16."}, {"id": 19, "level": "Medium", "en": "The LCM of two numbers is 630 and their HCF is 9. If the sum of the numbers is 153, their difference is ______.", "ta": "இரு எண்களின் மீ.சி.ம. 630 மற்றும் மீ.பொ.வ. 9. மேலும் அந்த எண்களின் கூடுதல் 153 எனில், அவற்றின் வித்தியாசம் ______.", "o": [{"en": "17", "ta": "17"}, {"en": "23", "ta": "23"}, {"en": "27", "ta": "27"}, {"en": "33", "ta": "33"}], "a": 2, "xen": "Numbers 9a, 9b (co-prime a, b): 9ab = 630 ⇒ ab = 70; 9(a + b) = 153 ⇒ a + b = 17 ⇒ (7, 10). Numbers 63 and 90; difference = 27.", "xta": "எண்கள் 9a, 9b; மீ.சி.ம. = 9ab = 630 ⇒ ab = 70; 9(a + b) = 153 ⇒ a + b = 17 ⇒ (7, 10); எண்கள் 63, 90; வித்தியாசம் = 27."}, {"id": 20, "level": "Medium", "en": "The GCD and LCM of two polynomials are x + 1 and x<sup>6</sup> − 1 respectively. If one of the polynomials is x<sup>3</sup> + 1, find the other one.", "ta": "இரு பல்லுறுப்புக் கோவைகளின் மீ.பொ.வ. மற்றும் மீ.சி.ம. முறையே x + 1 மற்றும் x<sup>6</sup> − 1. ஒரு பல்லுறுப்புக் கோவை x<sup>3</sup> + 1 எனில், மற்றொன்றைக் காண்க.", "o": [{"en": "(x<sup>3</sup> − 1)(x − 1)", "ta": "(x<sup>3</sup> − 1)(x − 1)"}, {"en": "(x<sup>3</sup> + 1)(x + 1)", "ta": "(x<sup>3</sup> + 1)(x + 1)"}, {"en": "(x<sup>3</sup> + 1)(x − 1)", "ta": "(x<sup>3</sup> + 1)(x − 1)"}, {"en": "(x<sup>3</sup> − 1)(x + 1)", "ta": "(x<sup>3</sup> − 1)(x + 1)"}], "a": 3, "xen": "Other = (GCD × LCM) ÷ given = (x + 1)(x<sup>6</sup> − 1) ÷ (x<sup>3</sup> + 1). Since x<sup>6</sup> − 1 = (x<sup>3</sup> − 1)(x<sup>3</sup> + 1), other = (x<sup>3</sup> − 1)(x + 1).", "xta": "மற்றொன்று = (மீ.பொ.வ. × மீ.சி.ம.) ÷ கொடுக்கப்பட்டது = (x + 1)(x<sup>6</sup> − 1) ÷ (x<sup>3</sup> + 1); x<sup>6</sup> − 1 = (x<sup>3</sup> − 1)(x<sup>3</sup> + 1) ⇒ (x<sup>3</sup> − 1)(x + 1)."}, {"id": 21, "level": "Difficult", "en": "The H.C.F. of 2 numbers, each having 3 digits, is 17 and their L.C.M. is 714. The sum of the numbers is ______.", "ta": "மூன்றிலக்கங்கள் கொண்ட இரு எண்களின் மீ.பொ.வ. 17 மற்றும் அவற்றின் மீ.சி.ம. 714 எனில், அவ்விரு எண்களின் கூடுதல் என்ன?", "o": [{"en": "289", "ta": "289"}, {"en": "391", "ta": "391"}, {"en": "221", "ta": "221"}, {"en": "731", "ta": "731"}], "a": 2, "xen": "Numbers 17a, 17b with ab = 714 ÷ 17 = 42 (co-prime pairs: 1·42, 2·21, 3·14, 6·7) ⇒ (17, 714), (34, 357), (51, 238), (102, 119). Only 102 and 119 are both 3-digit, so the sum = 221.", "xta": "எண்கள் 17a, 17b; ab = 714 ÷ 17 = 42 (பகா ஜோடிகள்: 1·42, 2·21, 3·14, 6·7) ⇒ (17, 714), (34, 357), (51, 238), (102, 119). இரண்டும் மூன்றிலக்க எண்கள் = 102, 119 மட்டுமே; கூடுதல் = 221."}, {"id": 22, "level": "Difficult", "en": "The sum and difference of the LCM and HCF of two numbers are 592 and 518 respectively. If the sum of the numbers is 296, then the numbers are ______.", "ta": "இரு எண்களின் மீ.சி.ம. மற்றும் மீ.பொ.வ.-வின் கூட்டுத்தொகை மற்றும் வேறுபாடு முறையே 592 மற்றும் 518. அவ்விரு எண்களின் கூட்டுத்தொகை 296 எனில், அந்த எண்கள் ______.", "o": [{"en": "101 and 195", "ta": "101 மற்றும் 195"}, {"en": "37 and 259", "ta": "37 மற்றும் 259"}, {"en": "74 and 222", "ta": "74 மற்றும் 222"}, {"en": "111 and 185", "ta": "111 மற்றும் 185"}], "a": 3, "xen": "LCM = (592 + 518) ÷ 2 = 555; HCF = (592 − 518) ÷ 2 = 37. Numbers 37a, 37b with ab = 555 ÷ 37 = 15 and a + b = 296 ÷ 37 = 8 ⇒ (3, 5). Numbers = 111 and 185.", "xta": "மீ.சி.ம. = (592 + 518) ÷ 2 = 555; மீ.பொ.வ. = (592 − 518) ÷ 2 = 37. எண்கள் 37a, 37b: ab = 555 ÷ 37 = 15, a + b = 296 ÷ 37 = 8 ⇒ (3, 5) ⇒ 111, 185."}, {"id": 23, "level": "Difficult", "en": "If the HCF of p and q is x and p : q = 1 : x, then the LCM of p and q is ______.", "ta": "p மற்றும் q இவற்றின் மீ.பொ.வ. x மற்றும் p : q = 1 : x எனில், p மற்றும் q இவற்றின் மீ.சி.ம. ______ ஆகும்.", "o": [{"en": "1", "ta": "1"}, {"en": "x<sup>2</sup>", "ta": "x<sup>2</sup>"}, {"en": "x", "ta": "x"}, {"en": "x<sup>3</sup>", "ta": "x<sup>3</sup>"}], "a": 1, "xen": "Let p = k, q = kx. HCF = k = x, so p = x and q = x². LCM = x².", "xta": "p = k, q = kx என்க; மீ.பொ.வ. = k = x ⇒ p = x, q = x²; மீ.சி.ம. = x²."}, {"id": 24, "level": "Difficult", "en": "If the H.C.F. of p and q is x and q = xy, find the L.C.M. of p and q from the following.", "ta": "p மற்றும் q-ன் மீ.பொ.வ. x மற்றும் q = xy எனில், p மற்றும் q-ன் மீ.சி.ம.-வை கீழ்க்கண்டவற்றிலிருந்து காண்க.", "o": [{"en": "py", "ta": "py"}, {"en": "pq", "ta": "pq"}, {" const QMAP = {}; QUESTIONS.forEach(q => QMAP[q.id] = q);
const SEC_PER_Q = 90;                       // 1.5 minutes per question
const TITLE = "Maths - LCM & HCF - Test - Tamil-English";
const LS = {att:"ova_lcmhcf_attempts_v1", act:"ova_lcmhcf_active_v1", usr:"ova_lcmhcf_user_v1"};
const LET = "ABCDE";
const E_OPT = {en:"Answer not known", ta:"விடை தெரியவில்லை"};

/* ---------- safe storage (works even if the browser blocks localStorage / session expires) ---------- */
const mem = {}; let storageBlocked = false;
function sget(k){ try{ const v = localStorage.getItem(k); return v === null ? (mem[k] ?? null) : v; }catch(e){ storageBlocked = true; return mem[k] ?? null; } }
function sset(k,v){ mem[k] = v; try{ localStorage.setItem(k,v); }catch(e){ storageBlocked = true; } }
function sdel(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){ storageBlocked = true; } }
function jget(k,d){ try{ const v = sget(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
const getAttempts = () => jget(LS.att, []);
const putAttempts = a => sset(LS.att, JSON.stringify(a));
const getActive = () => jget(LS.act, null);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = sec => { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec/60), s = sec%60; return m + ":" + String(s).padStart(2,"0"); };
const fmtDate = t => new Date(t).toLocaleString("en-IN", {day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const optText = (o, cls) => (o.en === o.ta) ? o.en : o.en + '<small class="' + (cls||"") + '">' + o.ta + '</small>';

let A = null;            // active attempt
let tick = null;
let curView = "home";

/* ---------- active attempt lifecycle ---------- */
function newAttempt(name, mobile, mode, qids, parent){
  const now = Date.now();
  return { id: uid(), name, mobile, mode, parent: parent || null, qids,
           startedAt: now, endsAt: now + qids.length * SEC_PER_Q * 1000,
           answers: {}, times: {}, marked: {}, cur: 0, curSince: now };
}
function flushTime(){
  if(!A) return;
  const now = Date.now(), q = A.qids[A.cur];
  A.times[q] = (A.times[q] || 0) + Math.max(0, (now - A.curSince)/1000);
  A.curSince = now;
}
function saveActive(){ if(!A) return; flushTime(); sset(LS.act, JSON.stringify(A)); }
function go(i){
  flushTime();
  A.cur = Math.min(Math.max(0, i), A.qids.length - 1);
  saveActive(); renderTest();
}

function beginTest(name, mobile, mode, qids, parent){
  A = newAttempt(name, mobile, mode, qids, parent);
  sset(LS.usr, JSON.stringify({name, mobile}));
  saveActive(); startTick(); renderTest(); window.scrollTo(0,0);
}

function startTick(){
  stopTick();
  tick = setInterval(onTick, 250);
}
function stopTick(){ if(tick){ clearInterval(tick); tick = null; } }
function onTick(){
  if(!A) return stopTick();
  const left = (A.endsAt - Date.now())/1000;
  const t = $("#timer");
  if(t){
    t.textContent = "⏱ " + fmt(left);
    t.className = "timer" + (left <= 60 ? " danger" : left <= 300 ? " warn" : "");
  }
  const qt = $("#qt");
  if(qt){ const q = A.qids[A.cur]; qt.textContent = fmt((A.times[q]||0) + (Date.now() - A.curSince)/1000); }
  if(left <= 0){ submitTest(true); return; }
  if(Math.floor(Date.now()/5000) !== onTick.last){ onTick.last = Math.floor(Date.now()/5000); saveActive(); refreshPaletteTimes(); }
}
function refreshPaletteTimes(){
  if(!A || curView !== "test") return;
  document.querySelectorAll(".pi").forEach(b => {
    const q = +b.dataset.q; let s = A.times[q] || 0;
    if(A.qids[A.cur] === q) s += (Date.now() - A.curSince)/1000;
    b.querySelector("small").textContent = fmt(s);
  });
}

function submitTest(auto){
  if(!A) return;
  flushTime(); stopTick();
  const a = A; A = null; sdel(LS.act);
  let correct = 0, wrong = 0, un = 0;
  a.qids.forEach(q => { const u = a.answers[q]; if(u === undefined) un++; else if(u === QMAP[q].a) correct++; else wrong++; });
  const rec = { id:a.id, name:a.name, mobile:a.mobile, mode:a.mode, parent:a.parent, qids:a.qids, answers:a.answers, times:a.times,
                startedAt:a.startedAt, submittedAt:Date.now(), auto:!!auto,
                usedSec: Math.min(a.qids.length*SEC_PER_Q, Math.round((Math.min(Date.now(), a.endsAt) - a.startedAt)/1000)),
                total:a.qids.length, correct, wrong, un, score:correct };
  const list = getAttempts(); list.unshift(rec); putAttempts(list.slice(0, 40));
  closeModal();
  if(auto){
    showModal("⏰ Time is up / நேரம் முடிந்தது", "<p>Your test was submitted automatically.<br><span class='ta'>உங்கள் தேர்வு தானாகவே சமர்ப்பிக்கப்பட்டது.</span></p>",
      [{label:"View result / முடிவைக் காண்க", cls:"primary", fn:() => renderResult(rec.id, "all")}]);
  } else renderResult(rec.id, "all");
}

/* ---------- modal ---------- */
function showModal(title, html, btns){
  const r = $("#modal-root");
  r.innerHTML = '<div class="ov"><div class="modal" role="dialog" aria-modal="true"><h3>' + title + '</h3>' + html + '<div class="row"></div></div></div>';
  const row = r.querySelector(".row");
  btns.forEach(b => { const e = document.createElement("button"); e.className = "btn " + (b.cls||""); e.innerHTML = b.label;
    e.onclick = () => { closeModal(); b.fn && b.fn(); }; row.appendChild(e); });
}
function closeModal(){ $("#modal-root").innerHTML = ""; }

/* ---------- HOME ---------- */
function renderHome(){
  curView = "home"; stopTickIfIdle();
  const usr = jget(LS.usr, {name:"", mobile:""});
  const act = getActive();
  const atts = getAttempts();
  const n = QUESTIONS.length, total = n * SEC_PER_Q;
  let resume = "";
  if(act && act.endsAt){
    const left = (act.endsAt - Date.now())/1000;
    resume = '<div class="notice"><b>Unfinished test found / முடிக்கப்படாத தேர்வு உள்ளது</b><br>' + esc(act.name) + ' · ' +
      (left > 0 ? fmt(left) + ' remaining' : 'time over — it will be submitted when you resume') +
      '<div class="row" style="margin-top:8px"><button class="btn primary sm" id="resume">Resume / தொடர்க</button> <button class="btn danger sm" id="discard">Discard</button></div></div>';
  }
  $("#app").innerHTML =
  '<div class="wrap">' +
   '<div class="hero"><h1>LCM &amp; HCF — Mock Test</h1><p class="ta" style="color:#d6f0df;font-size:19px">மீ.சி.ம. &amp; மீ.பொ.வ. — மாதிரித் தேர்வு</p>' +
   '<div class="facts"><div class="fact"><b>' + n + '</b><span>Questions / கேள்விகள்</span></div>' +
   '<div class="fact"><b>' + fmt(total) + ' min</b><span>1.5 min per Q / ஒரு கேள்விக்கு 1.5 நிமி</span></div>' +
   '<div class="fact"><b>' + n + ' marks</b><span>1 mark each / ஒரு மதிப்பெண்</span></div></div></div>' +
   '<div class="grid2"><div class="card"><h2>Start the test / தேர்வைத் தொடங்குக</h2>' + resume +
   (storageBlocked ? '<div class="notice">Your browser is blocking storage, so attempts cannot be saved on this device. The test will still work.</div>' : '') +
   '<form id="f" novalidate><label for="nm">Name / பெயர்</label><input id="nm" type="text" autocomplete="name" maxlength="60" value="' + esc(usr.name) + '">' +
   '<label for="mb">Mobile number / கைப்பேசி எண்</label><input id="mb" type="tel" inputmode="numeric" autocomplete="tel" maxlength="20" placeholder="10-digit number" value="' + esc(usr.mobile) + '">' +
   '<div class="err" id="err"></div><button class="btn primary" style="width:100%;margin-top:6px" type="submit">Start test / தேர்வைத் தொடங்கு</button></form>' +
   '<ul class="rules"><li>Timer runs for the whole test and it auto-submits at time-up. / நேரம் முடிந்ததும் தேர்வு தானாகச் சமர்ப்பிக்கப்படும்.</li>' +
   '<li>No negative marking. Option E (Answer not known) counts as a wrong answer. / தவறான விடைக்கு எதிர் மதிப்பெண் இல்லை.</li>' +
   '<li>If the page reloads or the session drops, your test resumes from where you left. / பக்கம் மீண்டும் ஏற்றப்பட்டாலும் தேர்வு தொடரும்.</li></ul></div>' +
   '<div class="card"><h2>Saved attempts / சேமித்த தேர்வுகள்</h2><div id="saved"></div></div></div></div>';

  $("#f").onsubmit = ev => {
    ev.preventDefault();
    const name = $("#nm").value.trim().replace(/\s+/g," ");
    const mobile = $("#mb").value.replace(/[\s\-]/g,"").replace(/^(\+91|91)(?=\d{10}$)/,"");
    const err = $("#err");
    if(name.length < 2){ err.textContent = "Please enter your name. / பெயரை உள்ளிடவும்."; return; }
    if(!/^[6-9]\d{9}$/.test(mobile)){ err.textContent = "Enter a valid 10-digit mobile number. / சரியான 10 இலக்க எண்ணை உள்ளிடவும்."; return; }
    const go_ = () => beginTest(name, mobile, "full", QUESTIONS.map(q => q.id));
    if(getActive()) showModal("Replace unfinished test?", "<p>Starting a new test will discard the unfinished one.</p>", [{label:"Cancel"},{label:"Start new", cls:"primary", fn:() => { sdel(LS.act); go_(); }}]);
    else go_();
  };
  if(act){
    $("#resume").onclick = () => { A = act; A.curSince = Date.now(); if(Date.now() >= A.endsAt){ submitTest(true); } else { startTick(); renderTest(); } };
    $("#discard").onclick = () => showModal("Discard unfinished test?", "<p>This cannot be undone.</p>", [{label:"Cancel"},{label:"Discard", cls:"danger", fn:() => { sdel(LS.act); renderHome(); }}]);
  }
  renderSaved();
}
function stopTickIfIdle(){ if(!A) stopTick(); }

function renderSaved(){
  const box = $("#saved"), list = getAttempts();
  if(!list.length){ box.innerHTML = '<p class="muted">No attempts yet. Your completed tests are saved here on this device.<br><span class="ta">இன்னும் தேர்வுகள் இல்லை. முடித்த தேர்வுகள் இங்கே சேமிக்கப்படும்.</span></p>'; return; }
  box.innerHTML = '<table class="saved"><thead><tr><th>Date</th><th>Test</th><th>Score</th><th></th></tr></thead><tbody>' +
   list.map(r => {
     const bad = r.wrong + r.un;
     return '<tr><td>' + fmtDate(r.submittedAt) + '<div class="muted" style="font-size:12px">' + esc(r.name) + '</div></td>' +
       '<td>' + (r.mode === "full" ? 'Full test' : 'Retry (wrong + unanswered)') + '<div class="muted" style="font-size:12px">' + r.total + ' Qs</div></td>' +
       '<td><b>' + r.score + '/' + r.total + '</b></td>' +
       '<td><div class="row" style="gap:5px"><button class="btn sm" data-a="view" data-id="' + r.id + '">View</button>' +
       '<button class="btn sm" data-a="full" data-id="' + r.id + '">Retake full</button>' +
       '<button class="btn sm warn" data-a="retry" data-id="' + r.id + '"' + (bad ? '' : ' disabled') + '>Retake wrong (' + bad + ')</button>' +
       '<button class="btn sm danger" data-a="del" data-id="' + r.id + '">✕</button></div></td></tr>';
   }).join("") + '</tbody></table>';
  box.querySelectorAll("button[data-a]").forEach(b => b.onclick = () => savedAction(b.dataset.a, b.dataset.id));
}
function savedAction(act, id){
  const list = getAttempts(), r = list.find(x => x.id === id); if(!r) return;
  if(act === "view") return renderResult(id, "all");
  if(act === "del") return showModal("Delete this attempt?", "<p>It will be removed from this device.</p>", [{label:"Cancel"},{label:"Delete", cls:"danger", fn:() => { putAttempts(list.filter(x => x.id !== id)); renderSaved(); }}]);
  if(act === "full") return retakeFull(r);
  if(act === "retry") return retakeWrong(r);
}
function guardActive(next){
  if(getActive()) showModal("Unfinished test found", "<p>Starting this will discard your unfinished test.</p>", [{label:"Cancel"},{label:"Continue", cls:"primary", fn:() => { sdel(LS.act); next(); }}]);
  else next();
}
function retakeFull(r){ guardActive(() => beginTest(r.name, r.mobile, "full", QUESTIONS.map(q => q.id), r.id)); }
function retakeWrong(r){
  const ids = r.qids.filter(q => r.answers[q] !== QMAP[q].a);
  if(!ids.length) return;
  guardActive(() => beginTest(r.name, r.mobile, "retry", ids, r.id));
}

/* ---------- TEST ---------- */
function renderTest(){
  curView = "test";
  const q = QMAP[A.qids[A.cur]], n = A.qids.length, sel = A.answers[q.id];
  const left = (A.endsAt - Date.now())/1000;
  const opts = q.o.concat([E_OPT]).map((o,i) =>
    '<button class="opt' + (sel === i ? ' sel' : '') + '" data-i="' + i + '" aria-pressed="' + (sel === i) + '"><span class="L">' + LET[i] + '</span><span class="otxt">' + optText(o) + '</span></button>').join("");
  const pal = A.qids.map((id,i) => {
    const st = A.answers[id] !== undefined ? " ans" : "";
    return '<button class="pi' + st + (A.marked[id] ? ' mk' : '') + (i === A.cur ? ' cur' : '') + '" data-q="' + id + '" data-i="' + i + '"><b>' + (i+1) + '</b><small>' + fmt(A.times[id]||0) + '</small></button>';
  }).join("");
  const answered = Object.keys(A.answers).length;
  $("#app").innerHTML =
   '<div class="topbar"><div class="in"><div class="tt">LCM &amp; HCF — Mock Test<div class="who">' + esc(A.name) + ' · ' + esc(A.mobile) + (A.mode === "retry" ? ' · Retry' : '') + '</div></div>' +
   '<div class="timer' + (left <= 60 ? ' danger' : left <= 300 ? ' warn' : '') + '" id="timer" role="timer">⏱ ' + fmt(left) + '</div></div></div>' +
   '<div class="wrap"><div class="testwrap"><section class="card">' +
   '<div class="qhead"><span><b>Question ' + (A.cur+1) + ' / ' + n + '</b> · கேள்வி ' + (A.cur+1) + ' / ' + n + '</span>' +
   '<span class="qtime">Time on this question / இந்தக் கேள்விக்கு: <b id="qt">' + fmt((A.times[q.id]||0) + (Date.now()-A.curSince)/1000) + '</b></span></div>' +
   '<div class="qen">' + q.en + '</div><div class="qta">' + q.ta + '</div>' +
   '<div class="opts">' + opts + '</div>' +
   '<div class="nav"><button class="btn" id="prev"' + (A.cur === 0 ? ' disabled' : '') + '>← Previous</button>' +
   '<button class="btn" id="clr"' + (sel === undefined ? ' disabled' : '') + '>Clear</button>' +
   '<button class="btn warn" id="mk">' + (A.marked[q.id] ? 'Unmark review' : 'Mark for review') + '</button><span class="sp"></span>' +
   '<button class="btn primary" id="next"' + (A.cur === n-1 ? ' disabled' : '') + '>Next →</button></div></section>' +
   '<aside class="card palette"><h3>Questions &amp; time taken / கேள்விகள் &amp; எடுத்த நேரம்</h3><div class="pgrid">' + pal + '</div>' +
   '<div class="legend"><span><i style="background:var(--grn-s)"></i>Answered</span><span><i style="background:var(--amber-s)"></i>Marked</span><span><i style="background:#f1f3f2"></i>Not answered</span></div>' +
   '<div class="muted" style="font-size:13px;margin-bottom:10px">Answered ' + answered + ' / ' + n + '</div>' +
   '<button class="btn primary" style="width:100%" id="sub">Submit test / சமர்ப்பி</button></aside></div></div>';

  document.querySelectorAll(".opt").forEach(b => b.onclick = () => { A.answers[q.id] = +b.dataset.i; saveActive(); renderTest(); });
  $("#prev").onclick = () => go(A.cur - 1);
  $("#next").onclick = () => go(A.cur + 1);
  $("#clr").onclick = () => { delete A.answers[q.id]; saveActive(); renderTest(); };
  $("#mk").onclick = () => { if(A.marked[q.id]) delete A.marked[q.id]; else A.marked[q.id] = 1; saveActive(); renderTest(); };
  document.querySelectorAll(".pi").forEach(b => b.onclick = () => go(+b.dataset.i));
  $("#sub").onclick = () => {
    const un = A.qids.filter(id => A.answers[id] === undefined).length, mk = Object.keys(A.marked).length;
    showModal("Submit the test? / சமர்ப்பிக்கவா?",
      "<p>Answered: <b>" + (A.qids.length - un) + "</b> · Not answered: <b>" + un + "</b> · Marked: <b>" + mk + "</b><br>Time left: <b>" + fmt((A.endsAt - Date.now())/1000) + "</b></p>",
      [{label:"Go back / திரும்பு"},{label:"Submit / சமர்ப்பி", cls:"primary", fn:() => submitTest(false)}]);
  };
}
document.addEventListener("keydown", e => {
  if(curView !== "test" || !A || e.target.tagName === "INPUT" || $("#modal-root").firstChild) return;
  const k = e.key.toLowerCase(), q = QMAP[A.qids[A.cur]];
  if("abcde".includes(k) && k.length === 1){ A.answers[q.id] = "abcde".indexOf(k); saveActive(); renderTest(); }
  else if(e.key === "ArrowRight") go(A.cur + 1);
  else if(e.key === "ArrowLeft") go(A.cur - 1);
});
document.addEventListener("visibilitychange", () => { if(!document.hidden && A) onTick(); });
window.addEventListener("beforeunload", e => { if(A){ saveActive(); e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("pagehide", () => { if(A) saveActive(); });

/* ---------- RESULT ---------- */
function status(r, q){ const u = r.answers[q]; return u === undefined ? "n" : (u === QMAP[q].a ? "g" : "r"); }
function reviewCard(r, q, seq){
  const Q = QMAP[q], u = r.answers[q], st = status(r, q), t = r.times[q] || 0;
  const pill = st === "g" ? '<span class="pill g">✔ Right / சரி</span>' : st === "r" ? '<span class="pill r">✘ Wrong / தவறு</span>' : '<span class="pill n">— Unanswered / விடையளிக்கவில்லை</span>';
  const opts = Q.o.concat([E_OPT]).map((o,i) => {
    const cls = i === Q.a ? " ok" : (i === u ? " bad" : "");
    const tag = i === Q.a ? (i === u ? "✔ Your answer · Correct" : "✔ Correct answer") : (i === u ? "✘ Your answer" : "");
    return '<div class="ro' + cls + '"><span class="L">' + LET[i] + '</span><span>' + optText(o) + '</span><span class="tag">' + tag + '</span></div>';
  }).join("");
  const c = Q.o[Q.a];
  const ans = (c.en === c.ta) ? c.en : c.en + ' / ' + c.ta;
  return '<div class="card rq"><div class="h"><span><b>Q' + seq + '</b> ' + pill + ' <span class="pill n">' + Q.level + '</span></span><span class="muted">⏱ ' + fmt(t) + '</span></div>' +
    '<div class="qen">' + Q.en + '</div><div class="qta">' + Q.ta + '</div>' + opts +
    '<div class="key"><b>Answer / விடை: (' + LET[Q.a] + ') ' + ans + '</b><br>' + Q.xen + '<br><span class="ta">' + Q.xta + '</span></div></div>';
}
function renderResult(id, tab){
  curView = "result"; stopTickIfIdle();
  const r = getAttempts().find(x => x.id === id); if(!r){ return renderHome(); }
  const pct = Math.round(r.score / r.total * 1000) / 10, bad = r.wrong + r.un;
  const lists = { all:r.qids, g:r.qids.filter(q => status(r,q) === "g"), r:r.qids.filter(q => status(r,q) === "r"), n:r.qids.filter(q => status(r,q) === "n") };
  const seq = {}; r.qids.forEach((q,i) => seq[q] = i+1);
  const tabs = [["all","All / எல்லாம்"],["g","Right / சரி"],["r","Wrong / தவறு"],["n","Unanswered / விடையிலா"]];
  const grid = r.qids.map((q,i) => '<div class="tc ' + status(r,q) + '"><b>' + (i+1) + '</b>' + fmt(r.times[q]||0) + '</div>').join("");
  $("#app").innerHTML =
   '<div class="wrap"><div class="row" style="justify-content:space-between;margin-bottom:12px"><div><h1 style="font-size:22px">Result / முடிவு</h1>' +
   '<div class="muted">' + esc(r.name) + ' · ' + esc(r.mobile) + ' · ' + fmtDate(r.submittedAt) + (r.mode === "retry" ? ' · Retry test' : '') + (r.auto ? ' · auto-submitted at time-up' : '') + '</div></div>' +
   '<button class="btn" id="home">← Home / முகப்பு</button></div>' +
   '<div class="card"><div class="score"><div class="big"><b>' + r.score + '</b><span> / ' + r.total + '</span><div>' + pct + '%</div></div>' +
   '<div class="stats"><div class="stat g"><b>' + r.correct + '</b><span>Right / சரி</span></div><div class="stat r"><b>' + r.wrong + '</b><span>Wrong / தவறு</span></div>' +
   '<div class="stat a"><b>' + r.un + '</b><span>Unanswered / விடையிலா</span></div><div class="stat"><b>' + fmt(r.usedSec) + '</b><span>Time taken / எடுத்த நேரம்</span></div>' +
   '<div class="stat"><b>' + fmt(r.usedSec / r.total) + '</b><span>Avg per Q / சராசரி</span></div></div></div>' +
   '<div class="row" style="margin-top:14px"><button class="btn primary" id="rfull">↻ Retake full test</button>' +
   '<button class="btn warn" id="rwrong"' + (bad ? '' : ' disabled') + '>↻ Retake wrong &amp; unanswered (' + bad + ')</button>' +
   '<button class="btn" id="pdf">⬇ Download attempted test as PDF</button></div>' +
   '<div class="muted" style="font-size:12px;margin-top:6px">In the print window choose “Save as PDF”. / அச்சு சாளரத்தில் “Save as PDF” தேர்வு செய்க.</div>' +
   '<h2 style="margin-top:16px">Time taken per question / ஒவ்வொரு கேள்விக்கும் எடுத்த நேரம்</h2><div class="tgrid">' + grid + '</div></div>' +
   '<div class="tabs">' + tabs.map(([k,l]) => '<button class="tab' + (k === tab ? ' on' : '') + '" data-t="' + k + '">' + l + ' (' + lists[k].length + ')</button>').join("") + '</div>' +
   '<div id="rv">' + (lists[tab].length ? lists[tab].map(q => reviewCard(r, q, seq[q])).join("") : '<div class="card muted">No questions in this list. / இந்தப் பட்டியலில் கேள்விகள் இல்லை.</div>') + '</div></div>';
  $("#home").onclick = renderHome;
  $("#rfull").onclick = () => retakeFull(r);
  $("#rwrong").onclick = () => retakeWrong(r);
  $("#pdf").onclick = () => printReport(r);
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => renderResult(id, b.dataset.t));
  window.scrollTo(0,0);
}

/* ---------- Download attempted test as PDF (browser print → Save as PDF) ---------- */
function printReport(r){
  const seq = {}; r.qids.forEach((q,i) => seq[q] = i+1);
  $("#print-root").innerHTML =
    '<h1 style="font-size:20px;margin:0">Maths — LCM &amp; HCF — Test</h1><div class="ta" style="margin-bottom:4px">மீ.சி.ம. &amp; மீ.பொ.வ. — தேர்வு</div>' +
    '<div style="margin:4px 0 10px;font-size:13px"><b>' + esc(r.name) + '</b> · ' + esc(r.mobile) + ' · ' + fmtDate(r.submittedAt) + '<br>' +
    'Score / மதிப்பெண்: <b>' + r.score + ' / ' + r.total + '</b> · Right ' + r.correct + ' · Wrong ' + r.wrong + ' · Unanswered ' + r.un + ' · Time taken ' + fmt(r.usedSec) + '</div>' +
    r.qids.map(q => reviewCard(r, q, seq[q])).join("");
  const old = document.title;
  document.title = TITLE + " - " + r.name;
  const done = () => { document.title = old; window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  window.print();
}

/* ---------- boot ---------- */
(function init(){
  const act = getActive();
  if(act && act.endsAt && act.qids && act.qids.every(q => QMAP[q])){
    // session survived a reload / dropped connection: continue the same test with the original deadline
    if(Date.now() >= act.endsAt){ A = act; A.curSince = Date.now(); submitTest(true); return; }
    renderHome();
  } else { if(act) sdel(LS.act); renderHome(); }
})();
</script>
</body>
</html>
