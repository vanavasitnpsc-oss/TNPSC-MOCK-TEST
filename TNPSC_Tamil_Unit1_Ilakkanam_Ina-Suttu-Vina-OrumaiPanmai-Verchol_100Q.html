:root{--pri:#1f6f4a;--pri-d:#14513a;--acc:#d98b00;--bg:#f4f6f1;--card:#fff;--ink:#1d2421;--mut:#5c6862;--line:#d8dfd9;--ok:#1b7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdeceb;--warn:#b7791f;--warnbg:#fff6e0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'NotoSansTamilEmb','Noto Sans Tamil','Latha','Nirmala UI','Tamil Sangam MN','Catamaran',system-ui,sans-serif;font-size:17px;line-height:1.65}
.wrap{max-width:860px;margin:0 auto;padding:12px 12px 90px}

h1{font-size:1.35rem;margin:.2rem 0;color:var(--pri-d);line-height:1.4}
h2{font-size:1.1rem;margin:.2rem 0 .6rem;color:var(--pri-d)}
.sub{color:var(--mut);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{background:#e8f1ea;color:var(--pri-d);border-radius:999px;padding:2px 10px;font-size:.85rem}
label.f{display:block;font-weight:700;margin:12px 0 4px}

input:focus{outline:2px solid var(--pri);border-color:var(--pri)}

.btn.sec{background:#fff;color:var(--pri-d)}

.btn.red{background:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:38px;padding:4px 12px;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1}
.top{position:sticky;top:0;z-index:20;background:var(--pri-d);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.top .t{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}

.top small{opacity:.9}
.top .btn{min-height:38px;padding:4px 12px;background:var(--acc);border-color:var(--acc)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}

.tail{font-weight:600;margin:8px 0 6px}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}

.foot{text-align:center;color:var(--mut);font-size:.85rem;padding:14px 8px 80px;border-top:1px solid var(--line);margin-top:18px}
#printArea{display:none}
.note{background:var(--warnbg);border:1px solid #ecd49a;border-radius:10px;padding:8px 12px;font-size:.9rem;margin-top:10px}

’ இடைநிலைச் சுட்டு; உவன், உவள், உவர், உது, உவை என்பன இடைநிலைச் சுட்டுச் சொற்கள்.","n":49},{"kind":"S","topic":"சுட்டு எழுத்துகள்","diff":"T","stem":"அகச்சுட்டு, புறச்சுட்டு தொடர்பான பின்வரும் கூற்றுகளைக் கருதுக:","stmts":["சுட்டெழுத்துகள் நிற்கும் இடத்தைப் பொறுத்து அகச்சுட்டு, புறச்சுட்டு எனப் பெயர் பெறும்.","அவன், இவன் ஆகியவை அகச்சுட்டுச் சொற்கள்.","அவ்வீடு, இவ்வீடு ஆகியவை புறச்சுட்டுச் சொற்கள்.","எவன், யார் ஆகியவை அகச்சுட்டுச் சொற்கள்."],"tail":"இவற்றுள் சரியானவை எவை?","opts":["1, 2 மட்டும்","1, 3 மட்டும்","2, 3 மட்டும்","1, 2, 3 மட்டும்"],"ans":3,"exp":"எவன், யார் ஆகியவை வினாச் சொற்கள்; சுட்டுச் சொற்கள் அல்ல. எனவே 1, 2, 3 சரி.","n":50},{"kind":"D","topic":"ஒருமை – பன்மை அறிதல்","diff":"T","stem":"தவறான இணையைக் கண்டறிக.","opts":["குதிரை – அஃறிணை ஒருமை","தாய் – உயர்திணை ஒருமை","தேவர் – அஃறிணைப் பன்மை","பூனைகள் – அஃறிணைப் பன்மை"],"ans":2,"exp":"தேவர் உயர்திணைப் பன்மை (பலர்பால்); அஃறிணைப் பன்மை அன்று.","n":51},{"kind":"D","topic":"வேர்ச்சொல் அறிதல்","diff":"T","stem":"‘ஓலக்கம்’ என்ற சொல்லின் வேர்ச்சொல் எது?","opts":["ஓலம்","ஓலகு","ஓலை","ஓல்"],"ans":3,"exp":"‘ஓலக்கம்’ என்பதன் வேர் ‘ஓல்’ ஆகும்.","n":52},{"kind":"D","topic":"வேர்ச்சொல் அறிதல்","diff":"M","stem":"‘படித்தல்’ என்ற தொழிற்பெயரின் வேர்ச்சொல் எது?","opts":["படு","படித்து","படி","படித்த"],"ans":2,"exp":"படி + தல் = படித்தல்; ‘படு’ என்பது வேறு வேர்ச்சொல் (பட்டான்).","n":53},{"kind":"D","topic":"ஒருமை – பன்மை அறிதல்","diff":"M","stem":"‘நீர்’, ‘நீவிர்’ என்பன ——— ஆகும்.","opts":["முன்னிலைப் பன்மைப் பெயர்கள்","முன்னிலை ஒருமைப் பெயர்கள்","தன்மைப் பன்மைப் பெயர்கள்","படர்க்கைப் பலர்பால் பெயர்கள்"],"ans":0,"exp":"முன்னிலை ஒருமை – நீ; முன்னிலைப் பன்மை – நீர், நீவிர், நீங்கள்.","n":54},{"kind":"S","topic":"வினா எழுத்துகள்","diff":"T","stem":"விடை வகைகள் குறித்த பின்வரும் கூற்றுகளைக் கருதுக:","stmts":["விடை வகைகள் எட்டு.","சுட்டு, மறை, நேர் ஆகியவை வெளிப்படை விடைகள்.","ஏவல், இனமொழி ஆகியவை குறிப்பு விடைகள்.","உற்றது உரைத்தல் விடை வெளிப்படை விடை வகையைச் சேர்ந்தது.","வினா எதிர் வினாதல் விடை குறிப்பு விடை வகையைச் சேர்ந்தது."], var TITLE = 'TNPSC பொதுத்தமிழ் – அலகு I: இலக்கணம் – மாதிரித் தேர்வு';
var SUBTITLE = 'இன எழுத்துகள் அறிதல் · சுட்டு எழுத்துகள் · வினா எழுத்துகள் · ஒருமை – பன்மை அறிதல் · வேர்ச்சொல் அறிதல்';
var LETTERS = ['A','B','C','D','E'];
var MODE_LABEL = {full:'முழுத் தேர்வு',answered:'விடையளித்த வினாக்கள் மட்டும்',wrong:'தவறியவை மட்டும்',skipped:'விடையளிக்காதவை மட்டும்'};

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(s){s=Math.max(0,Math.round(s));var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function fshort(s){s=Math.round(s);if(s<=0)return '–';if(s<60)return s+'s';var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}

/* ---------- storage (auto-save => no data loss on refresh / sleep / logout) ---------- */
var storageOK = true;
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);d.history=d.history||[];return d;}}catch(e){storageOK=false;}
  return {user:null,current:null,history:[]};
}
var DB = load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){storageOK=false;}}

/* ---------- question rendering ---------- */
function qBody(q){
  var h='<div class="stem">'+esc(q.stem)+'</div>';
  if(q.a){h+='<div class="ar"><div><b>கூற்று:</b> '+esc(q.a)+'</div><div><b>காரணம்:</b> '+esc(q.r)+'</div></div>';}
  if(q.stmts){h+='<ol class="stmts">'+q.stmts.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ol>';}
  if(q.rows){h+='<table class="tbl"><thead><tr><th>நிரல் I</th><th>நிரல் II</th></tr></thead><tbody>'+q.rows.map(function(r,i){return '<tr><td>'+(i+1)+'. '+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>';}).join('')+'</tbody></table>';}
  if(q.left){h+='<table class="tbl"><thead><tr><th>நிரல் I</th><th>நிரல் II</th></tr></thead><tbody>'+q.left.map(function(l,i){return '<tr><td>('+'abcd'[i]+') '+esc(l)+'</td><td>'+(i+1)+'. '+esc(q.right[i])+'</td></tr>';}).join('')+'</tbody></table>';}
  if(q.tail){h+='<div class="tail">'+esc(q.tail)+'</div>';}
  return h;
}
function optsHtml(q,sel,review){
  var h='<div class="opts">';
  for(var i=0;i<5;i++){
    var txt=i<4?q.opts[i]:'விடை தெரியவில்லை';
    var cls='opt'+(i===4?' na':'');
    var mk='';
    if(review){
      if(i===q.ans){cls+=' correct';mk='<span class="mk" style="color:var(--ok)">✔ சரி விடை</span>';}
      if(sel===i&&i!==q.ans){cls+=' wrong';mk='<span class="mk" style="color:var(--bad)">✘ உங்கள் விடை</span>';}
      else if(sel===i&&i===q.ans){mk='<span class="mk" style="color:var(--ok)">✔ உங்கள் விடை</span>';}
      h+='<div class="'+cls+'"><span class="ol">('+LETTERS[i]+')</span><span>'+esc(txt)+'</span>'+mk+'</div>';
    }else{
      if(sel===i)cls+=' sel';
      h+='<button type="button" class="'+cls+'" data-i="'+i+'"><span class="ol">('+LETTERS[i]+')</span><span>'+esc(txt)+'</span></button>';
    }
  }
  return h+'</div>';
}

/* ---------- attempt state ---------- */
var cur=null, curStart=null, ticker=null, lastSave=0, view='home';

function startAttempt(qids,mode){
  var dur=Math.round(qids.length*SEC_PER_Q), now=Date.now();
  cur={id:'A'+now,mode:mode,qids:qids,answers:{},times:{},startedAt:now,endAt:now+dur*1000,dur:dur,idx:0};
  DB.current=cur;save();openTest();
}
function flush(){
  if(!cur||!curStart)return;
  var now=Date.now(),q=cur.qids[cur.idx];
  cur.times[q]=(cur.times[q]||0)+(now-curStart)/1000;curStart=now;
}
function stopTick(){if(ticker){clearInterval(ticker);ticker=null;}}

function openTest(){
  view='test';stopTick();
  var n=cur.qids.length;
  $('#app').innerHTML=
   '<div class="top"><div><small>மீதமுள்ள நேரம்</small><div class="t" id="timer">--:--</div></div>'+
   '<div style="text-align:center"><small>விடையளித்தவை</small><div id="ansct" style="font-weight:700">0 / '+n+'</div></div>'+
   '<button class="btn" id="subBtn" type="button">சமர்ப்பி</button></div>'+
   '<div class="wrap"><div class="card" id="qcard"></div>'+
   '<div class="card"><div class="row"><b>வினா பட்டியல் / நேரம்</b><span class="sub">(ஒவ்வொரு வினாவுக்கும் செலவிட்ட நேரம் கீழே தெரியும்)</span></div><div class="pal" id="pal"></div>'+
   '<div class="sub" style="margin-top:8px">பச்சை = விடையளித்தது · மஞ்சள் = “விடை தெரியவில்லை” · வெள்ளை = விடையளிக்காதது</div></div></div>'+
   '<div class="nav"><button class="btn sec" id="prevBtn" type="button">◀ முந்தைய</button><button class="btn sec" id="clrBtn" type="button">தெளிவாக்கு</button><button class="btn" id="nextBtn" type="button">அடுத்த ▶</button></div>';
  $('#subBtn').onclick=function(){confirmSubmit();};
  $('#prevBtn').onclick=function(){if(cur.idx>0)go(cur.idx-1);};
  $('#nextBtn').onclick=function(){if(cur.idx<cur.qids.length-1)go(cur.idx+1);};
  $('#clrBtn').onclick=function(){delete cur.answers[cur.qids[cur.idx]];save();renderQ();renderPal();};
  $('#qcard').onclick=function(e){var b=e.target.closest?e.target.closest('.opt'):null;if(!b||!b.dataset.i)return;choose(+b.dataset.i);};
  $('#pal').onclick=function(e){var b=e.target.closest?e.target.closest('.pc'):null;if(!b)return;go(+b.dataset.k);window.scrollTo(0,0);};
  curStart=Date.now();renderQ();renderPal();tick();
  ticker=setInterval(tick,500);
}
function choose(i){var q=cur.qids[cur.idx];cur.answers[q]=i;save();renderQ();renderPal();}
function go(k){flush();cur.idx=k;curStart=Date.now();renderQ();renderPal();save();window.scrollTo(0,0);}
function renderQ(){
  var qid=cur.qids[cur.idx],q=QM[qid],n=cur.qids.length;
  $('#qcard').innerHTML='<div class="qhead"><span class="qn">வினா '+(cur.idx+1)+' / '+n+'</span><span class="qt" id="qtime">⏱ 00:00</span></div>'+qBody(q)+optsHtml(q,cur.answers[qid],false);
  $('#prevBtn').disabled=cur.idx===0;$('#nextBtn').disabled=cur.idx===n-1;
  var ct=0;cur.qids.forEach(function(x){var a=cur.answers[x];if(a!==undefined&&a<4)ct++;});
  $('#ansct').textContent=ct+' / '+n;
}
function renderPal(){
  $('#pal').innerHTML=cur.qids.map(function(x,k){
    var a=cur.answers[x],c='pc'+(a!==undefined?(a<4?' ans':' skip'):'')+(k===cur.idx?' cur':'');
    var t=(cur.times[x]||0)+((k===cur.idx&&curStart)?(Date.now()-curStart)/1000:0);
    return '<button type="button" class="'+c+'" data-k="'+k+'"><b>'+(k+1)+'</b><i>'+fshort(t)+'</i></button>';
  }).join('');
}
function tick(){
  if(!cur||view!=='test')return;
  var now=Date.now(),rem=Math.round((cur.endAt-now)/1000);
  var t=$('#timer');if(t){t.textContent=fmt(rem);t.className='t'+(rem<=300?' low':'');}
  if(rem<=0){submit(true);return;}
  var qid=cur.qids[cur.idx],e=(cur.times[qid]||0)+(curStart?(now-curStart)/1000:0);
  var qt=$('#qtime');if(qt)qt.textContent='⏱ '+fmt(e);
  var cell=document.querySelector('.pc.cur i');if(cell)cell.textContent=fshort(e);
  if(now-lastSave>5000){flush();save();lastSave=now;}
}
document.addEventListener('visibilitychange',function(){
  if(!cur||view!=='test')return;
  if(document.hidden){flush();curStart=null;save();}else{curStart=Date.now();tick();}
});
window.addEventListener('pagehide',function(){if(cur&&view==='test'){flush();save();}});

function modal(html,buttons){
  var m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="box">'+html+'<div class="row" style="margin-top:14px;justify-content:flex-end" id="mbtns"></div></div>';
  document.body.appendChild(m);
  buttons.forEach(function(b){var el=document.createElement('button');el.type='button';el.className='btn '+(b.cls||'');el.textContent=b.t;el.onclick=function(){document.body.removeChild(m);if(b.f)b.f();};m.querySelector('#mbtns').appendChild(el);});
}
function confirmSubmit(){
  flush();var n=cur.qids.length,ct=0;cur.qids.forEach(function(x){var a=cur.answers[x];if(a!==undefined&&a<4)ct++;});
  modal('<h2>தேர்வைச் சமர்ப்பிக்கவா?</h2><p>விடையளித்தது: <b>'+ct+'</b> / '+n+'<br>விடையளிக்காதது: <b>'+(n-ct)+'</b></p>',
    [{t:'திரும்பிச் செல்',cls:'sec'},{t:'சமர்ப்பி',cls:'warn',f:function(){submit(false);}}]);
}

/* ---------- result ---------- */
function status(att,qid){var a=att.answers[qid],q=QM[qid];if(a===undefined||a>3)return 'u';return a===q.ans?'r':'w';}
function stats(att){
  var s={r:0,w:0,u:0};att.qids.forEach(function(x){s[status(att,x)]++;});
  s.total=att.qids.length;s.pct=s.total?Math.round(s.r*1000/s.total)/10:0;return s;
}
function submit(auto){
  if(!cur)return;
  flush();stopTick();
  var now=Date.now();
  var att={id:cur.id,ts:now,name:(DB.user||{}).name||'',mobile:(DB.user||{}).mobile||'',mode:cur.mode,qids:cur.qids,answers:cur.answers,times:cur.times,dur:cur.dur,used:Math.round((Math.min(now,cur.endAt)-cur.startedAt)/1000),auto:!!auto};
  DB.history.unshift(att);DB.history=DB.history.slice(0,40);
  DB.current=null;cur=null;curStart=null;save();
  showResult(att,'all',true);
}
var shownAtt=null;
function showResult(att,filter,fresh){
  view='result';shownAtt=att;stopTick();
  var s=stats(att);
  var counts={answered:att.qids.filter(function(x){return status(att,x)!=='u';}),wrong:att.qids.filter(function(x){return status(att,x)==='w';}),skipped:att.qids.filter(function(x){return status(att,x)==='u';})};
  var h='<div class="wrap">';
  h+='<div class="card"><div class="row"><div class="grow"><h1>தேர்வு முடிவு'+(att.auto?' <span class="pill">நேரம் முடிந்ததால் தானாகச் சமர்ப்பிக்கப்பட்டது</span>':'')+'</h1><div class="sub">'+esc(att.name)+' · '+esc(att.mobile)+' · '+esc(MODE_LABEL[att.mode]||'')+' · '+new Date(att.ts).toLocaleString('en-IN')+'</div></div></div>';
  h+='<div class="big" style="margin-top:8px">'+s.r+' / '+s.total+' <span style="font-size:1.1rem;color:var(--mut)">('+s.pct+'%)</span></div>';
  h+='<div class="score"><div class="sbox ok"><b>'+s.r+'</b>சரி</div><div class="sbox bad"><b>'+s.w+'</b>தவறு</div><div class="sbox un"><b>'+s.u+'</b>விடையளிக்காதவை</div><div class="sbox"><b>'+fmt(att.used)+'</b>எடுத்த நேரம்</div></div>';
  h+='<div class="row" style="margin-top:14px"><button class="btn" id="pdfBtn" type="button">⬇ PDF ஆகப் பதிவிறக்கு</button><button class="btn sec" id="homeBtn" type="button">முகப்பு</button></div>';
  h+='<div class="sub" style="margin-top:6px">PDF: திறக்கும் அச்சு சாளரத்தில் “Save as PDF / PDF ஆகச் சேமி” என்பதைத் தேர்ந்தெடுக்கவும் (மொபைலிலும் இதுவே).</div></div>';
  h+='<div class="card"><h2>மீண்டும் எழுத</h2><div class="row">'+
     '<button class="btn" data-rt="full" type="button">முழுத் தேர்வு ('+QS.length+')</button>'+
     '<button class="btn sec" data-rt="answered" type="button"'+(counts.answered.length?'':' disabled')+'>விடையளித்தவை மட்டும் ('+counts.answered.length+')</button>'+
     '<button class="btn sec" data-rt="wrong" type="button"'+(counts.wrong.length?'':' disabled')+'>தவறியவை மட்டும் ('+counts.wrong.length+')</button>'+
     '<button class="btn sec" data-rt="skipped" type="button"'+(counts.skipped.length?'':' disabled')+'>விடையளிக்காதவை ('+counts.skipped.length+')</button></div>'+
     '<div class="sub" style="margin-top:6px">இத்தேர்வு இந்தச் சாதனத்தில் தானாகச் சேமிக்கப்பட்டுள்ளது; முகப்புப் பக்கத்தில் எப்போது வேண்டுமானாலும் மீண்டும் காணலாம்.</div></div>';
  h+='<div class="card"><h2>வினா வாரியான நேரம்</h2><div class="pal">'+att.qids.map(function(x,k){var st=status(att,x);return '<div class="pc '+st+'"><b>'+(k+1)+'</b><i>'+fshort(att.times[x]||0)+'</i></div>';}).join('')+'</div><div class="sub" style="margin-top:6px">பச்சை = சரி · சிவப்பு = தவறு · சாம்பல் = விடையளிக்கவில்லை</div></div>';
  h+='<div class="tabs" id="tabs">'+[['all','அனைத்தும் ('+s.total+')'],['r','சரி ('+s.r+')'],['w','தவறு ('+s.w+')'],['u','விடையளிக்காதவை ('+s.u+')']].map(function(t){return '<button type="button" class="tab'+(filter===t[0]?' on':'')+'" data-f="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div>';
  h+='<div id="rvlist">'+att.qids.map(function(x,k){return (filter==='all'||status(att,x)===filter)?reviewCard(att,x,k):'';}).join('')+'</div></div>';
  $('#app').innerHTML=h;
  if(fresh)window.scrollTo(0,0);
  $('#homeBtn').onclick=home;
  $('#pdfBtn').onclick=function(){printAttempt(att);};
  Array.prototype.forEach.call(document.querySelectorAll('[data-rt]'),function(b){b.onclick=function(){retake(att,b.dataset.rt);};});
  Array.prototype.forEach.call(document.querySelectorAll('#tabs .tab'),function(b){b.onclick=function(){showResult(att,b.dataset.f,false);};});
}
function reviewCard(att,qid,k){
  var q=QM[qid],st=status(att,qid),a=att.answers[qid];
  var lab=st==='r'?'சரி ✔':(st==='w'?'தவறு ✘':'விடையளிக்கவில்லை');
  var yours=(a===undefined)?'—':(a>3?'(E) விடை தெரியவில்லை':'('+LETTERS[a]+')');
  return '<div class="card rv '+st+'"><div class="qhead"><span class="qn">வினா '+(k+1)+'</span><span><span class="st '+st+'">'+lab+'</span> <span class="qt">⏱ '+fmt(att.times[qid]||0)+'</span></span></div>'+
    qBody(q)+optsHtml(q,a,true)+
    '<div class="exp"><b>உங்கள் விடை:</b> '+yours+' &nbsp;|&nbsp; <b>சரியான விடை:</b> ('+LETTERS[q.ans]+') '+esc(q.opts[q.ans])+'<br><b>விளக்கம்:</b> '+esc(q.exp)+'</div></div>';
}
function retake(att,mode){
  var ids;
  if(mode==='full')ids=QS.map(function(q){return q.n;});
  else if(mode==='answered')ids=att.qids.filter(function(x){return status(att,x)!=='u';});
  else if(mode==='wrong')ids=att.qids.filter(function(x){return status(att,x)==='w';});
  else ids=att.qids.filter(function(x){return status(att,x)==='u';});
  if(!ids.length)return;
  startAttempt(ids,mode);
}

/* ---------- PDF of the attempted test (browser "Save as PDF") ---------- */
function printAttempt(att){
  var s=stats(att);
  var h='<div style="text-align:center;margin-bottom:6px"><div style="font-size:15pt;font-weight:700">'+esc(TITLE)+'</div><div>'+esc(SUBTITLE)+'</div></div>';
  h+='<div class="phead"><b>பெயர்:</b> '+esc(att.name)+' &nbsp; <b>செல்:</b> '+esc(att.mobile)+' &nbsp; <b>நாள்:</b> '+new Date(att.ts).toLocaleString('en-IN')+'<br>'+
     '<b>தேர்வு வகை:</b> '+esc(MODE_LABEL[att.mode]||'')+' &nbsp; <b>மதிப்பெண்:</b> '+s.r+' / '+s.total+' ('+s.pct+'%) &nbsp; <b>சரி:</b> '+s.r+' &nbsp; <b>தவறு:</b> '+s.w+' &nbsp; <b>விடையளிக்காதவை:</b> '+s.u+' &nbsp; <b>எடுத்த நேரம்:</b> '+fmt(att.used)+'</div>';
  h+='<div class="pcols">';
  att.qids.forEach(function(x,k){
    var q=QM[x],st=status(att,x),a=att.answers[x];
    var lab=st==='r'?'சரி ✔':(st==='w'?'தவறு ✘':'விடையளிக்கவில்லை');
    var yours=(a===undefined)?'—':(a>3?'(E) விடை தெரியவில்லை':'('+LETTERS[a]+')');
    h+='<div class="pq"><div class="qhead"><span class="qn">வினா '+(k+1)+'</span><span><b>'+lab+'</b> · ⏱ '+fmt(att.times[x]||0)+'</span></div>'+qBody(q)+optsHtml(q,a,true)+
       '<div class="exp"><b>உங்கள் விடை:</b> '+yours+' | <b>சரியான விடை:</b> ('+LETTERS[q.ans]+') '+esc(q.opts[q.ans])+'<br><b>விளக்கம்:</b> '+esc(q.exp)+'</div></div>';
  });
  h+='</div>';
  $('#printArea').innerHTML=h;
  var done=function(){$('#printArea').innerHTML='';};
  window.onafterprint=done;
  setTimeout(function(){try{window.print();}catch(e){alert('இந்த உலாவியில் அச்சிட இயலவில்லை. Chrome / Safari-யில் திறக்கவும்.');}},200);
}

/* ---------- home ---------- */
function home(){
  view='home';stopTick();cur=null;curStart=null;
  var u=DB.user||{name:'',mobile:''};
  var h='<div class="wrap"><div class="card"><h1>'+esc(TITLE)+'</h1><div class="sub">'+esc(SUBTITLE)+'</div>'+
   '<div class="chips"><span class="chip">'+QS.length+' வினாக்கள்</span><span class="chip">நேரம்: '+Math.round(QS.length*SEC_PER_Q/60)+' நிமிடம் (வினாவுக்கு 0.6 நிமி.)</span><span class="chip">தவறுக்கு எதிர் மதிப்பெண் இல்லை</span></div>'+
   '<div class="sub" style="margin-top:8px">இன எழுத்துகள் · சுட்டு எழுத்துகள் · வினா எழுத்துகள் · ஒருமை – பன்மை · வேர்ச்சொல்</div></div>';
  if(DB.current){
    var c=DB.current,rem=Math.round((c.endAt-Date.now())/1000);
    h+='<div class="card" style="border-color:var(--acc)"><h2>முடிக்காத தேர்வு உள்ளது</h2><div class="sub">'+esc(MODE_LABEL[c.mode]||'')+' · '+c.qids.length+' வினாக்கள் · '+(rem>0?'மீதம் '+fmt(rem):'நேரம் முடிந்தது')+'</div>'+
       '<div class="row" style="margin-top:10px"><button class="btn warn" id="resumeBtn" type="button">தொடர்க ▶</button><button class="btn sec" id="dropBtn" type="button">கைவிடு</button></div></div>';
  }
  h+='<div class="card"><h2>தேர்வைத் தொடங்க</h2><label class="f" for="nm">பெயர்</label><input id="nm" type="text" autocomplete="name" placeholder="உங்கள் பெயர்" value="'+esc(u.name)+'">'+
     '<label class="f" for="mb">கைப்பேசி எண்</label><input id="mb" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10 இலக்க எண்" value="'+esc(u.mobile)+'">'+
     '<div class="err" id="err"></div>'+
     '<ul class="sub" style="padding-left:1.2em;margin:8px 0"><li>நேரம் முடிந்ததும் தேர்வு தானாகச் சமர்ப்பிக்கப்படும்.</li><li>உங்கள் விடைகள் தானாகச் சேமிக்கப்படும்; பக்கம் புதுப்பித்தாலும் / இணைப்பு துண்டித்தாலும் தேர்வு தொடரும்.</li></ul>'+
     '<button class="btn" id="startBtn" type="button" style="width:100%">தேர்வைத் தொடங்கு ▶</button></div>';
  if(!storageOK)h+='<div class="note">இந்த உலாவியில் சேமிப்பு (storage) முடக்கப்பட்டுள்ளது. எனவே இப்பக்கத்தை மூடினால் முடிவுகள் அழியும். PDF-ஐ உடனே பதிவிறக்கவும்.</div>';
  if(DB.history.length){
    h+='<div class="card"><h2>சேமிக்கப்பட்ட தேர்வுகள்</h2>'+DB.history.map(function(a,i){
      var s=stats(a);
      return '<div class="hist"><div><b>'+s.r+' / '+s.total+'</b> <span class="pill">'+esc(MODE_LABEL[a.mode]||'')+'</span><div class="sub">'+new Date(a.ts).toLocaleString('en-IN')+' · '+esc(a.name)+' · ⏱ '+fmt(a.used)+'</div></div>'+
        '<div class="row"><button class="btn sm" data-view="'+i+'" type="button">முடிவு</button><button class="btn sm sec" data-hrt="'+i+'" type="button">மீண்டும் (முழு)</button><button class="btn sm sec" data-hpdf="'+i+'" type="button">PDF</button></div></div>';
    }).join('')+'<div class="row" style="margin-top:10px"><button class="btn sm sec" id="clrHist" type="button">வரலாற்றை அழி</button></div></div>';
  }
  h+='</div>';
  $('#app').innerHTML=h;
  var rb=$('#resumeBtn');if(rb)rb.onclick=function(){cur=DB.current;if(Date.now()>=cur.endAt){submit(true);}else{openTest();}};
  var db=$('#dropBtn');if(db)db.onclick=function(){modal('<h2>முடிக்காத தேர்வைக் கைவிடவா?</h2>',[{t:'வேண்டாம்',cls:'sec'},{t:'கைவிடு',cls:'red',f:function(){DB.current=null;save();home();}}]);};
  $('#startBtn').onclick=function(){
    var n=$('#nm').value.trim(),m=$('#mb').value.replace(/\D/g,'');
    var e=$('#err');
    if(n.length<2){e.textContent='பெயரை உள்ளிடவும்.';return;}
    if(!/^[6-9]\d{9}$/.test(m)){e.textContent='சரியான 10 இலக்க கைப்பேசி எண்ணை உள்ளிடவும்.';return;}
    DB.user={name:n,mobile:m};save();
    if(DB.current&&!window.confirm('முடிக்காத தேர்வு அழிக்கப்படும். தொடரவா?'))return;
    startAttempt(QS.map(function(q){return q.n;}),'full');
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-view]'),function(b){b.onclick=function(){showResult(DB.history[+b.dataset.view],'all',true);};});
  Array.prototype.forEach.call(document.querySelectorAll('[data-hrt]'),function(b){b.onclick=function(){var a=DB.history[+b.dataset.hrt];if(!DB.user){DB.user={name:a.name,mobile:a.mobile};}retake(a,'full');};});
  Array.prototype.forEach.call(document.querySelectorAll('[data-hpdf]'),function(b){b.onclick=function(){printAttempt(DB.history[+b.dataset.hpdf]);};});
  var ch=$('#clrHist');if(ch)ch.onclick=function(){modal('<h2>சேமிக்கப்பட்ட எல்லா முடிவுகளையும் அழிக்கவா?</h2>',[{t:'வேண்டாம்',cls:'sec'},{t:'அழி',cls:'red',f:function(){DB.history=[];save();home();}}]);};
  window.scrollTo(0,0);
}
window.__tnpsc={QS:QS,home:home};
home();
})();
</script>
</body>
</html>
