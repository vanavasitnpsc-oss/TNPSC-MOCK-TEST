:root{--brand:#14573a;--brand2:#1f7a52;--bg:#f3f6f4;--card:#fff;--ink:#16221c;--mut:#5b6b62;--line:#d9e2dc;--ok:#1b8a4b;--bad:#c0392b;--warn:#d98a00;--mark:#7b3fb3;--sel:#e6f3ec}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'NotoTamil','Noto Sans Tamil','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;font-size:16px;line-height:1.55}
button,input{font-family:inherit;font-size:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h1{font-size:1.35rem;margin:.2rem 0;color:var(--brand)}
h2{font-size:1.1rem;margin:.2rem 0 .6rem;color:var(--brand)}
.ta{color:#2a3b33;font-size:.97em}
.en{font-weight:500}
.mut{color:var(--mut);font-size:.9em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--brand);background:#fff;color:var(--brand);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;min-height:44px;touch-action:manipulation}
.btn:hover{background:var(--sel)}
.btn.pri{background:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand2)}
.btn.warn{border-color:var(--warn);color:#8a5a00}.btn.warn:hover{background:#fff4de}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=tel]{width:100%;padding:11px 12px;border:1px solid #b9c7be;border-radius:10px;background:#fff}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.hero{background:linear-gradient(135deg,#14573a,#2a8a5e);color:#fff;border-radius:14px;padding:18px;margin-bottom:12px}
.hero h1{color:#fff}.hero .mut{color:#d6efe2}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:rgba(255,255,255,.16);border-radius:20px;padding:4px 12px;font-size:.9rem}
ul.ins{margin:.2rem 0 0 1.1rem;padding:0}ul.ins li{margin:3px 0}
/* test layout */
.hdr{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hdr .ttl{font-weight:700;font-size:.95rem}
.timer{font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:700;background:#0c3d28;padding:4px 12px;border-radius:8px;letter-spacing:.5px}
.timer.low{background:#a83224;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.65}}
.hdr .btn{border-color:#fff;background:transparent;color:#fff;min-height:38px;padding:6px 12px}
.hdr .btn.pri{background:#fff;color:var(--brand)}
.layout{display:grid;grid-template-columns:1fr 290px;gap:12px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}.palwrap{display:none}.palwrap.open{display:block;position:fixed;left:0;right:0;top:auto;bottom:0;max-height:70vh;overflow:auto;z-index:40;border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.3);margin:0}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qno{font-weight:700;color:var(--brand);font-size:1.05rem}
.qt{background:#eef4f0;border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:.88rem;font-variant-numeric:tabular-nums}
.stmts{margin:.3rem 0 .5rem 1.2rem;padding:0}.stmts li{margin:6px 0}
table.pt{width:100%;border-collapse:collapse;margin:.4rem 0 .6rem;font-size:.97em}
table.pt th,table.pt td{border:1px solid #b9c7be;padding:6px 8px;vertical-align:top;text-align:left}
table.pt th{background:#eef4f0}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff;touch-action:manipulation}
.opt:hover{border-color:var(--brand2)}
.opt.sel{border-color:var(--brand);background:var(--sel)}
.opt .ol{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid #8aa196;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.opt.sel .ol{background:var(--brand);color:#fff;border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:#e5f6ec}.opt.right .ol{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:#fdeceb}.opt.wrong .ol{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.ro{cursor:default}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:space-between}
.palwrap{position:sticky;top:64px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pb{border:1.5px solid #c3d0c8;background:#eceff0;border-radius:8px;padding:4px 0 2px;text-align:center;cursor:pointer;font-weight:700;min-height:44px;line-height:1.1;touch-action:manipulation}
.pb small{display:block;font-weight:400;font-size:.62rem;color:#4a5a52;font-variant-numeric:tabular-nums}
.pb.ans{background:#d3f0de;border-color:var(--ok)}.pb.vis{background:#fde3d8;border-color:#e08a5f}
.pb.mk{background:#e8dbf6;border-color:var(--mark)}.pb.cur{outline:3px solid #2a6df4;outline-offset:1px}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;margin:10px 0 0;color:var(--mut)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid #888}
.overlay{position:fixed;inset:0;background:rgba(10,30,20,.96);color:#fff;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.overlay .box{max-width:460px}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:14px;max-width:460px;width:100%;padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.stat{background:#f5f9f6;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.45rem}
.stat.g b{color:var(--ok)}.stat.r b{color:var(--bad)}.stat.o b{color:var(--warn)}
.score{font-size:2.2rem;font-weight:800;color:var(--brand)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tab{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:600;min-height:38px}
.tab.on{background:var(--brand);color:#fff}
.verdict{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.8rem;font-weight:700;color:#fff}
.verdict.r{background:var(--ok)}.verdict.w{background:var(--bad)}.verdict.u{background:var(--warn)}
.expl{background:#f7faf8;border-left:4px solid var(--brand2);padding:8px 12px;border-radius:6px;margin-top:10px;font-size:.95em}
.foot{text-align:center;color:#33463c;font-size:.88rem;padding:14px 8px 22px;border-top:1px solid var(--line);margin-top:18px;background:#e9f0eb}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;background:#222;color:#fff;padding:8px 16px;border-radius:20px;z-index:200;font-size:.9rem}
.hist .it{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0}
#printRoot{display:none}
/* print */
@media print{
 @page{size:A4;margin:12mm 11mm 16mm}
 body.printing{background:#fff;font-size:9.4pt;line-height:1.38}
 body.printing #app,body.printing .toast,body.printing .modalbg,body.printing .overlay{display:none!important}
 body.printing #printRoot{display:block}
 #printRoot .pfoot{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:8.5pt;border-top:1px solid #777;padding-top:3px;background:#fff}
 #printRoot .ph{border:1.5px solid #14573a;padding:6px 10px;margin-bottom:8px}
 #printRoot .cols{column-count:2;column-gap:9mm;column-rule:1px solid #bbb}
 #printRoot .pq{margin:0 0 7px;padding-bottom:5px;border-bottom:1px dotted #aaa;font-size:9pt}
 #printRoot .pq .opt,#printRoot .pq .expl,#printRoot .pq .qhead,#printRoot table.pt tr,#printRoot .pq li{break-inside:avoid}
 #printRoot .pq .opt{border:0;padding:1px 0;gap:6px;background:none}
 #printRoot .pq .opt .ol{flex:0 0 18px;height:18px;font-size:8pt}
 #printRoot .opts{gap:1px;margin-top:3px}
 #printRoot .opt.right{background:#e5f6ec}#printRoot .opt.wrong{background:#fdeceb}
 #printRoot .expl{font-size:8.5pt;padding:3px 6px;margin-top:3px;background:#f3f6f4}
 #printRoot .pq{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #printRoot table.pt th,#printRoot table.pt td{padding:2px 4px;font-size:8.6pt}
}

"use strict";
const DATA=[{"topic":"Velu Nachiyar","typ":"ar","intro":["Read the following Assertion (A) and Reason (R) and choose the correct answer:","கூற்று (A), காரணம் (R) ஆகியவற்றைப் படித்து சரியான விடையைத் தேர்ந்தெடுக்க:"],"A":["Velu Nachiyar is regarded as the first queen to wage war against the British colonial power in India.","இந்தியாவில் ஆங்கிலேய காலனி ஆதிக்கத்திற்கு எதிராகப் போரிட்ட முதல் அரசியாக வேலுநாச்சியார் கருதப்படுகிறார்."],"R":["She recovered Sivagangai in 1780 with the help of Hyder Ali and the Marudhu brothers.","ஹைதர் அலி மற்றும் மருது சகோதரர்களின் உதவியுடன் 1780-இல் சிவகங்கையை மீட்டார்."],"opts":[["Both (A) and (R) are true, and (R) is the correct explanation of (A)","(A), (R) இரண்டும் சரி; மேலும் (R), (A)-க்கு சரியான விளக்கம்"],["Both (A) and (R) are true, but (R) is not the correct explanation of (A)","(A), (R) இரண்டும் சரி; ஆனால் (R), (A)-க்கு சரியான விளக்கம் அல்ல"],["(A) is true, but (R) is false","(A) சரி; ஆனால் (R) தவறு"],["(A) is false, but (R) is true","(A) தவறு; ஆனால் (R) சரி"]],"ans":1,"exp":["Both are true, but the recovery of Sivagangai does not by itself explain why she is called the first queen to fight the British.","இரண்டும் சரி; ஆனால் சிவகங்கையை மீட்டது, அவர் முதல் அரசி எனக் கருதப்படுவதற்கான விளக்கமாகாது."],"level":"M","n":1},{"topic":"Madras Mahajana Sabha","typ":"single","stem":["The first President of the Madras Mahajana Sabha was:","சென்னை மகாஜன சபையின் முதல் தலைவர் யார்?"],"opts":[["P. Rangaiah Naidu","பி. இரங்கையா நாயுடு"],["G. Subramania Iyer","ஜி. சுப்பிரமணிய ஐயர்"],["M. Veeraraghavachariar","எம். வீரராகவாச்சாரியார்"],["P. Anandacharlu","பி. ஆனந்தாசார்லு"]],"ans":0,"exp":["P. Rangaiah Naidu was the first President and P. Anandacharlu the first Secretary of the Madras Mahajana Sabha.","சென்னை மகாஜன சபையின் முதல் தலைவர் பி. இரங்கையா நாயுடு; முதல் செயலர் பி. ஆனந்தாசார்லு."],"level":"E","n":2},{"topic":"Self-Respect Movement","typ":"ar","intro":["Read the following Assertion (A) and Reason (R) and choose the correct answer:","கூற்று (A), காரணம் (R) ஆகியவற்றைப் படித்து சரியான விடையைத் தேர்ந்தெடுக்க:"],"A":["Self-Respect marriages were conducted without Brahmin priests and Vedic rituals.","சுயமரியாதைத் திருமணங்கள் பிராமணப் புரோகிதரும் வேத சடங்குகளும் இன்றி நடத்தப்பட்டன."],"R":["Such marriages were legalised by the Hindu Marriage (Madras Amendment) Act of 1967.","இத்தகைய திருமணங்கள் 1967 இந்துத் திருமணச் (சென்னை திருத்த) சட்டத்தால் சட்டப்பூர்வமாக்கப்பட்டன."],"opts":[["Both (A) and (R) are true, and (R) is the correct explanation of (A)","(A), (R) இரண்டும் சரி; மேலும் (R), (A)-க்கு சரியான விளக்கம்"],["Both (A) and (R) are true, but (R) is not the correct explanation of (A)","(A), (R) இரண்டும் சரி; ஆனால் (R), (A)-க்கு சரியான விளக்கம் அல்ல"],["(A) is true, but (R) is false","(A) சரி; ஆனால் (R) தவறு"],["(A) is false, but (R) is true","(A) தவறு; ஆனால் (R) சரி"]],"ans":1,"exp":["Both are true, but the 1967 legalisation does not explain why the marriages were held without priests; that was due to the movement’s opposition to priestly domination.","இரண்டும் சரி; ஆனால் 1967 சட்ட அங்கீகாரம், புரோகிதரின்றி நடத்தப்பட்டதற்கான காரணமல்ல; அதற்குக் காரணம் புரோகித ஆதிக்கத்தை எதிர்த்த இயக்கத்தின் கொள்கை."],"level":"M","n":3},{"topic":"Last Phase of National Movement","typ":"match","intro":["Match List I with List II and select the correct answer using the codes given below:","பட்டியல் I-ஐ பட்டியல் II-உடன் பொருத்தி, கீழ்க்கண்ட குறியீடுகளிலிருந்து சரியான விடையைத் தேர்ந்தெடுக்க:"],"left":[["August Offer","ஆகஸ்ட் நிலைப்பாடு"],["Cripps Mission","கிரிப்ஸ் தூதுக்குழு"],["C. Rajagopalachari’s Formula","சி. இராஜகோபாலாச்சாரி சூத்திரம்"],["Cabinet Mission","அமைச்சரவைத் தூதுக்குழு"]],"right":[["1946","1946"],["1942","1942"],["1940","1940"],["1944","1944"]],"heads":[["List I (Proposal)","List II (Year)"],["பட்டியல் I (திட்டம்)","பட்டியல் II (ஆண்டு)"]],"opts":[["a-3, b-2, c-4, d-1","a-3, b-2, c-4, d-1"],["a-4, b-2, c-3, d-1","a-4, b-2, c-3, d-1"],["a-3, b-1, c-4, d-2","a-3, b-1, c-4, d-2"],["a-3, b-2, c-1, d-4","a-3, b-2, c-1, d-4"]],"ans":0,"exp":["August Offer 1940; Cripps Mission 1942; Rajaji Formula 1944; Cabinet Mission 1946.","ஆகஸ்ட் நிலைப்பாடு 1940; கிரிப்ஸ் தூதுக்குழு 1942; இராஜாஜி சூத்திரம் 1944; அமைச்சரவைத் தூதுக்குழு 1946."],"level":"M","n":4},{"topic":"Vellore Revolt","typ":"single","stem":["Which of the following statements about the consequences of the Vellore Revolt of 1806 is NOT true?","1806 வேலூர் கலகத்தின் விளைவுகள் குறித்த கீழ்க்கண்ட கூற்றுகளில் எது சரியானதல்ல?"],"opts":[["William Bentinck, the Governor of Madras, was recalled to England.","சென்னை ஆளுநர் வில்லியம் பெண்டிங் இங்கிலாந்துக்குத் திரும்ப அழைக்கப்பட்டார்."],["The new military regulations were continued without any change.","புதிய இராணுவ விதிகள் எந்த மாற்றமுமின்றி தொடர்ந்து நடைமுறைப்படுத்தப்பட்டன."],["Tipu Sultan’s sons were ordered to be shifted to Calcutta.","திப்பு சுல்தானின் மகன்கள் கல்கத்தாவுக்கு மாற்றப்பட்டனர்."],["Colonel Gillespie was rewarded with 7,000 pagodas.","கர்னல் கில்லஸ்பிக்கு 7,000 பகோடாக்கள் வெகுமதி வழங்கப்பட்டது."]],"ans":1,"exp":["The objectionable regulations were withdrawn after the revolt; Bentinck and Cradock were recalled.","கலகத்திற்குப் பிறகு சர்ச்சைக்குரிய விதிகள் திரும்பப் பெறப்பட்டன; பெண்டிங்கும் கிராடாக்கும் திரும்ப அழைக்கப்பட்டனர்."],"level":"E","n":5},{"topic":"Muthulakshmi Reddy","typ":"pairs","intro":["Consider the following pairs of institutions and their founders:","நிறுவனங்களும் அவற்றின் நிறுவனர்களும் அடங்கிய பின்வரும் இணைகளைக் கருதுக:"],"rows":[["Women’s Indian Association (1917)","இந்தியப் பெண்கள் சங்கம் (1917)","Annie Besant, Margaret Cousins and Dorothy Jinarajadasa","அன்னி பெசன்ட், மார்கரெட் கசின்ஸ், டோரத்தி ஜினராஜதாசா"],["Avvai Home","அவ்வை இல்லம்","Muthulakshmi Reddy","முத்துலட்சுமி ரெட்டி"],["Cancer Institute, Adyar","புற்றுநோய் நிறுவனம், அடையாறு","Muthulakshmi Reddy","முத்துலட்சுமி ரெட்டி"],["Stri Dharma (journal)","ஸ்திரீ தர்மா (இதழ்)","Sarojini Naidu","சரோஜினி நாயுடு"]],"heads":[["Institution","Founder"],["நிறுவனம்","நிறுவனர்"]],"stem":["Which of the pairs given above is/are wrongly matched?","மேற்கண்ட இணைகளில் எது/எவை தவறாகப் பொருந்தியுள்ளன?"],"opts":[["4 only","4 மட்டும்"],["2 only","2 மட்டும்"],["2 and 4 only","2 மற்றும் 4 மட்டும்"],["1 and 4 only","1 மற்றும் 4 மட்டும்"]],"ans":0,"exp":["‘Stri Dharma’ was the journal of the Women’s Indian Association (Dorothy Jinarajadasa as editor).","‘ஸ்திரீ தர்மா’ இந்தியப் பெண்கள் சங்கத்தின் இதழ் (ஆசிரியர் டோரத்தி ஜினராஜதாசா)."],"level":"M","n":6},{"topic":"V.O. Chidambaranar","typ":"single","stem":["Which one of the following statements about V.O. Chidambaranar is correct?","வ.உ. சிதம்பரனார் பற்றிய பின்வரும் கூற்றுகளில் சரியானது எது?"],"opts":[["In the Coimbatore Central Prison he was made to draw the oil press (chekku), earning the title ‘Chekkizhutha Chemmal’.","கோயம்புத்தூர் மத்தியச் சிறையில் செக்கிழுக்கச் செய்யப்பட்டதால் ‘செக்கிழுத்த செம்மல்’ எனப் போற்றப்பட்டார்."],["He was sentenced to death, which was later commuted to life imprisonment.","மரண தண்டனை விதிக்கப்பட்டு, பின்னர் அது ஆயுள் தண்டனையாகக் குறைக்கப்பட்டது."],["After his conviction he was transported to the Cellular Jail in the Andaman Islands.","தண்டனைக்குப் பின் அந்தமான் செல்லுலார் சிறைக்கு நாடு கடத்தப்பட்டார்."],["He was released from prison in 1908, soon after the Coral Mills strike.","கோரல் மில் வேலைநிறுத்தத்திற்குப் பின் 1908-லேயே சிறையிலிருந்து விடுவிக்கப்பட்டார்."]],"ans":0,"exp":["VOC was kept in the Coimbatore and Cannanore jails (1908–12) and made to pull the oil press. He was sentenced to two life terms (40 years), not death, and was released in 1912.","வ.உ.சி. 1908–12 காலத்தில் கோயம்புத்தூர், கண்ணனூர் சிறைகளில் அடைக்கப்பட்டு செக்கிழுக்க வைக்கப்பட்டார். அவருக்கு இரு ஆயுள் தண்டனை (40 ஆண்டுகள்) விதிக்கப்பட்டது, மரண தண்டனை அல்ல; 1912-இல் விடுதலையானார்."],"level":"E","n":7},{"topic":"Peasant Movements","typ":"stmt4","intro":["Consider the following statements about peasant movements:","விவசாயிகள் இயக்கங்கள் பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["Dinabandhu Mitra’s play ‘Neel Darpan’ exposed the oppression of indigo planters in Bengal.","தீனபந்து மித்ராவின் ‘நீல் தர்பன்’ நாடகம் வங்காள அவுரி விவசாயிகள் மீதான கொடுமையை வெளிப்படுத்தியது."],["The Deccan Riots of 1875 were directed against indigo planters.","1875 தக்காணக் கலகங்கள் அவுரித் தோட்டக்காரர்களுக்கு எதிராக நடைபெற்றன."],["The All India Kisan Sabha was formed at Lucknow in 1936 with Swami Sahajanand Saraswati as its president.","1936-இல் லக்னோவில் அகில இந்திய கிசான் சபை சுவாமி சகஜானந்த சரஸ்வதியைத் தலைவராகக் கொண்டு உருவானது."],["The Bardoli Satyagraha of 1928 was led by Vallabhbhai Patel.","1928 பர்டோலி சத்தியாகிரகத்தை வல்லபபாய் படேல் வழிநடத்தினார்."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["2 and 3 only","2 மற்றும் 3 மட்டும்"],["2 and 4 only","2 மற்றும் 4 மட்டும்"],["4 only","4 மட்டும்"],["2 only","2 மட்டும்"]],"ans":3,"exp":["The Deccan Riots (1875) were against moneylenders; the Deccan Agriculturists’ Relief Act followed in 1879.","தக்காணக் கலகங்கள் (1875) வட்டிக்காரர்களுக்கு எதிரானவை; 1879-இல் தக்காண விவசாயிகள் நிவாரணச் சட்டம் வந்தது."],"level":"D","n":8},{"topic":"Madras Native Association","typ":"pairs","intro":["Consider the following pairs of institutions and their founders / year:","அமைப்புகளும் அவற்றின் நிறுவனர் / ஆண்டும் அடங்கிய பின்வரும் இணைகளைக் கருதுக:"],"rows":[["Madras Native Association (1852)","சென்னை வாசிகள் சங்கம் (1852)","Gazulu Lakshminarasu Chetty","கசுலு லட்சுமிநரசு செட்டி"],["Swadesamitran","சுதேசமித்திரன்","G. Subramania Iyer","ஜி. சுப்பிரமணிய ஐயர்"],["The Hindu (1878)","தி இந்து (1878)","Kasturi Ranga Iyengar","கஸ்தூரி ரங்க ஐயங்கார்"],["Madras Mahajana Sabha","சென்னை மகாஜன சபை","Founded in 1884","1884-இல் தொடங்கப்பட்டது"]],"heads":[["Institution","Founder / Year"],["அமைப்பு","நிறுவனர் / ஆண்டு"]],"stem":["Which of the pairs given above is/are correctly matched?","மேற்கண்ட இணைகளில் எது/எவை சரியாகப் பொருந்தியுள்ளன?"],"opts":[["1, 2 and 4 only","1, 2 மற்றும் 4 மட்டும்"],["1 and 2 only","1 மற்றும் 2 மட்டும்"],["2 and 4 only","2 மற்றும் 4 மட்டும்"],["1, 2 and 3 only","1, 2 மற்றும் 3 மட்டும்"]],"ans":0,"exp":["The Hindu was started in 1878 by G. Subramania Iyer and others; Kasturi Ranga Iyengar took it over only in 1905.","தி இந்து 1878-இல் ஜி. சுப்பிரமணிய ஐயர் உள்ளிட்டோரால் தொடங்கப்பட்டது; கஸ்தூரி ரங்க ஐயங்கார் 1905-இல்தான் அதை ஏற்றார்."],"level":"M","n":9},{"topic":"Periyar","typ":"single","stem":["Periyar E.V. Ramasamy was imprisoned during the Vaikom Satyagraha of 1924 by the Government of:","1924-ஆம் ஆண்டு வைக்கம் சத்தியாகிரகத்தின்போது பெரியார் ஈ.வெ.இராமசாமி எந்த அரசால் சிறையிலடைக்கப்பட்டார்?"],"opts":[["Mysore","மைசூர்"],["Madras Presidency","சென்னை மாகாணம்"],["Travancore","திருவிதாங்கூர்"],["Cochin","கொச்சி"]],"ans":2,"exp":["Vaikom lay in the princely state of Travancore; Periyar was arrested there twice.","வைக்கம் திருவிதாங்கூர் சமஸ்தானத்தில் உள்ளது; பெரியார் அங்கு இருமுறை கைது செய்யப்பட்டார்."],"level":"E","n":10},{"topic":"Annie Besant","typ":"single","stem":["Which one of the following institutions was founded by Annie Besant at Benares in 1898?","1898-இல் அன்னி பெசன்ட் காசியில் (பனாரஸ்) தோற்றுவித்த நிறுவனம் எது?"],"opts":[["Dayanand Anglo-Vedic College","தயானந்த ஆங்கிலோ-வேதக் கல்லூரி"],["Deccan Education Society","தக்காணக் கல்விச் சங்கம்"],["Central Hindu College","மத்திய இந்துக் கல்லூரி"],["Banaras Sanskrit College","பனாரஸ் சமஸ்கிருதக் கல்லூரி"]],"ans":2,"exp":["Annie Besant founded the Central Hindu College at Benares, which later became the nucleus of the Banaras Hindu University.","அன்னி பெசன்ட் காசியில் மத்திய இந்துக் கல்லூரியைத் தொடங்கினார்; அதுவே பின்னர் பனாரஸ் இந்துப் பல்கலைக்கழகத்தின் அடித்தளமாயிற்று."],"level":"E","n":11},{"topic":"Moderates and Extremists","typ":"chrono","intro":["Arrange the following in chronological order (earliest first):","பின்வருவனவற்றை கால வரிசைப்படி (முந்தையது முதலில்) அமைக்க:"],"items":[["Lucknow Pact","லக்னோ ஒப்பந்தம்"],["Minto–Morley Reforms","மின்டோ–மார்லி சீர்திருத்தங்கள்"],["Partition of Bengal","வங்கப் பிரிவினை"],["Surat Split","சூரத் பிளவு"],["Formation of the Muslim League","முஸ்லிம் லீக் உருவாக்கம்"]],"opts":[["II, V, IV, III, I","II, V, IV, III, I"],["III, II, IV, V, I","III, II, IV, V, I"],["IV, V, III, II, I","IV, V, III, II, I"],["III, V, IV, II, I","III, V, IV, II, I"]],"ans":3,"exp":["Partition (1905) → Muslim League (1906) → Surat Split (1907) → Minto–Morley (1909) → Lucknow Pact (1916).","வங்கப் பிரிவினை (1905) → முஸ்லிம் லீக் (1906) → சூரத் பிளவு (1907) → மின்டோ–மார்லி (1909) → லக்னோ ஒப்பந்தம் (1916)."],"level":"M","n":12},{"topic":"Self-Respect Movement","typ":"stmt3","intro":["Consider the following statements about the first Provincial Self-Respect Conference at Chengalpattu (1929):","1929 செங்கல்பட்டு முதல் சுயமரியாதை மாகாண மாநாடு பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["It resolved that people should give up caste titles attached to their names.","மக்கள் தம் பெயர்களுடன் இணைந்த சாதிப் பட்டங்களைத் துறக்க வேண்டுமெனத் தீர்மானித்தது."],["It demanded equal rights for women, including the right to property.","சொத்துரிமை உள்ளிட்ட பெண்களுக்குச் சம உரிமைகளைக் கோரியது."],["It urged that Hindi be made a compulsory language in schools.","பள்ளிகளில் இந்தியைக் கட்டாய மொழியாக்க வலியுறுத்தியது."]],"stem":["Which of the statements given above is/are correct?","மேற்கண்ட கூற்றுகளில் எது/எவை சரியானவை?"],"opts":[["1 and 3 only","1 மற்றும் 3 மட்டும்"],["1 only","1 மட்டும்"],["1 and 2 only","1 மற்றும் 2 மட்டும்"],["2 only","2 மட்டும்"]],"ans":2,"exp":["The movement opposed compulsory Hindi (1938 agitation).","இவ்வியக்கம் கட்டாய இந்தியை எதிர்த்தது (1938 போராட்டம்)."],"level":"M","n":13},{"topic":"Justice Party","typ":"stmt4","intro":["Consider the following statements about the measures of the Justice Party governments:","நீதிக்கட்சி அரசுகளின் நடவடிக்கைகள் பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["The mid-day meal scheme was introduced in Madras Corporation schools in 1920 under Theagaraya Chetty.","1920-இல் தியாகராய செட்டியின் தலைமையில் சென்னை மாநகராட்சிப் பள்ளிகளில் மதிய உணவுத் திட்டம் தொடங்கப்பட்டது."],["The Staff Selection Board of 1924 later developed into the Public Service Commission in 1929.","1924 பணியாளர் தேர்வு வாரியம் பின்னர் 1929-இல் பொதுப்பணி ஆணையமாக வளர்ச்சி பெற்றது."],["The Communal G.O. was issued during the ministry of the Raja of Panagal.","வகுப்புவாரி அரசாணை பனகல் அரசரின் அமைச்சரவைக் காலத்தில் வெளியிடப்பட்டது."],["The party won an absolute majority in the 1937 provincial elections.","1937 மாகாணத் தேர்தலில் கட்சி அறுதிப் பெரும்பான்மை பெற்றது."]],"stem":["Which of the statements given above is/are correct?","மேற்கண்ட கூற்றுகளில் எது/எவை சரியானவை?"],"opts":[["1 and 3 only","1 மற்றும் 3 மட்டும்"],["1, 2 and 3 only","1, 2 மற்றும் 3 மட்டும்"],["All of the above","மேற்கண்ட அனைத்தும்"],["1, 2 and 4 only","1, 2 மற்றும் 4 மட்டும்"]],"ans":1,"exp":["The Justice Party was routed by the Congress in 1937; the Congress formed the ministry under Rajaji.","1937 தேர்தலில் காங்கிரஸிடம் நீதிக்கட்சி தோற்றது; இராஜாஜி தலைமையில் காங்கிரஸ் அமைச்சரவை அமைந்தது."],"level":"D","n":14},{"topic":"Revolutionary Movements","typ":"single","stem":["In December 1928 Bhagat Singh, Rajguru and Chandrashekhar Azad shot dead the police officer J.P. Saunders at Lahore to avenge the death of:","1928 டிசம்பரில் லாகூரில் காவல் அதிகாரி ஜே.பி. சாண்டர்ஸை பகத் சிங், ராஜ்குரு, சந்திரசேகர் ஆசாத் ஆகியோர் சுட்டுக் கொன்றது யாருடைய மரணத்திற்குப் பழிவாங்க?"],"opts":[["Bipin Chandra Pal","பிபின் சந்திர பால்"],["Lala Lajpat Rai","லாலா லஜபதி ராய்"],["Jatin Das","ஜதீந்திர நாத் தாஸ்"],["Ashfaqulla Khan","அஷ்பாகுல்லா கான்"]],"ans":1,"exp":["Lala Lajpat Rai died of injuries from the police lathi-charge during the protest against the Simon Commission (Lahore, 1928); Saunders was held responsible.","சைமன் குழுவுக்கு எதிரான ஊர்வலத்தில் (லாகூர், 1928) காவல் தடியடியால் காயமுற்ற லாலா லஜபதி ராய் உயிரிழந்தார்; அதற்குப் பொறுப்பாளியாகக் கருதப்பட்டவர் சாண்டர்ஸ்."],"level":"E","n":15},{"topic":"Dheeran Chinnamalai","typ":"stmt3","intro":["Consider the following statements about Dheeran Chinnamalai:","தீரன் சின்னமலை பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["His original name was Theerthagiri.","அவரது இயற்பெயர் தீர்த்தகிரி ஆகும்."],["He used guerrilla tactics against the British at Odanilai.","ஓடாநிலையில் ஆங்கிலேயருக்கு எதிராக கொரில்லாப் போர்முறையைப் பயன்படுத்தினார்."],["From 1800 until his hanging on 31 July 1805, he fought ceaselessly against the French.","1800 முதல் 1805 ஜூலை 31 அன்று தூக்கிலிடப்படும் வரை பிரெஞ்சுக்காரர்களை எதிர்த்து இடைவிடாது போரிட்டார்."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["2 and 3 only","2 மற்றும் 3 மட்டும்"],["1 and 3 only","1 மற்றும் 3 மட்டும்"],["3 only","3 மட்டும்"],["2 only","2 மட்டும்"]],"ans":2,"exp":["He fought the British East India Company, not the French. He was hanged at Sankagiri on 31 July 1805.","அவர் போரிட்டது ஆங்கிலேய கிழக்கிந்தியக் கம்பெனியை; பிரெஞ்சுக்காரரை அல்ல. 1805 ஜூலை 31 அன்று சங்ககிரியில் தூக்கிலிடப்பட்டார்."],"level":"M","n":16},{"topic":"Justice Party","typ":"single","stem":["The Justice Party opposed the Home Rule Movement in Madras because it considered the movement to be:","சென்னையில் ஹோம் ரூல் இயக்கத்தை நீதிக்கட்சி எதிர்த்ததற்குக் காரணம், அது இயக்கத்தை எவ்வாறு கருதியது?"],"opts":[["a pro-British movement","ஆங்கிலேய ஆதரவு இயக்கம்"],["one dominated by the Brahmins","பிராமணர்களின் ஆதிக்கத்திற்குட்பட்ட இயக்கம்"],["a movement basically of North India","அடிப்படையில் வட இந்தியாவின் இயக்கம்"],["a movement that supported communal reservation","வகுப்புவாரி இடஒதுக்கீட்டை ஆதரித்த இயக்கம்"]],"ans":1,"exp":["The Justice Party feared that Home Rule would only strengthen Brahmin domination, so it opposed Annie Besant’s agitation.","ஹோம் ரூல் பிராமணர் ஆதிக்கத்தை வலுப்படுத்தும் என நீதிக்கட்சி அஞ்சியதால் அன்னி பெசன்ட்டின் இயக்கத்தை எதிர்த்தது."],"level":"E","n":17},{"topic":"Periyar","typ":"stmt4","intro":["Consider the following statements about Periyar E.V. Ramasamy:","பெரியார் ஈ.வெ. ராமசாமி பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["He participated in the Vaikom Satyagraha of 1924 and came to be called ‘Vaikom Veerar’.","1924 வைக்கம் சத்தியாகிரகத்தில் பங்கேற்று ‘வைக்கம் வீரர்’ எனப் புகழ்பெற்றார்."],["He started the Self-Respect Movement in 1925 and the Tamil weekly ‘Kudi Arasu’.","1925-இல் சுயமரியாதை இயக்கத்தையும் ‘குடி அரசு’ தமிழ் வார இதழையும் தொடங்கினார்."],["He started the Tamil daily ‘Viduthalai’ in 1925.","1925-இல் ‘விடுதலை’ தமிழ் நாளிதழைத் தொடங்கினார்."],["He was honoured with the title ‘Periyar’ at a women’s conference in Madras in 1938.","1938-இல் சென்னையில் நடந்த பெண்கள் மாநாட்டில் ‘பெரியார்’ பட்டம் வழங்கப்பட்டது."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["1 only","1 மட்டும்"],["3 only","3 மட்டும்"],["3 and 4 only","3 மற்றும் 4 மட்டும்"],["2 and 3 only","2 மற்றும் 3 மட்டும்"]],"ans":1,"exp":["‘Viduthalai’ was started in 1935 (Kudi Arasu in 1925, Revolt in 1928).","‘விடுதலை’ தொடங்கப்பட்டது 1935-இல் (குடி அரசு 1925, ரிவோல்ட் 1928)."],"level":"D","n":18},{"topic":"Quit India Movement","typ":"stmt4","intro":["Consider the following statements about the Quit India Movement (1942):","வெள்ளையனே வெளியேறு இயக்கம் (1942) பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["Gandhi gave the call ‘Do or Die’ at the Gowalia Tank Maidan, Bombay.","பம்பாய் கோவாலியா டேங்க் மைதானத்தில் ‘செய் அல்லது செத்து மடி’ என காந்தி அறைகூவல் விடுத்தார்."],["A parallel government (Jatiya Sarkar) functioned at Tamluk in Bengal.","வங்காளத்தின் தம்லுக்கில் இணை அரசு (ஜாதிய சர்க்கார்) செயல்பட்டது."],["A parallel government (Prati Sarkar) was set up at Satara.","சதாராவில் இணை அரசு (பிரதி சர்க்கார்) அமைக்கப்பட்டது."],["The Quit India resolution was passed at the Lahore session of the Congress.","வெள்ளையனே வெளியேறு தீர்மானம் காங்கிரசின் லாகூர் மாநாட்டில் நிறைவேற்றப்பட்டது."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["1 only","1 மட்டும்"],["3 and 4 only","3 மற்றும் 4 மட்டும்"],["1 and 4 only","1 மற்றும் 4 மட்டும்"],["4 only","4 மட்டும்"]],"ans":3,"exp":["The resolution was adopted by the AICC at Bombay on 8 August 1942 (after the CWC at Wardha on 14 July).","தீர்மானம் 1942 ஆகஸ்ட் 8 அன்று பம்பாயில் அகில இந்தியக் காங்கிரஸ் குழுவால் நிறைவேற்றப்பட்டது (ஜூலை 14 வார்தா செயற்குழுவுக்குப் பின்)."],"level":"D","n":19},{"topic":"Marudhu Brothers","typ":"chrono","intro":["Arrange the following in chronological order (earliest first):","பின்வருவனவற்றை கால வரிசைப்படி (முந்தையது முதலில்) அமைக்க:"],"items":[["Marudhu brothers hanged at Tiruppathur","மருது சகோதரர்கள் திருப்பத்தூரில் தூக்கிலிடப்பட்டனர்"],["Battle of Kalaiyar Kovil – death of Muthu Vaduganathar","காளையார்கோவில் போர் – முத்துவடுகநாதர் மறைவு"],["Kattabomman hanged at Kayattar","கட்டபொம்மன் கயத்தாறில் தூக்கிலிடப்பட்டார்"],["Velu Nachiyar recovered Sivagangai","வேலுநாச்சியார் சிவகங்கையை மீட்டார்"]],"opts":[["IV, II, III, I","IV, II, III, I"],["II, III, IV, I","II, III, IV, I"],["II, IV, III, I","II, IV, III, I"],["II, I, III, IV","II, I, III, IV"]],"ans":2,"exp":["Kalaiyar Kovil (1772) → Sivagangai recovered (1780) → Kattabomman hanged (1799) → Marudhu brothers hanged (1801).","காளையார்கோவில் போர் (1772) → சிவகங்கை மீட்பு (1780) → கட்டபொம்மன் தூக்கு (1799) → மருது சகோதரர்கள் தூக்கு (1801)."],"level":"M","n":20},{"topic":"Justice Party","typ":"pairs","intro":["Consider the following pairs of newspapers and their language / nature:","இதழ்களும் அவற்றின் மொழி / தன்மையும் அடங்கிய பின்வரும் இணைகளைக் கருதுக:"],"rows":[["Justice","ஜஸ்டிஸ்","English daily of the Justice Party","நீதிக்கட்சியின் ஆங்கில நாளிதழ்"],["Dravidan","திராவிடன்","Tamil organ of the Justice Party","நீதிக்கட்சியின் தமிழ் ஏடு"],["Andhra Prakasika","ஆந்திர பிரகாசிகா","Telugu organ of the Justice Party","நீதிக்கட்சியின் தெலுங்கு ஏடு"],["Kudi Arasu","குடி அரசு","English weekly of the Justice Party","நீதிக்கட்சியின் ஆங்கில வார இதழ்"]],"heads":[["Newspaper","Language / Nature"],["இதழ்","மொழி / தன்மை"]],"stem":["Which of the pairs given abov Lord William Bentinck.","1829-இல் வில்லியம் பெண்டிங் பிரபு காலத்தில் உடன்கட்டை ஏறுதல் சட்டவிரோதமாக்கப்பட்டது."],["The Hindu Widows’ Remarriage Act was passed in 1856.","இந்து விதவை மறுமணச் சட்டம் 1856-இல் நிறைவேற்றப்பட்டது."],["The Age of Consent Act of 1891 raised the age of consent for girls to 12 years.","1891 ஒப்புதல் வயதுச் சட்டம் பெண்களுக்கான ஒப்புதல் வயதை 12-ஆக உயர்த்தியது."],["The Sarda Act of 1929 fixed the minimum marriage age at 14 for girls and 18 for boys.","1929 சாரதா சட்டம் திருமண வயதை பெண்களுக்கு 14, ஆண்களுக்கு 18 எனக் குறைந்தபட்சமாக நிர்ணயித்தது."],["The Special Marriage Act of 1872 legalised child marriages.","1872 சிறப்புத் திருமணச் சட்டம் குழந்தைத் திருமணங்களைச் சட்டப்பூர்வமாக்கியது."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["5 only","5 மட்டும்"],["2, 4 and 5 only","2, 4 மற்றும் 5 மட்டும்"],["4 and 5 only","4 மற்றும் 5 மட்டும்"],["1 and 5 only","1 மற்றும் 5 மட்டும்"]],"ans":0,"exp":["The Special Marriage Act (1872) legalised inter-caste and civil marriages, and fixed minimum ages (14 for girls, 18 for boys); it did not legalise child marriage.","1872 சிறப்புத் திருமணச் சட்டம் சாதிகடந்த, சிவில் திருமணங்களுக்குச் சட்ட அங்கீகாரம் அளித்தது; குழந்தைத் திருமணத்தை ஏற்கவில்லை."],"level":"D","n":27},{"topic":"Annie Besant","typ":"stmt4","intro":["Consider the following statements about Annie Besant:","அன்னி பெசன்ட் பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["She founded the Home Rule League at Adyar in September 1916.","1916 செப்டம்பரில் அடையாறில் ஹோம் ரூல் இயக்கத்தைத் தொடங்கினார்."],["She was interned at Ootacamund in June 1917 by the Governor of Madras, Lord Pentland.","1917 ஜூனில் சென்னை ஆளுநர் லார்டு பெண்ட்லாண்டால் உதகமண்டலத்தில் வீட்டுக்காவலில் வைக்கப்பட்டார்."],["She presided over the Calcutta session of the Congress in 1917, becoming its first woman President.","1917 கல்கத்தா காங்கிரஸ் மாநாட்டிற்குத் தலைமை தாங்கி, அதன் முதல் பெண் தலைவரானார்."],["She edited the newspaper ‘Young India’ to propagate Home Rule.","ஹோம் ரூலைப் பரப்ப ‘யங் இந்தியா’ இதழை நடத்தினார்."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["4 only","4 மட்டும்"],["3 and 4 only","3 மற்றும் 4 மட்டும்"],["1, 2 and 4 only","1, 2 மற்றும் 4 மட்டும்"],["2 and 4 only","2 மற்றும் 4 மட்டும்"]],"ans":0,"exp":["Besant edited ‘New India’ (daily) and ‘Commonweal’ (weekly); ‘Young India’ was Gandhi’s journal.","பெசன்ட் ‘நியூ இந்தியா’ (நாளிதழ்), ‘காமன்வீல்’ (வார இதழ்) ஆகியவற்றை நடத்தினார்; ‘யங் இந்தியா’ காந்தியின் இதழ்."],"level":"D","n":28},{"topic":"V.O. Chidambaranar","typ":"stmt3","intro":["Consider the following statements about VOC’s political associations:","வ.உ.சி.யின் அரசியல் தொடர்புகள் பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["He was a follower of Bal Gangadhar Tilak and the Extremist school.","அவர் பால கங்காதர திலகரையும் தீவிரவாத அணியையும் பின்பற்றியவர்."],["He attended the Surat Session of 1907 and sided with the Extremists.","1907 சூரத் மாநாட்டில் பங்கேற்று தீவிரவாதிகளின் பக்கம் நின்றார்."],["He remained a devoted follower of Gandhi’s Non-Cooperation Movement until his death.","மறையும் வரை காந்தியின் ஒத்துழையாமை இயக்கத்தை உறுதியாகப் பின்பற்றினார்."]],"stem":["Which of the statements given above is/are correct?","மேற்கண்ட கூற்றுகளில் எது/எவை சரியானவை?"],"opts":[["1 only","1 மட்டும்"],["All of the above","மேற்கண்ட அனைத்தும்"],["1 and 2 only","1 மற்றும் 2 மட்டும்"],["2 and 3 only","2 மற்றும் 3 மட்டும்"]],"ans":2,"exp":["VOC differed with Gandhi’s methods and left the Congress around 1920.","காந்தியின் வழிமுறைகளில் வேறுபட்ட வ.உ.சி., 1920 வாக்கில் காங்கிரசிலிருந்து விலகினார்."],"level":"M","n":29},{"topic":"Justice Party","typ":"ar","intro":["Read the following Assertion (A) and Reason (R) and choose the correct answer:","கூற்று (A), காரணம் (R) ஆகியவற்றைப் படித்து சரியான விடையைத் தேர்ந்தெடுக்க:"],"A":["Women were granted the right to vote in the Madras Presidency in 1921 during the Justice Party rule.","நீதிக்கட்சி ஆட்சியில் 1921-இல் சென்னை மாகாணத்தில் பெண்களுக்கு வாக்குரிமை வழங்கப்பட்டது."],"R":["This right was granted under the Government of India Act of 1935.","இவ்வுரிமை 1935 இந்திய அரசுச் சட்டத்தின் கீழ் வழங்கப்பட்டது."],"opts":[["Both (A) and (R) are true, and (R) is the correct explanation of (A)","(A), (R) இரண்டும் சரி; மேலும் (R), (A)-க்கு சரியான விளக்கம்"],["Both (A) and (R) are true, but (R) is not the correct explanation of (A)","(A), (R) இரண்டும் சரி; ஆனால் (R), (A)-க்கு சரியான விளக்கம் அல்ல"],["(A) is true, but (R) is false","(A) சரி; ஆனால் (R) தவறு"],["(A) is false, but (R) is true","(A) தவறு; ஆனால் (R) சரி"]],"ans":2,"exp":["The resolution was passed in 1921 under the Act of 1919; Madras was the first province to extend the franchise to women.","1919 சட்டத்தின் கீழ் 1921-இல் தீர்மானம் நிறைவேறியது; பெண்களுக்கு வாக்குரிமை அளித்த முதல் மாகாணம் சென்னை."],"level":"D","n":30},{"topic":"INA","typ":"stmt4","intro":["Consider the following statements about the Indian National Army (INA) and Subhas Chandra Bose:","இந்திய தேசிய இராணுவம் (INA), சுபாஷ் சந்திர போஸ் பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["Bose took over the leadership of the INA at Singapore in July 1943.","1943 ஜூலையில் சிங்கப்பூரில் INA தலைமையை போஸ் ஏற்றார்."],["The Provisional Government of Free India (Azad Hind) was proclaimed on 21 October 1943.","சுதந்திர இந்தியாவின் இடைக்கால அரசு (ஆசாத் ஹிந்த்) 1943 அக்டோபர் 21 அன்று அறிவிக்கப்பட்டது."],["Azad Hind Radio was operated from Berlin.","ஆசாத் ஹிந்த் வானொலி பெர்லினிலிருந்து இயங்கியது."],["Azad Hind Radio was started from Paris.","ஆசாத் ஹிந்த் வானொலி பாரிசிலிருந்து தொடங்கப்பட்டது."]],"stem":["How many of the statements given above are correct?","மேற்கண்ட கூற்றுகளில் எத்தனை சரியானவை?"],"opts":[["Only one","ஒன்று மட்டும்"],["Only two","இரண்டு மட்டும்"],["Only three","மூன்று மட்டும்"],["All four","நான்கும்"]],"ans":2,"exp":["Three are correct; the Azad Hind Radio operated from Berlin (later also from Southeast Asia), not Paris.","மூன்று சரி; ஆசாத் ஹிந்த் வானொலி பெர்லினிலிருந்து (பின்னர் தென்கிழக்காசியாவிலிருந்தும்) இயங்கியது; பாரிசிலிருந்து அல்ல."],"level":"D","n":31},{"topic":"Periyar","typ":"single","stem":["In 1921, two women of Erode took part in the picketing of toddy shops and were among the first women arrested for picketing in Tamil Nadu. They were:","1921-இல் ஈரோட்டில் கள்ளுக்கடை மறியலில் ஈடுபட்டு, தமிழகத்தில் மறியலுக்காகக் கைது செய்யப்பட்ட முதல் பெண்களில் இடம்பெற்ற இருவர்:"],"opts":[["Kannammal and Muthulakshmi Reddy","கண்ணம்மாள் மற்றும் முத்துலட்சுமி ரெட்டி"],["Nagammaiyar and Moovalur Ramamirtham Ammaiyar","நாகம்மையார் மற்றும் மூவலூர் இராமாமிர்தம் அம்மையார்"],["Maniammai and Nagammaiyar","மணியம்மையார் மற்றும் நாகம்மையார்"],["Nagammaiyar and Kannammal","நாகம்மையார் மற்றும் கண்ணம்மாள்"]],"ans":3,"exp":["Periyar’s wife Nagammai and his sister Kannammal joined the 1921 picketing of toddy shops at Erode and were arrested.","பெரியாரின் துணைவியார் நாகம்மையாரும் சகோதரி கண்ணம்மாளும் 1921-இல் ஈரோட்டில் கள்ளுக்கடை மறியலில் ஈடுபட்டுக் கைதானார்கள்."],"level":"E","n":32},{"topic":"Ramalinga Adigal","typ":"single","stem":["According to Ramalinga Adigal (Vallalar), his concept of Karunai (compassion) was based on:","இராமலிங்க அடிகளாரின் (வள்ளலார்) கருணைக் கோட்பாடு எதன் அடிப்படையில் அமைந்தது?"],"opts":[["the idea of peace","அமைதிக் கருத்து"],["helping others","பிறருக்கு உதவுதல்"],["service to the nation","நாட்டுக்குச் செய்யும் சேவை"],["the unity of mankind","மனிதகுல ஒற்றுமை"]],"ans":3,"exp":["Vallalar’s Jeevakarunyam (compassion towards all life) rested on the unity of mankind, opposed caste distinctions and led him to feed the hungry.","வள்ளலாரின் ஜீவகாருண்யம் மனிதகுல ஒற்றுமையை அடிப்படையாகக் கொண்டது; சாதி வேறுபாட்டை எதிர்த்து, பசித்தவருக்கு உணவளிக்கச் செய்தது."],"level":"E","n":33},{"topic":"Swadeshi Movement","typ":"ar","intro":["Read the following Assertion (A) and Reason (R) and choose the correct answer:","கூற்று (A), காரணம் (R) ஆகியவற்றைப் படித்து சரியான விடையைத் தேர்ந்தெடுக்க:"],"A":["The Partition of Bengal was annulled in 1911.","1911-இல் வங்கப் பிரிவினை ரத்து செய்யப்பட்டது."],"R":["At the Delhi Durbar of 1911 the capital of British India was also announced to be shifted from Calcutta to Delhi.","1911 டெல்லி தர்பாரில் பிரிட்டிஷ் இந்தியாவின் தலைநகரை கல்கத்தாவிலிருந்து டெல்லிக்கு மாற்றுவதாகவும் அறிவிக்கப்பட்டது."],"opts":[["Both (A) and (R) are true, and (R) is the correct explanation of (A)","(A), (R) இரண்டும் சரி; மேலும் (R), (A)-க்கு சரியான விளக்கம்"],["Both (A) and (R) are true, but (R) is not the correct explanation of (A)","(A), (R) இரண்டும் சரி; ஆனால் (R), (A)-க்கு சரியான விளக்கம் அல்ல"],["(A) is true, but (R) is false","(A) சரி; ஆனால் (R) தவறு"],["(A) is false, but (R) is true","(A) தவறு; ஆனால் (R) சரி"]],"ans":1,"exp":["Both are true, but the shifting of the capital does not explain the annulment, which was announced by George V at the Durbar owing to the Swadeshi–Boycott agitation.","இரண்டும் சரி; ஆனால் தலைநகர் மாற்றம், ரத்துக்கான காரணமல்ல; சுதேசி–புறக்கணிப்புப் போராட்டத்தால் ஐந்தாம் ஜார்ஜ் தர்பாரில் ரத்தை அறிவித்தார்."],"level":"M","n":34},{"topic":"Civil Disobedience Movement","typ":"single","stem":["Who organised the Khudai Khidmatgars (Red Shirts) in the North-West Frontier Province, which took part in the Civil Disobedience Movement?","சட்ட மறுப்பு இயக்கத்தில் பங்கேற்ற, வடமேற்கு எல்லைப்புற மாகாணத்தின் குதாய் கித்மத்கார்களை (செஞ்சட்டையினர்) ஒருங்கிணைத்தவர் யார்?"],"opts":[["K. Kelappan","கே. கேளப்பன்"],["Khan Abdul Ghaffar Khan","கான் அப்துல் கபார் கான்"],["Maulana Abul Kalam Azad","மௌலானா அபுல் கலாம் ஆசாத்"],["Imam Sahib","இமாம் சாஹிப்"]],"ans":1,"exp":["Khan Abdul Ghaffar Khan (‘Frontier Gandhi’) raised the Khudai Khidmatgars; Imam Sahib was associated with Dharasana and Kelappan with the Vaikom/Guruvayur satyagrahas.","கான் அப்துல் கபார் கான் (‘எல்லை காந்தி’) குதாய் கித்மத்கார்களை உருவாக்கினார்; இமாம் சாஹிப் தரசனா சத்தியாகிரகத்துடனும், கேளப்பன் குருவாயூர் சத்தியாகிரகத்துடனும் தொடர்புடையவர்கள்."],"level":"E","n":35},{"topic":"Self-Respect tem":["Who described the proposals of the Cripps Mission (1942) as “a post-dated cheque on a crashing bank”?","கிரிப்ஸ் தூதுக்குழுவின் (1942) முன்மொழிவுகளை “சரியும் வங்கியின் மீது எழுதப்பட்ட தேதி குறிக்கப்படாத காசோலை” என வர்ணித்தவர் யார்?"],"opts":[["Sardar Vallabhbhai Patel","சர்தார் வல்லபாய் படேல்"],["Mahatma Gandhi","மகாத்மா காந்தி"],["Jawaharlal Nehru","ஜவஹர்லால் நேரு"],["M.A. Jinnah","எம்.ஏ. ஜின்னா"]],"ans":1,"exp":["Gandhi called the Cripps offer of Dominion status after the war ‘a post-dated cheque on a crashing bank’; the Congress rejected it.","போருக்குப் பின் டொமினியன் அந்தஸ்து என்ற கிரிப்ஸ் முன்மொழிவை காந்தி ‘சரியும் வங்கியின் மீதான தேதியிடப்பட்ட காசோலை’ என்றார்; காங்கிரஸ் அதை நிராகரித்தது."],"level":"E","n":41},{"topic":"Civil Disobedience Movement","typ":"ar","intro":["Read the following Assertion (A) and Reason (R) and choose the correct answer:","கூற்று (A), காரணம் (R) ஆகியவற்றைப் படித்து சரியான விடையைத் தேர்ந்தெடுக்க:"],"A":["Gandhi undertook a fast unto death in Yerwada Jail in September 1932.","1932 செப்டம்பரில் எரவாடா சிறையில் காந்தி சாகும்வரை உண்ணாவிரதம் மேற்கொண்டார்."],"R":["He demanded that the Communal Award should grant separate electorates to the Depressed Classes.","வகுப்புவாரித் தீர்ப்பு தாழ்த்தப்பட்டோருக்குத் தனித் தொகுதிகளை வழங்க வேண்டுமென அவர் கோரினார்."],"opts":[["Both (A) and (R) are true, and (R) is the correct explanation of (A)","(A), (R) இரண்டும் சரி; மேலும் (R), (A)-க்கு சரியான விளக்கம்"],["Both (A) and (R) are true, but (R) is not the correct explanation of (A)","(A), (R) இரண்டும் சரி; ஆனால் (R), (A)-க்கு சரியான விளக்கம் அல்ல"],["(A) is true, but (R) is false","(A) சரி; ஆனால் (R) தவறு"],["(A) is false, but (R) is true","(A) தவறு; ஆனால் (R) சரி"]],"ans":2,"exp":["(R) is false: he opposed the separate electorates granted to the Depressed Classes. The fast ended with the Poona Pact between Gandhi and Ambedkar (24 Sept 1932).","(R) தவறு: தாழ்த்தப்பட்டோருக்கான தனித் தொகுதிகளை அவர் எதிர்த்தார். காந்தி–அம்பேத்கர் பூனா ஒப்பந்தத்தால் (19 ":["Rani Lakshmibai led at Jhansi; Kunwar Singh led at Jagdishpur (Bihar).","ஜான்சியில் வழிநடத்தியவர் ராணி லட்சுமிபாய்; குன்வர் சிங் பீகார் ஜகதீஷ்பூரில் வழிநடத்தினார்."],"level":"M","n":44},{"topic":"Gandhian Phase","typ":"ar","intro":["Read the following Assertion (A) and Reason (R) and choose the correct answer:","கூற்று (A), காரணம் (R) ஆகியவற்றைப் படித்து சரியான விடையைத் தேர்ந்தெடுக்க:"],"A":["Gandhi withdrew the Non-Cooperation Movement in February 1922.","1922 பிப்ரவரியில் ஒத்துழையாமை இயக்கத்தை காந்தி திரும்பப் பெற்றார்."],"R":["A mob set fire to a police station at Chauri Chaura, killing policemen.","சௌரி சௌரா காவல் நிலையத்தை கும்பல் தீவைத்து எரித்ததில் காவலர்கள் கொல்லப்பட்டனர்."],"opts":[["Both (A) and (R) are true, and (R) is the correct explanation of (A)","(A), (R) இரண்டும் சரி; மேலும் (R), (A)-க்கு சரியான விளக்கம்"],["Both (A) and (R) are true, but (R) is not the correct explanation of (A)","(A), (R) இரண்டும் சரி; ஆனால் (R), (A)-க்கு சரியான விளக்கம் அல்ல"],["(A) is true, but (R) is false","(A) சரி; ஆனால் (R) தவறு"],["(A) is false, but (R) is true","(A) தவறு; ஆனால் (R) சரி"]],"ans":0,"exp":["The violent incident of 5 Feb 1922 convinced Gandhi that the nation was not ready for non-violent mass action.","1922 பிப்ரவரி 5 வன்முறை, நாடு அகிம்சை வழிப் போராட்டத்திற்குத் தயாராகவில்லை என காந்தியை உணர்த்தியது."],"level":"M","n":45},{"topic":"INC Sessions","typ":"stmt4","intro":["Consider the following statements about the early sessions of the Indian National Congress:","இந்திய தேசிய காங்கிரசின் தொடக்க மாநாடுகள் பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["The first session (1885) at Bombay was presided over by W.C. Bonnerjee.","முதல் மாநாடு (1885) பம்பாயில் டபிள்யூ.சி. பானர்ஜி தலைமையில் நடந்தது."],["Badruddin Tyabji became the first Muslim President at the Madras session of 1887.","1887 சென்னை மாநாட்டில் பதுருதீன் தயாப்ஜி முதல் முஸ்லிம் தலைவரானார்."],["George Yule, the first English President, presided over the Allahabad session of 1888.","முதல் ஆங்கிலேயத் தலைவர் ஜார்ஜ் யூல் 1888 அலகாபாத் மாநாட்டிற்குத் தலைமை தாங்கினார்."],["The Surat session of 1907 was presided over by Surendranath Banerjee.","1907 சூரத் மாநாட்டிற்கு சுரேந்திரநாத் பானர்ஜி தலைமை தாங்கினார்."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["3 and 4 only","3 மற்றும் 4 மட்டும்"],["2 and 4 only","2 மற்றும் 4 மட்டும்"],["4 only","4 மட்டும்"],["1, 2 and 4 only","1, 2 மற்றும் 4 மட்டும்"]],"ans":2,"exp":["Rash Behari Ghosh presided over the Surat session (1907), where the Congress split.","சூரத் மாநாட்டிற்கு (1907) ராஷ் பிகாரி கோஷ் தலைமை தாங்கினார்; அங்கு காங்கிரஸ் பிளவுற்றது."],"level":"D","n":46},{"topic":"Periyar","typ":"ar","intro":["Read the following Assertion (A) and Reason (R) and choose the correct answer:","கூற்று (A), காரணம் (R) ஆகியவற்றைப் படித்து சரியான விடையைத் தேர்ந்தெடுக்க:"],"A":["Periyar E.V. Ramasamy is remembered as ‘Vaikom Veerar’.","பெரியார் ஈ.வெ. ராமசாமி ‘வைக்கம் வீரர்’ எனப் போற்றப்படுகிறார்."],"R":["The Vaikom Satyagraha (1924), in which he took part, demanded the abolition of the zamindari system in Travancore.","அவர் பங்கேற்ற வைக்கம் சத்தியாகிரகம் (1924), திருவிதாங்கூரில் ஜமீன்தாரி முறையை ஒழிக்கக் கோரியது."],"opts":[["Both (A) and (R) are true, and (R) is the correct explanation of (A)","(A), (R) இரண்டும் சரி; மேலும் (R), (A)-க்கு சரியான விளக்கம்"],["Both (A) and (R) are true, but (R) is not the correct explanation of (A)","(A), (R) இரண்டும் சரி; ஆனால் (R), (A)-க்கு சரியான விளக்கம் அல்ல"],["(A) is true, but (R) is false","(A) சரி; ஆனால் (R) தவறு"],["(A) is false, but (R) is true","(A) தவறு; ஆனால் (R) சரி"]],"ans":2,"exp":["(R) is false: Vaikom demanded the right of the depressed classes to walk on the roads near the Vaikom Mahadeva temple. He was arrested twice there.","(R) தவறு: வைக்கம் போராட்டம் வைக்கம் மகாதேவர் கோயில் சாலைகளில் தாழ்த்தப்பட்டோர் நடக்கும் உரிமையைக் கோரியது. அங்கு அவர் இருமுறை கைதானார்."],"level":"M","n":47},{"topic":"Gandhian Phase","typ":"stmt4","intro":["Consider the following statements about Gandhi’s early satyagrahas in India:","இந்தியாவில் காந்தியின் தொடக்கக் கால சத்தியாகிரகங்கள் பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["The Champaran Satyagraha (1917) was against the ‘tinkathia’ system of indigo cultivation.","சம்பரான் சத்தியாகிரகம் (1917) ‘தீன்கதியா’ அவுரிச் சாகுபடி முறைக்கு எதிரானது."],["The Ahmedabad mill strike of 1918 was the occasion of Gandhi’s first fast in India.","1918 அகமதாபாத் ஆலைத் தொழிலாளர் போராட்டத்தின்போது இந்தியாவில் காந்தியின் முதல் உண்ணாவிரதம் நடந்தது."],["In the Kheda Satyagraha (1918), Vallabhbhai Patel supported peasants demanding revenue remission after crop failure.","1918 கேடா சத்தியாகிரகத்தில் பயிர் சேதத்தால் வரி விலக்குக் கோரிய விவசாயிகளுக்கு வல்லபபாய் படேல் துணைநின்றார்."],["Gandhi’s first satyagraha in India was launched at Kheda.","இந்தியாவில் காந்தியின் முதல் சத்தியாகிரகம் கேடாவில் தொடங்கப்பட்டது."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["1, 3 and 4 only","1, 3 மற்றும் 4 மட்டும்"],["3 and 4 only","3 மற்றும் 4 மட்டும்"],["4 only","4 மட்டும்"],["1 and 4 only","1 மற்றும் 4 மட்டும்"]],"ans":2,"exp":["His first satyagraha in India was at Champaran (Bihar), followed by Ahmedabad and Kheda (1918).","இந்தியாவில் காந்தியின் முதல் சத்தியாகிரகம் சம்பரான் (பீகார்); பின்னர் அகமதாபாத், கேடா (1918)."],"level":"D","n":48},{"topic":"INC Sessions","typ":"match","intro":["Match List I with List II and select the correct answer using the codes given below:","பட்டியல் I-ஐ பட்டியல் II-உடன் பொருத்தி, கீழ்க்கண்ட குறியீடுகளிலிருந்து சரியான விடையைத் தேர்ந்தெடுக்க:"],"left":[["Belgaum (1924)","பெல்காம் (1924)"],["Kanpur (1925)","கான்பூர் (1925)"],["Lahore (1929)","லாகூர் (1929)"],["Karachi (1931)","கராச்சி (1931)"]],"right":[["Jawaharlal Nehru","ஜவஹர்லால் நேரு"],["Vallabhbhai Patel","வல்லபபாய் படேல்"],["Mahatma Gandhi","மகாத்மா காந்தி"],["Sarojini Naidu","சரோஜினி நாயுடு"]],"heads":[["List I (Session)","List II (President)"],["பட்டியல் I (மாநாடு)","பட்டியல் II (தலைவர்)"]],"opts":[["a-3, b-2, c-1, d-4","a-3, b-2, c-1, d-4"],["a-3, b-4, c-1, d-2","a-3, b-4, c-1, d-2"],["a-4, b-3, c-1, d-2","a-4, b-3, c-1, d-2"],["a-3, b-1, c-4, d-2","a-3, b-1, c-4, d-2"]],"ans":1,"exp":["Gandhi presided at Belgaum; Sarojini Naidu at Kanpur; Nehru at Lahore (Purna Swaraj); Patel at Karachi.","பெல்காமில் காந்தி; கான்பூரில் சரோஜினி நாயுடு; லாகூரில் நேரு (பூரண சுதந்திரம்); கராச்சியில் படேல் தலைமை தாங்கினர்."],"level":"M","n":49},{"topic":"Pre-Congress Organisations","typ":"pairs","intro":["Consider the following pairs of pre-Congress associations and their founders:","காங்கிரசுக்கு முந்தைய அமைப்புகளும் நிறுவனர்களும் அடங்கிய பின்வரும் இணைகளைக் கருதுக:"],"rows":[["East India Association (1866)","கிழக்கிந்தியச் சங்கம் (1866)","Dadabhai Naoroji","தாதாபாய் நௌரோஜி"],["Indian Association (1876)","இந்தியச் சங்கம் (1876)","Surendranath Banerjee and Anandamohan Bose","சுரேந்திரநாத் பானர்ஜி, ஆனந்தமோகன் போஸ்"],["Bombay Presidency Association (1885)","பம்பாய் மாகாணச் சங்கம் (1885)","Pherozeshah Mehta, Badruddin Tyabji and K.T. Telang","பெரோஷா மேத்தா, பதுருதீன் தயாப்ஜி, கே.டி. தெலாங்"],["British Indian Association (1851)","பிரிட்டிஷ் இந்தியச் சங்கம் (1851)","Surendranath Banerjee","சுரேந்திரநாத் பானர்ஜி"]],"heads":[["Association","Founder"],["சங்கம்","நிறுவனர்"]],"stem":["Which of the pairs given above is/are wrongly matched?","மேற்கண்ட இணைகளில் எது/எவை தவறாகப் பொருந்தியுள்ளன?"],"opts":[["4 only","4 மட்டும்"],["2 and 4 only","2 மற்றும் 4 மட்டும்"],["3 and 4 only","3 மற்றும் 4 மட்டும்"],["1, 2 and 4 only","1, 2 மற்றும் 4 மட்டும்"]],"ans":0,"exp":["The British Indian Association (Calcutta, 1851) was led by Radhakanta Deb and Debendranath Tagore.","பிரிட்டிஷ் இந்தியச் சங்கத்தை (கல்கத்தா, 1851) ராதாகாந்த தேவ், தேவேந்திரநாத் தாகூர் ஆகியோர் வழிநடத்தினர்."],"level":"D","n":50},{"topic":"Marudhu Brothers","typ":"single","stem":["The Tiruchirappalli Proclamation issued by the Marudhu brothers in June 1801 is also known as the:","1801 ஜூனில் மருது சகோதரர்கள் வெளியிட்ட திருச்சிராப்பள்ளி பிரகடனம் வேறு எப்பெயரால் அழைக்கப்படுகிறது?"],"opts":[["Panchalankurichi Declaration","பாஞ்சாலங்குறிச்சிப் பிரகடனம்"],["Palayakkarar Charter","பாளையக்காரர் உரிமைப் பட்டயம்"],["Madurai Manifesto","மதுரை அறிக்கை"],["Jambudweepa Proclamation","ஜம்புத்தீவு பிரகடனம்"]],"ans":3,"exp":["The proclamation, addressed to the people of ‘Jambudweepa’ (the Indian subcontinent), was pasted on the Tiruchirappalli fort and the Srirangam temple on 16 June 1801.","‘ஜம்புத்தீவு’ (இந்தியத் துணைக்கண்டம்) மக்களை நோக்கிய இப்பிரகடனம் 1801 ஜூன் 16 அன்று திருச்சிக் கோட்டையிலும் ஸ்ரீரங்கம் கோயிலிலும் ஒட்டப்பட்டது."],"level":"E","n":51},{"topic":"Civil Disobedience Movement","typ":"stmt3","intro":["Consider the following statements about the Dandi March:","தண்டி யாத்திரை பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["Gandhi started from Sabarmati Ashram on 12 March 1930 with 78 volunteers.","1930 மார்ச் 12 அன்று 78 தொண்டர்களுடன் சபர்மதி ஆசிரமத்திலிருந்து காந்தி புறப்பட்டார்."],["He broke the salt law at Dandi on 6 April 1930.","1930 ஏப்ரல் 6 அன்று தண்டியில் உப்புச் சட்டத்தை மீறினார்."],["Gandhi attended the First Round Table Conference in London in 1930.","1930 முதல் வட்டமேசை மாநாட்டில் காந்தி லண்டனில் பங்கேற்றார்."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["2 and 3 only","2 மற்றும் 3 மட்டும்"],["All of the above","மேற்கண்ட அனைத்தும்"],["1 and 3 only","1 மற்றும் 3 மட்டும்"],["3 only","3 மட்டும்"]],"ans":3,"exp":["The Congress boycotted the First Round Table Conference; Gandhi attended only the Second (1931).","முதல் வட்டமேசை மாநாட்டை காங்கிரஸ் புறக்கணித்தது; காந்தி இரண்டாவதில் (1931) மட்டுமே கலந்துகொண்டார்."],"level":"M","n":52},{"topic":"Revivalist Movements","typ":"pairs","intro":["Consider the following pairs of reform organisations and their year of foundation:","சீர்திருத்த அமைப்புகளும் அவை தொடங்கிய ஆண்டுகளும் அடங்கிய பின்வரும் இணைகளைக் கருதுக:"],"rows":[["Brahmo Samaj","பிரம்ம சமாஜம்","1828","1828"],["Prarthana Samaj","பிரார்த்தனா சமாஜம்","1867","1867"],["Ramakrishna Mission","இராமகிருஷ்ண மிஷன்","1897","1897"],["Arya Samaj","ஆரிய சமாஜம்","1857","1857"]],"heads":[["Organisation","Year"],["அமைப்பு","ஆண்டு"]],"stem":["Which of the pairs given above is/are wrongly matched?","மேற்கண்ட இணைகளில் எது/எவை தவறாகப் பொருந்தியுள்ளன?"],"opts":[["3 and 4 only","3 மற்றும் 4 மட்டும்"],["1, 2 and 4 only","1, 2 மற்றும் 4 மட்டும்"],["2 and 4 only","2 மற்றும் 4 மட்டும்"],["4 only","4 மட்டும்"]],"ans":3,"exp":["Dayananda Saraswati founded the Arya Samaj at Bombay in 1875.","தயானந்த சரசுவதி 1875-இல் பம்பாயில் ஆரிய சமாஜத்தைத் தொடங்கினார்."],"level":"M","n":53},{"topic":"Muslim League","typ":"single","stem":["The Lucknow Pact (1916) between the Congress and the Muslim League was concluded during the Congress session presided over by:","காங்கிரஸ்–முஸ்லிம் லீக் இடையிலான லக்னோ ஒப்பந்தம் (1916), யார் தலைமையில் நடந்த காங்கிரஸ் மாநாட்டில் ஏற்பட்டது?"],"opts":[["Annie Besant","அன்னி பெசன்ட்"],["Ambica Charan Mazumdar","அம்பிகா சரண் மஜும்தார்"],["Bishan Narayan Dar","பிஷன் நாராயண் தர்"],["Madan Mohan Malaviya","மதன் மோகன் மாளவியா"]],"ans":1,"exp":["Ambica Charan Mazumdar presided over the Lucknow session of 1916, where the Moderates and Extremists reunited and the Congress–League pact (Tilak–Jinnah) was made.","1916 லக்னோ மாநாட்டுக்கு அம்பிகா சரண் மஜும்தார் தலைமை வகித்தார்; அங்கு மிதவாதிகளும் தீவிரவாதிகளும் இணைந்தனர்; காங்கிரஸ்–லீக் ஒப்பந்தம் (திலகர்–ஜின்னா) ஏற்பட்டது."],"level":"E","n":54},{"topic":"Marudhu Brothers","typ":"stmt4","intro":["Consider the following statements about the Tiruchirappalli Proclamation (1801):","திருச்சிராப்பள்ளி பிரகடனம் (1801) பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["It was issued by Marudhu Pandiyan and pasted on the walls of the Tiruchirappalli fort and the Srirangam temple.","இது மருது பாண்டியரால் வெளியிடப்பட்டு திருச்சிராப்பள்ளிக் கோட்டைச் சுவர்களிலும் ஸ்ரீரங்கம் கோயிலிலும் ஒட்டப்பட்டது."],["It called upon people of all communities to unite and drive out the British.","ஆங்கிலேயரை விரட்ட அனைத்து சமூக மக்களும் ஒன்றுபட வேண்டுமென அது அழைப்பு விடுத்தது."],["It was issued in 1799, soon after the execution of Kattabomman.","கட்டபொம்மன் தூக்கிலிடப்பட்ட சிறிது காலத்திலேயே, 1799-இல் இது வெளியிடப்பட்டது."],["It condemned the political activities of the Carnatic Nawabs, including Muhammad Ali.","முகமது அலி உள்ளிட்ட கர்நாடக நவாப்களின் அரசியல் செயல்பாடுகளை அது கண்டித்தது."]],"stem":["Which of the statements given above is/are correct?","மேற்கண்ட கூற்றுகளில் எது/எவை சரியானவை?"],"opts":[["2 and 4 only","2 மற்றும் 4 மட்டும்"],["All of the above","மேற்கண்ட அனைத்தும்"],["1, 2 and 4 only","1, 2 மற்றும் 4 மட்டும்"],["4 only","4 மட்டும்"]],"ans":2,"exp":["The proclamation was issued in June 1801 (not 1799) by Marudhu Pandiyan, when the South Indian Rebellion was at its peak.","தென்னிந்தியக் கிளர்ச்சி உச்சத்தில் இருந்தபோது, 1801 ஜூன் மாதத்தில் (1799 அல்ல) மருது பாண்டியரால் இப்பிரகடனம் வெளியிடப்பட்டது."],"level":"M","n":55},{"topic":"Militant Movements","typ":"stmt3","intro":["Consider the following statements about the Chittagong Armoury Raid:","சிட்டகாங் ஆயுதக் கிடங்குத் தாக்குதல் பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["It took place in April 1930 under the leadership of Surya Sen.","1930 ஏப்ரலில் சூர்ய சென் தலைமையில் இது நடைபெற்றது."],["Pritilata Waddedar led an attack on the European Club at Pahartali in 1932.","1932-இல் பஹர்தாலியிலுள்ள ஐரோப்பியர் கிளப்பைத் தாக்கும் குழுவை பிரிதிலதா வாடேதர் வழிநடத்தினார்."],["Surya Sen was hanged in 1931 along with Bhagat Singh.","1931-இல் பகத் சிங்குடன் சூர்ய சென் தூக்கிலிடப்பட்டார்."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["3 only","3 மட்டும்"],["1 and 3 only","1 மற்றும் 3 மட்டும்"],["2 and 3 only","2 மற்றும் 3 மட்டும்"],["2 only","2 மட்டும்"]],"ans":0,"exp":["Surya Sen was hanged in January 1934; Bhagat Singh was hanged on 23 March 1931.","சூர்ய சென் 1934 ஜனவரியில்
