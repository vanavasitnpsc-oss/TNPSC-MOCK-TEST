 (Period)"],["பட்டியல் I (வைசிராய்)","பட்டியல் II (காலம்)"]],"opts":[["a-2, b-1, c-4, d-3","a-2, b-1, c-4, d-3"],["a-4, b-1, c-3, d-2","a-4, b-1, c-3, d-2"],["a-4, b-1, c-2, d-3","a-4, b-1, c-2, d-3"],["a-1, b-4, c-2, d-3","a-1, b-4, c-2, d-3"]],"ans":2,"exp":["Linlithgow 1936–43; Willingdon 1931–36; Wavell 1943–47; Dufferin 1884–88.","லின்லித்கோ 1936–43; வில்லிங்டன் 1931–36; வேவல் 1943–47; டப்ரின் 1884–88."],"level":"M","n":66},{"topic":"Ashe Murder","typ":"stmt3","intro":["Consider the following statements about the murder of Collector Ashe:","கலெக்டர் ஆஷ் கொலை பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["Robert Ashe, Collector of Tirunelveli, was shot by Vanchinathan on 17 June 1911.","திருநெல்வேலி ஆட்சியர் ராபர்ட் ஆஷ், 1911 ஜூன் 17 அன்று வாஞ்சிநாதனால் சுட்டுக் கொல்லப்பட்டார்."],["The incident took place at the Maniyachi railway junction.","இந்நிகழ்வு மணியாச்சி இரயில் சந்திப்பில் நடந்தது."],["Vanchinathan was a native of Madurai and belonged to the Home Rule League.","வாஞ்சிநாதன் மதுரையைச் சேர்ந்தவர்; ஹோம் ரூல் இயக்க உறுப்பினர்."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["1 only","1 மட்டும்"],["2 and 3 only","2 மற்றும் 3 மட்டும்"],["1 and 3 only","1 மற்றும் 3 மட்டும்"],["3 only","3 மட்டும்"]],"ans":3,"exp":["Vanchinathan hailed from Sengottai and belonged to the secret society ‘Bharat Mata Association’; the Home Rule League began only in 1916.","வாஞ்சிநாதன் செங்கோட்டையைச் சேர்ந்தவர்; ‘பாரத மாதா சங்கம்’ என்ற இரகசிய அமைப்பைச் சேர்ந்தவர். ஹோம் ரூல் இயக்கம் 1916-இல்தான் தொடங்கியது."],"level":"M","n":67},{"topic":"Last Phase of National Movement","typ":"stmt4","intro":["Consider the following statements about the Cripps Mission and the Cabinet Mission:","கிரிப்ஸ் தூதுக்குழு, அமைச்சரவைத் தூதுக்குழு பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["Sir Stafford Cripps represented the Labour Party in the War Cabinet.","சர் ஸ்டாஃபோர்டு கிரிப்ஸ் போர் அமைச்சரவையில் தொழிற்கட்சியைப் பிரதிநிதித்துவப்படுத்தினார்."],["The Cabinet Mission (1946) consisted of Pethick-Lawrence, Stafford Cripps and A.V. Alexander.","அமைச்சரவைத் தூதுக்குழுவில் (1946) பெதிக் லாரன்ஸ், ஸ்டாஃபோர்டு கிரிப்ஸ், ஏ.வி. அலெக்சாண்டர் இருந்தனர்."],["The Radcliffe Commission demarcated the boundary between India and Pakistan.","ராட்கிளிப் ஆணையம் இந்தியா–பாகிஸ்தான் எல்லையை வரையறுத்தது."],["The Cabinet Mission was headed by Clement Attlee.","அமைச்சரவைத் தூதுக்குழுவிற்கு கிளமென்ட் அட்லி தலைமை தாங்கினார்."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["1, 2 and 4 only","1, 2 மற்றும் 4 மட்டும்"],["2 and 4 only","2 மற்றும் 4 மட்டும்"],["4 only","4 மட்டும்"],["1 and 4 only","1 மற்றும் 4 மட்டும்"]],"ans":2,"exp":["The Cabinet Mission was headed by Lord Pethick-Lawrence, Secretary of State for India; Attlee was the Prime Minister.","அமைச்சரவைத் தூதுக்குழுவிற்கு இந்தியச் செயலர் பெதிக் லாரன்ஸ் தலைமை தாங்கினார்; அட்லி பிரதமர்."],"level":"D","n":68},{"topic":"Tamil Nadu Contributions","typ":"stmt4","intro":["Consider the following statements about Tamil Nadu’s role in the freedom struggle:","விடுதலைப் போராட்டத்தில் தமிழ்நாட்டின் பங்கு பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["Subramania Bharati edited the Tamil weekly ‘India’, published from Pondicherry.","சுப்பிரமணிய பாரதி புதுச்சேரியிலிருந்து வெளியான ‘இந்தியா’ தமிழ் வார இதழின் ஆசிரியராக இருந்தார்."],["Satyamurti became the Mayor of Madras in 1939.","1939-இல் சத்தியமூர்த்தி சென்னை மேயரானார்."],["Kodi Kaththa Kumaran died in Tiruppur in 1932 while holding the national flag during the Civil Disobedience Movement.","1932 சட்ட மறுப்பு இயக்கத்தின்போது தேசியக் கொடியை ஏந்தியபடி திருப்பூரில் கொடிகாத்த குமரன் உயிர்நீத்தார்."],["Subramania Bharati founded the daily ‘Swadesamitran’ in 1882.","சுப்பிரமணிய பாரதி 1882-இல் ‘சுதேசமித்திரன்’ நாளிதழை நிறுவினார்."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["2 only","2 மட்டும்"],["4 only","4 மட்டும்"],["3 and 4 only","3 மற்றும் 4 மட்டும்"],["2 and 4 only","2 மற்றும் 4 மட்டும்"]],"ans":1,"exp":["Swadesamitran was founded by G. Subramania Iyer in 1882; Bharati worked as its sub-editor.","சுதேசமித்திரனை 1882-இல் ஜி. சுப்பிரமணிய ஐயர் தொடங்கினார்; பாரதி அதன் துணையாசிரியராகப் பணிபுரிந்தார்."],"level":"D","n":69},{"topic":"Acts of British India","typ":"ar","intro":["Read the following Assertion (A) and Reason (R) and choose the correct answer:","கூற்று (A), காரணம் (R) ஆகியவற்றைப் படித்து சரியான விடையைத் தேர்ந்தெடுக்க:"],"A":["The distribution of legislative powers between the Centre and the States in the Indian Constitution is based on the Government of India Act, 1935.","இந்திய அரசியலமைப்பில் மத்திய–மாநில சட்டமியற்றும் அதிகாரப் பகிர்வு 1935 இந்திய அரசுச் சட்டத்தை அடிப்படையாகக் கொண்டது."],"R":["The 1935 Act divided legislative powers into the Federal, Provincial and Concurrent Lists.","1935 சட்டம் சட்டமியற்றும் அதிகாரங்களை மத்திய, மாகாண, பொதுப் பட்டியல்களாகப் பிரித்தது."],"opts":[["Both (A) and (R) are true, and (R) is the correct explanation of (A)","(A), (R) இரண்டும் சரி; மேலும் (R), (A)-க்கு சரியான விளக்கம்"],["Both (A) and (R) are true, but (R) is not the correct explanation of (A)","(A), (R) இரண்டும் சரி; ஆனால் (R), (A)-க்கு சரியான விளக்கம் அல்ல"],["(A) is true, but (R) is false","(A) சரி; ஆனால் (R) தவறு"],["(A) is false, but (R) is true","(A) தவறு; ஆனால் (R) சரி"]],"ans":0,"exp":["The list system originated in the Act of 1935.","பட்டியல் முறை 1935 சட்டத்திலிருந்தே தோன்றியது."],"level":"M","n":70},{"topic":"Puli Thevar","typ":"stmt3","intro":["Consider the following statements about Puli Thevar:","புலித்தேவர் பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["He was the Palayakkarar of Nerkattumseval in the Tirunelveli region.","திருநெல்வேலிப் பகுதியிலுள்ள நெற்கட்டும்செவ்வல் பாளையத்தின் பாளையக்காரர் ஆவார்."],["He sought the help of Hyder Ali and the French against the Nawab of Arcot and the English, but Hyder Ali could not help him as he was engaged in a conflict with the Marathas.","ஆற்காடு நவாப்பிற்கும் ஆங்கிலேயருக்கும் எதிராக ஹைதர் அலி, பிரெஞ்சுக்காரர்களின் உதவியை நாடினார்; ஆனால் மராத்தியருடனான போரில் ஈடுபட்டிருந்ததால் ஹைதர் அலியால் உதவ இயலவில்லை."],["Colonel Heron’s expedition of 1755 crushed his resistance and forced him to pay the arrears of tax.","1755-ஆம் ஆண்டு கர்னல் ஹெரான் மேற்கொண்ட படையெடுப்பு அவரது எதிர்ப்பை நசுக்கி, வரி பாக்கியைச் செலுத்தச் செய்தது."]],"stem":["Which of the statements given above is/are correct?","மேற்கண்ட கூற்றுகளில் எது/எவை சரியானவை?"],"opts":[["All of the above","மேற்கண்ட அனைத்தும்"],["2 only","2 மட்டும்"],["1 and 3 only","1 மற்றும் 3 மட்டும்"],["1 and 2 only","1 மற்றும் 2 மட்டும்"]],"ans":3,"exp":["Puli Thevar of Nerkattumseval sought Hyder Ali and the French, but Hyder was busy with the Marathas. Colonel Heron’s 1755 expedition failed to subdue him.","நெற்கட்டும்செவ்வல் புலித்தேவர் ஹைதர் அலி, பிரெஞ்சுக்காரர்களின் உதவியை நாடினார்; ஹைதர் மராத்தியருடன் போரிட்டதால் உதவ இயலவில்லை. 1755 கர்னல் ஹெரான் படையெடுப்பு அவரை அடக்கத் தவறியது."],"level":"M","n":71},{"topic":"Revenue Reforms","typ":"stmt4","intro":["Consider the following statements about the Permanent Settlement:","நிலையான நிலவரி முறை பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["It was introduced by Lord Cornwallis in 1793 in Bengal, Bihar and Orissa.","1793-இல் கார்ன்வாலிஸ் பிரபு வங்காளம், பீகார், ஒரிசாவில் இதை அறிமுகப்படுத்தினார்."],["Zamindars were recognised as the owners of the land, and the revenue demand was fixed permanently.","ஜமீன்தார்கள் நிலத்தின் உரிமையாளர்களாக அங்கீகரிக்கப்பட்டு, வரித் தொகை நிரந்தரமாக நிர்ணயிக்கப்பட்டது."],["Under the Sunset Law, an estate was auctioned if the zamindar failed to pay the revenue on the due date.","சூரிய அஸ்தமனச் சட்டப்படி, குறித்த நாளில் வரி செலுத்தத் தவறிய ஜமீன்தாரின் நிலம் ஏலம் விடப்பட்டது."],["The cultivating tenants were made the legal owners of the land.","பயிரிடும் குத்தகைதாரர்கள் நிலத்தின் சட்டப்பூர்வ உரிமையாளர்களாக ஆக்கப்பட்டனர்."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["2 and 4 only","2 மற்றும் 4 மட்டும்"],["4 only","4 மட்டும்"],["1 and 4 only","1 மற்றும் 4 மட்டும்"],["1 only","1 மட்டும்"]],"ans":1,"exp":["Tenants were reduced to the status of mere tenants-at-will; ownership was vested in zamindars.","குத்தகைதாரர்கள் உரிமையற்ற குத்தகையாளர்களாகவே இருந்தனர்; உரிமை ஜமீன்தார்களுக்கே வழங்கப்பட்டது."],"level":"D","n":72},{"topic":"Last Phase of National Movement","typ":"chrono","intro":["Arrange the following in chronological order (earliest first):","பின்வருவனவற்றை கால வரிசைப்படி (முந்தையது முதலில்) அமைக்க:"],"items":[["Quit India Movement","வெள்ளையனே வெளியேறு இயக்கம்"],["Shimla Conference","சிம்லா மாநாடு"],["Poona Pact","பூனா ஒப்பந்தம்"],["Cabinet Mission","அமைச்சரவைத் தூதுக்குழு"]],"opts":[["IV, I, II, III","IV, I, II, III"],["III, I, II, IV","III, I, II, IV"],["II, I, III, IV","II, I, III, IV"],["III, IV, II, I","III, IV, II, I"]],"ans":1,"exp":["Poona Pact (1932) → Quit India (1942) → Shimla Conference (1945) → Cabinet Mission (1946).","பூனா ஒப்பந்தம் (1932) → வெள்ளையனே வெளியேறு (1942) → சிம்லா மாநாடு (1945) → அமைச்சரவைத் தூதுக்குழு (1946)."],"level":"M","n":73},{"topic":"Swadeshi Movement","typ":"stmt4","intro":["Consider the following statements about the Swadeshi and Boycott Movement:","சுதேசி, புறக்கணிப்பு இயக்கம் பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["The Partition of Bengal came into effect on 16 October 1905.","1905 அக்டோபர் 16 அன்று வங்கப் பிரிவினை நடைமுறைக்கு வந்தது."],["The Boycott resolution was adopted at the Calcutta Town Hall on 7 August 1905.","1905 ஆகஸ்ட் 7 அன்று கல்கத்தா டவுன் ஹாலில் புறக்கணிப்புத் தீர்மானம் நிறைவேற்றப்பட்டது."],["On the day the Partition came into effect, Rabindranath Tagore popularised Rakhi Bandhan as a symbol of Hindu–Muslim unity.","பிரிவினை நடைமுறைக்கு வந்த நாளில் இந்து–முஸ்லிம் ஒற்றுமையின் அடையாளமாக இரவீந்திரநாத் தாகூர் ராக்கி கட்டும் நிகழ்வைப் பரப்பினார்."],["The Bengal National College was established in 1911.","வங்காள தேசியக் கல்லூரி 1911-இல் நிறுவப்பட்டது."]],"stem":["How many of the statements given above are correct?","மேற்கண்ட கூற்றுகளில் எத்தனை சரியானவை?"],"opts":[["Only one","ஒன்று மட்டும்"],["Only two","இரண்டு மட்டும்"],["Only three","மூன்று மட்டும்"],["All four","நான்கும்"]],"ans":2,"exp":["Three are correct. The Bengal National College was founded in 1906 (Aurobindo Ghose as principal).","மூன்று சரி. வங்காள தேசியக் கல்லூரி 1906-இல் நிறுவப்பட்டது (முதல்வர் அரவிந்த கோஷ்)."],"level":"D","n":74},{"topic":"V.O. Chidambaranar","typ":"single","stem":["Which one of the following works was written by V.O. Chidambaranar?","பின்வருவனவற்றுள் வ.உ. சிதம்பரனார் எழுதிய நூல் எது?"],"opts":[["Meyyaram","மெய்யறம்"],["Thiruvarutpa","திருவருட்பா"],["Jeeviya Saritha Surukkam","ஜீவிய சரித சுருக்கம்"],["Panchali Sapatham","பாஞ்சாலி சபதம்"]],"ans":0,"exp":["‘Meyyaram’ (a work on righteous conduct) is by VOC. Thiruvarutpa is by Ramalinga Adigal, ‘Jeeviya Saritha Surukkam’ by Rettaimalai Srinivasan and ‘Panchali Sapatham’ by Subramania Bharati.","‘மெய்யறம்’ (அறநெறி நூல்) வ.உ.சி. எழுதியது. திருவருட்பா இராமலிங்க அடிகளுடையது; ‘ஜீவிய சரித சுருக்கம்’ இரட்டைமலை சீனிவாசனுடையது; ‘பாஞ்சாலி சபதம்’ பாரதியாருடையது."],"level":"E","n":75},{"topic":"Revolutionary Movements","typ":"chrono","intro":["Arrange the following in chronological order (earliest first):","பின்வருவனவற்றை கால வரிசைப்படி (முந்தையது முதலில்) அமைக்க:"],"items":[["Chittagong Armoury Raid","சிட்டகாங் ஆயுதக் கிடங்குத் தாக்குதல்"],["Alipore Bomb Case","அலிப்பூர் குண்டுவெடிப்பு வழக்கு"],["Bomb in the Central Legislative Assembly","மத்திய சட்டமன்றத்தில் குண்டுவீச்சு"],["Kakori Train Robbery","ககோரி இரயில் கொள்ளை"]],"opts":[["II, IV, III, I","II, IV, III, I"],["II, I, III, IV","II, I, III, IV"],["II, III, IV, I","II, III, IV, I"],["III, IV, II, I","III, IV, II, I"]],"ans":0,"exp":["Alipore (1908) → Kakori (1925) → Assembly bomb (1929) → Chittagong (1930).","அலிப்பூர் (1908) → ககோரி (1925) → சட்டமன்றக் குண்டுவீச்சு (1929) → சிட்டகாங் (1930)."],"level":"M","n":76},{"topic":"Periyar","typ":"single","stem":["Which English weekly was started by Periyar in 1928?","1928-இல் பெரியார் தொடங்கிய ஆங்கில வார இதழ் எது?"],"opts":[["The Hindu","தி இந்து"],["Justice","ஜஸ்டிஸ்"],["Revolt","ரிவோல்ட்"],["New India","நியூ இந்தியா"]],"ans":2,"exp":["‘Revolt’ (1928) was Periyar’s English weekly.","‘ரிவோல்ட்’ (1928) பெரியாரின் ஆங்கில வார இதழ்."],"level":"E","n":77},{"topic":"B.R. Ambedkar","typ":"stmt5","intro":["Consider the following statements about B.R. Ambedkar:","பி.ஆர். அம்பேத்கர் பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["He started the Marathi weekly ‘Mooknayak’ in 1920.","1920-இல் ‘மூக்நாயக்’ என்ற மராத்தி வார இதழைத் தொடங்கினார்."],["He founded the Bahishkrit Hitakarini Sabha in 1924.","1924-இல் பகிஷ்கிருத் ஹிதகாரிணி சபையை நிறுவினார்."],["He led the Mahad Satyagraha in 1927 for the right to use water from the Chavdar Tank.","1927-இல் சவ்தார் குளத்து நீரைப் பயன்படுத்தும் உரிமைக்காக மகாத் சத்தியாகிரகத்தை வழிநடத்தினார்."],["He founded the Independent Labour Party in 1932.","1932-இல் சுதந்திர தொழிலாளர் கட்சியை நிறுவினார்."],["He embraced Buddhism at Nagpur in 1956.","1956-இல் நாக்பூரில் பௌத்தத்தைத் தழுவினார்."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["2 and 4 only","2 மற்றும் 4 மட்டும்"],["4 only","4 மட்டும்"],["5 only","5 மட்டும்"],["4 and 5 only","4 மற்றும் 5 மட்டும்"]],"ans":1,"exp":["The Independent Labour Party was founded in 1936; in 1932 he signed the Poona Pact.","சுதந்திர தொழிலாளர் கட்சி 1936-இல் நிறுவப்பட்டது; 1932-இல் அவர் பூனா ஒப்பந்தத்தில் கையெழுத்திட்டார்."],"level":"D","n":78},{"topic":"1857 Revolt","typ":"stmt4","intro":["Consider the following statements about the Revolt of 1857:","1857 புரட்சி பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["The use of Enfield rifle cartridges greased with animal fat was the immediate cause.","விலங்குக் கொழுப்பு தடவிய என்ஃபீல்டு துப்பாக்கித் தோட்டாக்கள் உடனடிக் காரணமாக அமைந்தன."],["The sepoys at Meerut revolted on 10 May 1857 and marched to Delhi.","1857 மே 10 அன்று மீரட் சிப்பாய்கள் கலகம் செய்து டெல்லிக்குச் சென்றனர்."],["They proclaimed Bahadur Shah II as the Emperor of India.","அவர்கள் இரண்டாம் பகதூர் ஷாவை இந்தியப் பேரரசராக அறிவித்தனர்."],["The Revolt resulted in the Government of India Act of 1935 ending Company rule.","இப்புரட்சியின் விளைவாக 1935 இந்திய அரசுச் சட்டம் கம்பெனி ஆட்சியை முடிவுக்குக் கொண்டுவந்தது."]],"stem":["Which of the statements given above is/are correct?","மேற்கண்ட கூற்றுகளில் எது/எவை சரியானவை?"],"opts":[["2 and 3 only","2 மற்றும் 3 மட்டும்"],["1, 2 and 3 only","1, 2 மற்றும் 3 மட்டும்"],["2, 3 and 4 only","2, 3 மற்றும் 4 மட்டும்"],["1 and 2 only","1 மற்றும் 2 மட்டும்"]],"ans":1,"exp":["Company rule ended with the Government of India Act of 1858 and Queen Victoria’s Proclamation of 1 November 1858.","1858 இந்திய அரசுச் சட்டம், 1858 நவம்பர் 1 விக்டோரியா அறிவிப்பு மூலம் கம்பெனி ஆட்சி முடிவுற்றது."],"level":"M","n":79},{"topic":"Muthulakshmi Reddy","typ":"single","stem":["Which one of the following statements about Dr. Muthulakshmi Reddy is correct?","டாக்டர் முத்துலட்சுமி ரெட்டி பற்றிய பின்வரும் கூற்றுகளில் சரியானது எது?"],"opts":[["She became the first woman Speaker of the Madras Legislative Assembly.","சென்னை சட்டமன்றத்தின் முதல் பெண் பேரவைத் தலைவராக (Speaker) ஆனார்."],["She was elected unanimously as the Deputy President of the Madras Legislative Council.","சென்னை சட்ட மேலவையின் துணைத் தலைவராக (Deputy President) ஒருமனதாகத் தேர்ந்தெடுக்கப்பட்டார்."],["She served as the first woman Mayor of the Madras Corporation.","சென்னை மாநகராட்சியின் முதல் பெண் மேயராகப் பணியாற்றினார்."],["She was nominated to the Imperial Legislative Council at Delhi.","டெல்லியிலுள்ள மத்திய சட்ட மேலவைக்கு (Imperial Legislative Council) நியமிக்கப்பட்டார்."]],"ans":1,"exp":["Nominated to the Madras Legislative Council as the first woman legislator in India, she was elected its Deputy President; she was also the first Alderwoman (not Mayor) of the Madras Corporation.","இந்தியாவின் முதல் பெண் சட்டமன்ற உறுப்பினராக சென்னை சட்ட மேலவைக்கு நியமிக்கப்பட்ட அவர் அதன் துணைத் தலைவராகத் தேர்வானார்; சென்னை மாநகராட்சியின் முதல் பெண் ஆல்டர்மேன் (மேயர் அல்ல) ஆவார்."],"level":"E","n":80},{"topic":"Iyothee Thassar","typ":"single","stem":["Which one of the following statements about Pandit Iyothee Thassar is correct?","பண்டிதர் அயோத்திதாசர் பற்றிய பின்வரும் கூற்றுகளில் சரியானது எது?"],"opts":[["He founded the Madras Dravidian Association in 1912.","1912-இல் சென்னை திராவிடர் சங்கத்தைத் தோற்றுவித்தார்."],["He edited the Tamil daily ‘Swadesamitran’.","‘சுதேசமித்திரன்’ தமிழ் நாளிதழின் ஆசிரியராக இருந்தார்."],["His original name was Kathavarayan.","அவரது இயற்பெயர் காத்தவராயன்."],["He started the English weekly ‘Revolt’ in 1928.","1928-இல் ‘ரிவோல்ட்’ என்ற ஆங்கில வார இதழைத் தொடங்கினார்."]],"ans":2,"exp":["Kathavarayan took the name Iyothee Thassar. The Madras Dravidian Association was C. Natesa Mudaliar’s, ‘Revolt’ was Periyar’s and ‘Swadesamitran’ was G. Subramania Iyer’s.","காத்தவராயனே அயோத்திதாசர் எனப் பெயர் பெற்றார். சென்னை திராவிடர் சங்கம் சி. நடேச முதலியாருடையது; ‘ரிவோல்ட்’ பெரியாருடையது; ‘சுதேசமித்திரன்’ ஜி. சுப்பிரமணிய ஐயருடையது."],"level":"E","n":81},{"topic":"Viceroys","typ":"stmt4","intro":["Consider the following statements about the Viceroys:","வைசிராய்கள் பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["Lord Lytton held the Delhi Durbar of 1877 and passed the Vernacular Press Act.","லிட்டன் பிரபு 1877 டெல்லி தர்பாரை நடத்தி, வட்டார மொழிப் பத்திரிகைச் சட்டத்தை நிறைவேற்றினார்."],["A bomb was thrown at Lord Hardinge at Chandni Chowk, Delhi, in December 1912.","1912 டிசம்பரில் டெல்லி சாந்தினி சௌக்கில் ஹார்டிஞ்ச் பிரபு மீது குண்டு வீசப்பட்டது."],["Lord Kitchener was appointed Commander-in-Chief in India in 1902 during Curzon’s term.","கர்சன் காலத்தில் 1902-இல் கிச்சனர் இந்தியத் தலைமைத் தளபதியாக நியமிக்கப்பட்டார்."],["Lord Mayo passed the Arms Act of 1878.","1878 ஆயுதச் சட்டத்தை மேயோ பிரபு நிறைவேற்றினார்."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["1 only","1 மட்டும்"],["3 and 4 only","3 மற்றும் 4 மட்டும்"],["2 and 4 only","2 மற்றும் 4 மட்டும்"],["4 only","4 மட்டும்"]],"ans":3,"exp":["The Arms Act of 1878 was passed under Lord Lytton; Lord Mayo (1869–72) was assassinated in the Andamans.","1878 ஆயுதச் சட்டம் லிட்டன் காலத்தில்; மேயோ பிரபு (1869–72) அந்தமானில் கொலை செய்யப்பட்டார்."],"level":"D","n":82},{"topic":"Rajaji","typ":"stmt5","intro":["Consider the following statements about C. Rajagopalachari (Rajaji):","சி. இராஜகோபாலாச்சாரி (இராஜாஜி) பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["He led the Salt Satyagraha march of 1930 from Madurai to Vedaranyam.","1930 உப்புச் சத்தியாகிரகப் பேரணியை மதுரையிலிருந்து வேதாரண்யம் வரை வழிநடத்தினார்."],["As Premier of Madras, he introduced prohibition in Salem district in 1937.","சென்னை பிரதமராக 1937-இல் சேலம் மாவட்டத்தில் மதுவிலக்கை அறிமுகப்படுத்தினார்."],["His ministry passed the Temple Entry Authorisation and Indemnity Act in 1939.","அவரது அமைச்சரவை 1939-இல் ஆலய நுழைவு அதிகாரமளிப்பு மற்றும் இழப்பீட்டுச் சட்டத்தை நிறைவேற்றியது."],["He introduced the Madras General Sales Tax Act in 1939.","1939-இல் சென்னை பொது விற்பனை வரிச் சட்டத்தை அறிமுகப்படுத்தினார்."],["He became the Governor-General of India in 1948, succeeding Lord Mountbatten.","1948-இல் மவுண்ட்பேட்டனுக்குப் பின் இந்தியாவின் கவர்னர் ஜெனரலானார்."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["1 only","1 மட்டும்"],["1 and 3 only","1 மற்றும் 3 மட்டும்"],["1, 3 and 5 only","1, 3 மற்றும் 5 மட்டும்"],["1 and 2 only","1 மற்றும் 2 மட்டும்"]],"ans":0,"exp":["The 1930 march started from Tiruchirappalli (13 April 1930) and ended at Vedaranyam.","1930 பேரணி திருச்சிராப்பள்ளியில் (ஏப். 13) தொடங்கி வேதாரண்யத்தில் முடிந்தது."],"level":"D","n":83},{"topic":"Justice Party","typ":"stmt4","intro":["Consider the following statements about the Justice Party:","நீதிக்கட்சி பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["The South Indian Liberal Federation was founded in November 1916 by T.M. Nair, P. Theagaraya Chetty and C. Natesa Mudaliar.","தென்னிந்திய நலஉரிமைச் சங்கம் 1916 நவம்பரில் டி.எம். நாயர், பி. தியாகராய செட்டி, சி. நடேச முதலியார் ஆகியோரால் தொடங்கப்பட்டது."],["Theagaraya Chetty issued the ‘Non-Brahmin Manifesto’ in December 1916.","1916 டிசம்பரில் தியாகராய செட்டி ‘பிராமணரல்லாதார் அறிக்கை’யை வெளியிட்டார்."],["A. Subbarayalu Reddiar became the first Chief Minister (Premier) of the Justice Party government in 1920.","1920-இல் நீதிக்கட்சி அரசின் முதல் முதலமைச்சராக (பிரதமராக) ஏ. சுப்பராயலு ரெட்டியார் பொறுப்பேற்றார்."],["The ‘Lotus’ was the election symbol of the party.","‘தாமரை’ கட்சியின் தேர்தல் சின்னமாக இருந்தது."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["3 and 4 only","3 மற்றும் 4 மட்டும்"],["1 and 4 only","1 மற்றும் 4 மட்டும்"],["4 only","4 மட்டும்"],["2 only","2 மட்டும்"]],"ans":2,"exp":["The party’s symbol was the Scale (Tharasu). Subbarayalu Reddiar was the first Premier; Raja of Panagal the second.","கட்சியின் சின்னம் தராசு. சுப்பராயலு ரெட்டியார் முதல் பிரதமர்; பனகல் அரசர் இரண்டாமவர்."],"level":"D","n":84},{"topic":"Kattabomman","typ":"match","intro":["Match List I with List II and select the correct answer using the codes given below:","பட்டியல் I-ஐ பட்டியல் II-உடன் பொருத்தி, கீழ்க்கண்ட குறியீடுகளிலிருந்து சரியான விடையைத் தேர்ந்தெடுக்க:"],"left":[["W.C. Jackson","W.C. ஜாக்சன்"],["Major Bannerman","மேஜர் பானர்மேன்"],["Colonel Agnew","கர்னல் அக்னியூ"],["Colonel Heron","கர்னல் ஹெரான்"]],"right":[["Siege of Panchalankurichi","பாஞ்சாலங்குறிச்சி முற்றுகை"],["Puli Thevar","புலித்தேவர்"],["Collector of Ramanathapuram who summoned Kattabomman","கட்டபொம்மனை வரவழைத்த இராமநாதபுர ஆட்சியர்"],["Marudhu brothers","மருது சகோதரர்கள்"]],"heads":[["List I (British officers)","List II (Associated with)"],["பட்டியல் I (ஆங்கிலேய அதிகாரிகள்)","பட்டியல் II (தொடர்புடையவை)"]],"opts":[["a-3, b-4, c-1, d-2","a-3, b-4, c-1, d-2"],["a-3, b-1, c-4, d-2","a-3, b-1, c-4, d-2"],["a-3, b-2, c-4, d-1","a-3, b-2, c-4, d-1"],["a-1, b-3, c-4, d-2","a-1, b-3, c-4, d-2"]],"ans":1,"exp":["Jackson – Collector of Ramanathapuram; Bannerman – siege of Panchalankurichi; Agnew (with Innes) – Marudhu brothers; Heron – Puli Thevar (1755).","ஜாக்சன் – இராமநாதபுர ஆட்சியர்; பானர்மேன் – பாஞ்சாலங்குறிச்சி முற்றுகை; அக்னியூ (இன்னஸுடன்) – மருது சகோதரர்கள்; ஹெரான் – புலித்தேவர் (1755)."],"level":"M","n":85},{"topic":"Gandhian Phase","typ":"stmt3","intro":["Consider the following statements about the Lahore Session of the Congress (1929):","1929 லாகூர் காங்கிரஸ் மாநாடு பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["It was presided over by Jawaharlal Nehru.","இதற்கு ஜவஹர்லால் நேரு தலைமை தாங்கினார்."],["It passed the resolution of Purna Swaraj (complete independence).","பூரண சுதந்திரத் தீர்மானம் நிறைவேற்றப்பட்டது."],["The tricolour flag was hoisted on the banks of the Ganga at midnight of 31 December 1929.","1929 டிசம்பர் 31 நள்ளிரவில் கங்கைக் கரையில் மூவர்ணக் கொடி ஏற்றப்பட்டது."]],"stem":["Which of the statements given above is/are correct?","மேற்கண்ட கூற்றுகளில் எது/எவை சரியானவை?"],"opts":[["2 only","2 மட்டும்"],["1 and 2 only","1 மற்றும் 2 மட்டும்"],["1 and 3 only","1 மற்றும் 3 மட்டும்"],["All of the above","மேற்கண்ட அனைத்தும்"]],"ans":1,"exp":["The flag was hoisted on the banks of the Ravi at Lahore; 26 January 1930 was observed as Independence Day.","லாகூரில் ராவி நதிக்கரையில் கொடி ஏற்றப்பட்டது; 1930 ஜனவரி 26 சுதந்திர தினமாகக் கொண்டாடப்பட்டது."],"level":"M","n":86},{"topic":"Rajaji","typ":"single","stem":["Which one of the following statements about C. Rajagopalachari (Rajaji) is correct?","சி. இராஜகோபாலாச்சாரி (இராஜாஜி) பற்றிய பின்வரும் கூற்றுகளில் சரியானது எது?"],"opts":[["He was awarded the Bharat Ratna in 1962 for his role in the Swatantra Party.","சுதந்திராக் கட்சியில் ஆற்றிய பணிக்காக 1962-இல் பாரத ரத்னா விருது பெற்றார்."],["He served as the Governor of Bombay before becoming the Governor-General.","ஆளுநர் நாயகமாவதற்கு முன் பம்பாய் மாகாண ஆளுநராகப் பணியாற்றினார்."],["He was the Governor of the Madras Presidency during the Congress ministry of 1937.","1937 காங்கிரஸ் அமைச்சரவைக் காலத்தில் சென்னை மாகாண ஆளுநராக இருந்தார்."],["He was among the first recipients of the Bharat Ratna, in 1954.","1954-ஆம் ஆண்டு பாரத ரத்னா விருது பெற்ற முதல் குழுவினருள் ஒருவர்."]],"ans":3,"exp":["Rajaji (with S. Radhakrishnan and C.V. Raman) received the Bharat Ratna in 1954. He received no award in 1962; he was Premier (not Governor) of Madras in 1937–39 and Governor of West Bengal (1947–48), not of Bombay.","இராஜாஜி (எஸ். இராதாகிருஷ்ணன், சி.வி. இராமனுடன்) 1954-இல் பாரத ரத்னா பெற்றார். 1962-இல் அவர் விருது பெறவில்லை; 1937–39-இல் அவர் சென்னை முதலமைச்சர் (ஆளுநர் அல்ல); மேற்கு வங்க ஆளுநராக (1947–48) இருந்தார், பம்பாய் அல்ல."],"level":"E","n":87},{"topic":"Civil Disobedience Movement","typ":"stmt4","intro":["Consider the following statements about the Gandhi–Irwin Pact (5 March 1931):","காந்தி–இர்வின் ஒப்பந்தம் (1931 மார்ச் 5) பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["The Congress agreed to suspend the Civil Disobedience Movement.","சட்ட மறுப்பு இயக்கத்தை நிறுத்த காங்கிரஸ் ஒப்புக்கொண்டது."],["Political prisoners not guilty of violence were to be released.","வன்முறையில் ஈடுபடாத அரசியல் கைதிகள் விடுவிக்கப்படுவர்."],["People living near the coast were permitted to make salt for domestic use.","கடலோர மக்கள் வீட்டுத் தேவைக்கு உப்பு தயாரிக்க அனுமதிக்கப்பட்டனர்."],["The Government agreed to hold a public enquiry into police excesses.","காவல்துறையின் அத்துமீறல்கள் குறித்து பொது விசாரணை நடத்த அரசு ஒப்புக்கொண்டது."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["3 and 4 only","3 மற்றும் 4 மட்டும்"],["1, 3 and 4 only","1, 3 மற்றும் 4 மட்டும்"],["4 only","4 மட்டும்"],["2 and 4 only","2 மற்றும் 4 மட்டும்"]],"ans":2,"exp":["Irwin refused a public enquiry into police excesses.","காவல்துறை அத்துமீறல் குறித்த பொது விசாரணையை இர்வின் மறுத்துவிட்டார்."],"level":"D","n":88},{"topic":"Dheeran Chinnamalai","typ":"single","stem":["Dheeran Chinnamalai, who fought the British in the Kongu region, was betrayed and captured with the help of his:","கொங்குப் பகுதியில் ஆங்கிலேயரை எதிர்த்துப் போராடிய தீரன் சின்னமலை, யாருடைய துரோகத்தால் பிடிக்கப்பட்டார்?"],"opts":[["brother Kuppuswami","சகோதரர் குப்புசாமி"],["Dewan Purnaiah","திவான் பூர்ணய்யா"],["commander Gopala Nayak","படைத்தலைவர் கோபால நாயக்கர்"],["cook Nallappan","சமையல்காரர் நல்லப்பன்"]],"ans":3,"exp":["Chinnamalai was betrayed by his cook Nallappan and hanged at Sankagiri on 31 July 1805.","சின்னமலை தனது சமையல்காரர் நல்லப்பனால் காட்டிக் கொடுக்கப்பட்டு, 1805 ஜூலை 31 அன்று சங்ககிரியில் தூக்கிலிடப்பட்டார்."],"level":"E","n":89},{"topic":"Newspapers","typ":"chrono","intro":["Arrange the following in chronological order (earliest first):","பின்வருவனவற்றை கால வரிசைப்படி (முந்தையது முதலில்) அமைக்க:"],"items":[["Kesari","கேசரி"],["Indian Opinion","இந்தியன் ஒபினியன்"],["The Hindu","தி இந்து"],["Amrita Bazar Patrika","அமிர்த பஜார் பத்திரிகா"]],"opts":[["IV, I, III, II","IV, I, III, II"],["IV, III, II, I","IV, III, II, I"],["I, III, IV, II","I, III, IV, II"],["IV, III, I, II","IV, III, I, II"]],"ans":3,"exp":["Amrita Bazar Patrika (1868) → The Hindu (1878) → Kesari (1881) → Indian Opinion (1903).","அமிர்த பஜார் பத்திரிகா (1868) → தி இந்து (1878) → கேசரி (1881) → இந்தியன் ஒபினியன் (1903)."],"level":"M","n":90},{"topic":"Rettaimalai Srinivasan","typ":"stmt3","intro":["Consider the following statements about Rettaimalai Srinivasan:","ரெட்டைமலை சீனிவாசன் பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["He founded the Paraiyar Mahajana Sabha in 1893, which later became the Adi Dravida Mahajana Sabha.","1893-இல் பறையர் மகாஜன சபையைத் தொடங்கினார்; அது பின்னர் ஆதிதிராவிட மகாஜன சபையாக மாறியது."],["He wrote the book ‘The Oppressed Hindus’.","‘ஒடுக்கப்பட்ட இந்துக்கள்’ (The Oppressed Hindus) என்ற நூலை எழுதினார்."],["He was h em":["How many of the statements given above are correct?","மேற்கண்ட கூற்றுகளில் எத்தனை சரியானவை?"],"opts":[["Only one","ஒன்று மட்டும்"],["Only two","இரண்டு மட்டும்"],["Only three","மூன்று மட்டும்"],["All four","நான்கும்"]],"ans":2,"exp":["Three statements are correct. The rebels hoisted the Mysore (Tipu Sultan’s) flag, not that of the Nawab of Arcot.","மூன்று கூற்றுகள் சரி. கலகக்காரர்கள் ஏற்றியது மைசூர் (திப்பு சுல்தான்) கொடி; ஆற்காடு நவாப்பின் கொடி அல்ல."],"level":"D","n":104},{"topic":"Gandhian Phase","typ":"stmt4","intro":["Consider the following statements about the Rowlatt Act and the Jallianwala Bagh massacre:","ரௌலட் சட்டம், ஜாலியன்வாலா பாக் படுகொலை பற்றிய பின்வரும் கூற்றுகளைக் கருதுக:"],"items":[["The Rowlatt Act (March 1919) permitted detention without trial.","ரௌலட் சட்டம் (மார்ச் 1919) விசாரணையின்றி சிறையிலடைக்க அனுமதித்தது."],["Gandhi called for a nationwide hartal on 6 April 1919.","1919 ஏப்ரல் 6 அன்று நாடு தழுவிய ஹர்த்தாலுக்கு காந்தி அழைப்பு விடுத்தார்."],["The massacre at Amritsar occurred on 13 April 1919 under the orders of General Dyer.","அமிர்தசரசில் 1919 ஏப்ரல் 13 அன்று ஜெனரல் டயரின் ஆணையால் படுகொலை நடந்தது."],["The Hunter Committee to enquire into the massacre was appointed by Lord Curzon.","படுகொலையை விசாரிக்க ஹண்டர் குழுவை கர்சன் பிரபு நியமித்தார்."]],"stem":["Which of the statements given above is/are incorrect?","மேற்கண்ட கூற்றுகளில் எது/எவை தவறானவை?"],"opts":[["4 only","4 மட்டும்"],["1 only","1 மட்டும்"],["2 and 4 only","2 மற்றும் 4 மட்டும்"],["1 and 4 only","1 மற்றும் 4 மட்டும்"]],"ans":0,"exp":["The Hunter Committee (1919) was appointed by the Government under Viceroy Lord Chelmsford; Curzon had left India in 1905.","ஹண்டர் குழு (1919) வைசிராய் செம்ஸ்போர்டு பிரபு அரசால் நியமிக்கப்பட்டது; கர்சன் 1905-லேயே விலகிவிட்டார்."],"level":"D","n":105},{"topic":"Justice Party","typ":"ar","intro":["Read the following Assertion (A) and Reason (R) and choose the correct answer:","கூற்று (A), காரணம் (R) ஆகியவற்றைப் படித்து சரியான விடையைத் தேர்ந்தெடுக்க:"],"A":["The Communal G.O. of 1921 provided reservation of government jobs for non-Brahmin communities.","1921 வகுப்புவாரி அரசாணை பிராமணரல்லாத சமூகங்களுக்கு அரசுப் பணிகளில் இடஒதுக்கீடு வழங்கியது."],"R":["The Justice Party believed that Brahmins dominated administrative services and education in the Madras Presidency.","சென்னை மாகாண நிர்வாகப் பணிகளிலும் கல்வியிலும் பிராமணர்கள் ஆதிக்கம் செலுத்தியதாக நீதிக்கட்சி கருதியது."],"opts":[["Both (A) and (R) are true, and (R) is the correct explanation of (A)","(A), (R) இரண்டும் சரி; மேலும் (R), (A)-க்கு சரியான விளக்கம்"],["Both (A) and (R) are true, but (R) is not the correct explanation of (A)","(A), (R) இரண்டும் சரி; ஆனால் (R), (A)-க்கு சரியான விளக்கம் அல்ல"],["(A) is true, but (R) is false","(A) சரி; ஆனால் (R) தவறு"],["(A) is false, but (R) is true","(A) தவறு; ஆனால் (R) சரி"]],"ans":0,"exp":["The G.O. (16 Sept 1921) divided posts 5:2:2:2:1 among non-Brahmins, Brahmins, Muslims, Anglo-Indians/Christians and Depressed classes.","அரசாணை (1921 செப். 16) பணிகளைப் பிராமணரல்லாதார், பிராமணர், முஸ்லிம், ஆங்கிலோ-இந்தியர்/கிறிஸ்தவர், தாழ்த்தப்பட்டோர் என 5:2:2:2:1 எனப் பகிர்ந்தது."],"level":"M","n":106},{"topic":"Early Uprisings","typ":"pairs","intro":["Consider the following pairs of rebellions and their regions:","கிளர்ச்சிகளும் அவை நடந்த பகுதிகளும் அடங்கிய பின்வரும் இணைகளைக் கருதுக:"],"rows":[["Rampa Rebellion (1922–24)","ராம்பா கிளர்ச்சி (1922–24)","Andhra region – Alluri Sitarama Raju","ஆந்திரப் பகுதி – அல்லூரி சீதாராம ராஜு"],["Pagal Panthi uprising","பாகல் பந்தி கிளர்ச்சி","Bengal – Karam Shah and Tipu Shah","வங்காளம் – கரம் ஷா, திப்பு ஷா"],["Kol Uprising (1831–32)","கோல் கிளர்ச்சி (1831–32)","Chotanagpur region","சோட்டாநாக்பூர் பகுதி"],["Moplah Rebellion (1921)","மோப்ளா கிளர்ச்சி (1921)","Gujarat","குஜராத்"]],"heads":[["Rebellion","Region / Leader"],["கிளர்ச்சி","பகுதி / தலைவர்"]],"stem":["Which of the pairs given above is/are wrongly matched?","மேற்கண்ட இணைகளில் எது/எவை தவறாகப் பொருந்தியுள்ளன?"],"opts":[["1 only","1 மட்டும்"] function render(){
  clearInterval(tickH);
  if(view==='home')drawHome();else if(view==='test'){drawTest();tickH=setInterval(tick,250)}else if(view==='result')drawResult();
}
function drawHome(){
  const p=store.profile,c=store.current;
  let h='<div class="wrap"><div class="hero"><h1>TNPSC History Mock Test – Std 10, Units 5–10</h1><div class="mut">இந்திய தேசிய இயக்கம் & தமிழ்நாடு – 125 வினாக்கள் | 100 நிமிடங்கள்</div>'+
   '<div class="chips"><span class="chip">125 Questions / வினாக்கள்</span><span class="chip">100 Minutes / நிமிடங்கள்</span><span class="chip">Bilingual / தமிழ் + English</span><span class="chip">Pause button / இடைநிறுத்தம்</span></div></div>';
  if(c){h+='<div class="card" style="border-color:#d98a00;background:#fff9ea"><h2>In-progress test found / பாதியில் உள்ள தேர்வு</h2><div>'+esc(modeName(c.mode))+' – '+Object.keys(c.answers).length+' / '+c.qids.length+' answered • Time left / மீதமுள்ள நேரம்: <b>'+fmtH(c.remMs)+'</b></div><div class="row" style="margin-top:10px"><button class="btn pri" data-act="resumeTest">Continue / தொடர்க</button><button class="btn bad" data-act="discard">Discard / நீக்கு</button></div></div>'}
  h+='<div class="grid2"><div class="card"><h2>Start the test / தேர்வைத் தொடங்குக</h2>'+
   '<label class="f" for="nm">Name / பெயர்</label><input id="nm" type="text" autocomplete="name" value="'+esc(p.name||'')+'" placeholder="Your full name">'+
   '<label class="f" for="mb">Mobile number / கைபேசி எண்</label><input id="mb" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" value="'+esc(p.mobile||'')+'" placeholder="10-digit mobile number">'+
   '<div class="err" id="err"></div><div class="row"><button class="btn pri" data-act="start">Start Test / தேர்வைத் தொடங்கு</button></div></div>'+
   '<div class="card"><h2>Instructions / அறிவுரைகள்</h2><ul class="ins"><li>125 questions, 100 minutes. Each question carries 1 mark; no negative marking.<br><span class="ta">125 வினாக்கள், 100 நிமிடங்கள்; ஒவ்வொன்றும் 1 மதிப்பெண்; எதிர்மறை மதிப்பெண் இல்லை.</span></li>'+
   '<li>Use <b>Pause</b> any time; questions stay hidden and the clock stops.<br><span class="ta"><b>இடை (Pause)</b> பொத்தானால் நேரம் நிற்கும்; வினாக்கள் மறைக்கப்படும்.</span></li>'+
   '<li>The test auto-submits when time is up. Progress is saved automatically on this device; reopening the page resumes it.<br><span class="ta">நேரம் முடிந்ததும் தானாகச் சமர்ப்பிக்கப்படும். முன்னேற்றம் இச்சாதனத்தில் தானாகச் சேமிக்கப்படும்; பக்கத்தை மீண்டும் திறந்தால் தொடரலாம்.</span></li>'+
   '<li>Time spent on each question is shown while you attempt and in the result.<br><span class="ta">ஒவ்வொரு வினாவிற்கும் செலவிட்ட நேரம் தேர்விலும் முடிவிலும் காட்டப்படும்.</span></li></ul></div></div>';
  if(store.attempts.length){h+='<div class="card hist"><h2>Saved tests / சேமிக்கப்பட்ட தேர்வுகள்</h2>'+store.attempts.map(a=>'<div class="it"><div><b>'+a.r+' / '+a.total+'</b> • '+esc(modeName(a.mode))+'<div class="mut">'+new Date(a.submittedAt).toLocaleString()+' • '+esc(a.profile.name||'')+'</div></div><div class="row"><button class="btn sm" data-act="view" data-id="'+a.id+'">View / பார்</button><button class="btn sm" data-act="pdf" data-id="'+a.id+'">PDF</button><button class="btn sm" data-act="retake" data-id="'+a.id+'" data-m="full">Retake full</button>'+(a.w+a.u?'<button class="btn sm warn" data-act="retake" data-id="'+a.id+'" data-m="wu">Retake wrong + unanswered</button>':'')+'<button class="btn sm bad" data-act="del" data-id="'+a.id+'">✕</button></div></div>').join('')+'</div>'}
  h+=footer+'</div>';
  $('app').innerHTML=h;
}
function palHTML(c){
  return '<div class="pal">'+c.qids.map((id,i)=>{let k='';if(c.marked[id])k='mk';else if(c.answers[id]!==undefined)k='ans';else if(c.visited[id])k='vis';
    return '<div class="pb '+k+(i===c.cur?' cur':'')+'" data-act="goto" data-i="'+i+'">'+(i+1)+'<small>'+fmt(c.times[id]||0)+'</small></div>'}).join('')+'</div>'+
    '<div class="leg"><span><i style="background:#d3f0de"></i>Answered / விடை</span><span><i style="background:#fde3d8"></i>Not answered / விடையில்லை</span><span><i style="background:#e8dbf6"></i>Marked / குறி</span><span><i style="background:#eceff0"></i>Not visited / பார்க்கவில்லை</span></div>';
}
function drawTest(top){
  const c=store.current;if(!c){view='home';render();return}
  const q=curQ(),id=q.n,sel=c.answers[id];
  const answered=Object.keys(c.answers).length;
  let h='<div class="hdr"><div class="ttl">'+esc(modeName(c.mode).split(' / ')[0])+' • '+answered+'/'+c.qids.length+'</div><div class="timer" id="timer">'+fmtH(c.remMs)+'</div>'+
   '<div class="row"><button class="btn" data-act="pause">Pause / இடை</button><button class="btn" data-act="pal" id="palbtn">▦</button><button class="btn pri" data-act="submit">Submit</button></div></div>';
  h+='<div class="wrap"><div class="layout"><div><div class="card"><div class="qhead"><span class="qno">Q '+(c.cur+1)+' / '+c.qids.length+'</span><span class="qt">⏱ <span id="qtime">'+fmt(c.times[id]||0)+'</span></span></div>'+qBody(q)+
   '<div class="opts">'+q.opts.map((o,i)=>optHTML(q,i,sel===i?'sel':'','data-act="opt" data-i="'+i+'"')).join('')+'</div>'+
   '<div class="nav"><button class="btn" data-act="prev"'+(c.cur===0?' disabled':'')+'>◀ Prev</button><button class="btn" data-act="clear">Clear / அழி</button><button class="btn warn" data-act="mark">'+(c.marked[id]?'Unmark / குறியை நீக்கு':'Mark for review / குறியிடு')+'</button><button class="btn pri" data-act="next"'+(c.cur===c.qids.length-1?' disabled':'')+'>Next ▶</button></div></div></div>'+
   '<div class="card palwrap" id="palwrap"><h2>Question palette / வினா பட்டியல்</h2>'+palHTML(c)+'<div class="row" style="margin-top:10px"><button class="btn sm" data-act="pal">Close / மூடு</button></div></div></div>'+footer+'</div>';
  if(c.paused){h+='<div class="overlay"><div class="box"><div style="display:flex;gap:12px;justify-content:center;margin-bottom:10px"><span style="width:16px;height:54px;background:#fff;border-radius:3px"></span><span style="width:16px;height:54px;background:#fff;border-radius:3px"></span></div><h1 style="color:#fff">Test paused / தேர்வு இடைநிறுத்தப்பட்டது</h1><p>'+(c.autoPaused?'Your progress was restored. / உங்கள் முன்னேற்றம் மீட்கப்பட்டது.<br>':'')+'Time left / மீதமுள்ள நேரம்: <b>'+fmtH(c.remMs)+'</b><br>Answered / விடையளித்தவை: <b>'+answered+'</b> of '+c.qids.length+'</p><button class="btn pri" style="background:#fff;color:#14573a;font-size:1.1rem" data-act="resume">▶ Resume / தொடர்க</button><p class="mut" style="color:#bfe3d0;margin-top:14px">'+esc(META.foot)+'</p></div></div>'}
  const st=top?0:window.scrollY;$('app').innerHTML=h;window.scrollTo(0,st);
  const pw=$('palwrap');if(pw&&window._palOpen&&window.innerWidth<=900)pw.classList.add('open');
}
function showModal(html){closeModal();const d=document.createElement('div');d.className='modalbg';d.id='modalbg';d.innerHTML='<div class="modal">'+html+'</div>';document.body.appendChild(d)}
function closeModal(){const m=$('modalbg');if(m)m.remove()}
function submitModal(){
  const c=store.current,a=Object.keys(c.answers).length,m=Object.keys(c.marked).length;
  showModal('<h2>Submit test? / சமர்ப்பிக்கவா?</h2><div class="stats"><div class="stat g"><b>'+a+'</b>Answered / விடையளித்தவை</div><div class="stat o"><b>'+(c.qids.length-a)+'</b>Unanswered / விடையளிக்காதவை</div><div class="stat"><b>'+m+'</b>Marked / குறியிட்டவை</div></div><div class="mut">Time left / மீதமுள்ள நேரம்: '+fmtH(c.remMs)+'</div><div class="row" style="margin-top:12px"><button class="btn pri" data-act="confirmSubmit">Yes, submit / ஆம்</button><button class="btn" data-act="closeModal">Back / திரும்பு</button></div>');
}
function drawResult(){
  const a=store.attempts.find(x=>x.id===viewArg);if(!a){view='home';render();return}
  const ev=evaluate(a),pct=a.total?Math.round(a.r*1000/a.total)/10:0;
  const avg=a.total?a.usedMs/a.total:0;
  let h='<div class="wrap"><div class="hero"><div class="mut">'+esc(a.profile.name||'')+' • '+esc(a.profile.mobile||'')+' • '+new Date(a.submittedAt).toLocaleString()+'</div><h1>Result / முடிவு – '+esc(modeName(a.mode))+'</h1>'+
   '<div style="font-size:2.4rem;font-weight:800">'+a.r+' / '+a.total+' <span style="font-size:1.1rem;font-weight:500">('+pct+'%)</span></div>'+(a.auto?'<div class="chip" style="display:inline-block">Auto-submitted at time-up / நேர முடிவில் தானாகச் சமர்ப்பிப்பு</div>':'')+'</div>'+
   '<div class="card"><div class="stats"><div class="stat g"><b>'+a.r+'</b>Right / சரி</div><div class="stat r"><b>'+a.w+'</b>Wrong / தவறு</div><div class="stat o"><b>'+a.u+'</b>Unanswered / விடையிலா</div><div class="stat"><b>'+fmtH(a.usedMs)+'</b>Time taken / எடுத்த நேரம்</div><div class="stat"><b>'+fmt(avg)+'</b>Avg per Q / சராசரி</div><div class="stat"><b>'+a.pauseCount+'</b>Pauses / இடைநிறுத்தம் ('+fmt(a.pausedMs)+')</div></div>'+
   '<div class="row"><button class="btn pri" data-act="retake" data-id="'+a.id+'" data-m="full">↻ Retake full test / முழுத் தேர்வு மீண்டும்</button>'+
   (a.w+a.u?'<button class="btn warn" data-act="retake" data-id="'+a.id+'" data-m="wu">↻ Wrong + Unanswered ('+(a.w+a.u)+')</button>':'')+
   (a.w?'<button class="btn sm warn" data-act="retake" data-id="'+a.id+'" data-m="wrong">Wrong only ('+a.w+')</button>':'')+
   (a.u?'<button class="btn sm warn" data-act="retake" data-id="'+a.id+'" data-m="un">Unanswered only ('+a.u+')</button>':'')+
   '<button class="btn" data-act="pdf" data-id="'+a.id+'">⬇ Download attempted test (PDF)</button><button class="btn" data-act="home">⌂ Home / முகப்பு</button></div></div>';
  const tabs=[['all','All / அனைத்தும்',a.total],['r','Right / சரி',a.r],['w','Wrong / தவறு',a.w],['u','Unanswered / விடையிலா',a.u]];
  h+='<div class="tabs">'+tabs.map(t=>'<button class="tab '+(tabSel===t[0]?'on':'')+'" data-act="tab" data-t="'+t[0]+'">'+t[1]+' ('+t[2]+')</button>').join('')+'</div>';
  const list=a.qids.filter(id=>tabSel==='all'||ev.st[id]===tabSel);
  if(!list.length)h+='<div class="card">Nothing here. / எதுவும் இல்லை.</div>';
  h+=list.map(id=>reviewCard(a,id,ev.st[id])).join('');
  h+=footer+'</div>';$('app').innerHTML=h;
}
function reviewCard(a,id,st,forPrint){
  const q=BYN[id],x=a.answers[id],no=a.qids.indexOf(id)+1;
  const v={r:'<span class="verdict r">Right / சரி</span>',w:'<span class="verdict w">Wrong / தவறு</span>',u:'<span class="verdict u">Unanswered / விடையிலா</span>'}[st];
  let opts=q.opts.map((o,i)=>{let cls='ro';if(i===q.ans)cls+=' right';else if(i===x)cls+=' wrong';return optHTML(q,i,cls,'')}).join('');
  const yours=x===undefined?'—':'ABCD'[x];
  return '<div class="'+(forPrint?'pq':'card')+'"><div class="qhead"><span class="qno">Q '+no+'</span><span>'+v+' <span class="qt">⏱ '+fmt(a.times[id]||0)+'</span></span></div>'+qBody(q)+'<div class="opts">'+opts+'</div>'+
   '<div class="mut" style="margin-top:6px">Your answer / உங்கள் விடை: <b>'+yours+'</b> • Correct / சரியான விடை: <b>'+'ABCD'[q.ans]+'</b></div>'+
   '<div class="expl"><b>Explanation / விளக்கம்:</b>'+bi(q.exp[0],q.exp[1])+'</div></div>';
}
/* ---------- PDF of attempted test ---------- */
function printAttempt(id){
  const a=store.attempts.find(x=>x.id===id);if(!a)return;
  const ev=evaluate(a);
  $('printRoot').innerHTML='<div class="pfoot">'+esc(META.foot)+'</div><div class="ph"><b style="font-size:12pt">'+esc(META.title)+'</b><br>'+esc(a.profile.name||'')+' • '+esc(a.profile.mobile||'')+' • '+new Date(a.submittedAt).toLocaleString()+' • '+esc(modeName(a.mode))+
   '<br><b>Score / மதிப்பெண்: '+a.r+' / '+a.total+'</b> • Right '+a.r+' • Wrong '+a.w+' • Unanswered '+a.u+' • Time taken / எடுத்த நேரம்: '+fmtH(a.usedMs)+'</div><div class="cols">'+a.qids.map(q=>reviewCard(a,q,ev.st[q],true)).join('')+'</div>';
  const old=document.title;document.title=META.fname+'_Attempt';
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');document.title=old;window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  setTimeout(()=>{try{window.print()}catch(e){toast('Use your browser menu → Print → Save as PDF')}if(!('onafterprint' in window))setTimeout(done,1500)},350);
}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,c=store.current;
  switch(act){
    case 'start':{const n=$('nm').value.trim(),m=$('mb').value.replace(/\s+/g,'');
      if(n.length<2){$('err').textContent='Please enter your name / பெயரை உள்ளிடுக';return}
      if(!/^[6-9]\d{9}$/.test(m)){$('err').textContent='Enter a valid 10-digit mobile number / சரியான 10 இலக்க கைபேசி எண்ணை உள்ளிடுக';return}
      store.profile={name:n,mobile:m};startAttempt('full',DATA.map(q=>q.n));break}
    case 'resumeTest':view='test';render();break;
    case 'discard':if(confirm('Discard the in-progress test? / பாதியில் உள்ள தேர்வை நீக்கவா?')){store.current=null;save();render()}break;
    case 'opt':select(+t.dataset.i);break;
    case 'prev':go(c.cur-1);break;case 'next':go(c.cur+1);break;
    case 'goto':window._palOpen=false;go(+t.dataset.i);break;
    case 'clear':clearAns();break;case 'mark':mark();break;
    case 'pause':pause();break;case 'resume':resume();break;
    case 'pal':window._palOpen=!window._palOpen;{const pw=$('palwrap');if(pw)pw.classList.toggle('open',!!window._palOpen)}break;
    case 'submit':tick();submitModal();break;
    case 'confirmSubmit':finish(false);break;
    case 'closeModal':closeModal();break;
    case 'view':view='result';viewArg=t.dataset.id;tabSel='all';render();window.scrollTo(0,0);break;
    case 'tab':tabSel=t.dataset.t;drawResult();break;
    case 'home':view='home';render();window.scrollTo(0,0);break;
    case 'pdf':printAttempt(t.dataset.id);break;
    case 'del':if(confirm('Delete this saved test? / இத்தேர்வைச் சேமிப்பிலிருந்து நீக்கவா?')){store.attempts=store.attempts.filter(x=>x.id!==t.dataset.id);save();if(view==='result'){view='home'}render()}break;
    case 'retake':{
      if(store.current&&!confirm('A test is already in progress. Discard it and start a new one? / ஒரு தேர்வு நடந்துகொண்டிருக்கிறது. அதை நீக்கிவிட்டுப் புதியதைத் தொடங்கவா?'))break;
      const a=store.attempts.find(x=>x.id===t.dataset.id);if(!a)break;const ev=evaluate(a),m=t.dataset.m;let ids;
      if(m==='full')ids=DATA.map(q=>q.n);else if(m==='wrong')ids=a.qids.filter(i=>ev.st[i]==='w');else if(m==='un')ids=a.qids.filter(i=>ev.st[i]==='u');else ids=a.qids.filter(i=>ev.st[i]!=='r');
      if(!ids.length){toast('No such questions / அத்தகைய வினாக்கள் இல்லை');break}
      closeModal();startAttempt(m,ids);window.scrollTo(0,0);break}
  }
});
document.addEventListener('keydown',e=>{
  if(view!=='test'||!store.current||store.current.paused||e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(['1','2','3','4'].includes(k))select(+k-1);else if(['a','b','c','d'].includes(k))select('abcd'.indexOf(k));
  else if(e.key==='ArrowRight')go(store.current.cur+1);else if(e.key==='ArrowLeft')go(store.current.cur-1);
});
/* persist on leave / hide so nothing is lost (session timeout, tab kill, phone lock) */
function flush(){const c=store.current;if(c&&view==='test'){const now=Date.now();if(!c.paused){const dt=Math.max(0,now-c.lastTick);c.remMs-=dt;const id=c.qids[c.cur];c.times[id]=(c.times[id]||0)+dt}c.lastTick=now}save()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
window.addEventListener('pagehide',flush);window.addEventListener('beforeunload',flush);
/* ---------- boot ---------- */
load();
if(store.current){ // restore after reload/crash: stay paused so no time is lost while the page was closed
  const c=store.current;if(!c.paused){c.paused=true;c.autoPaused=true}else if(c.paused&&!c.autoPaused){/* user pause survives reload */}
  c.lastTick=Date.now();view='home';
}
render();
</script>
</body>
</html>
