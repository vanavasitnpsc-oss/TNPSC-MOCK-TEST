*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#14506b;--bg:#f3f6f8;--line:#d5dde3;--g:#137333;--gb:#e7f4ea;--r:#b3261e;--rb:#fdecea;--a:#8a5a00;--ab:#fff5dd}
body{font-family:'TA',sans-serif;background:var(--bg);color:#17212b;line-height:1.6;font-size:16px;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:12px 12px 24px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h1{font-size:1.2rem;color:var(--p);line-height:1.4} h2{font-size:1.05rem;color:var(--p);margin-bottom:6px}
.sub{color:#556572;font-size:.9rem}
ul.ins{padding-left:1.2em}
label{display:block;font-weight:700;margin-top:8px}
input{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid #9fb0bc;border-radius:8px}
button{font:inherit;font-size:.95rem;cursor:pointer;border:1px solid var(--p);background:#fff;color:var(--p);border-radius:8px;padding:9px 12px;min-height:44px;touch-action:manipulation}
button.pri{background:var(--p);color:#fff;font-weight:700} button.full{width:100%;margin-top:8px}
button:disabled{opacity:.4;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.err{color:var(--r);font-weight:700;min-height:1.4em}
.hist{border-top:1px solid var(--line);padding:10px 0}
.bar{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
.bar .in{max-width:796px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.timer{font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{background:var(--r);border-radius:8px;padding:0 10px}
.bar button{background:#fff;min-height:40px;padding:6px 10px}
.meta{max-width:796px;margin:2px auto 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;font-size:.85rem}
.stem{font-weight:700;margin-bottom:8px}
.sts{margin:0 0 8px} .sts div{display:flex;gap:6px} .sts div span:first-child{min-width:1.5em;font-weight:700}
table.qt{width:100%;border-collapse:collapse;margin-bottom:8px;table-layout:fixed}
.qt td,.qt th{border:1px solid #9fb0bc;padding:5px 8px;text-align:left;vertical-align:top}
.qt th{background:#eaf1f5}
.opt{display:flex;gap:8px;width:100%;text-align:left;margin-top:8px;padding:10px;color:inherit;border-color:var(--line);align-items:flex-start}
.opt b{min-width:1.9em}
.opt.sel{background:#e1eff7;border-color:var(--p);box-shadow:inset 0 0 0 1px var(--p)}
.opt.ok{background:var(--gb);border-color:var(--g)} .opt.no{background:var(--rb);border-color:var(--r)}
div.opt{border:1px solid var(--line);border-radius:8px}
.nav{position:sticky;bottom:0;background:var(--bg);padding:8px 0;padding-bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.nav button{padding:8px 4px;font-size:.88rem}
button.flag{background:var(--ab);border-color:#c99400;color:var(--a)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
#modal.on{display:flex}
.box{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:560px;max-height:85vh;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:10px 0}
.grid button{padding:4px;min-height:40px}
.grid .a{background:var(--p);color:#fff} .grid .f{background:var(--ab);border-color:#c99400;color:var(--a)} .grid .c{outline:3px solid #e07b00}
.score{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.score div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.score b{display:block;font-size:1.5rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.tabs button.on{background:var(--p);color:#fff}
.tag{display:inline-block;font-size:.8rem;border-radius:20px;padding:0 10px;margin-bottom:6px;font-weight:700}
.tag.c{background:var(--gb);color:var(--g)} .tag.w{background:var(--rb);color:var(--r)} .tag.u{background:var(--ab);color:var(--a)}
.exp{margin-top:8px;background:#eef4f7;border-radius:8px;padding:8px 10px;font-size:.93rem}
.foot{text-align:center;font-weight:700;font-size:.85rem;color:var(--p);padding:12px 8px}
#print{display:none}
@media(min-width:620px){.score{grid-template-columns:repeat(5,1fr)}.tabs{grid-template-columns:repeat(4,1fr)}}
@media print{
 body{background:#fff;font-size:9pt;line-height:1.4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #app,#modal{display:none!important}
 #print{display:block}

function mmss(sec){sec=Math.max(0,Math.floor(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return(h?h+":"+(m<10?"0":""):"")+m+":"+(s<10?"0":"")+s}
function qtime(ms){var s=Math.round((ms||0)/1000);return s<60?s+" வி":Math.floor(s/60)+" நி "+(s%60)+" வி"}
function date(t){var d=new Date(t),p=function(n){return(n<10?"0":"")+n};return p(d.getDate())+"-"+p(d.getMonth()+1)+"-"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())}
function on(id,fn){var e=document.getElementById(id);if(e)e.onclick=fn}
function each(sel,fn){Array.prototype.forEach.call(document.querySelectorAll(sel),fn)}
function footer(){return'<div class="foot">'+FOOT+'</div>'}
function ask(title,msg,yes){modal.innerHTML='<div class="box" role="dialog" aria-modal="true"><h2>'+title+'</h2><p>'+msg+'</p><div class="two"><button id="mno">இல்லை</button><button class="pri" id="myes">ஆம்</button></div></div>';modal.className="on";on("mno",closeModal);on("myes",function(){closeModal();yes()})}
function closeModal(){modal.className="";modal.innerHTML=""}

function body(q){
  var h="";
  if(q.k==="ar"){return'<div class="stem"><div>கூற்று (A): '+esc(q.a)+'</div><div>காரணம் (R): '+esc(q.r)+'</div></div>'}
  h+='<div class="stem">'+esc(q.stem)+'</div>';
  if(q.sts)h+='<div class="sts">'+q.sts.map(function(s,i){return"<div><span>"+(i+1)+".</span><span>"+esc(s)+"</span></div>"}).join("")+"</div>";
  if(q.k==="match")h+='<table class="qt"><tr><th>'+esc(q.head[0])+'</th><th>'+esc(q.head[1])+'</th></tr>'+q.left.map(function(l,i){return"<tr><td>"+"abcd"[i]+") "+esc(l)+"</td><td>"+(i+1)+". "+esc(q.right[i])+"</td></tr>"}).join("")+"</table>";
  if(q.rows)h+='<table class="qt"><tr><th>'+esc(q.head[0])+'</th><th>'+esc(q.head[1])+'</th></tr>'+q.rows.map(function(r,i){return"<tr><td>"+(i+1)+". "+esc(r[0])+"</td><td>"+esc(r[1])+"</td></tr>"}).join("")+"</table>";
  return h;
}

/* ---------- home ---------- */
function home(){
  view="home";stop();closeModal();prn.innerHTML="";
  var u=load(UK)||{},st=load(SK),hist=load(HK)||[];
  var h='<div class="wrap"><div class="card"><h1>'+TITLE+'</h1><p class="sub">'+SUB+'</p></div>';
  if(st&&st.ids){h+='<div class="card" style="border-color:#c99400;background:var(--ab)"><h2>நிறைவடையாத தேர்வு உள்ளது</h2><p>'+esc(st.name)+' • '+st.ids.length+' வினாக்கள் • மீதி நேரம் '+mmss((st.end-Date.now())/1000)+'</p><button class="pri full" id="resume">தேர்வைத் தொடர்க</button><button class="full" id="drop">இத்தேர்வை நீக்குக</button></div>'}
  h+='<div class="card"><h2>தேர்வு விதிமுறைகள்</h2><ul class="ins"><li>மொத்த வினாக்கள்: '+Q.length+' • மதிப்பெண்: '+Q.length+'</li><li>நேரம்: '+Math.round(Q.length*SEC/60)+' நிமிடங்கள் (ஒரு வினாவுக்கு 0.6 நிமிடம்)</li><li>நேரம் முடிந்ததும் விடைத்தாள் தானாகச் சமர்ப்பிக்கப்படும்.</li><li>எதிர்மறை மதிப்பெண் இல்லை. (E) தேர்வு விடையளிக்காததாகக் கணக்கிடப்படும்.</li><li>பக்கம் மூடப்பட்டாலும் விடைகள் சேமிக்கப்படும்; கடிகாரம் தொடர்ந்து ஓடும்.</li></ul></div>';
  h+='<div class="card"><label for="nm">பெயர்</label><input id="nm" autocomplete="name" maxlength="60" value="'+esc(u.name||"")+'"><label for="mb">கைபேசி எண்</label><input id="mb" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="10 இலக்க எண்" value="'+esc(u.mobile||"")+'"><div class="err" id="err" role="alert"></div><button class="pri full" id="start">தேர்வைத் தொடங்குக</button></div>';
  if(hist.length){h+='<div class="card"><h2>சேமிக்கப்பட்ட தேர்வுகள்</h2>'+hist.map(function(a,i){var s=score(a);return'<div class="hist"><b>'+esc(a.name)+'</b> — '+esc(a.label)+'<br><span class="sub">'+date(a.done)+' • மதிப்பெண் '+s.c+'/'+a.ids.length+'</span><div class="two"><button data-v="'+i+'">முடிவைப் பார்</button><button data-r="'+i+'">மீண்டும் எழுது</button></div></div>'}).join("")+'</div>'}
  if(!storageOK)h+='<div class="card" style="background:var(--rb)">இந்த உலாவியில் சேமிப்பு முடக்கப்பட்டுள்ளது. பக்கத்தை மூடினால் விடைகள் அழியும்; Chrome-இல் சாதாரணப் பக்கத்தில் திறக்கவும்.</div>';
  app.innerHTML=h+footer()+'</div>';
  on("start",function(){
    var n=document.getElementById("nm").value.trim(),m=document.getElementById("mb").value.trim(),e=document.getElementById("err");
    if(n.length<2){e.textContent="உங்கள் பெயரை உள்ளிடவும்.";return}
    if(!/^[6-9]\d{9}$/.test(m)){e.textContent="சரியான 10 இலக்கக் கைபேசி எண்ணை உள்ளிடவும்.";return}
    save(UK,{name:n,mobile:m});
    var go=function(){begin(n,m,Q.map(function(_,i){return i}),"முழுத் தேர்வு")};
    if(load(SK))ask("புதிய தேர்வு","நிறைவடையாத பழைய தேர்வு நீக்கப்படும். தொடரலாமா?",go);else go();
  });
  on("resume",function(){S=load(SK);if(!S)return home();if(Date.now()>=S.end)return submit(true);run()});
  on("drop",function(){ask("தேர்வை நீக்குதல்","இந்த நிறைவடையாத தேர்வை நீக்கலாமா?",function(){save(SK,null);home()})});
  each("[data-v]",function(b){b.onclick=function(){result(hist[+b.dataset.v])}});
  each("[data-r]",function(b){b.onclick=function(){retakeMenu(hist[+b.dataset.r])}});
  window.scrollTo(0,0);
}

/* ---------- test ---------- */
function begin(n,m,ids,label){
  var now=Date.now();
  S={name:n,mobile:m,ids:ids,label:label,ans:{},time:{},flag:{},cur:0,start:now,end:now+ids.length*SEC*1000};
  save(SK,S);run();
}
function run(){view="test";shown=Date.now();paint();stop();timer=setInterval(tick,500)}
function stop(){if(timer){clearInterval(timer);timer=null}}
/* time on the current question counts only while the page is visible */
function account(){
  if(view!=="test"||!S||shown===null)return;
  var now=Math.min(Date.now(),S.end),i=S.ids[S.cur];
  if(now>shown)S.time[i]=(S.time[i]||0)+(now-shown);
  shown=Date.now();
}
var ticks=0;
function tick(){
  if(view!=="test")return;
  if(Date.now()>=S.end)return submit(true);
  if(!document.hidden){account();if(++ticks%4===0)save(SK,S)}
  var left=Math.ceil((S.end-Date.now())/1000),t=document.getElementById("tm");
  if(t){t.textContent=mmss(left);t.className="timer"+(left<=300?" low":"")}
  var q=document.getElementById("qt");if(q)q.textContent="இவ்வினா: "+qtime(S.time[S.ids[S.cur]]);
}
function paint(){
  var i=S.ids[S.cur],q=Q[i],n=S.ids.length,done=Object.keys(S.ans).filter(function(k){return S.ans[k]<4}).length;
  var h='<div class="bar"><div class="in"><button id="pal">வினாப் பட்டியல்</button><span class="timer" id="tm">'+mmss((S.end-Date.now())/1000)+'</span><button id="sub">சமர்ப்பி</button></div><div class="meta"><span>வினா '+(S.cur+1)+' / '+n+'</span><span id="qt">இவ்வினா: '+qtime(S.time[i])+'</span><span>விடையளித்தவை: '+done+'</span></div></div>';
  h+='<div class="wrap"><div class="card"><div class="sub">வினா '+(S.cur+1)+'</div>'+body(q);
  q.opts.concat(["விடை தெரியவில்லை"]).forEach(function(o,j){h+='<button class="opt'+(S.ans[i]===j?" sel":"")+'" data-o="'+j+'" aria-pressed="'+(S.ans[i]===j)+'"><b>('+"ABCDE"[j]+')</b><span>'+esc(o)+'</span></button>'});
  h+='</div><div class="nav"><button id="prev"'+(S.cur?"":" disabled")+'>◀ முந்தையது</button><button id="clr">விடையை நீக்கு</button><button id="next"'+(S.cur<n-1?"":" disabled")+' class="pri">அடுத்தது ▶</button><button id="flg" class="'+(S.flag[i]?"flag":"")+'" style="grid-column:1/-1">'+(S.flag[i]?"★ குறியிடப்பட்டது":"☆ மீள்பார்வைக்குக் குறியிடு")+'</button></div>'+footer()+'</div>';
  app.innerHTML=h;
  each("[data-o]",function(b){b.onclick=function(){account();S.ans[i]=+b.dataset.o;save(SK,S);paint()}});
  on("prev",function(){go(S.cur-1)});on("next",function(){go(S.cur+1)});
  on("clr",function(){account();delete S.ans[i];save(SK,S);paint()});
  on("flg",function(){account();S.flag[i]=!S.flag[i];save(SK,S);paint()});
  on("pal",palette);
  on("sub",function(){var d=S.ids.filter(function(k){return S.ans[k]<4}).length;ask("சமர்ப்பிக்கலாமா?","விடையளித்தவை: "+d+" • விடையளிக்காதவை: "+(n-d),function(){submit(false)})});
}
function go(k){if(k<0||k>=S.ids.length)return;account();S.cur=k;save(SK,S);paint();window.scrollTo(0,0)}
function palette(){
  var h='<div class="box"><h2>வினாப் பட்டியல்</h2><p class="sub">நீலம்: விடையளித்தது • மஞ்சள்: குறியிட்டது</p><div class="grid">';
  S.ids.forEach(function(i,k){h+='<button data-g="'+k+'" class="'+(S.flag[i]?"f":S.ans[i]<4?"a":"")+(k===S.cur?" c":"")+'">'+(k+1)+'</button>'});
  modal.innerHTML=h+'</div><button class="full" id="mc">மூடுக</button></div>';modal.className="on";
  on("mc",closeModal);each("[data-g]",function(b){b.onclick=function(){closeModal();go(+b.dataset.g)}});
}
function submit(auto){
  if(!S)return;
  account();stop();closeModal();view="result";
  var a={name:S.name,mobile:S.mobile,ids:S.ids,label:S.label,ans:S.ans,time:S.time,start:S.start,done:Math.min(Date.now(),S.end),auto:auto};
  var hist=load(HK)||[];hist.unshift(a);hist=hist.slice(0,25);
  save(HK,hist);save(SK,null);S=null;result(a);
}

/* ---------- result ---------- */
function status(a,i){var v=a.ans[i];return v===undefined||v>3?"u":v===Q[i].ans?"c":"w"}
function score(a){var s={c:0,w:0,u:0};a.ids.forEach(function(i){s[status(a,i)]++});return s}
function review(a,i,k){
  var q=Q[i],st=status(a,i),v=a.ans[i];
  var h='<div class="card"><span class="tag '+st+'">'+{c:"சரி",w:"தவறு",u:"விடையளிக்கவில்லை"}[st]+'</span> <span class="sub">⏱ '+qtime(a.time[i])+' • '+TOPICS[q.t]+'</span><div class="sub">வினா '+(k+1)+'</div>'+body(q);
  q.opts.forEach(function(o,j){var c=j===q.ans?" ok":j===v?" no":"";h+='<div class="opt'+c+'"><b>('+K[j]+')</b><span>'+esc(o)+(j===q.ans?" ✔":"")+(j===v?" — உங்கள் விடை":"")+'</span></div>'});
  if(v===4)h+='<div class="sub">நீங்கள் (E) விடை தெரியவில்லை எனத் தேர்ந்தீர்கள்.</div>';
  return h+'<div class="exp"><b>சரியான விடை: ('+K[q.ans]+')</b> '+esc(q.exp)+'</div></div>';
}
function summary(a){
  var s=score(a),used=0;a.ids.forEach(function(i){used+=a.time[i]||0});
  var tp=Object.keys(TOPICS).map(function(t){var ids=a.ids.filter(function(i){return Q[i].t==t});if(!ids.length)return"";return"<tr><td>"+TOPICS[t]+"</td><td>"+ids.filter(function(i){return status(a,i)==="c"}).length+" / "+ids.length+"</td></tr>"}).join("");
  return'<div class="card"><h1>தேர்வு முடிவு</h1><p><b>'+esc(a.name)+'</b> • '+esc(a.mobile)+'<br><span class="sub">'+TITLE+'<br>'+esc(a.label)+' • '+date(a.done)+(a.auto?" • நேரம் முடிந்ததால் தானாகச் சமர்ப்பிக்கப்பட்டது":"")+'</span></p><div class="score"><div style="grid-column:span 1"><b>'+s.c+'/'+a.ids.length+'</b>மதிப்பெண் ('+Math.round(100*s.c/a.ids.length)+'%)</div><div style="background:var(--gb)"><b>'+s.c+'</b>சரி</div><div style="background:var(--rb)"><b>'+s.w+'</b>தவறு</div><div style="background:var(--ab)"><b>'+s.u+'</b>விடையளிக்காதவை</div><div><b>'+mmss(used/1000)+'</b>எடுத்த நேரம்</div></div><table class="qt" style="margin-top:10px"><tr><th>பகுதி</th><th>சரி</th></tr>'+tp+'</table></div>';
}
function result(a){view="result";R=a;filter="all";drawResult();window.scrollTo(0,0)}
function drawResult(){
  var a=R,s=score(a),names={all:"அனைத்தும் ("+a.ids.length+")",c:"சரி ("+s.c+")",w:"தவறு ("+s.w+")",u:"விடையளிக்காதவை ("+s.u+")"};
  var h='<div class="wrap">'+summary(a)+'<div class="card"><button class="pri full" id="pdf">தேர்வை PDF ஆகப் பதிவிறக்கு</button><p class="sub">அச்சுத் திரையில் “Save as PDF” என்பதைத் தேர்ந்தெடுக்கவும். WhatsApp-க்குள் திறந்திருந்தால் Chrome-இல் திறக்கவும்.</p><div class="two"><button id="re">மீண்டும் எழுது</button><button id="hm">முகப்பு</button></div></div><div class="tabs">';
  Object.keys(names).forEach(function(f){h+='<button data-f="'+f+'" class="'+(f===filter?"on":"")+'">'+names[f]+'</button>'});
  h+='</div>';
  var any=false;a.ids.forEach(function(i,k){if(filter==="all"||status(a,i)===filter){any=true;h+=review(a,i,k)}});
  if(!any)h+='<div class="card">இப்பிரிவில் வினாக்கள் இல்லை.</div>';
  app.innerHTML=h+footer()+'</div>';
  each("[data-f]",function(b){b.onclick=function(){filter=b.dataset.f;drawResult()}});
  on("hm",home);on("re",function(){retakeMenu(a)});on("pdf",function(){buildPrint(a);var t=document.title;document.title=FILE+"-முடிவு";setTimeout(function(){window.print();setTimeout(function(){document.title=t},1500)},150)});
}
function buildPrint(a){
  var c=a.ids.map(function(i,k){return review(a,i,k)}).join("");
  prn.innerHTML=MARGINBOX?summary(a)+'<div class="cols">'+c+'</div>':'<table class="pg"><tbody><tr><td>'+summary(a)+c+'</td></tr></tbody><tfoot><tr><td>'+FOOT+'</td></tr></tfoot></table>';
}
window.addEventListener("beforeprint",function(){if(view==="result"&&R)buildPrint(R)});
function retakeMenu(a){
  var s=score(a),ans=a.ids.length-s.u;
  var items=[["full","முழுத் தேர்வு",Q.length],["ans","விடையளித்த வினாக்கள் மட்டும்",ans],["w","தவறான வினாக்கள் மட்டும்",s.w],["u","விடையளிக்காத வினாக்கள் மட்டும்",s.u]];
  modal.innerHTML='<div class="box"><h2>மீண்டும் எழுது</h2>'+items.map(function(x){return'<button class="full" data-m="'+x[0]+'"'+(x[2]?"":" disabled")+'>'+x[1]+' ('+x[2]+')</button>'}).join("")+'<button class="full" id="mc">ரத்து</button></div>';modal.className="on";
  on("mc",closeModal);
  each("[data-m]",function(b){b.onclick=function(){var m=b.dataset.m,ids,label;
    ids=m==="full"?Q.map(function(_,i){return i}):a.ids.filter(function(i){var st=status(a,i);return m==="ans"?st!=="u":st===m});
    label=items.filter(function(x){return x[0]===m})[0][1];
    var start=function(){closeModal();begin(a.name,a.mobile,ids,label)};
    if(load(SK))ask("புதிய தேர்வு","நிறைவடையாத பழைய தேர்வு நீக்கப்படும். தொடரலாமா?",start);else start()}});
}
document.addEventListener("visibilitychange",function(){
  if(view!=="test")return;
  if(document.hidden){account();save(SK,S);shown=null}else{shown=Date.now();tick()}
});
window.addEventListener("pagehide",function(){if(view==="test"){account();save(SK,S)}});
window.addEventListener("pageshow",function(){if(view==="test"){if(shown===null)shown=Date.now();tick()}});
document.addEventListener("keydown",function(e){if(view!=="test"||modal.className)return;if(e.key==="ArrowRight")go(S.cur+1);if(e.key==="ArrowLeft")go(S.cur-1)});
/* if time ran out while the page was closed, submit the saved attempt */
var saved=load(SK);
if(saved&&saved.ids&&Date.now()>=saved.end){S=saved;view="closed";shown=null;submit(true)}else home();
})();
</script>
</body>
</html>
