*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#0b4f6c;--bg:#f2f5f7;--c:#fff;--t:#17252e;--m:#5b6b75;--l:#d7e0e5;--g:#137a3e;--gb:#e5f5ea;--r:#b3261e;--rb:#fdeceb;--a:#8a5a00;--ab:#fff3d6}
html{-webkit-text-size-adjust:100%}
body{font-family:'TA',system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:15.5px;line-height:1.65;overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--l);background:var(--c);border-radius:10px;padding:9px 14px;min-height:44px;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
.pri{background:var(--p);border-color:var(--p);color:#fff;font-weight:700}
.wrap{max-width:780px;margin:0 auto;padding:12px}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:12px}
h1{font-size:1.22rem;line-height:1.5;color:var(--p)}
h2{font-size:1.05rem;color:var(--p);margin-bottom:8px}
.sub{color:var(--m);font-size:.9rem}
ul.ins{padding-left:20px;margin-top:6px}
label{display:block;font-weight:700;margin:10px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--l);border-radius:10px;font-size:16px;background:#fff}
.err{color:var(--r);font-size:.9rem;min-height:1.4em;margin-top:6px}
.full{width:100%;margin-top:8px}
footer{text-align:center;color:var(--m);font-size:.82rem;padding:14px 10px 22px}
.top{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
.top .row{max-width:780px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.clock{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.clock.low{background:#b3261e;border-radius:6px;padding:0 8px}
.bar{height:4px;background:#ffffff40;border-radius:2px;max-width:780px;margin:6px auto 0}
.bar i{display:block;height:100%;background:#ffd166;border-radius:2px}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.pill{font-size:.82rem;border-radius:20px;padding:2px 10px;background:#e8f1f5;color:var(--p);font-weight:700;font-variant-numeric:tabular-nums}
.stem{font-weight:700;margin-bottom:8px}
.stmts{list-style:none;margin:6px 0}
.stmts li{display:flex;gap:8px;padding:2px 0}
.stmts b{min-width:1.4em}
.ar{margin:6px 0;border-left:3px solid var(--p);padding-left:10px}
table.qt{width:100%;border-collapse:collapse;margin:8px 0;font-size:.95em;table-layout:fixed}
table.qt th,table.qt td{border:1px solid var(--l);padding:6px 8px;text-align:left;vertical-align:top}
table.qt th{background:#eef4f7}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin-top:8px;padding:11px 12px;align-items:flex-start;border:1.5px solid var(--l);border-radius:10px;background:#fff}
.opt .k{font-weight:700;min-width:1.8em}
.opt.sel{border-color:var(--p);background:#e3f0f6;box-shadow:inset 0 0 0 1px var(--p)}
.opt.good{border-color:var(--g);background:var(--gb)}
.opt.bad{border-color:var(--r);background:var(--rb)}
.tag{margin-left:auto;font-size:.75rem;font-weight:700;white-space:nowrap}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--l);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:6}
.nav .row{max-width:780px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.nav button{padding:8px 4px;font-size:.92rem;min-width:0}
.testpad{padding-bottom:110px}
.ov{position:fixed;inset:0;background:#0008;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:85vh;max-height:85dvh;overflow:auto;border-radius:16px 16px 0 0;padding:16px calc(16px) calc(16px + env(safe-area-inset-bottom))}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:16px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;margin:10px 0}
.grid button{padding:0;min-height:44px}
.grid .done{background:var(--g);color:#fff;border-color:var(--g)}
.grid .mk{background:#ffd166;border-color:#c99400;color:#17252e}
.grid .cur{outline:3px solid var(--p);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score{font-size:2.4rem;font-weight:700;color:var(--p);text-align:center;line-height:1.3}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.stats div{border-radius:10px;padding:8px 2px;text-align:center;font-size:.78rem;min-width:0}
.stats b{display:block;font-size:1.2rem}
@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0;position:sticky;top:0;background:var(--bg);z-index:3}
.tabs button{white-space:nowrap;border-radius:22px}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.rv.c{border-left:5px solid var(--g)}.rv.w{border-left:5px solid var(--r)}.rv.u{border-left:5px solid #c99400}
.exp{margin-top:10px;background:var(--ab);border-radius:8px;padding:8px 10px;font-size:.93rem}
table.tt{width:100%;border-collapse:collapse;font-size:.88rem}
table.tt th,table.tt td{border-bottom:1px solid var(--l);padding:6px 4px;text-align:center}
table.tt td:first-child,table.tt th:first-child{text-align:left}
table.tt td+td,table.tt th+th{white-space:nowrap;overflow-wrap:normal}
.hist{border-top:1px solid var(--l);padding:10px 0}
#print{display:none}
@page{size:A4;margin:12mm 11mm 17mm;@bottom-center{content:"ஒளிரும் வனவாசி அகாடமி, சேலம் (செல்:9789521578)";font-family:'TA',sans-serif;font-size:9pt}}
@media print{
 body{background:#fff;font-size:10.5pt;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #app,#modal{display:none!important}
 #print{display:block}
 #print .card{break-inside:avoid;border-radius:6px;padding:8px 10px;margin-bottom:7px}
 #print .opt{margin-top:3px;padding:3px 8px}
 #print>.pcols{column-count:2;column-gap:6mm}
 #print>.pcols .card{font-size:8.8pt}
 #print>.pcols .qmeta{margin-bottom:3px}
 #print>.pcols .exp{margin-top:5px;padding:4px 7px;font-size:8.4pt}
 #print table.ft{width:100%;border-collapse:collapse}
 #print table.ft tfoot td{text-align:center;font-size:9pt;padding-top:8px}
}

  h+='<div class="card"><label for="nm">பெயர்</label><input id="nm" autocomplete="name" maxlength="60" value="'+esc(u.name||"")+'"><label for="mb">கைபேசி எண்</label><input id="mb" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="10 இலக்க எண்" value="'+esc(u.mobile||"")+'"><div class="err" id="err" role="alert"></div><button class="pri full" id="start">தேர்வைத் தொடங்குக</button></div>';
  if(hist.length){h+='<div class="card"><h2>சேமிக்கப்பட்ட தேர்வுகள்</h2>'+hist.map(function(a,i){var s=score(a);return'<div class="hist"><b>'+esc(a.name)+'</b> — '+esc(a.label)+'<br><span class="sub">'+date(a.done)+' • மதிப்பெண் '+s.c+'/'+a.ids.length+'</span><div class="two"><button data-v="'+i+'">முடிவைப் பார்</button><button data-r="'+i+'">மீண்டும் எழுது</button></div></div>'}).join("")+'</div>'}
  if(!storageOK)h+='<div class="card" style="background:var(--rb)">இந்த உலாவியில் சேமிப்பு முடக்கப்பட்டுள்ளது. பக்கத்தை மூடினால் விடைகள் அழியும்; Chrome-இல் சாதாரணப் பக்கத்தில் திறக்கவும்.</div>';
  app.innerHTML=h+footer()+'</div>';
  on("start",function(){
    var n=document.getElementById("nm").value.trim(),m=document.getElementById("mb").value.trim(),e=document.getElementById("err");
    if(n.length<2){e.textContent="உங்கள் பெயரை உள்ளிடவும்.";return}
    if(!/^[6-9]\d{9}$/.test(m)){e.textContent="சரியான 10 இலக்கக் கைபேசி எண்ணை உள்ளிடவும்.";return}
    save(UK,{name:n,mobile:m});
    var go=function(){begin(n,m,Q.map(function(_,i){return i}),"முழுத் தேர்வு")};
    if(load(SK))ask("புதிய தேர்வு","நிறைவடையாத பழைய தேர்வு நீக்கப்படும். தொடரலாமா?","தொடங்கு",go);else go();
  });
  on("resume",function(){S=load(SK);run()});
  on("drop",function(){ask("தேர்வை நீக்குதல்","நிறைவடையாத தேர்வை நீக்கலாமா?","நீக்கு",function(){save(SK,null);home()})});
  app.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){shown=(load(HK)||[])[+b.dataset.v];filter="all";result()}});
  app.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){shown=(load(HK)||[])[+b.dataset.r];retakeMenu()}});
  window.scrollTo(0,0);
}

/* ---------- test ---------- */
function begin(name,mobile,ids,label){
  var now=Date.now();
  S={name:name,mobile:mobile,ids:ids,label:label,start:now,end:now+ids.length*SEC*1000,last:now,cur:0,ans:{},mark:{},time:{}};
  save(SK,S);run();
}
function run(){
  if(!S)return home();
  closeModal();view="test";
  if(Date.now()>=S.end){submit(true);return}
  tick();if(view!=="test")return;
  draw();stop();timer=setInterval(tick,500);
}
function stop(){if(timer){clearInterval(timer);timer=null}}
function account(){
  var now=Math.min(Date.now(),S.end),d=now-S.last;
  if(d>0){var id=S.ids[S.cur];S.time[id]=(S.time[id]||0)+d}
  S.last=Math.max(now,S.last);
}
function tick(){
  if(view!=="test"||!S)return;
  account();save(SK,S);
  var left=(S.end-Date.now())/1000,c=document.getElementById("clk");
  if(c){c.textContent=mmss(Math.ceil(left));c.className="clock"+(left<=300?" low":"")}
  var q=document.getElementById("qt");if(q)q.textContent="⏱ "+qtime(S.time[S.ids[S.cur]]);
  if(left<=0)submit(true);
}
function draw(){
  var n=S.cur,id=S.ids[n],q=Q[id],done=Object.keys(S.ans).length;
  var h='<div class="top"><div class="row"><div><div style="font-size:.8rem">மீதி நேரம்</div><div class="clock" id="clk">'+mmss(Math.ceil((S.end-Date.now())/1000))+'</div></div><div style="text-align:right;font-size:.85rem">'+esc(S.name)+'<br>விடையளித்தவை '+done+'/'+S.ids.length+'</div></div><div class="bar"><i style="width:'+(done/S.ids.length*100)+'%"></i></div></div>';
  h+='<div class="wrap testpad"><div class="card"><div class="qmeta"><span class="pill">வினா '+(n+1)+' / '+S.ids.length+'</span><span class="pill" id="qt">⏱ '+qtime(S.time[id])+'</span></div>'+body(q)+'<div role="radiogroup">';
  h+=q.opts.map(function(o,i){var s=S.ans[id]===i;return'<button class="opt'+(s?" sel":"")+'" role="radio" aria-checked="'+s+'" data-o="'+i+'"><span class="k">('+K[i]+')</span><span>'+esc(o)+'</span></button>'}).join("");
  h+='</div><div class="two" style="margin-top:12px"><button id="clr"'+(S.ans[id]===undefined?" disabled":"")+'>விடையை அழி</button><button id="mk">'+(S.mark[id]?"★ குறி நீக்கு":"☆ பிறகு பார்")+'</button></div></div>'+footer()+'</div>';
  h+='<div class="nav"><div class="row"><button id="pv"'+(n===0?" disabled":"")+'>‹ முந்தைய</button><button id="pal">வினாப் பட்டியல்</button>'+(n===S.ids.length-1?'<button id="sub" class="pri">சமர்ப்பி</button>':'<button id="nx" class="pri">அடுத்தது ›</button>')+'</div></div>';
  app.innerHTML=h;
  app.querySelectorAll("[data-o]").forEach(function(b){b.onclick=function(){if(expired())return;S.ans[id]=+b.dataset.o;save(SK,S);var y=window.scrollY;draw();window.scrollTo(0,y)}});
  on("clr",function(){if(expired())return;delete S.ans[id];save(SK,S);draw()});
  on("mk",function(){if(S.mark[id])delete S.mark[id];else S.mark[id]=1;save(SK,S);draw()});
  on("pv",function(){go(n-1)});on("nx",function(){go(n+1)});on("pal",palette);on("sub",confirmSubmit);
}
function expired(){if(Date.now()>=S.end){submit(true);return true}return false}
function go(i){if(expired())return;account();S.cur=i;save(SK,S);closeModal();draw();window.scrollTo(0,0)}
function palette(){
  var h='<div class="ov"><div class="sheet"><h2>வினாப் பட்டியல்</h2><p class="sub">பச்சை – விடையளித்தவை • மஞ்சள் – பிறகு பார்க்க • வெள்ளை – விடையளிக்காதவை</p><div class="grid">';
  h+=S.ids.map(function(id,i){var c=S.mark[id]?"mk":(S.ans[id]!==undefined?"done":"");return'<button class="'+c+(i===S.cur?" cur":"")+'" data-g="'+i+'">'+(i+1)+'</button>'}).join("");
  h+='</div><div class="two"><button id="cl">மூடு</button><button id="sub2" class="pri">தேர்வைச் சமர்ப்பி</button></div></div></div>';
  modal.innerHTML=h;
  modal.querySelectorAll("[data-g]").forEach(function(b){b.onclick=function(){go(+b.dataset.g)}});
  on("cl",closeModal);on("sub2",confirmSubmit);
}
function confirmSubmit(){
  var d=Object.keys(S.ans).length;
  ask("தேர்வைச் சமர்ப்பிக்கவா?","விடையளித்தவை: <b>"+d+"</b><br>விடையளிக்காதவை: <b>"+(S.ids.length-d)+"</b><br>பிறகு பார்க்கக் குறித்தவை: <b>"+Object.keys(S.mark).length+"</b>","சமர்ப்பி",function(){submit(false)});
}
function submit(auto){
  if(!S)return;
  account();stop();view="result";
  S.done=Math.min(Date.now(),S.end);S.auto=!!auto;
  var hist=load(HK)||[];
  if(!hist.some(function(a){return a.start===S.start})){hist.unshift(S);hist=hist.slice(0,30);save(HK,hist)}
  save(SK,null);shown=S;S=null;filter="all";closeModal();result();
}

/* ---------- result ---------- */
function status(a,id){return a.ans[id]===undefined?"u":(a.ans[id]===Q[id].ans?"c":"w")}
function score(a){var s={c:0,w:0,u:0};a.ids.forEach(function(id){s[status(a,id)]++});return s}
function review(a,id,i){
  var q=Q[id],st=status(a,id),mine=a.ans[id];
  var lab={c:"✔ சரி",w:"✘ தவறு",u:"– விடையளிக்கவில்லை"}[st];
  return'<div class="card rv '+st+'"><div class="qmeta"><span class="pill">வினா '+(i+1)+' • '+lab+'</span><span class="pill">⏱ '+qtime(a.time[id])+'</span></div>'+body(q)+
   q.opts.map(function(o,j){var c=j===q.ans?" good":(j===mine?" bad":"");var t=j===q.ans?(j===mine?"✔ உங்கள் விடை":"✔ சரியான விடை"):(j===mine?"✘ உங்கள் விடை":"");return'<div class="opt'+c+'"><span class="k">('+K[j]+')</span><span>'+esc(o)+'</span><span class="tag">'+t+'</span></div>'}).join("")+
   '<div class="exp"><b>விளக்கம்:</b> '+esc(q.exp)+'</div></div>';
}
function summary(a){
  var s=score(a),used=(a.done-a.start)/1000;
  var h='<div class="card"><h1>தேர்வு முடிவு — '+esc(a.label)+'</h1><p class="sub">அலகு II : சொல்லகராதி<br>பெயர்: <b>'+esc(a.name)+'</b> • கைபேசி: <b>'+esc(a.mobile)+'</b><br>நாள்: '+date(a.done)+(a.auto?" • நேரம் முடிந்ததால் தானாகச் சமர்ப்பிக்கப்பட்டது":"")+'</p><div class="score">'+s.c+' / '+a.ids.length+'</div><p style="text-align:center">'+(s.c/a.ids.length*100).toFixed(1)+'%</p><div class="stats"><div style="background:var(--gb)"><b>'+s.c+'</b>சரி</div><div style="background:var(--rb)"><b>'+s.w+'</b>தவறு</div><div style="background:var(--ab)"><b>'+s.u+'</b>விடையளிக்காதவை</div><div style="background:#e8f1f5"><b>'+mmss(used)+'</b>எடுத்த நேரம்</div></div></div>';
  h+='<div class="card"><h2>தலைப்பு வாரியாக</h2><table class="tt"><tr><th>தலைப்பு</th><th title="வினாக்கள்">#</th><th title="சரி">✔</th><th title="தவறு">✘</th><th title="விடையளிக்காதவை">–</th><th title="நேரம்">⏱</th></tr>';
  [1,2,3,4].forEach(function(t){var ids=a.ids.filter(function(i){return Q[i].topic===t});if(!ids.length)return;var x=score({ids:ids,ans:a.ans}),ms=ids.reduce(function(m,i){return m+(a.time[i]||0)},0);h+="<tr><td>"+TOPICS[t]+"</td><td>"+ids.length+"</td><td>"+x.c+"</td><td>"+x.w+"</td><td>"+x.u+"</td><td>"+mmss(ms/1000)+"</td></tr>"});
  return h+'</table><p class="sub"># வினாக்கள் • ✔ சரி • ✘ தவறு • – விடையளிக்காதவை • ⏱ நேரம்</p></div>';
}
function result(){
  view="result";stop();
  var a=shown,s=score(a);
  var tabs=[["all","அனைத்தும்",a.ids.length],["c","சரி",s.c],["w","தவறு",s.w],["u","விடையளிக்காதவை",s.u]];
  var h='<div class="wrap">'+summary(a)+'<div class="card"><div class="two"><button class="pri" id="pdf">PDF பதிவிறக்கம்</button><button id="re">மீண்டும் எழுது</button></div><button class="full" id="hm">முகப்புப் பக்கம்</button><p class="sub" style="margin-top:6px">PDF: திறக்கும் அச்சுத் திரையில் “Save as PDF” என்பதைத் தேர்ந்தெடுக்கவும். WhatsApp-க்குள் திறந்திருந்தால் Chrome-இல் திறக்கவும்.</p></div>';
  h+='<div class="tabs">'+tabs.map(function(t){return'<button data-f="'+t[0]+'" class="'+(filter===t[0]?"on":"")+'">'+t[1]+" ("+t[2]+")</button>"}).join("")+'</div><div id="list"></div>'+footer()+'</div>';
  app.innerHTML=h;list();
  app.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){filter=b.dataset.f;app.querySelectorAll("[data-f]").forEach(function(x){x.className=x===b?"on":""});list()}});
  on("pdf",function(){buildPrint(a);setTimeout(function(){window.print()},150)});
  on("re",retakeMenu);on("hm",home);
  window.scrollTo(0,0);
}
function list(){
  var a=shown,h="";
  a.ids.forEach(function(id,i){if(filter==="all"||status(a,id)===filter)h+=review(a,id,i)});
  document.getElementById("list").innerHTML=h||'<div class="card">இப்பிரிவில் வினாக்கள் இல்லை.</div>';
}
function retakeMenu(){
  var a=shown;
  var sets=[["முழுத் தேர்வு",Q.map(function(_,i){return i})],
    ["விடையளித்த வினாக்கள்",a.ids.filter(function(i){return a.ans[i]!==undefined})],
    ["தவறான வினாக்கள்",a.ids.filter(function(i){return status(a,i)==="w"})],
    ["விடையளிக்காத வினாக்கள்",a.ids.filter(function(i){return status(a,i)==="u"})]];
  modal.innerHTML='<div class="ov"><div class="sheet"><h2>மீண்டும் எழுதுக</h2><p class="sub">'+esc(a.name)+'</p>'+sets.map(function(s,i){return'<button class="full" data-s="'+i+'"'+(s[1].length?"":" disabled")+'>'+s[0]+' ('+s[1].length+' வினா • '+mmss(s[1].length*SEC)+')</button>'}).join("")+'<button class="full" id="cl">ரத்து</button></div></div>';
  on("cl",closeModal);
  modal.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){var s=sets[+b.dataset.s];var f=function(){begin(a.name,a.mobile,s[1].slice(),s[0])};if(load(SK))ask("புதிய தேர்வு","நிறைவடையாத பழைய தேர்வு நீக்கப்படும். தொடரலாமா?","தொடங்கு",f);else f()}});
}

/* ---------- print ---------- */
function buildPrint(a){
  var inner=summary(a)+'<div class="pcols">'+a.ids.map(function(id,i){return review(a,id,i)}).join("")+"</div>";
  /* Newer Chrome prints the @page footer; other browsers get a repeating table footer. */
  var m=navigator.userAgent.match(/Chrome\/(\d+)/);
  prn.innerHTML=(m&&+m[1]>=131)?inner:'<table class="ft"><tbody><tr><td>'+inner+'</td></tr></tbody><tfoot><tr><td>'+FOOT+'</td></tr></tfoot></table>';
  document.title=FILE+"_"+a.name.replace(/\s+/g,"-")+"_result";
}
window.addEventListener("beforeprint",function(){if(view==="result"&&shown)buildPrint(shown)});

/* ---------- keep the session alive across sleep, reload and app switching ---------- */
document.addEventListener("visibilitychange",function(){if(view==="test"&&S){tick()}});
window.addEventListener("pagehide",function(){if(view==="test"&&S){account();save(SK,S)}});
window.addEventListener("pageshow",function(){if(view==="test"&&S){tick()}});
window.addEventListener("beforeunload",function(e){if(view==="test"&&S){account();save(SK,S);e.preventDefault();e.returnValue=""}});
document.addEventListener("keydown",function(e){if(view!=="test"||!S||modal.innerHTML)return;if(e.key==="ArrowRight"&&S.cur<S.ids.length-1)go(S.cur+1);else if(e.key==="ArrowLeft"&&S.cur>0)go(S.cur-1)});

/* resume automatically after an accidental reload; submit if time ran out meanwhile */
var p=load(SK);
if(p&&p.ids){S=p;run()}else home();
})();
</script>
</body>
</html>
